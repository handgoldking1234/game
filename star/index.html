<!doctype html><html lang="ko" data-noasset="1"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>잿빛 전선</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%279%27 y=%279%27 width=%2714%27 height=%2714%27 transform=%27rotate(45 16 16)%27 fill=%27%23ff4f6d%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed battlefield canvas, slim resource strip on top, command console docked at the bottom */
:root{
  --void:#0b0d10; --panel:#13171b; --panel2:#1a2026; --line:#2a333b; --ink:#dbe3e6; --dim:#7d8a92;
  --ally:#3fd6c6; --hostile:#ff4f6d; --crystal:#8fd8ff; --gas:#5fe39a; --warn:#ffb547; --acid:#c6f04a;
  --f-display:'Black Han Sans','IBM Plex Sans KR',system-ui,sans-serif;
  --f-body:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--void)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--ally);outline-offset:2px}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}

/* top strip */
#top{display:flex;align-items:center;gap:20px;padding:7px 16px;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:10px;background:var(--hostile);transform:rotate(45deg);box-shadow:0 0 10px var(--hostile)}
.res{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.res b{font-family:var(--f-mono);font-weight:600;font-size:16px}
.res small{font-size:11px;color:var(--dim);letter-spacing:.06em}
.res .ico{width:10px;height:10px;align-self:center;display:inline-block}
.ico.cry{background:var(--crystal);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.ico.sup{border:2px solid var(--ally);border-radius:2px}
.ico.gas{background:var(--gas);border-radius:50%}
.res.warn b{color:var(--warn)}
.res.short b{color:var(--hostile)}
.spacer{flex:1}
.tb{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer}
.tb:hover{border-color:var(--dim)}
.tb b{font-family:var(--f-mono);color:var(--ally)}

/* stage */
#stage{position:relative;min-height:0;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#toasts{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92%,520px)}
.toast{background:rgba(11,13,16,.82);border:1px solid var(--line);border-left:3px solid var(--ally);padding:6px 12px;font-size:13px;border-radius:3px;animation:tin .2s ease-out}
.toast.bad{border-left-color:var(--hostile)}
.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{transform:translateY(-6px);opacity:.3}}
#boxBtn{position:absolute;left:12px;bottom:12px;display:none;background:rgba(19,23,27,.9);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:12px}
#boxBtn.on{border-color:var(--ally);color:var(--ally)}
@media (pointer:coarse){#boxBtn{display:block}#toasts{bottom:56px}}

/* overlay */
#overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 70% 20%,rgba(255,79,109,.10),transparent 60%),rgba(8,10,12,.72);overflow-y:auto}
#overlay[hidden]{display:none!important}
.brief{width:min(100%,640px);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px 28px 24px;display:grid;gap:18px;position:relative}
.brief::before{content:"";position:absolute;left:0;top:0;width:64px;height:3px;background:var(--hostile)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--hostile);text-transform:uppercase}
.brief h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,8vw,64px);line-height:1;margin:0;letter-spacing:.02em;text-wrap:balance}
.brief p{margin:0;line-height:1.7;color:#b7c2c7;max-width:62ch;font-size:14px}
.brief p b{color:var(--ink)}
.diff{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.diff button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px;text-align:left;cursor:pointer;display:grid;gap:3px}
.diff button span{font-weight:700;font-size:14px}
.diff button small{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.diff button[aria-pressed="true"]{border-color:var(--ally);box-shadow:inset 0 0 0 1px var(--ally)}
.diff.race{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.brief.wide{width:min(100%,1080px);gap:14px;padding:22px 24px 0}
.brief-head{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:end}
.brief-head h1{font-size:clamp(34px,5vw,52px)}
.brief-head p{font-size:13px;line-height:1.6}
.start-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:22px}
.start-col{display:grid;gap:14px;align-content:start}
.start-col .diff{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.start-col .diff button{padding:8px 10px}
.go-bar{position:sticky;bottom:0;display:flex;align-items:center;gap:14px;padding:14px 0 18px;background:linear-gradient(transparent,var(--panel) 30%)}
.diff.num{grid-template-columns:repeat(8,minmax(0,1fr))!important;gap:5px}.diff.num button{padding:6px 0!important;text-align:center;place-items:center}.diff.num button small{display:none}
#chat{position:absolute;left:14px;bottom:90px;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.7);border:1px solid #2fb35a;padding:4px 10px;border-radius:3px;font-size:13px;color:#9ff5c8}
#chat[hidden]{display:none}
#objBox{position:absolute;right:14px;top:64px;background:rgba(6,9,11,.78);border:1px solid #6b5a22;border-left:3px solid #f0c845;padding:7px 12px;border-radius:3px;font-size:12.5px;color:#e6e0c8;pointer-events:none;max-width:min(46%,340px);display:grid;gap:2px;z-index:5}
#objBox[hidden]{display:none}#objBox .ok{color:#9ff7b8}#objBox .dim{color:#8a8f86}
.blines{display:grid;gap:8px;margin:4px 0 14px}.bline{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:4px;padding:8px 12px 8px 8px}
.bline canvas{border:1px solid #2d3a40;border-radius:3px;background:#0b1013;image-rendering:pixelated}.bline b{font-size:13px;color:#d9c8ff}.bline p{margin:2px 0 0;font-size:13.5px;line-height:1.55}#objBox b{color:#f0c845;font-size:13px}#objBox .prog{font-family:var(--f-mono);color:#9ff7b8;margin-top:2px}
.camp-btn{background:#3a2f0e;border-color:#f0c845;color:#f8e7a6}
.start-grid.camp-grid{grid-template-columns:repeat(3,minmax(0,1fr))}@media (max-width:900px){.start-grid.camp-grid{grid-template-columns:1fr}}
.diff.camp{grid-template-columns:1fr}.diff.camp button:disabled{opacity:.42;cursor:not-allowed}
.camp-obj{display:grid;gap:5px;font-size:13px;line-height:1.5;color:#c9d2d6}.camp-obj .lose{color:#ff8f9f;font-size:12px}
.eyebrow.rc-t{color:#7fb6ff}.eyebrow.rc-z{color:#d68cff}.eyebrow.rc-p{color:#f0c845}
#chatLog{position:absolute;left:14px;top:64px;display:flex;flex-direction:column;gap:3px;pointer-events:none;font-size:13px;max-width:min(80%,520px);z-index:5}
#chatLog div{background:rgba(0,0,0,.6);padding:2px 9px;border-radius:2px;color:#e8e8e8;text-shadow:0 1px 0 #000;transition:opacity .6s}
#chatLog b{font-weight:600;margin-right:6px}#chatLog .me b{color:#9ff7b8}#chatLog .ally b{color:#7fd0ff}#chatLog .foe b{color:#ff8f9f}
#cheatMenu{position:absolute;top:8px;right:12px;z-index:6;display:grid;gap:5px;max-height:calc(100% - 16px);overflow-y:auto;background:rgba(10,14,16,.95);border:1px solid #2fb35a;border-radius:4px;padding:10px;width:290px}
#cheatMenu[hidden]{display:none}
#cheatMenu button{text-align:left;background:#141b1f;border:1px solid #2a333b;border-radius:3px;padding:6px 8px;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#cheatMenu button:hover{border-color:#62e38a}
#cheatMenu button.on{border-color:#ffb547;color:#ffd27a}
#cheatMenu small{color:#7d8a92;font-family:var(--f-mono)}
#chatIn{background:transparent;border:0;outline:0;color:#fff;font:inherit;width:300px}
.go-hint{font-size:12px;color:var(--dim)}
@media (max-width:760px){.brief-head{grid-template-columns:1fr;gap:6px}.start-grid{grid-template-columns:1fr}}
.rc-t span{color:#7fb8ff}.rc-z span{color:#d77bff}.rc-p span{color:#ffd36b}.rc-r span{color:var(--ink)}
.rc-t[aria-pressed="true"]{border-color:#7fb8ff;box-shadow:inset 0 0 0 1px #7fb8ff}.rc-z[aria-pressed="true"]{border-color:#d77bff;box-shadow:inset 0 0 0 1px #d77bff}.rc-p[aria-pressed="true"]{border-color:#ffd36b;box-shadow:inset 0 0 0 1px #ffd36b}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;font-size:12px;color:var(--dim)}
.keys div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.keys kbd{font-family:var(--f-mono);color:var(--ink);font-size:11px}
.go{justify-self:start;background:var(--ally);color:#06201d;border:0;border-radius:4px;padding:12px 26px;font-weight:700;font-size:15px;cursor:pointer;letter-spacing:.04em}
.go:hover{filter:brightness(1.1)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--panel2);border-radius:4px;padding:10px;display:grid;gap:2px}
.stats b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stats small{font-size:11px;color:var(--dim)}
.win h1{color:var(--ally)} .lose h1{color:var(--hostile)}

/* HUD */
#hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"mini info cmd";gap:14px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line);height:150px}
#miniWrap{grid-area:mini;border:1px solid var(--line);background:#000;align-self:start;line-height:0}
#mini{width:186px;height:128px;display:block;touch-action:none;cursor:pointer}
#info{grid-area:info;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:6px;font-size:13px}
#cmd{grid-area:cmd;display:grid;grid-template-columns:repeat(4,60px);grid-template-rows:repeat(3,35px);gap:4px;align-self:start}
.cb{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:3px;font-size:11.5px;line-height:1.15;padding:3px 4px 2px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cb:hover:not(:disabled){border-color:var(--ally)}
.cb:disabled{opacity:.38;cursor:not-allowed}
.cb .k{position:absolute;right:3px;top:2px;font-family:var(--f-mono);font-size:9.5px;color:var(--ally)}
.cb .c{font-family:var(--f-mono);font-size:10px;color:var(--crystal)}
.cb.poor .c{color:var(--hostile)}
.cb.hot{border-color:var(--warn);color:var(--warn)}
.cb.empty{visibility:hidden}
.iname{display:flex;align-items:baseline;gap:10px}
.iname b{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.02em}
.iname span{font-size:12px;color:var(--dim)}
.iname .foe{color:var(--hostile)}
.hpb{height:6px;background:#0a0c0e;border-radius:3px;overflow:hidden;max-width:300px}
.hpb i{display:block;height:100%;background:var(--ally)}
.istat{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.istat b{color:var(--ink);font-family:var(--f-mono);font-weight:400}
.queue{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.qi{width:38px;height:36px;padding:1px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;font-size:11px;background:var(--panel2);cursor:pointer;position:relative;overflow:hidden}
.qi i{position:absolute;left:0;bottom:0;height:3px;background:var(--ally)}
.chips{display:flex;flex-wrap:wrap;gap:4px;overflow:hidden;max-height:92px}
.chip{width:38px;height:36px;padding:1px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);display:grid;place-items:center;font-size:11px;position:relative;cursor:pointer;overflow:hidden}
.chip i{position:absolute;left:0;bottom:0;height:3px}
.tip{color:var(--dim);font-size:12.5px;line-height:1.6;max-width:60ch}
.tip b{color:var(--ink);font-weight:500}
.tip kbd{font-family:var(--f-mono);font-size:11px;color:var(--ally)}

/* StarCraft-style chrome: floating resource counters top-right, beveled metal console with portrait */
#top{background:linear-gradient(#1b2228,#0f1317);border-bottom:2px solid #39454e;box-shadow:0 2px 0 #06080a}
#top .res{order:5;background:rgba(0,0,0,.35);border:1px solid #2a333b;border-radius:3px;padding:3px 8px}
#top .spacer{order:4}
#top{flex-wrap:wrap;row-gap:5px;overflow:visible;white-space:nowrap;gap:6px 8px}
#top .tb{padding:4px 8px}
#top .spacer{flex:1 1 0;min-width:0}
#cheatBtn{border-color:#c9952a;color:#ffd27a;background:#2a2210}
#top .res:first-of-type{margin-left:0}
#hud{grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"mini info port cmd";
  background:linear-gradient(180deg,#2b343b 0,#1a2025 8px,#141a1e 60%,#0e1215);border-top:3px solid #4b5963;box-shadow:inset 0 1px 0 #6d7d88,0 -2px 0 #06080a}
#miniWrap,#info,#portWrap,#cmd{border:2px solid #0a0d10;outline:1px solid #46535d;border-radius:2px;background:#05070a}
#info{padding:8px 12px;background:radial-gradient(ellipse at 50% 0,#0f1a1c,#05070a 70%)}
#cmd{padding:4px;background:#0a0e11}
#portWrap{grid-area:port;width:92px;height:118px;align-self:start;position:relative;overflow:hidden;line-height:0}
#port{width:100%;height:100%;display:block}
#portWrap::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);pointer-events:none}
.cb{background:linear-gradient(#1d262c,#11171b);border:1px solid #3a4852;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.cb:hover:not(:disabled){border-color:#62e38a;box-shadow:0 0 6px rgba(98,227,138,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.cb .k{color:#ffd75e}
#toasts{top:auto;bottom:14px;left:14px;transform:none;align-items:flex-start;width:min(80%,460px)}
.toast{background:rgba(0,0,0,.55);border:0;border-left:0;padding:2px 6px;font-size:14px;color:#ffe9a8;text-shadow:0 1px 0 #000}
.toast.bad{color:#ff8a9c}.toast.warn{color:#ffd27a}
/* StarCraft-style console: black glass panels, green readouts, icon command buttons */
#top .res{background:none;border:0;padding:0 4px}
#top .res b{color:#62e38a;font-size:17px;text-shadow:0 1px 0 #000}
#top .res small{color:#7d8a92}
#top .res.short b{color:var(--hostile)}
#info{flex-direction:row;align-items:flex-start;gap:14px;background:#000;padding:10px 14px}
#wireBox{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px}
#wireBox[hidden]{display:none}
#wire{width:72px;height:72px;image-rendering:pixelated;border:1px solid #1d2a22;background:#020604}
#wireHp{font-family:var(--f-mono);font-size:12px;color:#62e38a;line-height:1}
#wireHp .sh{color:#7cc8ff}
#infoTxt{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.iname b{color:#fff;font-family:var(--f-body);font-weight:700;font-size:17px}
.istat{color:#9bb0a4}.istat b{color:#62e38a}
.upbox{display:inline-flex;gap:8px;align-items:center;border:1px solid #2fb35a;border-radius:4px;padding:3px 8px;font-size:11.5px;color:#cfe;align-self:flex-start}
.upbox i{font-style:normal;color:#ffd75e;font-family:var(--f-mono)}
#port{image-rendering:pixelated}
.cb{padding:0;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1a2420,#070a09);border:1px solid #33463d}
.cb canvas{width:30px;height:30px;image-rendering:auto;pointer-events:none}
.cb .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cb .k{left:auto;right:3px;top:auto;bottom:1px;font-size:9px}
.cb .c{display:none}
.cb.poor canvas{opacity:.55}
.cb.hot{box-shadow:0 0 0 1px var(--warn),0 0 8px rgba(255,181,71,.5)}
#ctip{position:absolute;right:16px;bottom:calc(100% + 6px);z-index:5;background:rgba(0,0,0,.92);border:1px solid #2fb35a;border-radius:3px;padding:6px 10px;font-size:12.5px;color:#e8f0e8;max-width:300px;pointer-events:none;line-height:1.5}
#ctip[hidden]{display:none}
#ctip .cost{display:flex;gap:12px;font-family:var(--f-mono);font-size:12px;margin-top:2px}
#ctip .cost span{display:inline-flex;align-items:center;gap:4px}
#ctip .h{color:#9bb0a4;font-size:11.5px}
#hud{position:relative}
@media (max-width:700px){
  #portWrap{display:none}
  #wireBox{display:none}
  #top{gap:14px;padding:6px 12px}
  .brand{font-size:16px} .brand span{display:none}
  .res small{display:none}
  #hud{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"mini cmd" "info info";grid-template-rows:auto auto;height:auto;gap:8px;padding:8px 12px}
  #mini{width:128px;height:88px}
  #cmd{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,27px);gap:3px;justify-self:stretch}
  .cb{font-size:10.5px;flex-direction:row;align-items:center;gap:4px;padding:2px 4px}
  .cb .k{display:none}
  #info{height:38px;flex-direction:row;align-items:center;gap:10px}
  .iname b{font-size:16px}
  .istat,.tip{font-size:11px}
  .tip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips{max-height:30px}
  .hpb{width:80px}
  .brief{padding:22px 18px}
  .keys{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .diff button small{font-size:10px}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head><body>

<div id="app">
  <header id="top">
    <div class="brand"><i></i><span>잿빛 전선</span><small style="font:600 10px var(--f-mono);color:#ffd27a;margin-left:6px">v11.08</small></div>
    <div class="res" id="resMoney"><span class="ico cry"></span><b id="rMoney">0</b><small>미네랄</small></div>
    <div class="res"><span class="ico gas"></span><b id="rGas">0</b><small>가스</small></div>
    <div class="res" id="resSup"><span class="ico sup"></span><b id="rSup">0/0</b><small>보급</small></div>
    <div class="res"><b id="rTime">0:00</b><small>작전 시간</small></div>
    <div class="res warn"><b id="rWave">–</b><small>다음 습격</small></div>
    <div class="spacer"></div>
    <button id="idleBtn" class="tb" type="button">유휴 일꾼 <b id="idleN">0</b></button>

// can unit/building e shoot target t? (air-only and ground-only weapons, melee cannot hit flyers)
function atkAir(D,u=1){return !!D.dmg&&!D.noAir&&!(D.range<=10&&u&&!D.fly)}
function atkGround(D){return !!D.dmg&&!D.airOnly}
function atkTag(D){if(!D.dmg)return '';const a=atkAir(D,D.u),g=atkGround(D);return (a&&g?'지상·공중 공격':a?'공중 공격만':'지상 공격만 (공중 공격 불가)')+(D.moveShoot?' · 이동 중 사격':'')}
function canHit(e,t){const D=DEF[e.type];if(!D.dmg||t.stasis>0)return false;if(D.burrowAtk&&!e.bur)return false;if(e.bur&&!D.burrowAtk)return false;if(hiddenFrom(e.team,t))return false;const air=DEF[t.type].fly||t.lifted;if(air)return !D.noAir&&!(D.range<=10&&isU(e)&&!D.fly);return !D.airOnly}

function distRect(x,y,b){const h=b.size/2;const dx=Math.max(Math.abs(x-b.x)-h,0),dy=Math.max(Math.abs(y-b.y)-h,0);return Math.hypot(dx,dy)}

}

function st(e){
  const d=DEF[e.type],u=G.up;
  const s={dmg:d.dmg||0,range:d.range||0,cd:d.cd||1,sp:(d.sp||0)*1.4,armor:d.armor||0,splash:d.splash||0,minR:0,sight:d.sight||0};
  if(e.team===0){
    if(d.inf){if(s.dmg)s.dmg+=u.iw*(d.upw||1);s.armor+=u.ia}
    if(e.type==='fang'&&u.zspd)s.sp*=1.6;if(e.type==='zealot'&&u.leg)s.sp*=1.5;if(e.type==='dragoon'&&u.drange)s.range+=80;
    if(d.mech){s.armor+=u.va;if(e.sg){s.dmg=70+u.vw*5;s.range=380;s.splash=60;s.cd=2.9;s.minR=50}else s.dmg+=u.vw*3}
    if(e.stim>0){s.cd*=.6;s.sp*=1.5}
  }else if(e.team>0){const u=AIS(e.team).up;if(d.inf){if(s.dmg)s.dmg+=u.iw*(d.upw||1);s.armor+=u.ia}if(d.mech){s.armor+=u.va;if(e.sg){s.dmg=70+u.vw*5;s.range=380;s.splash=60;s.cd=2.9;s.minR=50}else s.dmg+=u.vw*3}if(e.stim>0){s.cd*=.6;s.sp*=1.5}if(e.type==='fang'&&u.zspd)s.sp*=1.6;if(e.type==='zealot'&&u.leg)s.sp*=1.5;if(e.type==='dragoon'&&u.drange)s.range+=80}
  if(e.ens>0){s.sp*=.5;s.cd*=1.3}if(e.acid)s.cd*=1+.06*e.acid;if(e.blind)s.sight=Math.min(s.sight,40);

  const btns=(k,from,to,cur,lab)=>{let h='';for(let n=from;n<=to;n++)h+=`<button type="button" data-${k}="${n}" aria-pressed="${n===cur}"><span>${n}</span><small>${lab(n)}</small></button>`;return h};
  return `<div><div class="eyebrow" style="color:var(--ally);margin-bottom:6px">구성 · 나 ${1+allyPick} : 적 ${foePick} (이 지도 최대 ${mx+1}명)</div>

}

function objDone(m,i){

function renderPort(now){

  }

function renderMini(now){
  const W=mm.width,H=mm.height,sx=W/WW,sy=H/WH;
  mctx.setTransform(1,0,0,1,0,0);
  mctx.drawImage(miniTerr,0,0);
  if(!G)return;
  for(const e of G.ents){
    let c,s;
    if(e.type==='crystal'){if(!G.explored[cellI(e.x,e.y)])continue;c=CRY;s=2*dpr}
    else if(e.type==='geyser'){if(!G.explored[cellI(e.x,e.y)])continue;c=GAS;s=e.size*sx}
    else if(e.team===0){c=isB(e)?ALLY:'#62e38a';s=(isB(e)?e.size*sx:3*dpr)}
    else{if(hiddenFrom(0,e)||DEF[e.type].noPick)continue;if(hostileT(0,e.team)&&(isB(e)?!G.explored[cellI(e.x,e.y)]:!visAt(e.x,e.y)))continue;c=TEAMCOL[e.team];s=(isB(e)?e.size*sx:3*dpr)}
    mctx.fillStyle=c;mctx.fillRect(e.x*sx-s/2,e.y*sy-s/2,s,s);
  }
  mctx.imageSmoothingEnabled=true;mctx.drawImage(fogC,0,0,W,H);
  miniRelics(sx,sy);
  for(const p of pings){const a=Math.max(0,(now-p.t)/3000);if(a>1)continue;mctx.strokeStyle=`rgba(255,79,109,${1-a})`;mctx.lineWidth=2*dpr;mctx.beginPath();mctx.arc(p.x*sx,p.y*sy,(4+(a*6%1)*14)*dpr,0,TAU);mctx.stroke()}
  pings=pings.filter(p=>now-p.t<3000);
  mctx.strokeStyle='#e8f0f2';mctx.lineWidth=1*dpr;mctx.strokeRect(cam.x*sx,cam.y*sy,VW/z*sx,VH/z*sy);
}

// --- casting
function castAt(k,x,y){const s=SP[k];
  const cs=selUnits().filter(u=>s.u.includes(u.type)&&!u.hallu&&spellOk(u,k)&&(u.mp||0)>=s.mp&&(!s.need||s.need(u))&&!disabled(u));
  if(!cs.length){toast(s.need&&!selUnits().some(s.need)?s.needWhy:'에너지가 부족합니다 ('+s.mp+' 필요)','bad');sfx('err');return}
  let t=null;if(s.tg==='unit'){t=pick(x,y);if(!t||!s.ok(cs[0],t)){toast(s.why,'warn');sfx('err');return}}
  const free=cs.filter(u=>!(u.order&&u.order.k==='cast')),pool=free.length?free:cs;
  const c=pool.reduce((a,b)=>Math.hypot(b.x-x,b.y-y)<Math.hypot(a.x-x,a.y-y)?b:a);
  orderCast(c,k,t,x,y);mark(t?t.x:x,t?t.y:y,t&&!hostile(c,t)?ALLY:HOST);sfx('ack')}
function orderCast(c,k,t,x,y){const prev=c.team>0&&c.order&&c.order.k!=='cast'?c.order:null;setOrd(c,null);c.order={k:'cast',sp:k,id:t?t.id:0,x:t?t.x:x,y:t?t.y:y,after:prev}}
function endCast(e,o){e.order=o.after||null}
function updCast(e,o,dt){const s=SP[o.sp];
  if(o.ph==='aim'){if(!FL().some(f=>f.k==='nuke'&&f.src===e.id)){endCast(e,o);return}e.face=turn(e.face,Math.atan2(o.y-e.y,o.x-e.x),dt*8);return}
  let t=null;
  if(s.tg==='unit'){t=byId.get(o.id);if(!alive(t)||(e.team===0&&hostile(e,t)&&!canSee(0,t))||(e.team>0&&hiddenFrom(e.team,t))||!s.ok(e,t)){endCast(e,o);return}o.x=t.x;o.y=t.y}
  if(o.ph==='charge'){e.face=turn(e.face,Math.atan2(o.y-e.y,o.x-e.x),dt*8);o.ct+=dt;if(o.ct>=s.charge*(DEF[e.type].heroU?.5:1)){s.cast(e,t);endCast(e,o)}return}
  if(!spellOk(e,o.sp)||(e.mp||0)<s.mp||(s.need&&!s.need(e))){if(e.team===0)toast(s.need&&!s.need(e)?s.needWhy:'에너지가 부족합니다','bad');endCast(e,o);return}
  const dist=t?gap(e,t):Math.hypot(o.x-e.x,o.y-e.y);
  if(dist>s.range){moveTo(e,o.x,o.y,dt);return}
  e.face=turn(e.face,Math.atan2(o.y-e.y,o.x-e.x),dt*12);e.mv=0;
  e.mp-=s.mp;
  if(s.snd&&o.sp!=='nuke')osnd('Magic.'+s.snd,{e:{x:o.x,y:o.y},gap:.1,vol:.7});
  if(FXK[o.sp])fxAt(o.sp,o.x,o.y,t&&isU(t)?t.id:0);
  if(o.sp==='nuke'){launchNuke(e,o);o.ph='aim';return}
  if(s.charge){o.ph='charge';o.ct=0;return}
  s.cast(e,t||{x:o.x,y:o.y});endCast(e,o)}
function launchNuke(e,o){const b=G.ents.find(b=>b.type==='nsilo'&&b.team===e.team&&b.nuke&&!b.dead);if(b)b.nuke=0;
  FL().push({k:'nuke',x:o.x,y:o.y,t:0,dur:14,src:e.id,team:e.team,r:0});
  if(hostileT(0,e.team)){toast('핵 공격이 감지되었습니다!','bad');say('핵 공격이 감지되었습니다',{pri:1,gap:0});sfx('alert');pings.push({x:o.x,y:o.y,t:performance.now()});G.alertPos={x:o.x,y:o.y,t:G.t}}
  else if(e.team===0)toast('핵미사일 발사! 14초 동안 고스트가 조준을 유지해야 합니다','warn')}
function detonate(f){const src=byId.get(f.src);
  for(const o of G.ents){if(o.dead||o.team<0||DEF[o.type].noPick)continue;const d=isB(o)?distRect(f.x,f.y,o):Math.hypot(o.x-f.x,o.y-f.y);if(d>180)continue;
    const D=DEF[o.type],base=Math.max(500,((D.hp||0)+(D.sh||0))*2/3);dmgDirect(o,base*(d<=64?1:d<=120?.5:.25),src,true)}
  osnd('Magic.NuclearStrike',{gap:0,vol:.9});origFx('BigExplode',f.x,f.y,2.4);boom(f.x,f.y,120,WARN);
  for(let i=0;i<12;i++){const a=Math.random()*TAU,r=Math.random()*150;boom(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r,36,WARN)}
  sfxL.push({k:'nukeflash',x:f.x,y:f.y,t:0,dur:2});G.decals.push({x:f.x,y:f.y,r:170,k:'scorch',s:Math.random()*1e6|0,t:G.t});sfx('bigboom',{x:f.x,y:f.y})}

// --- per-frame status effects, fields, arbiter cloaking field
function updSpells(dt){
  if(!G.fields){G.fields=[];sfxL=[]}
  const F=G.spF=(G.spF||0)+1;
  for(const e of G.ents){if(e.dead)continue;
    if(e.stasis>0)e.stasis-=dt;if(e.lock>0)e.lock-=dt;if(e.mael>0)e.mael-=dt;if(e.ens>0)e.ens-=dt;
    if(e.mxT>0){e.mxT-=dt;if(e.mxT<=0||e.mx<=0){e.mx=0;e.mxT=0}}
    if(e.acid&&G.t>e.acidT)e.acid=0;
    if(e.irr>0){e.irr-=dt;const s=byId.get(e.irrSrc);for(const o of inR(e.x,e.y,32))if(DEF[o.type].bio)dmgDirect(o,10*dt,s)}
    if(e.plg>0){e.plg-=dt;if(e.hp>1&&!(e.stasis>0))e.hp=Math.max(1,e.hp-12*dt)}
    if(e.tl>0){e.tl-=dt;if(e.tl<=0){e.silent=true;e.dead=true}}
    if(e.hallu>0){e.hallu-=dt;if(e.hallu<=0){e.silent=true;e.dead=true}}
    if(UQ[e.type])updUQ(e,dt);
    if(e.fclU&&G.t>e.fclU){e.fclU=0;if(!e.selfCl&&!DEF[e.type].cloakAlways&&!e.bur&&!DEF[e.type].smine)e.cloak=false}
  }
  if(F%6===0)for(const a of G.ents){if(a.dead||a.type!=='arbiter'||a.hallu||disabled(a))continue;
    for(const o of G.ents){if(o.dead||o.team!==a.team||!isU(o)||o.type==='arbiter'||DEF[o.type].noPick||o.hallu)continue;if(Math.hypot(o.x-a.x,o.y-a.y)<150){o.fclU=G.t+.4;o.cloak=true}}}
  for(const f of G.fields){f.t+=dt;
    if(f.k==='storm'){const s=byId.get(f.src);for(const o of inR(f.x,f.y,f.r))if(o.stF!==F){o.stF=F;dmgDirect(o,28*dt,s,true)}}
    if(f.k==='nuke'){const g=byId.get(f.src);if(!alive(g)||!g.order||g.order.k!=='cast'||g.order.ph!=='aim'||disabled(g)){f.done=true;if(f.team===0)toast('고스트가 조준을 멈춰 핵 공격이 취소되었습니다','warn');continue}
      if(f.t>=f.dur){f.done=true;detonate(f);endCast(g,g.order)}continue}
    if(f.t>=f.dur)f.done=true}
  G.fields=G.fields.filter(f=>!f.done);
  for(const p of sfxL)p.t+=dt;sfxL=sfxL.filter(p=>p.t<p.dur);
}

const transOk=t=>t.type!=='overlord'||t.team!==0||G.up.vsacs>0;
function canBoard(u,tr){return !!u&&!!tr&&u!==tr&&isU(u)&&!u.dead&&!tr.dead&&!!TRANS[tr.type]&&!tr.hallu&&!u.hallu&&transOk(tr)&&u.team===tr.team&&!DEF[u.type].fly&&!DEF[u.type].larva&&!u.egg&&!DEF[u.type].smine&&!DEF[u.type].noPick&&!u.sg&&!u.bur&&!disabled(u)&&DEF[u.type].race===DEF[tr.type].race&&(!isB(tr)||(tr.built&&(!!DEF[u.type].inf||!!DEF[u.type].wk)))&&cargoUsed(tr)+slotOf(u)<=TRANS[tr.type]}

function updBoard(e,o,dt){const tr=byId.get(o.id);if(!canBoard(e,tr)){e.order=null;return}if(isB(tr)?gap(e,tr)<=14:Math.hypot(tr.x-e.x,tr.y-e.y)<=rad(tr)+rad(e)+28){doBoard(e,tr);return}

  G.ents.push(u);byId.set(u.id,u);if(tr.team===0)sfx('click');if(!tr.cargo.length)tr.order=null}

const nyPair=t=>{const p=t&&byId.get(t.pair);return alive(p)&&p.built&&t.built?p:null};

// right-click on an own transport, nydus canal or (with transports selected) on a unit to pick up
function transportClick(us,t){
  if(!t||t.team!==0||us.includes(t))return false;
  if(TRANS[t.type]){const gs=us.filter(u=>canBoard(u,t));if(gs.length){for(const u of gs)setOrd(u,{k:'board',id:t.id});mark(t.x,t.y,ALLY);sfx('ack');return true}}
  if(t.type==='nydus'&&nyPair(t)){const gs=us.filter(u=>!DEF[u.type].fly);if(gs.length){for(const u of gs)setOrd(u,{k:'nydus',id:t.id});mark(t.x,t.y,ACID);sfx('ack');return true}}
  if(isU(t)&&us.every(u=>TRANS[u.type])){const tr=us.find(r=>canBoard(t,r));if(tr){setOrd(tr,{k:'pickup',id:t.id});setOrd(t,{k:'board',id:tr.id});mark(t.x,t.y,ALLY);sfx('ack');return true}}
  return false}

// --- AI casting: picks a good target every ~0.6 s
function aiCast(e){if(disabled(e)||e.hallu||(e.order&&e.order.k==='cast'))return;
  const foes=[];for(const o of G.ents){if(o.dead||!isU(o)||!hostile(e,o)||DEF[o.type].noPick||o.stasis>0||o.hallu||hiddenFrom(e.team,o))continue;if(Math.hypot(o.x-e.x,o.y-e.y)<400)foes.push(o)}
  const can=k=>SP[k].u.includes(e.type)&&(e.mp||0)>=SP[k].mp;
  const go=(k,t,x,y)=>{orderCast(e,k,t,t?t.x:x,t?t.y:y);return true};
  const cnt=(x,y,r,pred)=>{let n=0,m=0;for(const o of G.ents){if(o.dead||!isU(o)||o.team<0||DEF[o.type].noPick||o.stasis>0||Math.hypot(o.x-x,o.y-y)>r)continue;if(hostile(e,o)){if(!pred||pred(o))n++}else if(o!==e)m++}return n-m*1.5};
  const best=(r,min,pred)=>{let bp=null,bs=min-.01;for(const o of foes){if(pred&&!pred(o))continue;const sc=cnt(o.x,o.y,r,pred);if(sc>bs){bs=sc;bp=o}}return bp};
  const val=o=>(DEF[o.type].cost||0)+(DEF[o.type].gas||0)*1.5;
  const top=pred=>foes.filter(pred).sort((a,b)=>val(b)-val(a))[0];
  let p;
  if(e.type==='medic'&&can('restore')){const a=G.ents.find(o=>o.team===e.team&&isU(o)&&!o.dead&&hasDebuff(o)&&Math.hypot(o.x-e.x,o.y-e.y)<260);if(a)return go('restore',a)}
  if(e.type==='vessel'){if(can('matrix')){const a=G.ents.find(o=>o.team===e.team&&isU(o)&&!o.dead&&!(o.mx>0)&&G.t-(o.hitT||-99)<2&&o.hp<DEF[o.type].hp*.75&&Math.hypot(o.x-e.x,o.y-e.y)<340);if(a)return go('matrix',a)}
    if(!foes.length)return;
    if(can('irr')&&(p=top(o=>DEF[o.type].bio&&!(o.irr>0)&&val(o)>=100)))return go('irr',p);
    if(can('emp')&&(p=best(64,3,o=>(o.sh||0)>30||(o.mp||0)>60)))return go('emp',null,p.x,p.y);return}
  if(!foes.length)return;
  if((e.type==='htemplar'||e.type==='kerrigan')&&can('storm')&&(p=best(48,3)))return go('storm',null,p.x,p.y);
  if(e.type==='kerrigan'&&can('ensnare')&&(p=best(64,4)))return go('ensnare',null,p.x,p.y);
  if(e.type==='darchon'){if(can('feedback')&&(p=top(o=>DEF[o.type].mp&&(o.mp||0)>=50)))return go('feedback',p);
    if(can('mind')&&(p=top(o=>val(o)>=250&&!DEF[o.type].heroU)))return go('mind',p);
    if(can('mael')&&(p=best(48,4,o=>DEF[o.type].bio)))return go('mael',null,p.x,p.y);return}
  if(e.type==='ghost'&&can('lockdown')&&(p=top(o=>DEF[o.type].mech&&!(o.lock>0)&&val(o)>=150)))return go('lockdown',p);
  if(e.type==='queen'){if(can('brood')&&(p=top(o=>SP.brood.ok(e,o)&&val(o)>=150)))return go('brood',p);if(can('ensnare')&&(p=best(64,4)))return go('ensnare',null,p.x,p.y);return}
  if(e.type==='defiler'){if(can('plague')&&(p=best(64,3)))return go('plague',null,p.x,p.y);
    if(can('swarm')&&foes.some(o=>st(o).range>64)&&!fieldAt('swarm',e)){const f=foes.reduce((a,b)=>Math.hypot(b.x-e.x,b.y-e.y)<Math.hypot(a.x-e.x,a.y-e.y)?b:a),a=Math.atan2(f.y-e.y,f.x-e.x);return go('swarm',null,e.x+Math.cos(a)*70,e.y+Math.sin(a)*70)}return}
  if(e.type==='arbiter'&&can('stasis')&&(p=best(48,5)))return go('stasis',null,p.x,p.y);
  if(e.type==='corsair'&&can('dweb')&&(p=best(64,2,o=>!DEF[o.type].fly&&!!DEF[o.type].dmg)))return go('dweb',null,p.x,p.y);
  if(e.type==='bcruiser'&&can('yamato')&&(p=top(o=>o.hp>=150)))return go('yamato',p);
}

// --- info panel chips
function statusChips(e){const c=[];
  if(e.stasis>0)c.push('스테이시스 '+Math.ceil(e.stasis)+'초');if(e.lock>0)c.push('락다운 '+Math.ceil(e.lock)+'초');if(e.mael>0)c.push('마엘스트롬 '+Math.ceil(e.mael)+'초');
  if(e.mx>0)c.push('매트릭스 '+Math.ceil(e.mx));if(e.irr>0)c.push('이레디에이트');if(e.plg>0)c.push('플레이그');if(e.ens>0)c.push('인스네어');
  if(e.blind)c.push('시야 잃음');if(e.acid)c.push('산성 포자 '+e.acid);if(e.para&&e.para[grpOf(0)]&&hostileT(0,e.team))c.push('패러사이트');
  if(e.hallu>0&&!hostileT(0,e.team))c.push('환상 '+Math.ceil(e.hallu)+'초');if(e.tl>0)c.push('남은 시간 '+Math.ceil(e.tl)+'초');
  if(TRANS[e.type]&&e.team===0)c.push('탑승 '+cargoUsed(e)+'/'+TRANS[e.type]);if(e.nuke)c.push('핵미사일 장전됨');
  if(UQ[e.type]&&!hostileT(0,e.team)){const q=UQ[e.type];c.push(q.n+' '+(e[q.k]||0)+'/'+uqCap(e)+(e.uq?' (+'+e.uq+' 생산 '+Math.floor((e.uqT||0)/q.time*100)+'%)':''))}
  if(e.smorph)c.push(DEF[e.smorph.to].n+' 변태 '+Math.floor(e.smorph.t/e.smorph.dur*100)+'%');if(e.type==='nydus'&&e.team===0)c.push(nyPair(e)?'출구 연결됨':'출구 없음');
  return c.map(s=>'<span>'+s+'</span>').join('')}

// --- drawing: original Magic.png animations when present, otherwise drawn effects
function spfx(key,x,y,f,k=1,alpha=1){const s=SPFX[key],im=s&&OA.img[s.img];if(!im||!useO())return false;const i=((f%s.L.length)+s.L.length)%s.L.length,sc=k*(s.sc||1),ga=ctx.globalAlpha;
  ctx.globalAlpha=ga*alpha;ctx.drawImage(im,s.L[i],s.T[i],s.w,s.h,x-s.w*sc/2,y-s.h*sc/2,s.w*sc,s.h*sc);ctx.globalAlpha=ga;return true}
// looping animation: hidden intro frames (index >= n) play once, then frames 0..n-1 loop
function spLoop(key,x,y,t,k,alpha){const s=SPFX[key];if(!s)return false;const intro=Math.max(0,s.L.length-s.n),f=Math.floor(t*10);return spfx(key,x,y,f<intro?s.n+f:f%s.n,k,alpha)}
function ring(x,y,r,col,a,w=2){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.ellipse(x,y,r,r*.72,0,0,TAU);ctx.stroke();ctx.restore()}
function blob(x,y,r,col,a){ctx.save();ctx.globalAlpha=a;const g=ctx.createRadialGradient(x,y,r*.1,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,r,r*.75,0,0,TAU);ctx.fill();ctx.restore()}
function drawSpells(T,inV,us){
  if(!G.fields)return;
  for(const f of G.fields){if(f.k!=='nuke'&&(!inV(f)||(f.team!==0&&!visAt(f.x,f.y))))continue;
    const a=clamp(Math.min(f.t/.3,(f.dur-f.t)/.6),0,1);
    if(f.k==='storm'){if(!spLoop('spPsionicStorm',f.x,f.y,f.t,.75,a)){blob(f.x,f.y,f.r*1.2,'rgba(150,120,255,.75)',a*.8);ctx.save();ctx.strokeStyle='#d9ccff';ctx.lineWidth=1.6;ctx.globalAlpha=a;for(let i=0;i<4;i++){const q=T*7+i*1.7;ctx.beginPath();let x=f.x+Math.cos(q)*f.r*.8,y=f.y+Math.sin(q)*f.r*.55;ctx.moveTo(x,y);for(let j=0;j<4;j++){x=f.x+(Math.random()-.5)*f.r*1.4;y=f.y+(Math.random()-.5)*f.r;ctx.lineTo(x,y)}ctx.stroke()}ctx.restore()}}
    else if(f.k==='swarm'){if(!spLoop('spDarkSwarm',f.x,f.y,f.t,1,a*.9)){for(let i=0;i<7;i++){const q=i*.9+T*.15;blob(f.x+Math.cos(q)*f.r*.45,f.y+Math.sin(q)*f.r*.32,f.r*.65,'rgba(40,30,20,.9)',a*.55)}}ring(f.x,f.y,f.r,'#a08060',a*.25,1)}
    else if(f.k==='web'){if(!spLoop('spDisruptionWeb',f.x,f.y,f.t,1,a)){ctx.save();ctx.globalAlpha=a*.7;ctx.strokeStyle='#8fe36a';ctx.lineWidth=1.2;for(let i=0;i<8;i++){const q=i/8*TAU+T*.4;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x+Math.cos(q)*f.r,f.y+Math.sin(q)*f.r*.72);ctx.stroke()}for(const k of [.35,.7,1])ring(f.x,f.y,f.r*k,'#8fe36a',a*.6,1);ctx.restore()}}
    else if(f.k==='nuke'){if(f.team!==0&&!visAt(f.x,f.y))continue;const g=byId.get(f.src),bl=.5+.5*Math.sin(T*12);
      if(g&&(f.team===0||visAt(g.x,g.y))&&!hiddenFrom(0,g)){ctx.save();ctx.strokeStyle='rgba(255,40,40,.35)';ctx.lineWidth=1;ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(g.x,g.y);ctx.lineTo(f.x,f.y);ctx.stroke();ctx.restore()}
      ctx.save();ctx.fillStyle=`rgba(255,30,30,${.6+.4*bl})`;circ(f.x,f.y,3.5);ctx.fill();ctx.restore();ring(f.x,f.y,10+6*bl,'#ff3030',.5);
      if(f.dur-f.t<2.2){const k=1-(f.dur-f.t)/2.2;ctx.save();ctx.fillStyle='#ffe0a0';ctx.globalAlpha=.9;ctx.beginPath();ctx.ellipse(f.x,f.y-260*(1-k),4,10,0,0,TAU);ctx.fill();ctx.restore()}}
  }
  for(const p of sfxL){const u=p.id&&byId.get(p.id),x=u?u.x:p.x,y=u?u.y:p.y,a=1-p.t/p.dur;
    if(p.k==='nukeflash'){blob(x,y,260*(.6+p.t*.3),'rgba(255,240,200,1)',a*.9);blob(x,y,140,'rgba(255,160,60,1)',a);continue}
    const key=FXK[p.k];if(!(key&&spfx(key,x,y-(u?6:0),Math.floor(p.t*10),1,1))){ring(x,y,10+p.t*50,FXC[p.k]||'#fff',a*.8,2.5);blob(x,y,24,FXC[p.k]||'#fff',a*.4)}}
  for(const e of us){const r=rad(e),y0=e.y-(DEF[e.type].fly?r*.8:0);
    if(e.stasis>0){if(!spLoop('spStasisField',e.x,y0,30-e.stasis,Math.max(.5,r/30),.85)){blob(e.x,y0,r*1.8,'rgba(120,200,255,.9)',.55);ring(e.x,y0,r*1.5,'#bfe9ff',.8)}}
    if(e.lock>0){if(!spLoop('spLockdown',e.x,y0,40-e.lock,Math.max(.45,r/40),.9)){for(let i=0;i<3;i++)ring(e.x,y0,r*(1+.25*i)+Math.sin(T*6+i)*2,'#8fe36a',.6)}}
    if(e.mael>0){if(!spLoop('spMaelStorm',e.x,y0,7-e.mael,Math.max(.4,r/40),.9))blob(e.x,y0,r*1.6,'rgba(190,110,255,.9)',.5+.2*Math.sin(T*9))}
    if(e.mx>0){if(!spLoop('spDefensiveMatrix',e.x,y0,60-e.mxT,Math.max(.5,r/28),.75)){ring(e.x,y0,r*1.45,'#7fd8ff',.5+.2*Math.sin(T*5),2.5)}}
    if(e.irr>0){if(!spLoop('spIrradiate',e.x,y0,25-e.irr,Math.max(.5,r/30),.8))blob(e.x,y0,r*2.2,'rgba(120,255,90,.8)',.4+.15*Math.sin(T*7))}
    if(e.plg>0){if(!spLoop('spPlague',e.x,y0+r*.3,25-e.plg,Math.max(.4,r/40),.7)){ctx.save();ctx.fillStyle='rgba(255,110,40,.8)';for(let i=0;i<3;i++){const q=(T*1.3+i/3)%1;circ(e.x+(i-1)*r*.5,y0-r*.4+q*r*1.3,1.8);ctx.fill()}ctx.restore()}}
    if(e.ens>0){if(!spLoop('spEnsnare',e.x,y0,20-e.ens,Math.max(.4,r/35),.75))blob(e.x,y0,r*1.5,'rgba(150,220,60,.9)',.4)}
    if(e.hallu>0&&!hostileT(0,e.team))ring(e.x,e.y+2,r*1.25,'#9fd8ff',.5+.3*Math.sin(T*4),1.5);
    if(e.para&&e.para[grpOf(0)]&&hostileT(0,e.team)){ctx.save();ctx.fillStyle='#ff5a7a';circ(e.x+r,y0-r,2.5);ctx.fill();ctx.restore()}
    if(e.order&&e.order.k==='cast'&&e.order.ph==='charge'){const k=e.order.ct/SP[e.order.sp].charge;additive(()=>glow(SPR.fire,e.x+Math.cos(e.face)*r,y0+Math.sin(e.face)*r,8+k*22,.5+.5*k))}
    if(e.order&&e.order.k==='cast'&&e.order.ph==='aim'&&(e.team===0||!e.cloak)){ctx.save();ctx.fillStyle='#ff3030';circ(e.x+Math.cos(e.face)*r,y0+Math.sin(e.face)*r,2);ctx.fill();ctx.restore()}
    if(e.type==='carrier'&&e.icp>0&&G.t-(e.atkT||-9)<1.2){const t=byId.get(e.tgt);if(t){ctx.save();ctx.fillStyle='#d8e6ff';for(let i=0;i<e.icp;i++){const q=T*3+i/e.icp*TAU;circ(t.x+Math.cos(q)*(rad(t)+14),t.y+Math.sin(q)*(rad(t)+10),1.8);ctx.fill()}ctx.restore()}}
    if(TRANS[e.type]&&e.cargo&&e.cargo.length&&e.team===0){ctx.save();ctx.fillStyle='#62e38a';for(let i=0;i<e.cargo.length;i++)ctx.fillRect(e.x-12+i*3.4,y0+r+4,2.4,3);ctx.restore()}
  }
  for(const b of G.ents){if(!isB(b)||b.dead||!inV(b)||!(b.team===0||G.explored[cellI(b.x,b.y)]))continue;
    if(b.type==='turret'&&b.cargo&&b.cargo.length){ctx.save();ctx.fillStyle=b.team===0?'#62e38a':HOST;for(let i=0;i<b.cargo.length;i++)ctx.fillRect(b.x-8+i*4.5,b.y+b.size/2+3,3,3);ctx.restore()}
    if(b.plg>0){ctx.save();ctx.fillStyle='rgba(255,110,40,.8)';for(let i=0;i<4;i++){const q=(T*1.1+i/4)%1;circ(b.x+(i-1.5)*b.size*.25,b.y-b.size*.3+q*b.size*.6,2.2);ctx.fill()}ctx.restore()}
    if(b.type==='shbat'&&b.bto)for(const id of b.bto){const u=byId.get(id);if(!u)continue;ctx.save();ctx.strokeStyle=`rgba(110,200,255,${.5+.3*Math.sin(T*20)})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,b.y-b.size*.2);ctx.lineTo(u.x,u.y);ctx.stroke();ctx.restore()}
    if(b.type==='nsilo'&&b.nuke&&b.team===0){additive(()=>glow(SPR.host,b.x,b.y-b.size*.2,12+3*Math.sin(T*4),.8))}
    if(b.smorph){const k=b.smorph.t/b.smorph.dur;ctx.save();ctx.strokeStyle='rgba(155,224,74,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,b.size*.55,-Math.PI/2,-Math.PI/2+TAU*k);ctx.stroke();ctx.restore();blob(b.x,b.y,b.size*.6,'rgba(120,40,90,.9)',.35+.1*Math.sin(T*4))}
    if(b.type==='nydus'&&b.pair&&b.team===0&&sel.includes(b.id)){const p=byId.get(b.pair);if(p){ctx.save();ctx.strokeStyle='rgba(155,224,74,.4)';ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.restore()}}
  }
}

// --- energy upgrades (max 200 -> 250), carrier interceptors, reaver scarabs, bunker
const ER={ghost:'moebius',medic:'caduceus',vessel:'titan',wraith:'apollo',bcruiser:'colossus',queen:'gamete',defiler:'metasyn',htemplar:'kamulet',darchon:'argtal',arbiter:'kcore',corsair:'argjewel'};
const upOf=e=>e.team===0?G.up:(AIS(e.team)||{}).up||{};
function spMax(e){const d=DEF[e.type];return (d.mp||0)+(e.team>=0&&ER[e.type]&&upOf(e)[ER[e.type]]>0?50:0)}
// carriers start with no interceptors and reavers with no scarabs: they are bought one at a time
const UQ={carrier:{k:'icp',n:'인터셉터',key:'I',cost:25,time:14,cap:4,capR:'ccap',d:'캐리어는 인터셉터가 있어야 공격하고, 많을수록 강해집니다'},
          reaver:{k:'scb',n:'스캐럽',key:'R',cost:15,time:5,cap:5,capR:'rcap',d:'리버는 공격할 때마다 스캐럽 1개를 씁니다'}};
const uqCap=e=>{const q=UQ[e.type];return q.cap*(upOf(e)[q.capR]>0?2:1)};
function updUQ(e,dt){const q=UQ[e.type];if(e.hallu||e.team<0)return;
  if(e.team>0&&!(e.uq>0)&&(e[q.k]||0)<uqCap(e)){const A=AIS(e.team);if(A&&A.money>=q.cost){A.money-=q.cost;e.uq=1;e.uqT=0}}
  if(e.uq>0){e.uqT=(e.uqT||0)+dt*bt(e.team);if(e.uqT>=q.time){e.uqT=0;e.uq--;e[q.k]=Math.min(uqCap(e),(e[q.k]||0)+1)}}}
function buyUQ(ty){const q=UQ[ty];const cs=selUnits().filter(u=>u.type===ty&&!u.hallu&&(u[q.k]||0)+(u.uq||0)<uqCap(u)&&(u.uq||0)<5);
  if(!cs.length){toast(q.n+'이(가) 가득 찼습니다','warn');return}if(!afford(q.cost,0))return;
  const u=cs.reduce((a,b)=>((b[q.k]||0)+(b.uq||0))<((a[q.k]||0)+(a.uq||0))?b:a);G.money-=q.cost;u.uq=(u.uq||0)+1;sfx('click')}
const canFire=e=>!webbed(e)&&!(UQ[e.type]&&isU(e)&&!(e[UQ[e.type].k]>0));
// called at the start of fire(): uses up a scarab, scales carrier damage with interceptors, interceptors can be shot down
function ammoFire(e,t,s){if(!isU(e)||!UQ[e.type])return s;
  if(e.type==='reaver'){e.scb=Math.max(0,(e.scb||0)-1);return upOf(e).scdmg>0?{...s,dmg:s.dmg+25}:s}
  const n=e.icp||0;let aa=0;for(const o of G.ents){if(o.dead||!hostile(e,o)||!DEF[o.type].dmg||Math.hypot(o.x-t.x,o.y-t.y)>220)continue;if(canHit(o,e))aa++}
  if(aa&&Math.random()<Math.min(.4,aa*.025))e.icp=Math.max(0,n-1);
  return {...s,dmg:s.dmg*n/4}}
// bunker: up to 4 infantry shoot out of it with +32 range; with no one inside it does not attack
function updBunker(b,dt){const cg=b.cargo||[];
  if(b.team>0&&(G.spF+b.id)%45===0&&cargoUsed(b)<4){let free=4-cargoUsed(b)-G.ents.filter(u=>u.team===b.team&&u.order&&u.order.k==='board'&&u.order.id===b.id).length;
    for(const u of G.ents){if(free<=0)break;if(u.team!==b.team||u.dead||!isU(u)||DEF[u.type].wk||!(DEF[u.type].range>10)||(u.order&&u.order.k!=='hold'&&u.order.k!=='move')||Math.hypot(u.x-b.x,u.y-b.y)>380||!canBoard(u,b))continue;setOrd(u,{k:'board',id:b.id});free--}}
  if(webbed(b))return;
  for(const u of cg){u.cd=Math.max(0,(u.cd||0)-dt);const D=DEF[u.type];if(!D.dmg||D.range<=10||u.cd>0)continue;
    const s={...st(u)};s.range+=32+b.size/2-rad(u);const px={id:b.id,type:u.type,team:b.team,x:b.x,y:b.y,face:b.face||0};
    let t=nearestHostile(px,s.range);if(!t)continue;fire(px,t,s);b.face=px.face;b.atkT=G.t;u.cd=s.cd}}
function ejectAll(b){const cg=b.cargo||[];b.cargo=[];cg.forEach((u,i)=>{const a=i/Math.max(1,cg.length)*TAU+.4;u.x=b.x+Math.cos(a)*(b.size/2+14);u.y=b.y+Math.sin(a)*(b.size/2+14);u.dead=false;u.order=null;placeGround(u);G.ents.push(u);byId.set(u.id,u)});if(cg.length&&b.team===0)sfx('click')}
Object.assign(CMD_IC,{'인터셉터 생산':'icp','스캐럽 생산':'scb'});Object.assign(SPIC,{icp:'Interceptor',scb:'Scarab'});Object.assign(GLY,{icp:'인',scb:'스'});
Object.assign(RESIC,{caduceus:'ResearchCaduceusReactor',moebius:'ResearchMoebiusReactor',titan:'ResearchTitanReactor',apollo:'ResearchApolloReactor',colossus:'ResearchColossusReactor',gamete:'EvolveGameteMeiosis',metasyn:'EvolveMetasynapticNode',kamulet:'DevelopKhaydarinAmulet',argtal:'DevelopArgusTalisman',kcore:'DevelopKhaydarinCore',argjewel:'DevelopArgusJewel',ccap:'IncreaseCarrierCapacity',rcap:'IncreaseReaverCapacity',scdmg:'UpgradeScarabDamage'});

// --- original heroes: drawn and voiced as their base unit with a gold aura
const HB={hbc:'bcruiser',hghost:'ghost',hvult:'vulture'};
const isVul=t=>t==='vulture'||t==='hvult';
for(const k in HB){const b=HB[k];if(ORIG_DATA.u[b])ORIG_DATA.u[k]=ORIG_DATA.u[b];SN[k]=SN[b];if(DEATH[b])DEATH[k]=DEATH[b];if(HIT[b])HIT[k]=HIT[b];if(MISSILE_U[b])MISSILE_U[k]=1;if(SLOT[b])SLOT[k]=SLOT[b]}
SP.lockdown.u.push('hghost');SP.nuke.u.push('hghost');SP.yamato.u.push('hbc');
function heroAura(e,T){const r=rad(e),y=e.y-(DEF[e.type].fly?r*.8:0);ctx.save();ctx.globalAlpha=e.cloak?.35:.75;ctx.strokeStyle='#ffd24a';ctx.lineWidth=1.6;ctx.setLineDash([4,4]);ctx.lineDashOffset=-T*12;ctx.beginPath();ctx.ellipse(e.x,y+r*.5,r*1.35,r*.7,0,0,TAU);ctx.stroke();ctx.restore()}

// ---------- loop ----------
let last=performance.now(),uiT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G&&started){
    // camera scroll
    const cs=900*dt/z;
    if(keys.ArrowLeft)cam.x-=cs; if(keys.ArrowRight)cam.x+=cs; if(keys.ArrowUp)cam.y-=cs; if(keys.ArrowDown)cam.y+=cs;
    if(mouse.in&&mouse.type==='mouse'&&!drag&&!paused){const m=10,at=mouse.sx<m||mouse.sx>VW-m||mouse.sy<m||mouse.sy>VH-m;mouse.edgeT=at?(mouse.edgeT||0)+dt:0;if(mouse.edgeT>.22){if(mouse.sx<m)cam.x-=cs;if(mouse.sx>VW-m)cam.x+=cs;if(mouse.sy<m)cam.y-=cs;if(mouse.sy>VH-m)cam.y+=cs}}else mouse.edgeT=0;
    clampCam();
    if(!paused&&!G.over){let rem=dt*speed;while(rem>1e-4&&!G.over){const s=Math.min(rem,.034);G.frame=(G.frame||0)+1;update(s);rem-=s}}
    if(!paused)updParts(dt);
    const w=toWorld(mouse.sx,mouse.sy);mouse.wx=w.x;mouse.wy=w.y;
  }else if(!started){cam.x+=dt*14;if(cam.x>WW-VW/z-10)cam.x=0;clampCam()}
  render(now);renderMini(now);renderPort(now);
  uiT-=dt;if(uiT<=0){uiT=.15;if(G&&started){renderTop();renderCard();renderInfo()}else{renderCard();renderInfo()}}
  if(G&&started){const hover=mouse.type==='mouse'&&mouse.in&&!placing?pick(mouse.wx,mouse.wy):null;cv.style.cursor=tmode?'cell':hover&&hostileT(0,hover.team)&&selUnits().length?'crosshair':hover?'pointer':'default'}
  requestAnimationFrame(frame);
}
function update(dt){
  for(const e of G.ents)if(e.r){e.px=e.x;e.py=e.y}
  G.t+=dt;
  if(navDirty)rebuildNav();
  pathBudget=10;
  for(const e of G.ents){if(e.dead)continue;const d=DEF[e.type];if(d.u)updUnit(e,dt);else if(d.b)updBld(e,dt)}
  updSpells(dt);
  collide(dt);updShots(dt);for(const t in G.ais)if(G.ents.some(e=>e.team===+t&&!e.dead))runAI(+t,dt);if(autoPlay)runAI(0,dt);
  fogT-=dt;if(fogT<=0){updFog();updDetect();checkRaceSeen();fogT=.12}
  cleanup();checkEnd();
}

// ---------- boot ----------
function start(data){
  resize();origLoad();
  if(data&&data.G){
    G=data.G;byId=new Map(G.ents.map(e=>[e.id,e]));
    G.up=G.up||{iw:0,ia:0,vw:0,va:0,stim:0,siege:0};G.gas=G.gas||0;G.gasMined=G.gasMined||0;
    for(const e of G.ents){e.pg=null;e.path=null}
    if(!G.ents.some(e=>e.type==='geyser'||DEF[e.type].gasb))for(const [x,y] of GEYSERS)spawn('geyser',-1,x,y);
    rebuildNav();cam=data.cam||cam;z=data.z||z;started=!G.over;diffPick=G.diff;updFog();
    if(started){paused=true;showPause()}else showStart();
  }else{
    cam.x=WW/2-VW/2;cam.y=WH/2-VH/2;clampCam();if(CAMPQ&&CAMP_BY[CAMPQ])showBriefing(CAMP_BY[CAMPQ]);else showStart();
  }
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(()=>({G:started&&G?JSON.parse(JSON.stringify(G)):null,cam:{...cam},z}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
