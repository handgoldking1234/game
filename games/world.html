<title>에너지 월드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 화면 가득 횡스크롤 사냥터, 아래 상태 막대(레벨·HP·MP·경험치·스킬 칸), 오른쪽 위 퀘스트 알림, 휴대폰은 아래 터치 버튼 */
:root{
  color-scheme:light;
  --ink:#1d2939; --muted:#5d6b7c; --paper:#ffffff; --paper2:#f1f5f9; --line:#d6dee8;
  --hp:#ef4444; --mp:#3e7bfa; --exp:#facc15; --leaf:#22a065; --leaf-soft:#dcf5e8; --alarm-soft:#fde2e2; --sky:#3e7bfa; --sun:#ffc83d;
  --bar:#1e2a3a; --bar2:#2b3a4f;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:#0f1522}
body{margin:0;overflow:hidden;font-family:var(--f-body);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}

#mapName{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left,0px));top:max(10px,env(safe-area-inset-top,0px));background:rgba(30,42,58,.85);color:#fff;border-radius:10px;padding:5px 12px;font-family:var(--f-display);font-size:16px;pointer-events:none}
#topBtns{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left,0px));top:calc(max(10px,env(safe-area-inset-top,0px)) + 38px);display:flex;gap:6px}
.hb{border:0;background:rgba(255,255,255,.9);border-radius:10px;padding:5px 10px;font-size:12.5px}
#quest{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right,0px));top:max(10px,env(safe-area-inset-top,0px));width:min(260px,46vw);background:rgba(255,255,255,.92);border-radius:12px;padding:8px 11px;font-size:13px;line-height:1.45;pointer-events:none}
#quest:empty{display:none}
#quest b{font-family:var(--f-display);font-weight:400;font-size:15px;display:block;color:#b45309}
#quest .ok{color:var(--leaf)}

#bar{position:fixed;z-index:5;left:0;right:0;bottom:0;background:linear-gradient(var(--bar2),var(--bar));color:#fff;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;
  padding-block:6px max(6px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#expLine{position:absolute;left:0;right:0;top:-6px;height:6px;background:#0b1220}
#expLine i{display:block;height:100%;background:var(--exp);transition:width .3s}
#lvBox{font-family:var(--f-display);font-size:17px;white-space:nowrap}
#lvBox small{font-family:var(--f-body);font-size:12px;color:#cbd5e1;margin-left:4px}
.gauge{display:grid;gap:2px;min-width:110px;flex:1;max-width:220px}
.gauge span{font-size:11px;color:#cbd5e1;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.gauge .tr{height:9px;border-radius:5px;background:#0b1220;overflow:hidden}
.gauge .tr i{display:block;height:100%;transition:width .2s}
#slots{display:flex;gap:5px;margin-left:auto}
.slot{position:relative;width:46px;height:46px;border-radius:9px;background:#0b1220;border:1px solid #475569;display:grid;place-items:center;overflow:hidden;padding:0}
.slot canvas{width:34px;height:34px}
.slot .k{position:absolute;left:3px;top:1px;font-size:10px;color:#fde047;font-family:var(--f-display)}
.slot .n{position:absolute;right:3px;bottom:1px;font-size:10px;color:#fff}
.slot .cd{position:absolute;inset:0;background:rgba(0,0,0,.6);transform-origin:bottom;pointer-events:none}
.slot.lock{opacity:.35}
.slot.lock::after{content:attr(data-lv);position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#fff;background:rgba(0,0,0,.4)}
#coins{font-size:13px;white-space:nowrap;color:#fde68a}

#toast{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top,0px)) + 46px);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(520px,70vw);pointer-events:none}
.toast{background:rgba(15,23,42,.9);color:#fff;border-radius:10px;padding:6px 12px;font-size:13.5px;text-align:center;animation:tin .25s}
.toast.good{background:rgba(21,128,61,.94)}.toast.lv{background:linear-gradient(90deg,#f59e0b,#facc15);color:#3b2a00;font-family:var(--f-display);font-size:18px}
.toast.bad{background:rgba(185,28,28,.94)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

#pad{position:fixed;z-index:5;left:0;right:0;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#pad .grp{display:grid;gap:7px;pointer-events:auto}
#dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px)}
#acts{grid-template-columns:repeat(4,54px);grid-template-rows:repeat(2,54px)}
.pb{border:0;border-radius:14px;background:rgba(255,255,255,.82);font-family:var(--f-display);font-size:15px;line-height:1.05;box-shadow:0 4px 0 rgba(0,0,0,.25);touch-action:none;padding:0}
.pb.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.pb.atk{background:rgba(239,68,68,.9);color:#fff}.pb.jmp{background:rgba(250,204,21,.95)}
.pb.sk{background:rgba(62,123,250,.9);color:#fff}.pb.sk:disabled{opacity:.4}
@media (hover:none),(pointer:coarse){#pad{display:flex}}
@media (max-width:440px){#dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px)}#acts{grid-template-columns:repeat(4,48px);grid-template-rows:repeat(2,48px);gap:6px}.pb{font-size:13px;border-radius:12px}}

#ov{position:fixed;inset:0;z-index:20;background:rgba(10,15,28,.66);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);border-radius:20px;width:min(600px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:12px}
.card.wide{width:min(900px,100%)}
.card h1,.card h2,.card h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.card h1{font-size:clamp(34px,7vw,52px);line-height:1.05}
.card h2{font-size:24px}.card h3{font-size:17px}
.card p{margin:0;line-height:1.65}
.eyebrow{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.btn{font-family:var(--f-display);font-size:18px;border:0;border-radius:12px;padding:10px 18px;background:var(--leaf);color:#fff}
.btn.alt{background:var(--paper2);color:var(--ink)}.btn.blue{background:var(--sky)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.jobs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.job{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px;display:grid;gap:5px;text-align:left;align-content:start}
.job canvas{width:100%;height:auto;aspect-ratio:4/3;border-radius:10px}
.job b{font-family:var(--f-display);font-weight:400;font-size:19px}
.job small{color:var(--muted);font-size:12.5px;line-height:1.45}
.job[aria-pressed="true"]{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky) inset;background:#eef4ff}
.dlg{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.dlg canvas{width:72px;height:90px;border-radius:12px;background:var(--paper2)}
.box{background:var(--paper2);border-radius:14px;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.box ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px;line-height:1.55}
.box.tip{background:#fff6d6}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px;font-size:13.5px}
.keys div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0}
.keys kbd{font-family:var(--f-display);color:var(--sky)}
.choice{text-align:left;background:var(--paper2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15.5px}
.choice:hover:not(:disabled){border-color:var(--sky)}
.choice.right{border-color:var(--leaf);background:var(--leaf-soft)}.choice.wrong{border-color:#ef4444;background:var(--alarm-soft)}
.note{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6}
.note.good{background:var(--leaf-soft)}.note.bad{background:var(--alarm-soft)}.note.info{background:#e6efff}
.sk{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;font-size:13.5px;line-height:1.45}
.sk canvas{width:40px;height:40px;border-radius:8px;background:#0b1220}
@media (max-width:700px){.jobs{grid-template-columns:1fr}.job{grid-template-columns:110px 1fr;align-items:center}.job canvas{grid-row:span 3}.cols,.keys{grid-template-columns:1fr}
  .gauge{min-width:70px}#slots .slot{width:38px;height:38px}#slots .slot canvas{width:28px;height:28px}#quest{font-size:12px;width:min(200px,50vw)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<canvas id="game" aria-label="게임 화면"></canvas>
<div id="mapName">햇살 마을</div>
<div id="topBtns"><button class="hb" id="helpBtn" type="button">게임 방법</button><button class="hb" id="skillBtn" type="button">스킬</button><button class="hb" id="pauseBtn" type="button">일시정지</button></div>
<div id="quest"></div>
<div id="toast" aria-live="polite"></div>
<div id="pad">
  <div class="grp" id="dpad">
    <span></span><button class="pb" id="pU" type="button" aria-label="위">▲</button><span></span>
    <button class="pb" id="pL" type="button" aria-label="왼쪽">◀</button><button class="pb" id="pD" type="button" aria-label="아래">▼</button><button class="pb" id="pR" type="button" aria-label="오른쪽">▶</button>
  </div>
  <div class="grp" id="acts">
    <button class="pb sk" id="pS1" type="button">스킬1</button><button class="pb sk" id="pS2" type="button">스킬2</button><button class="pb sk" id="pS3" type="button">스킬3</button><button class="pb" id="pQ" type="button">물약</button>
    <button class="pb" id="pT" type="button">대화<br>포탈</button><span></span><button class="pb atk" id="pA" type="button">공격</button><button class="pb jmp" id="pJ" type="button">점프</button>
  </div>
</div>
<div id="bar">
  <div id="expLine"><i id="expBar"></i></div>
  <div id="lvBox">Lv.<span id="lv">1</span><small id="job">태양 마법사</small></div>
  <div class="gauge"><span><b>HP</b><em id="hpT">100/100</em></span><div class="tr"><i id="hpB" style="background:var(--hp)"></i></div></div>
  <div class="gauge"><span><b>MP</b><em id="mpT">50/50</em></span><div class="tr"><i id="mpB" style="background:var(--mp)"></i></div></div>
  <div class="gauge"><span><b>EXP</b><em id="expT">0%</em></span><div class="tr"><i id="expB2" style="background:var(--exp)"></i></div></div>
  <div id="coins">⚡ 0 코인</div>
  <div id="slots"></div>
</div>
<div id="ov"></div>

<script>
/* ============ 기본 ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const bat=s=>{const c=s.charCodeAt(s.length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0};
const VH0=600;   // 화면 논리 높이

/* ============ 직업과 스킬 ============ */
const JOBS={
  sun:{n:'태양 마법사',c:'#f59e0b',hair:'#7c2d12',hpM:1,energy:'태양 에너지',

    style:'멀리서 햇빛 마법을 쏘는 원거리 직업',
    sk:[{n:'햇빛 구슬',lv:1,mp:0,cd:.45,kind:'orb',mult:1,d:'햇빛 구슬을 앞으로 던져요.'},
        {n:'태양 광선',lv:2,mp:8,cd:2.2,kind:'beam',mult:1.7,d:'앞으로 길게 뻗는 광선. 여러 몬스터를 뚫어요.'},
        {n:'햇살 폭발',lv:4,mp:15,cd:5,kind:'nova',mult:2.4,d:'주변에 햇빛을 터뜨려 둘레의 몬스터를 공격해요.'},
        {n:'태양 폭풍',lv:6,mp:28,cd:11,kind:'storm',mult:1.6,d:'하늘에서 햇빛 기둥 여러 개가 내리꽂혀요.'}]},
  wind:{n:'바람 궁수',c:'#10b981',hair:'#1e3a8a',hpM:1.1,energy:'바람 에너지',

    style:'빠르게 화살을 쏘는 원거리 직업',

        {n:'세 갈래 화살',lv:2,mp:8,cd:1.8,kind:'tri',mult:1.1,d:'화살 세 발을 부채꼴로 쏴요.'},
        {n:'회오리',lv:4,mp:15,cd:5.5,kind:'tornado',mult:.9,d:'천천히 나아가며 여러 번 때리는 회오리를 만들어요.'},
        {n:'폭풍 화살비',lv:6,mp:28,cd:11,kind:'rain',mult:1.2,d:'앞쪽 넓은 곳에 화살비를 내려요.'}]},
  geo:{n:'지열 전사',c:'#ef4444',hair:'#292524',hpM:1.35,energy:'지열 에너지',
    fact:'땅속 깊은 곳은 아주 뜨거워요. 그 열로 물을 데워 증기를 만들고 발전기를 돌려요. 밤낮, 날씨와 상관없이 일정해요.',
    style:'튼튼한 몸으로 가까이에서 싸우는 근접 직업',
    sk:[{n:'지열 베기',lv:1,mp:0,cd:.5,kind:'slash',mult:1.4,d:'앞을 크게 베어요.'},
        {n:'용암 돌진',lv:2,mp:8,cd:2.6,kind:'dash',mult:1.9,d:'앞으로 빠르게 돌진하며 베어요.'},
        {n:'땅 울림',lv:4,mp:15,cd:5,kind:'quake',mult:2.6,d:'땅을 내리쳐 양옆의 몬스터를 공격해요.'},
        {n:'화산 분출',lv:6,mp:28,cd:11,kind:'erupt',mult:2.2,d:'앞으로 용암 기둥이 차례로 솟아올라요.'}]}
};
const SKKEY=['Z','X','C','V'];

/* ============ 몬스터 ============ */
const MOB={
  smog:{n:'꼬마 스모그',lv:1,hp:32,atk:7,exp:7,coin:[2,4],drop:['sunShard',.5],w:34,h:30,spd:40},
  slime:{n:'기름 슬라임',lv:3,hp:80,atk:13,exp:15,coin:[4,7],drop:['windShard',.45],w:36,h:28,spd:55},

};

  wind:{n:'바람 언덕',w:2300,bg:'wind',

    ladders:[{x:770,y1:310,y2:G0}],

    portals:[{x:40,to:'wind',tx:2180,label:'← 바람 언덕'}],
    mobs:[['golem',400,0],['golem',700,0],['golem',360,400],['golem',780,310],['golem',1180,400],['golem',1100,0]]}
};

let S,P,M,mobs=[],fx=[],drops=[],dmgs=[],parts=[],cam={x:0},jobPick='sun';
function newGame(job){
  S={job,lv:1,exp:0,coin:0,pot:5,inv:{sunShard:0,windShard:0,coal:0},q:0,qState:'none',kills:{},paused:false,started:true,ended:false,quizOK:0,quizTry:0,bossDead:false,switchOff:false,qpool:shuffle(QUIZ.slice())};
  const J=JOBS[job];
  P={x:200,y:G0-48,w:24,h:48,vx:0,vy:0,on:true,face:1,climb:null,inv:0,walk:0,act:0,actK:0,cd:[0,0,0,0],dash:0};
  stats(); P.hp=P.maxhp; P.mp=P.maxmp;
  loadMap('town',200);
  buildSlots(); renderBar(); renderQuest(); resize();
}
function stats(){const J=JOBS[S.job];P.maxhp=Math.round((100+(S.lv-1)*28)*J.hpM);P.maxmp=50+(S.lv-1)*10;P.atk=10+(S.lv-1)*5}
const needExp=lv=>Math.round(25*lv*lv+15*lv);
function loadMap(id,x){
  M=MAPS[id];M.id=id;mobs=[];fx=[];drops=[];dmgs=[];parts=[];
  for(const [k,mx,py] of M.mobs)mobs.push(mkMob(k,mx,py));
  if(id==='factory'&&S.q===4&&S.qState==='active'&&!S.bossDead)mobs.push(mkMob('boss',1650,0));
  P.x=x;P.y=G0-P.h;P.vx=P.vy=0;P.climb=null;P.inv=1;
  $('mapName').textContent=M.n;
  cam.x=clamp(P.x-viewW()/2,0,Math.max(0,M.w-viewW()));
}
function mkMob(k,x,py){const d=MOB[k];const plat=py?M.plats.find(p=>p.y===py&&x>=p.x&&x<=p.x+p.w):null;
  const lo=plat?plat.x:60,hi=plat?plat.x+plat.w:M.w-60;const y=(plat?plat.y:G0)-d.h;
  return {k,x,y,sx:x,sy:y,lo,hi,w:d.w,h:d.h,hp:d.hp,max:d.hp,dir:Math.random()<.5?-1:1,t:rnd(0,5),hitT:0,aggro:0,dead:0,resp:0,vy:0,atkT:0,fl:0}}

/* ============ 입력 ============ */
const key={},tp={l:0,r:0,u:0,d:0};
addEventListener('keydown',e=>{
  if(!$('ov').hidden){ if(e.key==='Escape'&&$('ovClose'))$('ovClose').click(); if(e.key==='Enter'&&$('goBtn')){e.preventDefault();$('goBtn').click()} return }
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  if(!key[e.key]){
    const k=e.key.toUpperCase();
    if(e.key===' '||e.key==='Alt')jump();
    const si=SKKEY.indexOf(k); if(si>=0)useSkill(si);
    if(k==='Q')usePot();
    if(e.key==='ArrowUp')interact();
    if(k==='P')togglePause();
  }
  key[e.key]=true});
addEventListener('keyup',e=>key[e.key]=false);
addEventListener('blur',()=>{for(const k in key)key[k]=false;for(const k in tp)tp[k]=0;atkHeld=0});
let atkHeld=0;
function hold(id,on,off){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');on()});
  const end=()=>{b.classList.remove('on');off&&off()};b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end)}
hold('pL',()=>tp.l=1,()=>tp.l=0);hold('pR',()=>tp.r=1,()=>tp.r=0);
hold('pU',()=>{tp.u=1;interact()},()=>tp.u=0);hold('pD',()=>tp.d=1,()=>tp.d=0);
hold('pJ',()=>jump());hold('pA',()=>{atkHeld=1;useSkill(0)},()=>atkHeld=0);
hold('pS1',()=>useSkill(1));hold('pS2',()=>useSkill(2));hold('pS3',()=>useSkill(3));hold('pQ',()=>usePot());hold('pT',()=>interact());

/* ============ 플레이어 ============ */
const GRAV=1650,JUMP=690,SPD=190;
const L=()=>key.ArrowLeft||tp.l, Rk=()=>key.ArrowRight||tp.r, U=()=>key.ArrowUp||tp.u, D=()=>key.ArrowDown||tp.d;
function jump(){if(!S||!S.started||S.paused||!$('ov').hidden)return;
  if(P.climb){P.climb=null;P.vy=-JUMP*.75;P.vx=(Rk()?1:L()?-1:0)*SPD;return}
  if(!P.on)return;
  if(D()&&P.platY!==G0){P.drop=.25;P.on=false;P.y+=4;return}
  P.vy=-JUMP;P.on=false}
function ladderAt(){return M.ladders.find(l=>Math.abs(P.x+P.w/2-l.x)<16&&P.y+P.h>=l.y1-4&&P.y<=l.y2)}
function updPlayer(dt){
  if(P.inv>0)P.inv-=dt; if(P.act>0)P.act-=dt; for(let i=0;i<4;i++)if(P.cd[i]>0)P.cd[i]-=dt;
  P.mp=Math.min(P.maxmp,P.mp+(3+S.lv*.4)*dt);
  if(atkHeld||key.z||key.Z)useSkill(0);
  if(P.dash>0){P.dash-=dt;P.x+=P.face*620*dt;P.x=clamp(P.x,0,M.w-P.w);return}
  // 사다리
  const lad=ladderAt();
  if(!P.climb&&lad&&(U()&&P.y+P.h>lad.y1+6||D()&&P.on&&P.y+P.h<=lad.y1+6)){P.climb=lad;P.x=lad.x-P.w/2;P.vx=0;P.vy=0}
  if(P.climb){const l=P.climb,dy=(D()?1:0)-(U()?1:0);P.y+=dy*130*dt;P.walk+=dy?dt:0;
    if(P.y+P.h<l.y1-2){P.y=l.y1-P.h;P.climb=null;P.on=true;P.platY=l.y1;P.vy=0}
    else if(P.y+P.h>=l.y2){P.y=l.y2-P.h;P.climb=null;P.on=true;P.platY=l.y2}
    return}
  const ax=(Rk()?1:0)-(L()?1:0);
  if(P.act>0&&P.on&&JOBS[S.job].sk[0].kind==='slash')P.vx*=.8;
  else if(ax){P.vx=ax*SPD;P.face=ax;P.walk+=dt}else P.vx*=Math.pow(.001,dt);
  P.vy=Math.min(P.vy+GRAV*dt,900);
  if(P.drop>0)P.drop-=dt;
  const pb=P.y+P.h; P.x=clamp(P.x+P.vx*dt,0,M.w-P.w); P.y+=P.vy*dt; P.on=false;
  if(P.vy>=0){
    for(const s of surfaces()){ if(P.drop>0&&s.y!==G0)continue;
      if(P.x+P.w>s.x+4&&P.x<s.x+s.w-4&&pb<=s.y+2&&P.y+P.h>=s.y){P.y=s.y-P.h;P.vy=0;P.on=true;P.platY=s.y;break}}
  }
}
function surfaces(){return [...M.plats,{x:0,y:G0,w:M.w}]}
function interact(){
  if(!S||!S.started||S.paused||!$('ov').hidden)return;
  const cx=P.x+P.w/2;
  const po=M.portals.find(p=>Math.abs(p.x-cx)<40&&P.y+P.h>G0-10);
  if(po){toast(`${MAPS[po.to].n}(으)로 이동해요.`);loadMap(po.to,po.tx);renderQuest();return}
  const n=M.npcs.find(n=>Math.abs(n.x-cx)<60&&P.y+P.h>G0-10);
  if(n){talk(n);return}
  if(M.id==='factory'&&S.bossDead&&!S.switchOff&&Math.abs(1800-cx)<70){S.switchOff=true;finale();}
}

/* ============ 스킬 ============ */
function useSkill(i){
  if(!S||!S.started||S.paused||!$('ov').hidden||P.climb)return;
  const sk=JOBS[S.job].sk[i];
  if(S.lv<sk.lv){if(i>0)toast(`${sk.n}은(는) Lv.${sk.lv}부터 쓸 수 있어요.`);return}
  if(P.cd[i]>0)return;
  if(P.mp<sk.mp){toast('MP가 부족해요. 잠깐 기다리면 다시 차요.');return}
  P.mp-=sk.mp;P.cd[i]=sk.cd;P.act=.25;P.actK=i;
  const f=P.face,cx=P.x+P.w/2,cy=P.y+P.h/2,d=P.atk*sk.mult,J=S.job;
  const add=o=>fx.push(Object.assign({hits:new Set(),life:.3,dmg:d,job:J,kind:sk.kind,t:0},o));
  switch(sk.kind){
    case 'orb':add({x:cx+f*14-10,y:cy-14,w:20,h:20,vx:f*460,life:.9});break;
    case 'arrow':add({x:cx+f*14-12,y:cy-6,w:24,h:8,vx:f*700,life:.75,f});break;
    case 'slash':add({x:f>0?cx:cx-96,y:P.y-6,w:96,h:P.h+10,life:.18,f,max:3});break;
    case 'beam':add({x:f>0?cx:cx-420,y:cy-16,w:420,h:30,life:.3,f,pierce:1});break;
    case 'tri':for(const a of [-.18,0,.18])add({x:cx-12,y:cy-6,w:24,h:8,vx:f*680*Math.cos(a),vy:680*Math.sin(a),life:.7,f});break;
    case 'dash':P.dash=.28;P.inv=Math.max(P.inv,.4);add({x:0,y:P.y,w:70,h:P.h,life:.3,follow:1,f,pierce:1});break;
    case 'nova':add({x:cx-150,y:cy-110,w:300,h:200,life:.35,pierce:1,max:8});break;
    case 'tornado':add({x:cx+f*20-26,y:P.y+P.h-80,w:52,h:80,vx:f*150,life:2.6,pierce:1,multi:.28});break;
    case 'quake':add({x:cx-170,y:P.y+P.h-60,w:340,h:70,life:.35,pierce:1,max:8});break;
    case 'storm':for(let k=0;k<6;k++)setTimeout(()=>{if(!S.paused)add({x:cx+f*(60+k*90)-30,y:P.y-200,w:60,h:P.h+200,life:.3,pierce:1,delay:0})},k*110);break;
    case 'rain':for(let k=0;k<8;k++)setTimeout(()=>{if(!S.paused)add({x:cx+f*(rnd(40,560))-24,y:P.y-160,w:48,h:P.h+160,life:.25,pierce:1})},k*90);break;
    case 'erupt':for(let k=0;k<6;k++)setTimeout(()=>{if(!S.paused)add({x:cx+f*(70+k*85)-32,y:G0-160,w:64,h:160,life:.35,pierce:1,ground:1})},k*120);break;
  }
}
function usePot(){if(!S||!S.started||S.paused)return;if(S.pot<=0){toast('물약이 없어요. 마을 충전소 상인에게 살 수 있어요.');return}if(P.hp>=P.maxhp)return;
  S.pot--;P.hp=Math.min(P.maxhp,P.hp+Math.round(P.maxhp*.5));popDmg(P.x+12,P.y-10,'+'+Math.round(P.maxhp*.5),'#22c55e');renderBar()}

/* ============ 진행 ============ */
function update(dt){
  updPlayer(dt);
  // 스킬 판정
  for(const f of fx){f.t+=dt;f.life-=dt;
    if(f.follow){f.x=P.x+P.w/2+(f.f>0?0:-70);f.y=P.y}
    if(f.vx)f.x+=f.vx*dt; if(f.vy)f.y+=f.vy*dt;
    if(f.multi){f.mt=(f.mt||0)+dt;if(f.mt>=f.multi){f.mt=0;f.hits.clear()}}
    for(const m of mobs){ if(m.dead||f.hits.has(m))continue; if(f.max&&f.hits.size>=f.max)break;
      if(f.x<m.x+m.w&&f.x+f.w>m.x&&f.y<m.y+m.h&&f.y+f.h>m.y){f.hits.add(m);hitMob(m,f);if(!f.pierce&&!f.max&&!f.multi){f.life=0;break}}}
  }
  fx=fx.filter(f=>f.life>0&&f.x>-200&&f.x<M.w+200);
  // 몬스터
  for(const m of mobs){
    if(m.dead){m.resp-=dt;if(m.resp<=0&&m.k!=='boss'){Object.assign(m,mkMob(m.k,m.sx,0),{x:m.sx,y:m.sy,sy:m.sy,lo:m.lo,hi:m.hi});m.dead=0}continue}
    m.t+=dt; if(m.hitT>0)m.hitT-=dt; if(m.fl>0)m.fl-=dt; if(m.aggro>0)m.aggro-=dt;
    const d=MOB[m.k], px=P.x+P.w/2, mx=m.x+m.w/2, same=Math.abs((P.y+P.h)-(m.y+m.h))<50||m.k==='boss';
    let dir=m.dir;
    if(m.aggro>0&&same){dir=Math.sign(px-mx)||1}
    else if(Math.random()<dt*.4)m.dir*=-1;
    if(m.hitT<=0){
      let sp=d.spd*(m.aggro>0?1.6:1);
      if(m.k==='slime'){m.vy+=GRAV*dt;m.y+=m.vy*dt;if(m.y>=m.sy){m.y=m.sy;m.vy=m.t%1.4<.05?-320:0;if(m.vy===0&&Math.random()<dt*1.5)m.vy=-300}}
      if(m.k==='boss'){m.atkT-=dt;if(m.atkT<=0){m.atkT=rnd(2.5,3.5);bossAttack(m)}if(Math.abs(px-mx)<120)sp=0}
      m.x+=dir*sp*dt; m.dir=dir;
      if(m.x<m.lo){m.x=m.lo;m.dir=1}if(m.x+m.w>m.hi){m.x=m.hi-m.w;m.dir=-1}
    }
    // 닿으면 피해
    if(P.inv<=0&&!P.climb&&P.x<m.x+m.w-6&&P.x+P.w>m.x+6&&P.y<m.y+m.h-4&&P.y+P.h>m.y+6)hurt(d.atk,Math.sign(px-mx)||1);
  }
  // 보스 탄
  for(const f of bfx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt;if(P.inv<=0&&f.life>0&&Math.abs(f.x-(P.x+P.w/2))<f.r+10&&Math.abs(f.y-(P.y+P.h/2))<f.r+20){f.life=0;hurt(18,Math.sign(f.vx)||1)}}
  bfx=bfx.filter(f=>f.life>0);
  // 떨어진 물건
  for(const it of drops){it.vy=Math.min(it.vy+GRAV*dt,700);it.y+=it.vy*dt;it.t+=dt;
    const floor=surfaces().filter(s=>it.x>=s.x&&it.x<=s.x+s.w&&s.y>=it.y0-2).sort((a,b)=>a.y-b.y)[0];
    if(floor&&it.y>=floor.y-14){it.y=floor.y-14;it.vy=0}
    if(it.t>.4&&Math.abs(it.x-(P.x+P.w/2))<30&&Math.abs(it.y-(P.y+P.h/2))<40){it.got=1;getDrop(it)}}
  drops=drops.filter(i=>!i.got&&i.t<60);
  dmgs=dmgs.filter(d=>(d.l-=dt)>0).map(d=>(d.y-=40*dt,d));
  parts=parts.filter(p=>(p.l-=dt)>0).map(p=>(p.x+=p.vx*dt,p.y+=p.vy*dt,p.vy+=300*dt,p));
  if(P.y>G0+200){P.y=G0-P.h}
  cam.x+=(clamp(P.x-viewW()/2+P.w/2,0,Math.max(0,M.w-viewW()))-cam.x)*Math.min(1,dt*8);
  hudT-=dt;if(hudT<=0){hudT=.15;renderBar();renderSlots()}
}
let bfx=[],hudT=0;
function bossAttack(m){
  const mx=m.x+m.w/2,my=m.y+m.h/2,px=P.x+P.w/2,dir=Math.sign(px-mx)||1;
  if(Math.random()<.55){for(let k=-1;k<=1;k++)bfx.push({x:mx+dir*50,y:my+k*14,vx:dir*rnd(200,260),vy:k*30,r:16,life:3})}
  else{for(let k=0;k<2;k++){const s=mkMob('smog',clamp(mx+rnd(-200,200),80,M.w-80),0);s.aggro=10;s.minion=1;mobs.push(s)}toast('매연 대왕이 스모그를 불러냈어요!','bad')}
}
function hitMob(m,f){

function killMob(m){

  if(g.kill)o.push([MOB[g.kill].n+' 정화',Math.min(g.n,(S.kills[g.kill]||0)-(S.qBase||0)),g.n]);
  if(g.item)o.push([ITEMS[g.item].n+' 모으기',Math.min(g.in||g.n,S.inv[g.item]),g.in||g.n]);
  if(g.boss)o.push(['매연 대왕 물리치기',S.bossDead?1:0,1],['발전소 스위치 끄기',S.switchOff?1:0,1]);

  // 무기

    case 'storm':{const g=x.createLinearGradient(0,f.y,0,f.y+f.h);g.addColorStop(0,'rgba(253,224,71,0)');g.addColorStop(1,'rgba(255,251,200,.95)');x.fillStyle=g;x.fillRect(f.x+10,f.y,f.w-20,f.h);circ(x,f.x+f.w/2,f.y+f.h,22,'rgba(253,224,71,.6)');break}
    case 'rain':x.strokeStyle='rgba(209,250,229,.9)';x.lineWidth=2;for(let k=0;k<4;k++){const X=f.x+k*12,Y=f.y+((f.t*900+k*40)%f.h);x.beginPath();x.moveTo(X,Y-24);x.lineTo(X,Y);x.stroke()}break;
    case 'erupt':{const h=f.h*(1-Math.abs(.5-(.35-f.life)/.35)*1.4);const g=x.createLinearGradient(0,G0-h,0,G0);g.addColorStop(0,'#fde047');g.addColorStop(1,'#ef4444');x.fillStyle=g;rr(x,f.x+12,G0-Math.max(10,h),f.w-24,Math.max(10,h),12,g);break}
  }
  x.restore();
}

/* ============ UI ============ */
const ov=$('ov');
function openOv(h){ov.innerHTML=h;ov.hidden=false;S&&(S.paused=true);const b=ov.querySelector('.btn,.choice');if(b)b.focus()}
function closeOv(){ov.hidden=true;ov.innerHTML='';if(S&&!S.ended)S.paused=!!S.userPause}
function toast(m,c){const t=document.createElement('div');t.className='toast '+(c||'');t.textContent=m;$('toast').appendChild(t);while($('toast').children.length>3)$('toast').firstChild.remove();setTimeout(()=>t.remove(),3800)}
function renderBar(){
  if(!S)return;
  $('lv').textContent=S.lv;$('job').textContent=JOBS[S.job].n;
  $('hpT').textContent=`${Math.ceil(P.hp)}/${P.maxhp}`;$('hpB').style.width=P.hp/P.maxhp*100+'%';
  $('mpT').textContent=`${Math.floor(P.mp)}/${P.maxmp}`;$('mpB').style.width=P.mp/P.maxmp*100+'%';
  const e=S.lv>=10?100:S.exp/needExp(S.lv)*100;$('expT').textContent=S.lv>=10?'MAX':e.toFixed(1)+'%';$('expB2').style.width=e+'%';$('expBar').style.width=e+'%';
  $('coins').textContent=`⚡ ${S.coin} 코인 · 물약 ${S.pot}`;
}
function skIcon(c,job,i){const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.scale(c.width/40,c.height/40);const J=JOBS[job],col=J.c;
  x.fillStyle='#0b1220';x.fillRect(0,0,40,40);
  if(i===4){rr(x,14,8,12,24,4,'#ef4444','#fff',2);x.fillStyle='#fff';x.fillRect(17,4,6,5);return}
  const k=J.sk[i].kind;
  if(k==='orb'){circ(x,20,20,9,'#fde047','#f59e0b',2)}
  if(k==='beam'){x.fillStyle='#fde047';x.fillRect(4,16,32,8);circ(x,8,20,7,'#fff')}
  if(k==='nova'){for(let r=6;r<18;r+=5)circ(x,20,20,r,null,'#facc15',2)}
  if(k==='storm'){for(let j=0;j<3;j++){x.fillStyle='#fde047';x.fillRect(8+j*10,4,5,28)}}
  if(k==='arrow'){x.strokeStyle='#e2e8f0';x.lineWidth=2;x.beginPath();x.moveTo(6,30);x.lineTo(32,8);x.stroke();x.fillStyle=col;x.beginPath();x.moveTo(34,6);x.lineTo(26,9);x.lineTo(31,14);x.fill()}
  if(k==='tri'){x.strokeStyle='#e2e8f0';x.lineWidth=2;for(const a of [-.5,0,.5]){x.beginPath();x.moveTo(8,20);x.lineTo(8+26*Math.cos(a),20+26*Math.sin(a));x.stroke()}}
  if(k==='tornado'){for(let j=0;j<5;j++){x.strokeStyle='#a7f3d0';x.lineWidth=2;x.beginPath();x.ellipse(20,32-j*6,4+j*3,2.5,0,0,7);x.stroke()}}
  if(k==='rain'){x.strokeStyle='#a7f3d0';x.lineWidth=2;for(let j=0;j<5;j++){x.beginPath();x.moveTo(6+j*7,6+j%2*6);x.lineTo(6+j*7,22+j%2*6);x.stroke()}}
  if(k==='slash'){x.strokeStyle='#f97316';x.lineWidth=4;x.beginPath();x.arc(14,20,16,-1,1);x.stroke()}
  if(k==='dash'){x.fillStyle='#f97316';x.beginPath();x.moveTo(6,12);x.lineTo(34,20);x.lineTo(6,28);x.closePath();x.fill()}
  if(k==='quake'){x.fillStyle='#f97316';for(let j=0;j<4;j++){x.beginPath();x.moveTo(4+j*8,34);x.lineTo(8+j*8,18-j%2*6);x.lineTo(12+j*8,34);x.fill()}}
  if(k==='erupt'){for(let j=0;j<3;j++){x.fillStyle=j===1?'#fde047':'#ef4444';rr(x,7+j*10,10+j%2*6,7,26,3,x.fillStyle)}}
}
function buildSlots(){
  const J=JOBS[S.job],el=$('slots');el.innerHTML='';
  J.sk.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='slot'+(S.lv<s.lv?' lock':'');b.dataset.lv='Lv.'+s.lv;b.title=`${s.n} (${SKKEY[i]}) · MP ${s.mp} · ${s.d}`;
    b.innerHTML=`<canvas width="68" height="68"></canvas><span class="k">${SKKEY[i]}</span><span class="cd"></span>`;skIcon(b.firstChild,S.job,i);b.onclick=()=>useSkill(i);el.appendChild(b)});
  const b=document.createElement('button');b.type='button';b.className='slot';b.title='HP 물약 (Q)';b.innerHTML=`<canvas width="68" height="68"></canvas><span class="k">Q</span><span class="n" id="potN">${S.pot}</span>`;skIcon(b.firstChild,S.job,4);b.onclick=usePot;el.appendChild(b);
  ['pS1','pS2','pS3'].forEach((id,i)=>{$(id).textContent=J.sk[i+1].n.length>4?J.sk[i+1].n.slice(0,4):J.sk[i+1].n});
  renderSlots();
}
function renderSlots(){const J=JOBS[S.job],sl=$('slots').children;
  J.sk.forEach((s,i)=>{const c=sl[i]&&sl[i].querySelector('.cd');if(c)c.style.transform=`scaleY(${P.cd[i]>0?P.cd[i]/s.cd:0})`;if(sl[i])sl[i].classList.toggle('lock',S.lv<s.lv)});
  if($('potN'))$('potN').textContent=S.pot;
  ['pS1','pS2','pS3'].forEach((id,i)=>$(id).disabled=S.lv<J.sk[i+1].lv)}
function togglePause(){if(!S||!S.started||!ov.hidden)return;S.userPause=!S.userPause;S.paused=S.userPause;$('pauseBtn').textContent=S.paused?'계속하기':'일시정지'}
$('pauseBtn').onclick=togglePause;
$('helpBtn').onclick=()=>{if(!ov.hidden&&S&&S.started)return;showHelp(!!(S&&S.started))};
$('skillBtn').onclick=()=>{if(!S||!ov.hidden)return;skillWin()};
function skillWin(){const J=JOBS[S.job];
  openOv(`<div class="card"><div class="eyebrow">${J.n} · ${J.energy}</div><h2>스킬</h2><p style="font-size:14px">${J.fact}</p>
    <div style="display:grid;gap:8px">${J.sk.map((s,i)=>`<div class="sk"><canvas data-sk="${i}" width="80" height="80"></canvas><span><b>${s.n}</b> [${SKKEY[i]}] · Lv.${s.lv}부터 · MP ${s.mp}<br>${s.d}${S.lv<s.lv?' <i style="color:#ef4444">(아직 잠김)</i>':''}</span></div>`).join('')}</div>
    <div class="row"><button class="btn alt" id="ovClose" type="button">닫기</button></div></div>`);
  ov.querySelectorAll('canvas[data-sk]').forEach(c=>skIcon(c,S.job,+c.dataset.sk));$('ovClose').onclick=closeOv}
const HELP=`<div class="cols">
  <div class="box"><h3>목표</h3><ul><li>햇살 마을의 <b>에너지 박사</b>에게 퀘스트를 받아요 (머리 위 <b>!</b>).</li><li>사냥터에서 오염 몬스터를 정화하고, 레벨을 올려 새 스킬을 배워요.</li><li>마지막 퀘스트에서 <b>매연 대왕</b>을 물리치고 화력 발전소를 꺼요.</li></ul></div>
  <div class="box"><h3>지도</h3><ul><li><b>햇살 마을</b>: 에너지 박사, 충전소 상인(물약)</li><li><b>햇빛 들판</b>: 꼬마 스모그 Lv.1</li><li><b>바람 언덕</b>: 기름 슬라임 Lv.3</li><li><b>굴뚝 공장</b>: 석탄 골렘 Lv.5, 매연 대왕</li><li>초록 소용돌이 <b>포탈</b>에서 ▲를 누르면 다음 지도로 가요.</li></ul></div></div>
  <div class="box"><h3>조작법</h3><div class="keys"><div><span>이동</span><kbd>← →</kbd></div><div><span>점프</span><kbd>Space</kbd></div><div><span>사다리 오르내리기</span><kbd>↑ ↓</kbd></div><div><span>발판 아래로 내려가기</span><kbd>↓ + Space</kbd></div>
    <div><span>대화 · 포탈</span><kbd>↑</kbd></div><div><span>기본 공격 (누르고 있기)</span><kbd>Z</kbd></div><div><span>스킬 1 · 2 · 3</span><kbd>X · C · V</kbd></div><div><span>HP 물약</span><kbd>Q</kbd></div></div>
    <p style="font-size:13px;color:var(--muted)">휴대폰은 왼쪽 방향 버튼, 오른쪽 공격·점프·스킬 버튼을 써요.</p></div>
  <div class="cols"><div class="box"><h3>성장</h3><ul><li>몬스터를 정화하면 경험치와 <b>에너지 코인</b>을 얻어요.</li><li>스킬 1은 Lv.2, 스킬 2는 Lv.4, 스킬 3은 Lv.6에 열려요.</li><li>퀘스트를 끝내면 <b>보너스 퀴즈</b>가 나와요. 맞히면 경험치 50% 더!</li></ul></div>
  <div class="box tip"><h3>꿀팁</h3><ul><li>각 지도의 <b>안내판</b>에서 ▲를 누르면 에너지 이야기를 읽을 수 있어요.</li><li>HP가 낮으면 Q로 물약! 마을 상인에게 코인으로 살 수 있어요.</li><li>MP는 가만히 있어도 조금씩 차요.</li></ul></div></div>`;
function showHelp(inGame){openOv(`<div class="card wide"><div class="eyebrow">게임 방법</div><h2>에너지 월드</h2>${HELP}<div class="row"><button class="btn" id="ovClose" type="button">${inGame?'게임으로 돌아가기':'처음 화면으로'}</button></div></div>`);
  $('ovClose').onclick=()=>{if(inGame)closeOv();else showStart()}}
function showStart(){
  openOv(`<div class="card wide"><div class="eyebrow">5학년 2학기 · 자원과 에너지</div><h1>에너지 월드</h1>
    <p>화석 연료를 마구 태운 탓에 마을 곳곳에 <b>오염 몬스터</b>가 나타났어요! 재생에너지의 힘을 가진 모험가가 되어 몬스터를 정화하고, <b>매연 대왕</b>이 돌리는 화력 발전소를 멈춰 주세요.</p>
    <h3>직업 고르기</h3>
    <div class="jobs">${Object.entries(JOBS).map(([k,j])=>`<button class="job" type="button" data-job="${k}" aria-pressed="${jobPick===k}"><canvas width="240" height="180"></canvas><b>${j.n}</b><small>${j.style}<br><b style="font-size:13px;font-family:var(--f-body)">${j.energy}</b>: ${j.fact.split('.')[0]}.</small></button>`).join('')}</div>
    <div class="row"><button class="btn" id="goBtn" type="button">모험 시작</button><button class="btn alt" id="howBtn" type="button">게임 방법 자세히 보기</button></div></div>`);
  ov.querySelectorAll('[data-job]').forEach(b=>{const c=b.querySelector('canvas'),x=c.getContext('2d'),k=b.dataset.job;
    const g=x.createLinearGradient(0,0,0,180);g.addColorStop(0,'#bfe3ff');g.addColorStop(1,'#eaf6ff');x.fillStyle=g;x.fillRect(0,0,240,180);x.fillStyle='#65a30d';x.fillRect(0,150,240,30);
    x.save();x.translate(120,150);x.scale(1.7,1.7);drawHero(x,k,.4,{act:.12});x.restore();
    b.onclick=()=>{jobPick=k;ov.querySelectorAll('[data-job]').forEach(z=>z.setAttribute('aria-pressed',z===b))}});
  $('goBtn').onclick=()=>{newGame(jobPick);closeOv();S.paused=false;toast(`${JOBS[jobPick].n}(으)로 모험을 시작해요! 에너지 박사(!)에게 가서 ▲를 눌러 말을 걸어요.`,'good')};
  $('howBtn').onclick=()=>showHelp(false);
}

/* ============ 루프 ============ */
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(S&&S.started&&!S.paused)update(dt);
  draw(now/1000);requestAnimationFrame(frame);
}
addEventListener('resize',resize);
S={started:false,paused:true,job:'sun',q:0,qState:'none',kills:{},inv:{},lv:1,bossDead:false};
P={x:200,y:G0-48,w:24,h:48,vx:0,vy:0,face:1,walk:0,act:0,cd:[0,0,0,0],inv:0,maxhp:1,hp:1,maxmp:1,mp:1};
M=MAPS.town;M.id='town';
resize();showStart();requestAnimationFrame(frame);
</script>
