<script>/* ===== 민왕게임월드 온라인 연결 도우미 v2 =====
   PeerJS(WebRTC)로 먼저 연결하고, 안 되면(서버 장애·학교/통신사 방화벽) MQTT 중계 서버로 자동 전환해요.
   게임 코드는 그대로 new Peer(...)를 쓰면 돼요. */
(function(){

var RealPeer=window.Peer;
var BROKERS=window.MWG_MQTT||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
var ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'},
 {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}];
var TOPIC='mwgame/v2/';
function rid(n){var s='',c='abcdefghijkmnpqrstuvwxyz23456789';for(var i=0;i<(n||10);i++)s+=c[Math.random()*c.length|0];return s}
function Em(){this._h={}}
Em.prototype.on=function(e,f){(this._h[e]=this._h[e]||[]).push(f);return this};
Em.prototype.off=function(e,f){var a=this._h[e];if(a){var i=a.indexOf(f);if(i>=0)a.splice(i,1)}return this};
Em.prototype.emit=function(e){var a=(this._h[e]||[]).slice(),args=[].slice.call(arguments,1);for(var i=0;i<a.length;i++){try{a[i].apply(this,args)}catch(err){console.error(err)}}};
function inherit(C){C.prototype=Object.create(Em.prototype);C.prototype.constructor=C}

/* ---------- 아주 작은 MQTT 3.1.1 (웹소켓) ---------- */
var te=new TextEncoder(),td=new TextDecoder();
function str(s){var b=te.encode(s);var o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o}
function cat(arr){var n=0,i;for(i=0;i<arr.length;i++)n+=arr[i].length;var o=new Uint8Array(n),p=0;for(i=0;i<arr.length;i++){o.set(arr[i],p);p+=arr[i].length}return o}
function pkt(h,body){var len=body.length,lb=[];do{var d=len%128;len=Math.floor(len/128);if(len>0)d|=128;lb.push(d)}while(len>0);return cat([new Uint8Array([h].concat(lb)),body])}
function Mqtt(clientId){Em.call(this);this.cid=clientId;this.bi=0;this.ok=false;this.subs=[];this.buf=new Uint8Array(0);this.pid=1;this.dead=false;this._go()}
inherit(Mqtt);
Mqtt.prototype._go=function(){var self=this;if(this.dead)return;if(this.bi>=BROKERS.length){this.emit('fail');return}
  var url=BROKERS[this.bi],ws,done=false;try{ws=new WebSocket(url,'mqtt')}catch(e){this.bi++;return this._go()}
  ws.binaryType='arraybuffer';this.ws=ws;
  var to=setTimeout(function(){if(!done){done=true;try{ws.close()}catch(e){}self.bi++;self._go()}},6000);
  ws.onopen=function(){var body=cat([str('MQTT'),new Uint8Array([4,2,0,40]),str(self.cid)]);ws.send(pkt(0x10,body))};
  ws.onmessage=function(ev){self._rx(new Uint8Array(ev.data),function(){if(!done){done=true;clearTimeout(to)}})};
  ws.onerror=function(){};
  ws.onclose=function(){clearTimeout(to);var was=self.ok;self.ok=false;clearInterval(self.pt);if(self.dead)return;if(!done){done=true;self.bi++;self._go();return}
    if(was){self.emit('down');setTimeout(function(){if(!self.dead){self.bi=0;self._go()}},1500)}}};
Mqtt.prototype._rx=function(chunk,onConn){var b=cat([this.buf,chunk]);var p=0;
  while(p<b.length){var h=b[p],mul=1,len=0,q=p+1,d;do{if(q>=b.length){this.buf=b.slice(p);return}d=b[q++];len+=(d&127)*mul;mul*=128}while(d&128);
    if(q+len>b.length){this.buf=b.slice(p);return}var body=b.subarray(q,q+len);p=q+len;var t=h>>4;
    if(t===2){if(body[1]===0){onConn();var first=!this.everOk;this.ok=true;this.everOk=true;var self=this;this.pt=setInterval(function(){try{self.ws.send(new Uint8Array([0xC0,0]))}catch(e){}},20000);for(var i=0;i<this.subs.length;i++)this._sub(this.subs[i]);this.emit(first?'ready':'up')}else{try{this.ws.close()}catch(e){}}}
    else if(t===3){var tl=(body[0]<<8)|body[1];var topic=td.decode(body.subarray(2,2+tl));var off=2+tl+((h>>1)&3?2:0);this.emit('msg',topic,td.decode(body.subarray(off)))}}
  this.buf=new Uint8Array(0)};
Mqtt.prototype._sub=function(t){var id=this.pid++&65535||1;this.ws.send(pkt(0x82,cat([new Uint8Array([id>>8,id&255]),str(t),new Uint8Array([0])])))};
Mqtt.prototype.sub=function(t){this.subs.push(t);if(this.ok)this._sub(t)};
Mqtt.prototype.pub=function(t,s){if(!this.ok)return false;try{this.ws.send(pkt(0x30,cat([str(t),te.encode(s)])));return true}catch(e){return false}};
Mqtt.prototype.close=function(){this.dead=true;clearInterval(this.pt);try{this.ws.send(new Uint8Array([0xE0,0]));this.ws.close()}catch(e){}};

/* ---------- 연결 하나 (PeerJS 또는 MQTT를 감싸요) ---------- */
function Conn(peer,remote){Em.call(this);this.peer=remote;this.open=false;this.reliable=true;this._p=peer;this._k=null;this._rc=null;this.closed=false;this.via=''}
inherit(Conn);
Conn.prototype.send=function(d){if(!this.open||this.closed)return;if(this._rc){try{this._rc.send(d)}catch(e){}}else if(this._k){this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'d',c:this._k,f:this._p.id,d:d}));this._tx=Date.now()}};
Conn.prototype.close=function(){if(this.closed)return;this.closed=true;var was=this.open;this.open=false;if(this._rc){try{this._rc.close()}catch(e){}}if(this._k){this._p._mq&&this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'fin',c:this._k,f:this._p.id}));delete this._p._mc[this._k]}clearInterval(this._ka);if(was)this.emit('close')};
Conn.prototype._useReal=function(rc){var self=this;this._rc=rc;this.via='webrtc';
  rc.on('data',function(d){self.emit('data',d)});rc.on('close',function(){if(!self.closed){self.closed=true;self.open=false;self.emit('close')}});rc.on('error',function(e){self.emit('error',e)})};

Conn.prototype._useMq=function(k){var self=this;this._k=k;this.via='relay';this._rx=Date.now();this._p._mc[k]=this;
  this._ka=setInterval(function(){if(!self.open)return;if(Date.now()-(self._tx||0)>3000)self._p._mq.pub(TOPIC+self.peer,JSON.stringify({t:'png',c:k,f:self._p.id}));if(Date.now()-self._rx>16000){self.close()}},2000)};

/* ---------- Peer 대신 쓰는 SmartPeer ---------- */
function SmartPeer(id,opts){if(!(this instanceof SmartPeer))return new SmartPeer(id,opts);Em.call(this);var self=this;
  if(id&&typeof id==='object'){opts=id;id=undefined}
  this.id=id||('g'+rid(11));this.isHost=!!id;this.opts=opts||{};this.destroyed=false;this.open=false;this._mc={};this._openSent=false;this._rpOpen=false;this._mqReady=false;
  // 1) PeerJS
  if(RealPeer){try{var o={};for(var k in this.opts)o[k]=this.opts[k];o.config=o.config||{iceServers:ICE};
    this._rp=new RealPeer(this.id,o);
    this._rp.on('open',function(){self._rpOpen=true;self._open()});
    this._rp.on('connection',function(rc){var c=new Conn(self,rc.peer);rc.on('open',function(){if(c.closed)return;c._useReal(rc);c._setOpen();self.emit('connection',c)})});
    this._rp.on('error',function(e){var t=e&&e.type;if(t==='unavailable-id'){self.emit('error',e);return}if(t==='peer-unavailable'){var m=/peer\s+(\S+)/i.exec(e.message||'');self.emit('_pu',m?m[1]:'');return}self._rpBad=true;if(!self._rpOpen)self._maybeOpen()});
    this._rp.on('disconnected',function(){if(!self.destroyed){try{self._rp.reconnect()}catch(e){}}});
  }catch(e){this._rp=null;this._rpBad=true}}else this._rpBad=true;
  // 2) MQTT 중계 (항상 함께 켜 둬요)
  this._mq=new Mqtt('mw'+rid(12));
  this._mq.on('ready',function(){self._mqReady=true;self._maybeOpen()});
  this._mq.on('fail',function(){self._mqBad=true;if(!self._openSent&&(self._rpBad||!RealPeer))self.emit('error',{type:'network',message:'연결 서버에 닿지 못했어요'})});
  this._mq.on('msg',function(t,s){self._onMsg(s)});
  this._mq.sub(TOPIC+this.id);
  setTimeout(function(){self._waited=true;self._maybeOpen()},3500)}

const KQ=Object.assign({n:0,ok:0,wrong:[],seen:[],best:0},store.get('quiz',{}));
function saveKQ(){store.set('quiz',KQ)}
const ABC=['①','②','③','④'];
function pickQ(){const unseen=QB.map((_,i)=>i).filter(i=>!KQ.seen.includes(i));if(KQ.wrong.length&&Math.random()<.35)return KQ.wrong[Math.random()*KQ.wrong.length|0];const pool=unseen.length?unseen:QB.map((_,i)=>i);return pool[Math.random()*pool.length|0]}
function recordQ(qi,ok){KQ.n++;if(ok)KQ.ok++;if(!KQ.seen.includes(qi))KQ.seen.push(qi);const w=KQ.wrong.indexOf(qi);if(ok&&w>=0)KQ.wrong.splice(w,1);if(!ok&&w<0)KQ.wrong.push(qi);saveKQ()}

/* 게임 속 문제 창 — 푸는 동안 내 캐릭터는 멈춰요 */
const QZ={open:false,done:false,cb:null,qi:0,log:[]};
function openQuiz(qi,cb,reward){const Q=QB[qi];QZ.open=true;QZ.done=false;QZ.cb=cb;QZ.qi=qi;if(document.pointerLockElement)document.exitPointerLock();for(const k in keys)keys[k]=false;ME.vx=ME.vz=0;sfx('cp');
  const p=$('qz');p.hidden=false;
  p.innerHTML=`<div class="qh"><span>❓ 에너지 퀴즈 · ${esc(Q.k)}</span><b>⏸ 잠깐 멈춤</b></div><p class="qq">${esc(Q.q)}</p><div class="qa">${Q.a.map((a,i)=>`<button type="button" data-i="${i}"><b>${ABC[i]}</b> ${esc(a)}</button>`).join('')}</div><p class="qs">맞히면 ${reward} · 키보드 1~4</p>`;
  p.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.i))}
function answerQuiz(i){if(!QZ.open||QZ.done)return;QZ.done=true;const Q=QB[QZ.qi],ok=i===Q.c;recordQ(QZ.qi,ok);QZ.log.push({qi:QZ.qi,ok});
  const p=$('qz');p.querySelectorAll('[data-i]').forEach(b=>{const k=+b.dataset.i;b.disabled=true;if(k===Q.c)b.classList.add('ok');else if(k===i)b.classList.add('no')});
  p.querySelector('.qs').innerHTML=`<b class="${ok?'g':'r'}">${ok?'⭕ 정답!':'❌ 아쉬워요! 정답은 '+ABC[Q.c]}</b> ${esc(Q.x)}<br><button type="button" class="qok">계속하기 ▶</button>`;
  sfx(ok?'win':'fall');const cb=QZ.cb;QZ.cb=null;if(cb)cb(ok);p.querySelector('.qok').onclick=closeQuiz;QZ.closeT=setTimeout(closeQuiz,ok?2600:6500)}
function closeQuiz(){clearTimeout(QZ.closeT);$('qz').hidden=true;QZ.open=false;QZ.done=false}
addEventListener('keydown',e=>{if(!QZ.open)return;const m=/^(Digit|Numpad)([1-4])$/.exec(e.code);if(m){e.preventDefault();e.stopImmediatePropagation();if(!QZ.done)answerQuiz(+m[2]-1);else closeQuiz()}else if(QZ.done&&(e.code==='Enter'||e.code==='Space'||e.code==='KeyE')){e.preventDefault();e.stopImmediatePropagation();closeQuiz()}else if(/^(Key[WASD]|Arrow|Space)/.test(e.code)){e.preventDefault();e.stopImmediatePropagation()}},true);

/* 🏃 탈출 모드: ❓ 퀴즈 키와 🔓 퀴즈 문 */
function addRunQuiz(P,ITEMS,stages,R){for(const st of stages){
  const ks=P.filter(p=>p.kind==='key'&&p.stage===st.i&&p.w<2&&p.z>st.z0+3&&p.z<st.z1-5);if(ks.length){const p=ks[R()*ks.length|0];if(!ITEMS.some(it=>it.x===p.x&&it.z===p.z))ITEMS.push({x:p.x,z:p.z,k:'quiz'})}
  const lr=P.filter(p=>p.kind==='key'&&p.stage===st.i&&p.w<2&&p.z<st.z1-.6&&p.z>st.z1-4.6).sort((a,b)=>b.z-a.z||Math.abs(a.x)-Math.abs(b.x));if(lr.length){const p=lr[0];const k=ITEMS.findIndex(it=>it.x===p.x&&it.z===p.z);if(k>=0)ITEMS.splice(k,1);ITEMS.push({x:p.x,z:p.z,k:'qgate',stage:st.i})}}}
function runQuiz(it){const qi=pickQ();
  if(it.k==='qgate'){const st=TW.rstages[it.stage];const need=RUN.spd<st.need;
    openQuiz(qi,ok=>{if(!ok){toast('🔒 다음에 다시 도전! (처음부터 다시 오면 문제가 또 나와요)','bad');return}RS.qopen=RS.qopen||new Set();RS.qopen.add(it.stage);const w=Math.round(4*(1+RUN.world*3));RUN.wins+=w;saveRun();toast(need?`🔓 정답! 스피드가 모자라도 이 문은 열려요! 🏆 +${w}`:`⭕ 정답! 🏆 +${w}`,'good')},need?'🔓 스피드가 모자라도 초록 문이 열려요! + 🏆':'🏆 보너스');return}
  openQuiz(qi,ok=>{if(!ok)return;const b=Math.round(45*runMul()*(1+RUN.tread)+20),w=Math.round(3*(1+RUN.world*3));RUN.spd+=b;RUN.wins+=w;saveRun();popText('⚡+'+fmtN(b),'#c084fc');toast(`⭕ 정답! ⚡ +${fmtN(b)} · 🏆 +${w}`,'good')},'⚡ 스피드 크게 + 🏆')}

/* 🗼 타워 모드: 체크포인트마다 ❓ 퀴즈 키캡 (맞히면 기록 3초 단축) */
let tqG=null;const TQ=[];
function buildTowerQuiz(){if(tqG){scene.remove(tqG);tqG=null}TQ.length=0;if(!TW||TW.mode==='run')return;tqG=new THREE.Group();scene.add(tqG);
  for(const p of TW.P){if(p.kind!=='cp'||!p.stage)continue;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:legendTex('❓',0xc084fc,'#000'),transparent:true}));s.scale.set(.9,.9,.9);const ox=p.w/2-.5;s.position.set(p.x+ox,p.y+p.h/2+.9,p.z);tqG.add(s);TQ.push({s,x:p.x+ox,y:p.y+p.h/2,z:p.z,stage:p.stage})}}
function updTowerQuiz(t){if(!TQ.length||QZ.open||ME.fin)return;for(const q of TQ){if(!q.s.visible)continue;q.s.position.y=q.y+.9+Math.sin(t*3+q.stage)*.12;
  if(Math.abs(ME.x-q.x)<.8&&Math.abs(ME.z-q.z)<.8&&Math.abs(ME.y-q.y)<1.2){q.s.visible=false;openQuiz(pickQ(),ok=>{if(ok){GAME.t0+=3000;toast('⭕ 정답! ⏱ 기록 3초 단축!','good')}},'⏱ 기록 3초 단축')}}}

/* 로비: 📚 에너지 퀴즈 */
function kqCard(tab){tab=tab||'quiz';const acc=KQ.n?Math.round(KQ.ok/KQ.n*100):0;
  const tabs=`<div class="seg" id="kqTab">${[['quiz','🧠 퀴즈'],['wrong','📝 오답 노트'+(KQ.wrong.length?' '+KQ.wrong.length:'')],['learn','📖 개념']].map(([k,n])=>`<button type="button" data-t="${k}" aria-pressed="${k===tab}">${n}</button>`).join('')}</div>`;
  let body='';
  if(tab==='quiz')body=`<p>자원과 에너지 문제 <b>10개</b>! 맞힐 때마다 🏆 승리 +${2*(1+RUN.world)}, 만점이면 🏆 +${20*(1+RUN.world)} 더!</p><div class="seg" id="kqCat">${['전체','형태','전환','태양','자원','절약'].map((k,i)=>`<button type="button" data-k="${k}" aria-pressed="${i===0}">${k}</button>`).join('')}</div><p class="small">✅ 맞힌 문제 ${KQ.ok} · 🎯 정답률 ${acc}% · 🏆 최고 ${KQ.best}/10 · 📚 본 문제 ${KQ.seen.length}/${QB.length}</p><button class="btn" id="kqGo" type="button">▶ 퀴즈 시작</button>`;
  else if(tab==='wrong')body=KQ.wrong.length?`<div class="wl">${KQ.wrong.map(i=>`<div><b>Q.</b> ${esc(QB[i].q)}<br><span class="g">정답 ${ABC[QB[i].c]} ${esc(QB[i].a[QB[i].c])}</span><br><small>${esc(QB[i].x)}</small></div>`).join('')}</div><button class="btn" id="kqW" type="button">🔁 오답만 다시 풀기</button>`:'<p>🎉 틀린 문제가 없어요!</p>';
  else body=`<div class="cgrid">${CONCEPTS.map((c,i)=>`<details class="cc"${i===0?' open':''}><summary>${c.e} ${c.t}</summary><div>${c.b}</div></details>`).join('')}</div>`;
  openCard(`<div class="hd"><h2>📚 에너지 퀴즈</h2><button class="x" type="button" data-x aria-label="닫기">✕</button></div>${tabs}${body}`,false);
  ov.querySelector('[data-x]').onclick=lobby;ov.querySelectorAll('#kqTab button').forEach(b=>b.onclick=()=>kqCard(b.dataset.t));
  let cat='전체';ov.querySelectorAll('#kqCat button').forEach(b=>b.onclick=()=>{cat=b.dataset.k;ov.querySelectorAll('#kqCat button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const g=$('kqGo');if(g)g.onclick=()=>kqDrill(QB.map((_,i)=>i).filter(i=>cat==='전체'||QB[i].k===cat).sort(()=>Math.random()-.5).slice(0,10));
  const w=$('kqW');if(w)w.onclick=()=>kqDrill(KQ.wrong.slice().sort(()=>Math.random()-.5).slice(0,10),1)}
const KD={ans:null};
function kqDrill(list,wm){let k=0,ok=0;const res=[];
  const show=()=>{if(k>=list.length){fin();return}const qi=list[k],Q=QB[qi];let done=false;
    openCard(`<div class="hd"><h2>🧠 ${k+1} / ${list.length}</h2><span class="pill">⭕ ${ok}</span></div><p class="qq">${esc(Q.q)}</p><div class="qa">${Q.a.map((a,i)=>`<button type="button" data-i="${i}"><b>${ABC[i]}</b> ${esc(a)}</button>`).join('')}</div><div id="kdEx"></div>`,false);
    const ans=i=>{if(done)return;done=true;KD.ans=null;const good=i===Q.c;if(good)ok++;recordQ(qi,good);res.push({qi,ok:good});sfx(good?'cp':'fall');
      ov.querySelectorAll('[data-i]').forEach(b=>{const n=+b.dataset.i;b.disabled=true;if(n===Q.c)b.classList.add('ok');else if(n===i)b.classList.add('no')});
      $('kdEx').innerHTML=`<div class="note"><b class="${good?'g':'r'}">${good?'⭕ 정답!':'❌ 정답은 '+ABC[Q.c]}</b> ${esc(Q.x)}</div><div class="row" style="margin-top:8px"><button class="btn" id="kdN" type="button">${k+1<list.length?'다음 문제 ▶':'결과 보기 ▶'}</button></div>`;$('kdN').onclick=()=>{k++;show()};$('kdN').focus()};
    ov.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>ans(+b.dataset.i));KD.ans=ans};
  const fin=()=>{const m=1+RUN.world,w=ok*2*m+(ok===list.length&&list.length>=10?20*m:0);RUN.wins+=w;saveRun();if(list.length>=10)KQ.best=Math.max(KQ.best,ok);saveKQ();sfx(ok>=list.length*.7?'win':'fall');
    openCard(`<div style="text-align:center"><h1>${ok===list.length?'🏆 만점!':ok>=list.length*.7?'🎉 잘했어요!':'💪 다시 도전!'}</h1><p style="font-size:26px;font-weight:900;margin:4px 0">${ok} / ${list.length}</p><p>🏆 승리 +${w}</p></div>
      <div class="wl">${res.map(r=>`<div>${r.ok?'⭕':'❌'} ${esc(QB[r.qi].q)}<br><small>${ABC[QB[r.qi].c]} ${esc(QB[r.qi].a[QB[r.qi].c])} — ${esc(QB[r.qi].x)}</small></div>`).join('')}</div>
      <div class="row" style="justify-content:center"><button class="btn" id="kdA" type="button">🔁 한 번 더</button><button class="btn alt" id="kdB" type="button">📚 퀴즈 화면</button><button class="btn alt" id="kdL" type="button">🏠 처음 화면</button></div>`,false);
    $('kdA').onclick=()=>kqDrill(wm&&KQ.wrong.length?KQ.wrong.slice(0,10):QB.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,10),wm);$('kdB').onclick=()=>kqCard(wm?'wrong':'quiz');$('kdL').onclick=lobby};
  show()}

function ktStart(mode){KTE.started=performance.now();KTE.jumpT=0;KTE.spd0=RUN.spd;KTE.air=0;KTE.fl=0;KTE.ballSeen=0;KTE.gateSeen=0;const g=KT_GOALS[mode].map(x=>Object.assign({},x));if(mode==='tower'&&TW&&TW.stages)g[0].n=Math.min(5,TW.stages.length),g[0].t=`${g[0].n}층까지 올라가기 (⛰️ 위치 에너지 쌓기)`;

function ktEnergyTick(){requestAnimationFrame(ktEnergyTick);const nw=performance.now();if(nw-KTE.last<100)return;KTE.last=nw;
  if(!GAME.started||!TW||document.body.classList.contains('pre')){return}
  const run=TW.mode==='run';const v=Math.hypot(ME.vx||0,ME.vz||0,ME.vy||0);const vmax=run?24:12;
  const base=run?-.5:0;const H=run?6:Math.max(8,TW.height||20);const k=clamp(v*v/(vmax*vmax),0,1),p=clamp((ME.y-base)/H,0,1);
  $('enK').style.width=(k*100).toFixed(0)+'%';$('enP').style.width=(p*100).toFixed(0)+'%';
  const air=!ME.ground,vy=ME.vy||0;const tr=ME.ground&&ME.ground.kind==='tread';let cv='';
  if(QZ.open)cv='⏸ 퀴즈 푸는 중';else if(air&&vy<-3)cv='⛰️ 위치 → 🏃 운동<br><small>떨어지며 빨라져요</small>';else if(air&&vy>1.5)cv='🏃 운동 → ⛰️ 위치<br><small>올라가며 느려져요</small>';else if(tr)cv='🔌 전기 → 🏃 운동<br><small>러닝머신</small>';else if(ME.mv)cv='🍙 화학(몸) → 🏃 운동<br><small>음식 에너지로 달려요</small>';else cv='🧍 멈춤: 운동 에너지 0';
  const c=$('enC');if(c.innerHTML!==cv)c.innerHTML=cv;
  if(!EL.round||QZ.open||nw-KTE.started<1500)return;
  if(run)EL.prog('kup',0,Math.max(0,Math.floor(RUN.spd-KTE.spd0)));
  if(air&&vy>3&&!KTE.jumpT){KTE.jumpT=1;EL.flow(['kinetic','potential'],'⤴ 점프! 올라가면서 운동 에너지가 위치 에너지로 바뀌어요','jump');EL.prog('jump',1)}
  if(air&&vy<-7){KTE.air+=.1;if(KTE.air>.35){EL.flow(['potential','kinetic'],'⬇ 떨어지면서 위치 에너지가 운동 에너지로 바뀌어요','fall');EL.prog('fall',1)}}else if(!air)KTE.air=0;
  if(tr){EL.flow(['electric','kinetic'],'🏃 러닝머신: 전동기가 전기 에너지로 벨트를 움직여요','tread');EL.prog('tread',1)}
  if(!run&&typeof floorOf==='function'){const fl=floorOf(ME.y)+1;if(fl>KTE.fl){KTE.fl=fl;EL.prog('high',0,fl);if(fl===3)EL.see('potential',`${fl}층! 높을수록 ⛰️ 위치 에너지가 커요`,true)}}
  if(run&&typeof BALLS!=='undefined'&&BALLS.length&&!KTE.ballSeen){KTE.ballSeen=1;EL.see('kinetic','굴러오는 사탕도 운동 에너지를 가져서 부딪히면 밀려나요')}
  if(run&&RS&&RS.passed&&RS.passed.size&&!KTE.gateSeen){KTE.gateSeen=1;EL.see('kinetic','스피드가 커질수록 운동 에너지도 커져요. 그래서 빠르면 문이 열려요!',true)}}
