<style>
:root{--ink:#0f172a;--paper:#fff;--paper2:#f1f5f9;--muted:#64748b;--acc:#facc15;--al:#3b82f6;--en:#ef4444;--me:#22c55e;--f:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#7dd3fc;font-family:var(--f);color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lab{position:absolute;left:0;top:0;display:grid;justify-items:center;gap:2px;font-size:12.5px;font-weight:800;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap}
.lab .bx{font-size:12px}.lab .hpb{width:62px;height:8px;border-radius:5px;background:rgba(0,0,0,.55);overflow:hidden;border:1px solid rgba(0,0,0,.6)}.lab .hpb i{display:block;height:100%;background:var(--en);transition:width .15s}
.lab.me .hpb i{background:var(--me)}.lab.al .hpb i{background:var(--al)}.lab.me .nm{color:#bbf7d0}.lab.al .nm{color:#bfdbfe}.lab.en .nm{color:#fecaca}
.lab .amb{display:flex;gap:2px;width:62px}.lab .amb i{flex:1;height:5px;background:#f97316;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.dn{position:absolute;font-weight:900;font-size:20px;text-shadow:0 2px 0 #000,0 0 4px #000;animation:dn .8s forwards;pointer-events:none;transform:translate(-50%,-50%)}.dn.en{color:#fff}.dn.al,.dn.me{color:#fca5a5}.dn.hl{color:#4ade80}
@keyframes dn{0%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-150%) scale(.9);opacity:0}}
#hud{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);z-index:5;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;background:rgba(15,23,42,.66);border-radius:14px;padding:8px 14px;font-size:18px;max-width:94vw;pointer-events:none}
#hud b.al{color:#93c5fd;font-size:22px}#hud b.en{color:#fca5a5;font-size:22px}#hud .tm{font-size:15px;opacity:.9}#hud .cd{flex-basis:100%;text-align:center;font-weight:900;font-size:15px}#hud .cd.al{color:#86efac}#hud .cd.en{color:#fca5a5}
#kf{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:5;display:grid;gap:4px;justify-items:end;pointer-events:none;font-size:13px}
.kfi{background:rgba(15,23,42,.7);border-radius:10px;padding:4px 9px;animation:tin .2s}.kfi .al{color:#93c5fd}.kfi .en{color:#fca5a5}.kfi .sm{color:#d6d3d1}
#pcBar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;gap:12px;font-size:14px;background:rgba(15,23,42,.6);border-radius:12px;padding:6px 12px;pointer-events:none}#pcBar:empty{display:none}#pcBar .rdy{color:#fde047;font-weight:900}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;z-index:8;pointer-events:none;width:min(560px,94vw)}
.toast{background:rgba(15,23,42,.86);border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 14px;font-size:14.5px;text-align:center;animation:tin .25s}.toast.good{border-color:#22c55e}.toast.bad{border-color:#ef4444}@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-size:clamp(26px,5vw,46px);font-weight:900;text-align:center;opacity:0;transition:opacity .4s;z-index:7;pointer-events:none;text-shadow:0 4px 18px rgba(15,23,42,.8);width:min(720px,94vw)}#banner small{display:block;font-size:16px;font-weight:600;margin-top:6px}
#ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.38);padding:12px}#ov[hidden]{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:22px;padding:20px;width:min(580px,96vw);max-height:94vh;overflow:auto;display:grid;gap:12px;box-shadow:0 20px 60px rgba(15,23,42,.35);user-select:text}
.card h1{margin:0;font-size:30px}.card h2{margin:0;font-size:22px}.card h3{margin:0;font-size:19px}.card h3 small{font-size:13px;color:var(--muted)}.card p{margin:0;line-height:1.55}.card .big{font-size:26px;font-weight:900}.small{font-size:13.5px;color:var(--muted)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{background:var(--paper2);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:800;white-space:nowrap}
.x{border:0;background:var(--paper2);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.btn{border:0;border-radius:12px;padding:11px 16px;font-size:16px;font-weight:800;background:#facc15;color:#1f1300;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #ca8a04}.btn.blue{background:#3b82f6;color:#fff;box-shadow:0 4px 0 #1d4ed8}.btn.alt{background:var(--paper2);color:var(--ink);box-shadow:0 4px 0 #cbd5e1}.btn.sm{font-size:14px;padding:8px 12px}.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.seg button:focus-visible,.bgrid button:focus-visible,.selb:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.inp{border:2px solid #cbd5e1;border-radius:12px;padding:10px 12px;font-size:16px;font-family:inherit;width:100%}.lbl{display:grid;gap:4px;font-size:14px;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:2px solid #cbd5e1;background:#fff;border-radius:12px;padding:8px 11px;font-size:14px;cursor:pointer;font-family:inherit}.seg button[aria-pressed=true]{border-color:#facc15;background:#fef9c3;font-weight:800}
.note{border-radius:12px;padding:10px 12px;background:#f1f5f9;font-size:14px;line-height:1.6}
.selb{display:flex;gap:12px;align-items:center;text-align:left;border:3px solid var(--bc);background:color-mix(in srgb,var(--bc) 14%,#fff);border-radius:16px;padding:10px 14px;cursor:pointer;font-family:inherit;color:var(--ink);font-size:16px}.selb .be{font-size:44px}.selb small{color:var(--muted)}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.bgrid button{border:2px solid #e2e8f0;background:#fff;border-radius:12px;padding:6px 2px;display:grid;justify-items:center;gap:1px;cursor:pointer;font-family:inherit;color:var(--ink)}.bgrid button span{font-size:28px}.bgrid button b{font-size:13.5px}.bgrid button small{font-size:11.5px;color:var(--muted)}
.bgrid button.on{border-color:var(--bc);background:color-mix(in srgb,var(--bc) 18%,#fff)}.bgrid button.lock span{filter:grayscale(1);opacity:.6}
.binfo{border-left:6px solid var(--bc);background:#f8fafc;border-radius:12px;padding:12px;display:grid;gap:7px;font-size:14.5px}.stats{display:flex;gap:6px;flex-wrap:wrap}.stats span{background:#fff;border-radius:8px;padding:3px 8px;font-size:13px;font-weight:700}
.st{width:100%;border-collapse:collapse;font-size:13.5px}.st th,.st td{padding:4px 6px;text-align:center}.st td:first-child{text-align:left}.st tr.me td{background:#dcfce7;font-weight:800}.st tr.al td{color:#1d4ed8}.st tr.en td{color:#b91c1c}.rw{text-align:center;font-weight:800;font-size:16px}
.pbar{height:14px;background:#e2e8f0;border-radius:8px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#facc15,#f97316)}
.ptrack{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.ptrack div{background:#f1f5f9;border-radius:10px;padding:6px;display:grid;justify-items:center;font-size:12px}.ptrack span{font-size:22px}.ptrack .done{background:#dcfce7}
.plist{display:grid;gap:4px}.plist div{background:#f1f5f9;border-radius:10px;padding:6px 10px}.plist small{color:var(--muted)}
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}#touch[hidden]{display:none}
.joy{position:absolute;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);pointer-events:auto;touch-action:none;display:grid;place-items:center}.joy .kn{width:46%;height:46%;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:24px;color:#0f172a;pointer-events:none}
#joyM{left:max(20px,env(safe-area-inset-left));bottom:max(28px,env(safe-area-inset-bottom));width:132px;height:132px}
#joyA{right:max(24px,env(safe-area-inset-right));bottom:max(30px,env(safe-area-inset-bottom));width:128px;height:128px;background:rgba(239,68,68,.22)}
#joyS{right:calc(max(24px,env(safe-area-inset-right)) + 140px);bottom:max(26px,env(safe-area-inset-bottom));width:94px;height:94px;background:conic-gradient(rgba(250,204,21,.65) var(--c,0%),rgba(255,255,255,.12) 0);opacity:.75}#joyS.rdy{opacity:1;border-color:#fde047;box-shadow:0 0 18px #facc15}
#bGad,#bEmo{position:absolute;pointer-events:auto;border:0;border-radius:50%;width:58px;height:58px;font-size:17px;font-weight:900;background:rgba(255,255,255,.85);color:#0f172a;touch-action:none;font-family:inherit}
#bGad{right:calc(max(24px,env(safe-area-inset-right)) + 40px);bottom:calc(max(30px,env(safe-area-inset-bottom)) + 140px);background:#bbf7d0}#bGad:disabled{opacity:.4}
#bEmo{right:max(14px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 130px);width:46px;height:46px}
#emo{position:fixed;right:max(70px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 120px);z-index:9;display:grid;gap:6px}#emo[hidden]{display:none}#emo button{border:0;border-radius:12px;padding:8px 12px;font-size:15px;font-weight:800;background:rgba(255,255,255,.95);font-family:inherit;cursor:pointer}

#qz[hidden]{display:none!important}
#qz{position:fixed;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 58px));transform:translateX(-50%);z-index:9;width:min(560px,94vw);background:rgba(255,255,255,.97);color:var(--ink);border-radius:18px;padding:14px;box-shadow:0 14px 40px rgba(15,23,42,.45);display:grid;gap:8px;border:4px solid #a855f7;pointer-events:auto}
#qz .qh{display:flex;justify-content:space-between;font-weight:900;color:#7e22ce;font-size:14px}#qz .qh b{background:#f3e8ff;border-radius:999px;padding:2px 10px}
.qq{font-size:18px;font-weight:800;margin:0;line-height:1.45}.qq.dk{font-size:20px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:6px}.qa button{border:2px solid #e2e8f0;background:#f8fafc;border-radius:12px;padding:10px;font:inherit;font-size:15px;font-weight:700;text-align:left;cursor:pointer;color:var(--ink);min-height:48px}
.qa button:hover:not(:disabled){border-color:#a855f7;background:#faf5ff}.qa button.ok{background:#dcfce7;border-color:#22c55e}.qa button.no{background:#fee2e2;border-color:#ef4444}.qa button b{color:#7e22ce}
.qs{margin:0;font-size:13.5px;color:#475569;line-height:1.5}.qok{margin-top:6px;border:0;border-radius:10px;background:#a855f7;color:#fff;font:inherit;font-weight:800;padding:7px 14px;cursor:pointer}
.g{color:#15803d}.r{color:#dc2626}
.cv{position:absolute;transform:translate(-50%,-100%);font-weight:900;font-size:16px;background:rgba(15,23,42,.82);color:#fde68a;border:2px solid #facc15;border-radius:999px;padding:4px 12px;white-space:nowrap;animation:cvu 1.7s forwards;pointer-events:none}

.cgrid{display:grid;gap:6px}.cc{background:#f8fafc;border-radius:12px;padding:8px 12px;border:1px solid #e2e8f0}.cc summary{font-weight:900;font-size:16px;cursor:pointer;padding:4px 0}.cc>div{font-size:14.5px;line-height:1.7;padding-top:4px}
.qt{width:100%;border-collapse:collapse;font-size:14px}.qt td{border-top:1px solid #e2e8f0;padding:6px 4px;vertical-align:top}.qt td:first-child{white-space:nowrap;width:1%;padding-right:10px}
.wl{display:grid;gap:6px;max-height:300px;overflow:auto}.wl>div{background:#f8fafc;border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.5}.wl small{color:#475569}
.bdg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.bdg div{background:#f1f5f9;border-radius:12px;padding:8px 4px;display:grid;justify-items:center;text-align:center;opacity:.45;filter:grayscale(1)}.bdg div.on{opacity:1;filter:none;background:#fef9c3}.bdg span{font-size:28px}.bdg b{font-size:13px}.bdg small{font-size:11px;color:#64748b}
.btn.study{background:#a855f7;color:#fff;box-shadow:0 4px 0 #7e22ce}.btn.study .pill{background:#fff;color:#7e22ce;padding:1px 7px;font-size:12px}
.note.lb{background:#faf5ff;border:2px solid #e9d5ff}
@media (max-width:520px){.qa{grid-template-columns:1fr}.qq{font-size:16px}.bdg{grid-template-columns:repeat(2,1fr)}}

.mgrid b{font-size:14.5px}.mgrid small{font-size:12px;color:var(--muted);line-height:1.35}

function bfsPath(m,sx,sz,tx,tz){const W=m.W,H=m.H,si=Math.floor(sx),sj=Math.floor(sz);let ti=clamp(Math.floor(tx),0,W-1),tj=clamp(Math.floor(tz),0,H-1);

const BADGES=[{n:10,e:'🥉',t:'에너지 새싹',c:100},{n:30,e:'🥈',t:'에너지 탐험가',c:200},{n:60,e:'🥇',t:'에너지 박사',c:300},{n:100,e:'🏆',t:'에너지 마스터',c:500}];
function checkBadge(){const out=[];while(LEARN.badge<BADGES.length&&LEARN.ok>=BADGES[LEARN.badge].n){const B=BADGES[LEARN.badge];LEARN.badge++;PROG.coins+=B.c;out.push(`${B.e} 배지 「${B.t}」! 🪙 +${B.c}`)}if(out.length){saveLearn();saveProg()}return out}
function pickQ(){const unseen=QB.map((_,i)=>i).filter(i=>!LEARN.seen.includes(i));if(LEARN.wrong.length&&Math.random()<.35)return LEARN.wrong[Math.random()*LEARN.wrong.length|0];const pool=unseen.length?unseen:QB.map((_,i)=>i);return pool[Math.random()*pool.length|0]}
function recordQ(qi,ok){LEARN.n++;if(ok)LEARN.ok++;if(!LEARN.seen.includes(qi))LEARN.seen.push(qi);const w=LEARN.wrong.indexOf(qi);if(ok&&w>=0)LEARN.wrong.splice(w,1);if(!ok&&w<0)LEARN.wrong.push(qi);saveLearn()}
const ABC=['①','②','③','④'];

const QZ={open:false,pause:false,log:[],cb:null,timer:0};
function stepQuiz(dt){if(!G||CUR.demo||!LEARN.cube||G.over)return;G.qT=(G.qT==null?8:G.qT)-dt;if(G.qT>0)return;G.qT=G.mode==='sd'?14:18;
  if(G.picks.filter(k=>k.k==='quiz').length>=2)return;const m=G.map;
  for(let t=0;t<60;t++){const i=1+(Math.random()*(m.W-2)|0),j=2+(Math.random()*(m.H-4)|0);const v=m.g[j*m.W+i];if(v!==T_FLOOR&&v!==T_BUSH)continue;
    if(m.sd){const c=m.W/2;if(Math.abs(i+.5-c)>Math.max(4,(G.smog||c)-2)||Math.abs(j+.5-c)>Math.max(4,(G.smog||c)-2))continue}else if(Math.abs(j+.5-m.H/2)>7)continue;
    G.picks.push({id:G.nid++,k:'quiz',x:i+.5,z:j+.5,vx:0,vz:0});addFx('mine',i+.5,j+.5);break}}
function quizPick(e){if(e.bot){if(Math.random()<.5)quizReward(e);return}
  const qi=pickQ();e.qz={qi};if(NET.on)e.inv=Math.max(e.inv,6);
  if(e.ctrl==='local')openQuiz(qi,ok=>quizAnswer(e,qi,ok));else if(e.peer)netTo(e.peer,{t:'quiz',qi})}
function quizAnswer(e,qi,ok){if(!e.qz||e.qz.qi!==qi)return;e.qz=null;e.inv=Math.min(e.inv,.4);if(ok)quizReward(e)}
function quizReward(e){if(e.dead)return;e.sup=1;heal(e,1500,e);e.speedT=3;e.ammo=3;addFx('gad',e.x,e.z,0,0,e.b);addFx('ring',e.x,e.z,0,0,1)}
function openQuiz(qi,cb){const Q=QB[qi];if(!Q){cb&&cb(false);return}QZ.open=true;QZ.cb=cb;QZ.qi=qi;QZ.pause=CUR.role==='solo';firing=false;for(const k in keys)keys[k]=false;sfx('gem');
  const p=$('qz');p.hidden=false;const lim=QZ.pause?0:15;QZ.timer=lim;
  p.innerHTML=`<div class="qh"><span>❓ 지식 큐브 · ${esc(Q.k)}</span>${lim?`<b id="qzT">${lim}</b>`:'<b>⏸ 잠깐 멈춤</b>'}</div><p class="qq">${esc(Q.q)}</p><div class="qa">${Q.a.map((a,i)=>`<button type="button" data-i="${i}"><b>${ABC[i]}</b> ${esc(a)}</button>`).join('')}</div><p class="qs">맞히면 🌟궁극기 가득 + ❤️회복 + 👟빨라짐 + 🪙5 · 키보드 1~4</p>`;
  p.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.i))}
function answerQuiz(i){if(!QZ.open||QZ.done)return;QZ.done=true;const Q=QB[QZ.qi],ok=i===Q.c;recordQ(QZ.qi,ok);QZ.log.push({qi:QZ.qi,ok});if(ok){PROG.coins+=5;saveProg()}const bd=checkBadge();
  const p=$('qz');p.querySelectorAll('[data-i]').forEach(b=>{const k=+b.dataset.i;b.disabled=true;if(k===Q.c)b.classList.add('ok');else if(k===i)b.classList.add('no')});
  p.querySelector('.qs').innerHTML=`<b class="${ok?'g':'r'}">${ok?'⭕ 정답! 힘이 솟아요!':i<0?'⏰ 시간 초과!':'❌ 아쉬워요!'}</b> ${esc(Q.x)}${bd.length?'<br>'+bd.join(' '):''}<br><button type="button" class="qok">확인 ▶</button>`;
  sfx(ok?'cell':'lose');const cb=QZ.cb;QZ.cb=null;if(cb)cb(ok);
  p.querySelector('.qok').onclick=closeQuiz;QZ.closeT=setTimeout(closeQuiz,QZ.pause?(ok?2500:6000):(ok?1800:3500))}
function closeQuiz(){clearTimeout(QZ.closeT);$('qz').hidden=true;QZ.open=false;QZ.done=false;QZ.pause=false}
addEventListener('keydown',e=>{if(!QZ.open)return;const m=/^(Digit|Numpad)([1-4])$/.exec(e.code);if(m){e.preventDefault();e.stopImmediatePropagation();if(!QZ.done)answerQuiz(+m[2]-1);else closeQuiz()}else if(QZ.done&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();e.stopImmediatePropagation();closeQuiz()}},true);
setInterval(()=>{if(!QZ.open||QZ.done||QZ.pause||!QZ.timer)return;QZ.timer--;const t=$('qzT');if(t)t.textContent=QZ.timer;if(QZ.timer<=0)answerQuiz(-1)},1000);

function studyCard(tab){tab=tab||'learn';const acc=LEARN.n?Math.round(LEARN.ok/LEARN.n*100):0;const nb=BADGES[LEARN.badge];
  const tabs=`<div class="seg" id="stTab">${[['learn','📖 개념'],['quiz','🧠 퀴즈'],['wrong','📝 오답 노트'],['me','🏅 내 기록']].map(([k,n])=>`<button type="button" data-t="${k}" aria-pressed="${k===tab}">${n}${k==='wrong'&&LEARN.wrong.length?' '+LEARN.wrong.length:''}</button>`).join('')}</div>`;
  let body='';
  if(tab==='learn')body=`<div class="cgrid">${CONCEPTS.map((c,i)=>`<details class="cc"${i===0?' open':''}><summary>${c.e} ${c.t}</summary><div>${c.b}</div></details>`).join('')}</div>
    <details class="cc"><summary>⚡ 브롤러로 보는 발전 방식 비교</summary><div><table class="qt">${BR.map(b=>`<tr><td>${b.e} <b>${b.n}</b></td><td>${CONV[b.id]}<br><span class="g">👍 ${PROCON[b.id][0]}</span><br><span class="r">👎 ${PROCON[b.id][1]}</span></td></tr>`).join('')}</table></div></details>`;
  else if(tab==='quiz')body=`<p>문제 <b>10개</b>를 풀어요. 맞힐 때마다 🪙10 + 🎫5 XP, 10개 모두 맞히면 🪙50 더!</p><div class="seg" id="qkSeg">${['전체','형태','전환','태양','자원','절약'].map((k,i)=>`<button type="button" data-k="${k}" aria-pressed="${i===0}">${k}</button>`).join('')}</div><button class="btn" id="qStart" type="button">▶ 퀴즈 시작</button>`;
  else if(tab==='wrong')body=LEARN.wrong.length?`<p class="small">틀린 문제예요. 다시 맞히면 노트에서 지워져요.</p><div class="wl">${LEARN.wrong.map(i=>`<div><b>Q.</b> ${esc(QB[i].q)}<br><span class="g">정답 ${ABC[QB[i].c]} ${esc(QB[i].a[QB[i].c])}</span><br><small>${esc(QB[i].x)}</small></div>`).join('')}</div><button class="btn" id="qWrong" type="button">🔁 오답만 다시 풀기</button>`:'<p>🎉 틀린 문제가 없어요! 퀴즈를 더 풀어 보세요.</p>';
  else body=`<div class="stats"><span>✅ 맞힌 문제 ${LEARN.ok}</span><span>📝 푼 문제 ${LEARN.n}</span><span>🎯 정답률 ${acc}%</span><span>📚 본 문제 ${LEARN.seen.length}/${QB.length}</span><span>🏆 퀴즈 최고 ${LEARN.best}/10</span></div>
    <div class="bdg">${BADGES.map((B,i)=>`<div class="${i<LEARN.badge?'on':''}"><span>${B.e}</span><b>${B.t}</b><small>정답 ${B.n}개 · 🪙${B.c}</small></div>`).join('')}</div>${nb?`<p class="small">다음 배지까지 정답 ${nb.n-LEARN.ok}개!</p>`:'<p class="small">모든 배지를 모았어요! 👏</p>'}`;

function runDrill(list,wrongMode){let k=0,ok=0;const res=[];

      <div class="qa dk">${Q.a.map((a,i)=>`<button type="button" data-i="${i}"><b>${ABC[i]}</b> ${esc(a)}</button>`).join('')}</div><div id="dEx"></div>`,{x:lobby});

      ov.querySelectorAll('[data-i]').forEach(b=>{const n=+b.dataset.i;b.disabled=true;if(n===Q.c)b.classList.add('ok');else if(n===i)b.classList.add('no')});
      $('dEx').innerHTML=`<div class="note"><b class="${good?'g':'r'}">${good?'⭕ 정답!':'❌ 정답은 '+ABC[Q.c]}</b> ${esc(Q.x)}</div><div class="row"><button class="btn" id="dNext" type="button">${k+1<list.length?'다음 문제 ▶':'결과 보기 ▶'}</button></div>`;$('dNext').onclick=()=>{k++;show()};$('dNext').focus()};
    delete ov.dataset.ans;ov.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>ans(+b.dataset.i));DRILL.ans=ans};
  const finish=()=>{DRILL.ans=null;const coin=ok*10+(ok===list.length&&list.length>=10?50:0),xp=ok*5;PROG.coins+=coin;PROG.xp+=xp;const pm=claimPass();if(list.length>=10)LEARN.best=Math.max(LEARN.best,ok);saveLearn();saveProg();const bd=checkBadge();sfx(ok>=list.length*.7?'win':'lose');
    openCard(`<div style="text-align:center"><h1>${ok===list.length?'🏆 만점!':ok>=list.length*.7?'🎉 잘했어요!':'💪 다시 도전!'}</h1><p class="big">${ok} / ${list.length}</p></div><p class="rw">🪙 +${coin} · 🎫 +${xp} XP${pm?'<br>'+pm:''}${bd.length?'<br>'+bd.join('<br>'):''}</p>
      <div class="wl">${res.map(r=>`<div>${r.ok?'⭕':'❌'} ${esc(QB[r.qi].q)}<br><small>${ABC[QB[r.qi].c]} ${esc(QB[r.qi].a[QB[r.qi].c])} — ${esc(QB[r.qi].x)}</small></div>`).join('')}</div>

    $('dAgain').onclick=()=>{const pool=QB.map((_,i)=>i).sort(()=>Math.random()-.5);runDrill(wrongMode&&LEARN.wrong.length?LEARN.wrong.slice(0,10):pool.slice(0,10),wrongMode)};$('dBack').onclick=()=>studyCard(wrongMode?'wrong':'quiz')};
  show()}

  pc.on('connection',c=>{if(!asHost){c.close();return}c.on('open',()=>NET.conns.set(c.peer,c));c.on('data',d=>onNet(d,c.peer));c.on('close',()=>{NET.conns.delete(c.peer);const p=NET.pl[c.peer];if(p)toast(`${p.n}님이 나갔어요`);delete NET.pl[c.peer];

function onNet(d,from){if(!d||typeof d!=='object')return;
  if(NET.host&&from!=='self'){
    if(d.t==='hi'){NET.pl[from]={n:String(d.n||'친구').slice(0,10),b:clamp(d.b|0,0,BR.length-1),lvl:clamp(d.lvl|0,1,9)};toast(`${NET.pl[from].n}님이 들어왔어요! 👋`,'good');
      if(CUR.started&&!CUR.over&&G&&!CUR.demo){const p=NET.pl[from];const cnt=[0,0];G.ents.forEach(e=>{if(!e.bot)cnt[e.team]=(cnt[e.team]||0)+1});const myT=G.ents.find(e=>e.peer==='self').team;
        const want=G.mode==='sd'?null:NET.coop?myT:(cnt[0]<=cnt[1]?0:1);const bot=G.ents.find(e=>e.bot&&(want==null||e.team===want))||G.ents.find(e=>e.bot);

    if(d.t==='in'){if(!G)return;const e=G.ents.find(x=>x.peer===from);if(!e)return;if(!e.dead&&e.lockT<=0&&!e.dash&&isFinite(d.x)&&isFinite(d.z)){e.x=clamp(+d.x,.3,G.map.W-.3);e.z=clamp(+d.z,.3,G.map.H-.3);e.y=clamp(+d.y||0,0,4);e.face=+d.f||0;e.mv=d.mv?1:0;e.mx=d.mv?Math.sin(e.face):0;e.mz=d.mv?Math.cos(e.face):0}

    return}

    case'ev':showEv(d);break;
    case'quiz':{const qi=d.qi|0;openQuiz(qi,ok=>netSend({t:'qa',qi,ok:ok?1:0}));break}
