<script>
/* ============ claude.ai 함께 하기 (room 기능을 PeerJS처럼 쓰는 연결 도구) ============ */
/* ============ claude.ai 함께 하기 (room 기능을 PeerJS처럼 쓰는 연결 도구) ============ */
let NETR_=null;
(async()=>{try{if(window.claude&&claude.use){const r=await claude.use('room');if(r)NETR_=r}}catch(e){NETR_=null}})();
const RP_CLEAN=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F­​-‏‪-‮⁠-⁯﻿-]/g,'');
const RP_LATEST=new Set(['p','s','m','gs','ps','pos','st','mobs','in','ro','room','wd']);
class RPConn{constructor(pc,peer){this.pc=pc;this.peer=peer;this.open=false;this.h={}}
  on(ev,fn){(this.h[ev]=this.h[ev]||[]).push(fn);return this}
  fire(ev,a){for(const f of this.h[ev]||[])try{f(a)}catch(e){console.error(e)}}
  send(m){if(this.open)this.pc._q(this.peer,m)}
  close(){this.open=false}}
class RoomPeer{
  constructor(id){this.id=id||null;this.h={};this.conns=new Map();this.seq=0;this.win=[];this.pend=[];this.seen={};this.chunks={};this.room=null;this.dead=false;this.unsub=[];
    this._start().catch(e=>this.fire('error',{type:e&&e.type||'network'}))}
  on(ev,fn){(this.h[ev]=this.h[ev]||[]).push(fn);return this}
  fire(ev,a){for(const f of this.h[ev]||[])try{f(a)}catch(e){console.error(e)}}
  async _start(){await new Promise(r=>setTimeout(r,0));const R=NETR_;if(!R)throw{type:'network'};const host=!!this.id;this.host=host;
    const name=String(host?this.id:'x').toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);
    if(host){this.room=await R.join(name);await new Promise(r=>setTimeout(r,1200));
      if(this.room.peers().some(p=>!p.sameTab&&p.presence&&p.presence.h)){await this.room.leave().catch(()=>{});throw{type:'unavailable-id'}}
      await this.room.presence({h:1,o:[]});this.me=(this.room.peers().find(p=>p.sameTab)||{}).peer;this._listen();this.fire('open',this.id)}
    else this.fire('open','guest')}
  connect(hid){const c=new RPConn(this,null);(async()=>{try{const name=String(hid).toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);this.room=await NETR_.join(name);
      let hp=null;for(let i=0;i<40&&!hp;i++){hp=this.room.peers().find(p=>!p.sameTab&&p.presence&&p.presence.h);if(!hp)await new Promise(r=>setTimeout(r,250))}
      if(!hp){await this.room.leave().catch(()=>{});this.fire('error',{type:'peer-unavailable'});return}
      this.me=(this.room.peers().find(p=>p.sameTab)||{}).peer;c.peer=hp.peer;this.conns.set(hp.peer,c);await this.room.presence({g:1,o:[]});this._listen();c.open=true;c.fire('open')}catch(e){this.fire('error',{type:'network'})}})();return c}
  _listen(){const r=this.room;this.unsub.push(r.onPeers(ch=>this._peers(ch),()=>{for(const c of this.conns.values()){c.open=false;c.fire('close')}}));this._peers({peers:r.peers(),joined:r.peers(),left:[],updated:[]});
    this.timer=setInterval(()=>this._flush(),100)}
  _peers(ch){for(const p of ch.left||[]){const c=this.conns.get(p.peer);if(c){c.open=false;this.conns.delete(p.peer);c.fire('close')}}
    for(const p of ch.peers){if(p.sameTab)continue;const pr=p.presence||{};
      if(this.host&&pr.g&&!this.conns.has(p.peer)){const c=new RPConn(this,p.peer);this.conns.set(p.peer,c);this.fire('connection',c);setTimeout(()=>{c.open=true;c.fire('open')},50)}
      const c=this.conns.get(p.peer);if(!c)continue;const o=Array.isArray(pr.o)?pr.o.slice().sort((x,y)=>x.s-y.s):[];const sn=this.seen[p.peer]||(this.seen[p.peer]={set:new Set(),floor:0});
      for(const e of o){if(!e||!(e.s>sn.floor)||sn.set.has(e.s))continue;sn.set.add(e.s);if(e.to!=='*'&&!(Array.isArray(e.to)&&e.to.includes(this.me)))continue;let txt=e.x;
        if(e.c){const k=p.peer+':'+e.c[0];const bk=this.chunks[k]||(this.chunks[k]=[]);bk[e.c[1]]=e.x;if(bk.filter(v=>v!=null).length<e.c[2])continue;txt=bk.join('');delete this.chunks[k]}
        try{c.fire('data',JSON.parse(txt))}catch(err){}}
      if(sn.set.size>600){const arr=[...sn.set].sort((x,y)=>x-y);sn.floor=arr[arr.length-400];sn.set=new Set(arr.slice(-400))}}}
  _q(to,m){const t=m&&m.t,key=RP_LATEST.has(t)?t+'|'+(m.id??''):null;
    for(const e of this.pend)if(e.ref===m){if(!e.to.includes(to))e.to.push(to);return}
    let txt;try{txt=RP_CLEAN(JSON.stringify(m))}catch(e){return}
    if(key){const e=this.pend.find(q=>q.key===key);if(e){e.ref=m;e.txt=txt;if(!e.to.includes(to))e.to.push(to);return}}
    this.pend.push({ref:m,key,to:[to],txt})}
  _flush(){if(!this.room||this.dead)return;const now=Date.now();

const LEARN=Object.assign({n:0,ok:0,wrong:[],seen:[],best:0,badge:0,cube:1},store.get('learn',{}));
function saveLearn(){store.set('learn',LEARN)}
const BADGES=[{n:10,e:'🥉',t:'에너지 새싹',c:100},{n:30,e:'🥈',t:'에너지 탐험가',c:200},{n:60,e:'🥇',t:'에너지 박사',c:300},{n:100,e:'🏆',t:'에너지 마스터',c:500}];
function checkBadge(){const out=[];while(LEARN.badge<BADGES.length&&LEARN.ok>=BADGES[LEARN.badge].n){const B=BADGES[LEARN.badge];LEARN.badge++;PROG.coins+=B.c;out.push(`${B.e} 배지 「${B.t}」! 🪙 +${B.c}`)}if(out.length){saveLearn();saveProg()}return out}
function pickQ(){const unseen=QB.map((_,i)=>i).filter(i=>!LEARN.seen.includes(i));if(LEARN.wrong.length&&Math.random()<.35)return LEARN.wrong[Math.random()*LEARN.wrong.length|0];const pool=unseen.length?unseen:QB.map((_,i)=>i);return pool[Math.random()*pool.length|0]}
function recordQ(qi,ok){LEARN.n++;if(ok)LEARN.ok++;if(!LEARN.seen.includes(qi))LEARN.seen.push(qi);const w=LEARN.wrong.indexOf(qi);if(ok&&w>=0)LEARN.wrong.splice(w,1);if(!ok&&w<0)LEARN.wrong.push(qi);saveLearn()}
const ABC=['①','②','③','④'];

function stepQuiz(dt){if(!G||CUR.demo||!LEARN.cube||G.over)return;G.qT=(G.qT==null?8:G.qT)-dt;if(G.qT>0)return;G.qT=G.mode==='sd'?14:18;
  if(G.picks.filter(k=>k.k==='quiz').length>=2)return;const m=G.map;
  for(let t=0;t<60;t++){const i=1+(Math.random()*(m.W-2)|0),j=2+(Math.random()*(m.H-4)|0);const v=m.g[j*m.W+i];if(v!==T_FLOOR&&v!==T_BUSH)continue;
    if(m.sd){const c=m.W/2;if(Math.abs(i+.5-c)>Math.max(4,(G.smog||c)-2)||Math.abs(j+.5-c)>Math.max(4,(G.smog||c)-2))continue}else if(Math.abs(j+.5-m.H/2)>7)continue;
    G.picks.push({id:G.nid++,k:'quiz',x:i+.5,z:j+.5,vx:0,vz:0});addFx('mine',i+.5,j+.5);break}}
function quizPick(e){if(e.bot){if(Math.random()<.5)quizReward(e);return}
  const qi=pickQ();e.qz={qi};if(NET.on)e.inv=Math.max(e.inv,6);
  if(e.ctrl==='local')openQuiz(qi,ok=>quizAnswer(e,qi,ok));else if(e.peer)netTo(e.peer,{t:'quiz',qi})}
function quizAnswer(e,qi,ok){if(!e.qz||e.qz.qi!==qi)return;e.qz=null;e.inv=Math.min(e.inv,.4);if(ok)quizReward(e)}
function quizReward(e){if(e.dead)return;e.sup=1;heal(e,1500,e);e.speedT=3;e.ammo=3;addFx('gad',e.x,e.z,0,0,e.b);addFx('ring',e.x,e.z,0,0,1)}
function openQuiz(qi,cb){const Q=QB[qi];if(!Q){cb&&cb(false);return}QZ.open=true;QZ.cb=cb;QZ.qi=qi;QZ.pause=CUR.role==='solo';firing=false;for(const k in keys)keys[k]=false;sfx('gem');
  const p=$('qz');p.hidden=false;const lim=QZ.pause?0:15;QZ.timer=lim;
  p.innerHTML=`<div class="qh"><span>❓ 지식 큐브 · ${esc(Q.k)}</span>${lim?`<b id="qzT">${lim}</b>`:'<b>⏸ 잠깐 멈춤</b>'}</div><p class="qq">${esc(Q.q)}</p><div class="qa">${Q.a.map((a,i)=>`<button type="button" data-i="${i}"><b>${ABC[i]}</b> ${esc(a)}</button>`).join('')}</div><p class="qs">맞히면 🌟궁극기 가득 + ❤️회복 + 👟빨라짐 + 🪙5 · 키보드 1~4</p>`;
  p.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.i))}
function answerQuiz(i){if(!QZ.open||QZ.done)return;QZ.done=true;const Q=QB[QZ.qi],ok=i===Q.c;recordQ(QZ.qi,ok);QZ.log.push({qi:QZ.qi,ok});if(ok){PROG.coins+=5;saveProg()}const bd=checkBadge();
  const p=$('qz');p.querySelectorAll('[data-i]').forEach(b=>{const k=+b.dataset.i;b.disabled=true;if(k===Q.c)b.classList.add('ok');else if(k===i)b.classList.add('no')});
  p.querySelector('.qs').innerHTML=`<b class="${ok?'g':'r'}">${ok?'⭕ 정답! 힘이 솟아요!':i<0?'⏰ 시간 초과!':'❌ 아쉬워요!'}</b> ${esc(Q.x)}${bd.length?'<br>'+bd.join(' '):''}<br><button type="button" class="qok">확인 ▶</button>`;
  sfx(ok?'cell':'lose');const cb=QZ.cb;QZ.cb=null;if(cb)cb(ok);

addEventListener('keydown',e=>{if(!QZ.open)return;const m=/^(Digit|Numpad)([1-4])$/.exec(e.code);if(m){e.preventDefault();e.stopImmediatePropagation();if(!QZ.done)answerQuiz(+m[2]-1);else closeQuiz()}else if(QZ.done&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();e.stopImmediatePropagation();closeQuiz()}},true);
setInterval(()=>{if(!QZ.open||QZ.done||QZ.pause||!QZ.timer)return;QZ.timer--;const t=$('qzT');if(t)t.textContent=QZ.timer;if(QZ.timer<=0)answerQuiz(-1)},1000);

function studyCard(tab){tab=tab||'learn';const acc=LEARN.n?Math.round(LEARN.ok/LEARN.n*100):0;const nb=BADGES[LEARN.badge];

  else body=`<div class="stats"><span>✅ 맞힌 문제 ${LEARN.ok}</span><span>📝 푼 문제 ${LEARN.n}</span><span>🎯 정답률 ${acc}%</span><span>📚 본 문제 ${LEARN.seen.length}/${QB.length}</span><span>🏆 퀴즈 최고 ${LEARN.best}/10</span></div>
    <div class="bdg">${BADGES.map((B,i)=>`<div class="${i<LEARN.badge?'on':''}"><span>${B.e}</span><b>${B.t}</b><small>정답 ${B.n}개 · 🪙${B.c}</small></div>`).join('')}</div>${nb?`<p class="small">다음 배지까지 정답 ${nb.n-LEARN.ok}개!</p>`:'<p class="small">모든 배지를 모았어요! 👏</p>'}`;

  ov.querySelectorAll('#stTab button').forEach(b=>b.onclick=()=>studyCard(b.dataset.t));

  const qs=$('qStart');if(qs)qs.onclick=()=>{const pool=QB.map((_,i)=>i).filter(i=>cat==='전체'||QB[i].k===cat).sort(()=>Math.random()-.5);runDrill(pool.slice(0,10))};

function runDrill(list,wrongMode){let k=0,ok=0;const res=[];

function onGoal(team,o){const msg={t:'ev',k:'goal',team,n:o?o.nm:''};showEv(msg);if(NET.on&&NET.host)netSend(msg)}

function onMatchEnd(){if(CUR.demo){setTimeout(()=>{if(CUR.demo)startDemo()},3000);return}const st=G.ents.map(e=>[e.id,e.stats.k,e.stats.d,e.stats.dmg,e.stats.heal,e.stats.obj,e.rank||0]);const msg={t:'end',win:G.res.win,sc:G.res.score,mvp:G.res.mvp,st};
  if(NET.on)netSend(msg);setTimeout(()=>showResult(msg),1200)}
let sdShown=false;function sdOut(rank){if(sdShown)return;sdShown=true;showResult({sdOut:1,rank})}
function showResult(d){if(CUR.over&&!d.sdOut)return;if(!d.sdOut)CUR.over=true;const my=CUR.ro[CUR.myId]||{};const sd=CUR.mode==='sd';let title,good;
  let rank=d.rank;if(sd&&!rank){const row=(d.st||[]).find(r=>r[0]===CUR.myId);rank=row?row[6]||1:1}
  if(sd){title=rank===1?'🏆 1등! 끝까지 살아남았어요!':`${rank}등`;good=rank<=4}else if(d.win<0){title='🤝 무승부';good=null}else{good=d.win===my.team;title=good?'🎉 승리!':'😢 패배'}
  if(CUR.rewarded&&!d.sdOut&&sd){/* 이미 보상 */}
  let tr=0,coin=0,xp=0;if(!CUR.rewarded){if(sd){tr=[0,10,7,5,3,1,-1,-2,-3,-4,-4][rank]??-4;coin=Math.max(5,32-rank*3);xp=Math.max(10,50-rank*5)}else{tr=good===true?8:good===false?-3:0;coin=good===true?30:good===false?12:18;xp=good===true?40:20}
    if(d.mvp===CUR.myId){coin+=10;xp+=10}CUR.rewarded=true;const b=my.b??PROG.sel;PROG.tr=Math.max(0,PROG.tr+tr);PROG.btr[b]=Math.max(0,(PROG.btr[b]||0)+tr);PROG.coins+=coin;PROG.games++;if(good)PROG.wins++;PROG.xp+=xp;
    var passMsg=claimPass();saveProg()}
  sfx(good===false?'lose':'win');
  const rows=(d.st||[]).slice().sort((a,b)=>sd?(a[6]||1)-(b[6]||1):(CUR.ro[a[0]].team-CUR.ro[b[0]].team)).map(r=>{const ro=CUR.ro[r[0]]||{};const cls=r[0]===CUR.myId?'me':!sd&&ro.team===CUR.myTeam?'al':'en';return`<tr class="${cls}"><td>${r[0]===d.mvp?'👑 ':''}${sd?(r[6]||1)+'등 ':''}${BR[ro.b]?BR[ro.b].e:''} ${esc(ro.n||'')}</td><td>${r[1]}</td><td>${r[2]}</td><td>${Math.round(r[3]/100)/10}k</td><td>${r[5]}</td></tr>`}).join('');
  const mvp=CUR.ro[d.mvp];
  openCard(`<div style="text-align:center"><h1>${title}</h1>${!sd&&d.sc?`<p class="big">${{gem:'💎',ball:'⚽',bounty:'⭐'}[CUR.mode]} ${d.sc[my.team]} : ${d.sc[1-my.team]}</p>`:''}${mvp?`<p>👑 MVP: <b>${BR[mvp.b].e} ${esc(mvp.n)}</b></p>`:''}</div>
   <p class="rw">${tr>=0?'🏆 +'+tr:'🏆 '+tr} · 🪙 +${coin} · 🎫 +${xp} XP${passMsg?'<br>'+passMsg:''}</p>
   ${rows?`<table class="st"><tr><th>브롤러</th><th>⚔️</th><th>💫</th><th>피해</th><th>목표</th></tr>${rows}</table>`:''}
   ${learnBox(my.b??0)}
   <div class="row" style="justify-content:center">${NET.on&&NET.guest?'<span class="note">방장이 다음 판을 시작하면 바로 들어가요</span>':`<button class="btn" id="again" type="button">🔁 다시 하기</button>`}<button class="btn alt" id="toLobby" type="button">🏠 로비</button></div>`,()=>{
    const ag=$('again');if(ag)ag.onclick=()=>{CUR.rewarded=false;sdShown=false;if(NET.on&&NET.host)roomCard();else startSolo(PROG.mode)};$('toLobby').onclick=()=>{if(NET.on){location.reload();return}CUR.rewarded=false;sdShown=false;CUR.started=false;document.body.classList.add('pre');startDemo();lobby()}})}
function claimPass(){let out=[];while(PROG.tier<PASS.length&&PROG.xp>=(PROG.tier+1)*100){const r=PASS[PROG.tier];PROG.tier++;if(r.b!=null){if(PROG.own[r.b]){PROG.coins+=300;out.push(`🎫 패스 ${PROG.tier}단계: 🪙 300 (이미 가진 브롤러)`)}else{PROG.own[r.b]=1;out.push(`🎫 패스 ${PROG.tier}단계: 새 브롤러 ${BR[r.b].e} ${BR[r.b].n}!`)}}else{PROG.coins+=r.c;out.push(`🎫 패스 ${PROG.tier}단계: 🪙 ${r.c}`)}}return out.join('<br>')}

/* ============ 함께 하기 ============ */
function netSend(m){if(!NET.on)return;if(NET.host){for(const c of NET.conns.values())if(c.open)try{c.send(m)}catch(e){}}else if(NET.hc&&NET.hc.open)try{NET.hc.send(m)}catch(e){}}
function netExcept(m,pid){for(const[k,c]of NET.conns)if(k!==pid&&c.open)try{c.send(m)}catch(e){}}
function netTo(pid,m){const c=NET.conns.get(pid);if(c&&c.open)try{c.send(m)}catch(e){}}
function netStart(asHost,code){if(!window.Peer&&!NETR_){toast('친구와 함께 하기를 불러오지 못했어요','bad');return}
  code=asHost?String(1000+Math.floor(Math.random()*9000)):String(code||'').replace(/\D/g,'').slice(0,4);if(code.length!==4){toast('방 번호 4자리를 적어 주세요','bad');return}
  const hid='ebrawl-v1-'+code;toast(asHost?'방을 만드는 중…':'방에 들어가는 중…');ov.querySelectorAll('.btn').forEach(b=>b.disabled=true);
  const pc=new (NETR_?RoomPeer:Peer)(asHost?hid:undefined,Object.assign({debug:0},window.ERV_PEERCFG||{}));NET.pc=pc;let done=false;
  const fail=m=>{try{pc.destroy()}catch(e){}toast(m,'bad');ov.querySelectorAll('.btn').forEach(b=>b.disabled=false)};
  const to=setTimeout(()=>{if(!done)fail(asHost?'방을 만들지 못했어요. 잠시 뒤 다시 해 주세요.':'방을 찾지 못했어요. 번호를 확인해 주세요.')},20000);
  pc.on('error',e=>{if(!done){clearTimeout(to);fail(e.type==='unavailable-id'?'그 방 번호는 이미 쓰고 있어요. 다시 만들어 주세요.':e.type==='peer-unavailable'?'그 번호의 방이 없어요.':(window.claude&&!NETR_)?'claude.ai 링크에서는 로그인한 친구끼리만 함께 할 수 있어요. 로그인 없이 하려면 크롬판 파일이나 웹사이트 주소로 열어 주세요.':'연결에 실패했어요 ('+(e.type||'오류')+')')}});
  pc.on('open',()=>{if(asHost){done=true;clearTimeout(to);Object.assign(NET,{on:true,host:true,guest:false,code});NET.coop=true;roomCard();toast(`방을 열었어요! 친구에게 방 번호 ${code}을(를) 알려 주세요${NETR_?' · claude.ai에 로그인한 친구가 같은 링크로 들어와요':''}`,'good');return}
    const hc=pc.connect(hid,{reliable:true});NET.hc=hc;
    hc.on('open',()=>{done=true;clearTimeout(to);Object.assign(NET,{on:true,host:false,guest:true,code});hc.send({t:'hi',n:NET.nick,b:PROG.sel,lvl:PROG.lvl[PROG.sel]});waitCard()});
    hc.on('data',d=>onNet(d,'host'));hc.on('close',()=>{if(NET.guest){banner('방이 닫혔어요','방장이 나갔어요');setTimeout(()=>location.reload(),3000)}})});
  pc.on('connection',c=>{if(!asHost){c.close();return}c.on('open',()=>NET.conns.set(c.peer,c));c.on('data',d=>onNet(d,c.peer));c.on('close',()=>{NET.conns.delete(c.peer);const p=NET.pl[c.peer];if(p)toast(`${p.n}님이 나갔어요`);delete NET.pl[c.peer];
    if(G)for(const e of G.ents)if(e.peer===c.peer){e.peer=null;e.bot=true;e.nm='🤖'+e.nm;CUR.ro[e.id].n=e.nm;CUR.ro[e.id].bot=1;netSend(roMsg())}if(!CUR.started||CUR.over)roomBroadcast()})})}

  ov.querySelectorAll('#mdSeg button').forEach(x=>x.onclick=()=>{PROG.mode=x.dataset.m;saveProg();roomBroadcast();roomCard()});ov.querySelectorAll('#tmSeg button').forEach(x=>x.onclick=()=>{NET.coop=x.dataset.c==='1';roomBroadcast();roomCard()});
  $('go').onclick=()=>{audio();startOnline()};$('mapB').onclick=()=>mapCard(roomCard);$('chB').onclick=()=>brawlerCard(PROG.sel,roomCard)});netSend({t:'room',mode:PROG.mode,coop:NET.coop?1:0,pl})}
function waitCard(d){const pl=d?d.pl:[];openCard(`<div class="hd"><h2>👥 방 ${NET.code}</h2><span class="pill">${d?MODES[d.mode].e+' '+MODES[d.mode].n+' · '+mapName(d.map||'random'):''}</span></div><p class="small">방장이 ▶ 시작을 누르면 바로 시작해요! ${d?(d.coop?'🤝 친구와 같은 팀':'⚔️ 친구와 대결'):''}</p>
  <div class="plist">${pl.map((p,i)=>`<div>${i===0?'👑':'🙂'} ${BR[p[1]]?BR[p[1]].e:''} <b>${esc(p[0])}</b> <small>${BR[p[1]]?BR[p[1]].n:''} Lv.${p[2]}</small></div>`).join('')}</div>
  <div class="row"><button class="btn alt" id="chB" type="button">${BR[PROG.sel].e} 브롤러 바꾸기</button></div>`,()=>{$('chB').onclick=()=>brawlerCard(PROG.sel,()=>waitCard(NET.lastRoom))})}
function startOnline(){const mode=PROG.mode;const ro=[{n:NET.nick,b:PROG.sel,lvl:PROG.lvl[PROG.sel],human:1,peer:'self'}];const peers=Object.keys(NET.pl);
  peers.forEach((pid,i)=>{const p=NET.pl[pid];ro.push({n:p.n,b:p.b,lvl:p.lvl,human:1,peer:pid})});
  if(mode!=='sd'){ro.forEach((r,i)=>{r.team=NET.coop?(i<3?0:1):(i%2)})}fillBots(ro,mode);CUR.rewarded=false;sdShown=false;launchHost((Math.random()*1e9)|0,mode,ro)}
function onNet(d,from){if(!d||typeof d!=='object')return;
  if(NET.host&&from!=='self'){
    if(d.t==='hi'){NET.pl[from]={n:String(d.n||'친구').slice(0,10),b:clamp(d.b|0,0,BR.length-1),lvl:clamp(d.lvl|0,1,9)};toast(`${NET.pl[from].n}님이 들어왔어요! 👋`,'good');
      if(CUR.started&&!CUR.over&&G&&!CUR.demo){const p=NET.pl[from];const cnt=[0,0];G.ents.forEach(e=>{if(!e.bot)cnt[e.team]=(cnt[e.team]||0)+1});const myT=G.ents.find(e=>e.peer==='self').team;
        const want=G.mode==='sd'?null:NET.coop?myT:(cnt[0]<=cnt[1]?0:1);const bot=G.ents.find(e=>e.bot&&(want==null||e.team===want))||G.ents.find(e=>e.bot);
        if(bot){bot.bot=false;bot.peer=from;bot.nm=p.n;bot.b=p.b;bot.lvl=p.lvl;bot.mhp=Math.round(BR[p.b].hp*lvMul(bot))+bot.cells*400;bot.hp=Math.min(bot.hp,bot.mhp);CUR.ro[bot.id]={n:bot.nm,b:bot.b,team:bot.team,lvl:bot.lvl,bot:0};netSend(roMsg());netTo(from,initMsg(bot.id))}
        else netTo(from,{t:'room',mode:PROG.mode,coop:NET.coop?1:0,pl:roomList()})}
      else roomBroadcast();return}
    if(d.t==='pick'){const p=NET.pl[from];if(p){p.b=clamp(d.b|0,0,BR.length-1);p.lvl=clamp(d.lvl|0,1,9)}if(!CUR.started||CUR.over)roomBroadcast();return}
    if(d.t==='in'){if(!G)return;const e=G.ents.find(x=>x.peer===from);if(!e)return;if(!e.dead&&e.lockT<=0&&!e.dash&&isFinite(d.x)&&isFinite(d.z)){e.x=clamp(+d.x,.3,G.map.W-.3);e.z=clamp(+d.z,.3,G.map.H-.3);e.y=clamp(+d.y||0,0,4);e.face=+d.f||0;e.mv=d.mv?1:0;e.mx=d.mv?Math.sin(e.face):0;e.mz=d.mv?Math.cos(e.face):0}
      if(Array.isArray(d.a))for(const a of d.a){if(!(a.s>(e.lastS||0)))continue;e.lastS=a.s;if(a.k==='atk')doAttack(e,+a.x||0,+a.z||0);else if(a.k==='sup')doSuper(e,+a.x||0,+a.z||0);else if(a.k==='gad')doGadget(e)}return}
    if(d.t==='qa'){const e=G&&G.ents.find(x=>x.peer===from);if(e)quizAnswer(e,d.qi|0,!!d.ok);return}
    if(d.t==='emo'){const e=G&&G.ents.find(x=>x.peer===from);if(e){showEmo(e.id,d.i|0);netSend({t:'emo',i:d.i|0,id:e.id})}return}
    return}
  switch(d.t){
    case'room':NET.lastRoom=d;if(!CUR.started||CUR.over||!ov.hidden&&!$('again'))waitCard(d);break;
    case'init':CUR.rewarded=false;sdShown=false;guestInit(d);break;
    case'ro':for(const r of d.R)CUR.ro[r[0]]={n:r[1],b:r[2],team:r[3],lvl:r[4],bot:r[5]};break;
    case's':if(CUR.role==='guest')applySnap(d);break;
    case'wd':if(CUR.role==='guest')applyWD(d.w||[]);break;
    case'fx':if(CUR.role==='guest')for(const f of d.f||[])onFx({id:f[0],k:f[1],x:f[2],z:f[3],x2:f[4],z2:f[5],c:f[6]});break;
    case'kf':feed(d.k);if(d.k&&CUR.ro[CUR.myId]&&d.k[3]===BR[CUR.ro[CUR.myId].b].e+' '+CUR.ro[CUR.myId].n){sfx('die');if(CUR.mode==='sd')setTimeout(()=>{const v=VS.ents.get(CUR.myId);if(v&&v.dead)sdOut(VS.alive+1)},900);else banner('💫 쓰러졌어요!','3초 뒤에 다시 나와요')}break;
    case'ev':showEv(d);break;
    case'quiz':{const qi=d.qi|0;openQuiz(qi,ok=>netSend({t:'qa',qi,ok:ok?1:0}));break}
    case'emo':showEmo(d.id,d.i|0);break;
    case'end':if(CUR.role==='guest')showResult(d);break}}
let netT=0,fxT=0,lastFx=0,lastWd=0;
function netTick(dt){if(!NET.on)return;netT-=dt;fxT-=dt;
  if(NET.guest){if(gCD>0)gCD-=dt;if(netT<=0&&CUR.started&&CUR.role==='guest'){netT=NETR_?.1:.066;const now=performance.now();ACTQ=ACTQ.filter(a=>now-a.t<1500);netSend({t:'in',x:r1(ME.x),z:r1(ME.z),y:r1(ME.y),f:Math.round(ME.face*100)/100,mv:ME.mv,a:ACTQ.map(a=>({s:a.s,k:a.k,x:a.x,z:a.z}))})}return}
  if(!NET.host||!G||CUR.demo)return;
  if(netT<=0){netT=NETR_?.125:.066;const fl=e=>(e.dead?1:0)|(inBush(e)?2:0)|(e.revealT>0?4:0)|(e.stunT>0?8:0)|(e.shieldT>0?16:0)|((e.lockT>0||e.dash)?32:0)|(e.slowT>0?64:0)|((e.boostT>0||e.speedT>0)?128:0)|(e.invisT>0?256:0);
    const P=G.projs.slice(-(NETR_?16:40)).map(p=>p.lob?[p.id,r1(p.sx),r1(p.sz),r1(p.tx),r1(p.tz),Math.round(p.T*10),Math.round(p.t*10),p.ty,1]:[p.id,r1(p.x),r1(p.z),r1(p.vx),r1(p.vz),0,0,p.ty,0]);
    const B=G.ball;netSend({t:'s',sc:G.score,tl:Math.ceil(G.time),cd:G.cd?[G.cd.team,r1(G.cd.t)]:0,sm:r1(G.smog||0),al:G.alive,
      E:G.ents.map(e=>[e.id,r1(e.x),r1(e.z),r1(e.y),Math.round(e.face*100)/100,Math.round(e.hp),e.mhp,fl(e),Math.round(e.ammo*10),Math.round(e.sup*100),e.gems,e.bounty,e.cells,e.tp,e.gadN]),
      P,Z:G.zones.map(z=>[z.id,r1(z.x),r1(z.z),r1(z.r),z.kind,z.team]),K:G.picks.slice(0,30).map(k=>[k.id,r1(k.x),r1(k.z),k.k]),B:B?[r1(B.x),r1(B.z),r1(B.h),B.own]:0,TW:G.tw?G.tw.map(w=>w.n):[]})}
  if(G.wd.length!==lastWd){lastWd=G.wd.length;netSend({t:'wd',w:G.wd})}
  if(fxT<=0){fxT=NETR_?.2:.1;const skip=NETR_?new Set(['mz','heal','pick','chip']):new Set(['chip']);const f=G.fx.filter(x=>x.id>lastFx&&!skip.has(x.k)).slice(-12);if(G.fx.length)lastFx=Math.max(lastFx,G.fx[G.fx.length-1].id);if(f.length)netSend({t:'fx',f:f.map(x=>[x.id,x.k,x.x,x.z,x.x2,x.z2,x.c])})}}

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
if(touchUI)$('touch').hidden=false;
let last=performance.now(),T0=performance.now();
function frame(nw){const dt=Math.min(.05,Math.max(0,(nw-last)/1000));last=nw;const t=(nw-T0)/1000;
  try{if(CUR.role!=='guest'&&G){const e=CUR.demo?null:myEnt();if(e){updMouseAim();const[mx,mz]=ov.hidden?moveInput():[0,0];e.mx=mx;e.mz=mz;if(firing&&ov.hidden)act('atk',mouseAim)}simStep(dt)}
    else if(CUR.role==='guest'){updMouseAim();if(firing&&ov.hidden)act('atk',mouseAim);if(ov.hidden)guestStep(dt)}
    netTick(dt);hud();render(dt,t)}catch(err){console.error(err)}
  requestAnimationFrame(frame)}
startDemo();requestAnimationFrame(frame);lobby();
