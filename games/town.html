<style>
/* 레이아웃: 화면 가득 비스듬한 마을 지도, 위에 상태 막대, 아래에 메뉴 버튼, 패널은 아래에서 올라오는 시트 */
:root{
  color-scheme:light;
  --ink:#1f2f3c; --muted:#5b6b78; --paper:#ffffff; --paper2:#f3f7fa; --line:#d8e2ea;
  --leaf:#22a065; --leaf-soft:#dcf3e6; --sun:#ffc531; --sun-soft:#fff3cc; --heat:#e5533a; --heat-soft:#fde4dd;
  --sky:#3e8ee8; --carbon:#4a4658; --carbon-soft:#e8e6ee;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#8fd0f2}
body{overflow:hidden;font-family:var(--f-body);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.drag{cursor:grabbing}

/* 상단 상태 */
#top{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.pill{pointer-events:auto;background:rgba(255,255,255,.94);border-radius:999px;padding:4px 12px 4px 4px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 rgba(0,0,0,.12);font-size:14px;white-space:nowrap}
.pill .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none}
.pill b{font-family:var(--f-display);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums}
.lvl .ic{background:#3e8ee8;color:#fff;font-family:var(--f-display);font-size:16px}
.xpbar,.bbar,.cbar{width:74px;height:9px;border-radius:6px;background:#e3eaf0;overflow:hidden}
.xpbar i,.bbar i,.cbar i{display:block;height:100%;border-radius:6px;transition:width .3s}
.xpbar i{background:#3e8ee8}.bbar i{background:linear-gradient(90deg,#facc15,#22c55e)}.cbar i{background:linear-gradient(90deg,#9ca3af,#4a4658)}
.coin .ic{background:#ffd54a}.bat .ic{background:#fff1a6}.co2 .ic{background:#e8e6ee}.wx .ic{background:#e0f2fe}.happy .ic{background:#fde4dd}
.small{font-size:12px;color:var(--muted)}
.pill.warn{background:#fee2e2}
.sp{flex:1}

/* 하단 메뉴 */
#bot{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mb{pointer-events:auto;position:relative;border:0;border-radius:18px;background:#fff;min-width:74px;padding:8px 12px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 5px 0 rgba(0,0,0,.18);font-family:var(--f-display);font-size:14px}
.mb em{font-style:normal;font-size:24px;line-height:1.1}
.mb.main{background:var(--leaf);color:#fff}
.mb:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.mb .dot{position:absolute;top:-4px;right:-4px;background:var(--heat);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;font-family:var(--f-body)}
#placeBar{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 80px);background:rgba(15,23,42,.9);color:#fff;border-radius:14px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;font-size:14px;max-width:92vw}
#placeBar button{border:0;border-radius:10px;padding:6px 12px;background:#fff;color:var(--ink);font-family:var(--f-display)}

#toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top,0px)) + 52px);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(560px,90vw);pointer-events:none}
.toast{background:rgba(15,23,42,.9);color:#fff;border-radius:10px;padding:6px 12px;font-size:14px;text-align:center;animation:tin .25s}
.toast.bad{background:rgba(190,40,30,.95)}.toast.good{background:rgba(21,128,61,.95)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* 시트(패널) */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(15,30,45,.45);display:flex;align-items:flex-end;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
#sheet.center{align-items:center;padding-bottom:16px}
.card{background:var(--paper);border-radius:22px 22px 0 0;width:min(760px,100%);max-height:86vh;overflow:auto;padding:18px 18px max(18px,env(safe-area-inset-bottom,0px));display:grid;gap:12px;animation:up .22s ease-out}
#sheet.center .card{border-radius:22px;width:min(540px,100%)}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.card h2,.card h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.card h2{font-size:25px}.card h3{font-size:18px}
.card p{margin:0;line-height:1.6}
.hd{display:flex;align-items:center;gap:10px}.hd .x{margin-left:auto;border:0;background:var(--paper2);border-radius:12px;width:38px;height:38px;font-size:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-family:var(--f-display);font-size:15px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bc{border:2px solid var(--line);background:var(--paper2);border-radius:16px;padding:8px;display:grid;gap:3px;justify-items:center;text-align:center;position:relative}
.bc:hover:not(:disabled){border-color:var(--ink)}
.bc:disabled{opacity:.55;cursor:not-allowed}
.bc canvas{width:96px;height:80px}
.bc b{font-family:var(--f-display);font-weight:400;font-size:16px}
.bc small{font-size:12px;color:var(--muted);line-height:1.35}
.bc .price{font-family:var(--f-display);font-size:15px}
.bc .lock{position:absolute;inset:0;border-radius:14px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-family:var(--f-display);font-size:17px;color:var(--muted)}
.kind{font-size:11px;border-radius:6px;padding:0 6px;font-family:var(--f-body)}
.kind.r{background:var(--leaf-soft);color:#17663e}.kind.f{background:var(--carbon-soft);color:var(--carbon)}.kind.t{background:#e0f2fe;color:#075985}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.pros{background:var(--leaf-soft);border-radius:10px;padding:8px 10px;font-size:14px}
.cons{background:var(--heat-soft);border-radius:10px;padding:8px 10px;font-size:14px}
.note{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55}
.note.good{background:var(--leaf-soft)}.note.bad{background:var(--heat-soft)}.note.info{background:var(--sun-soft)}
.btn{font-family:var(--f-display);font-size:18px;border:0;border-radius:14px;padding:10px 18px;background:var(--leaf);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn.alt{background:var(--paper2);color:var(--ink)}.btn.red{background:#fff;color:var(--heat);border:2px solid var(--heat);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ord{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--paper2);border-radius:14px;padding:10px}
.ord em{font-style:normal;font-size:30px;text-align:center}
.need{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.need span{background:#fff;border-radius:8px;padding:1px 8px;font-size:13.5px;border:1px solid var(--line)}
.need span.no{border-color:var(--heat);color:var(--heat)}
.q{display:grid;gap:4px;background:var(--paper2);border-radius:14px;padding:10px 12px}
.q.done{opacity:.55}.q.now{background:var(--sun-soft);border:2px solid var(--sun)}
.choice{text-align:left;background:var(--paper2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice.right{border-color:var(--leaf);background:var(--leaf-soft)}.choice.wrong{border-color:var(--heat);background:var(--heat-soft)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.box{background:var(--paper2);border-radius:14px;padding:10px 12px;display:grid;gap:6px;align-content:start;min-width:0}
.box ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px;line-height:1.5}
.big{font-family:var(--f-display);font-size:30px;text-align:center}
@media (max-width:640px){.pill{padding-right:9px;gap:5px;font-size:12px}.pill b{font-size:16px}.pill .ic{width:26px;height:26px;font-size:15px}.xpbar,.bbar,.cbar{width:48px}.hide-s{display:none}.mb{min-width:60px;padding:6px 8px;font-size:12.5px}.mb em{font-size:20px}.cols{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.toast,.card{animation:none}}
</style>
</head><body>
<canvas id="cv" aria-label="에너지 마을 지도. 땅이나 건물을 눌러요."></canvas>
<div id="top">
  <div class="pill lvl"><span class="ic" id="lvT">1</span><div><div class="small">레벨</div><div class="xpbar"><i id="xpB"></i></div></div></div>
  <div class="pill coin"><span class="ic">🪙</span><b id="coinT">0</b></div>
  <div class="pill bat" id="batP"><span class="ic">⚡</span><div><b id="batT">0</b><span class="small" id="batC"> / 0</span><div class="bbar"><i id="batB"></i></div></div></div>
  <div class="pill co2"><span class="ic">🏭</span><div><div class="small">탄소 <span id="co2T">0</span></div><div class="cbar"><i id="co2B"></i></div></div></div>
  <div class="pill happy hide-s"><span class="ic" id="hapI">😊</span><div><div class="small">행복</div><b id="hapT">0</b></div></div>

</div>

<div id="bot">
  <button class="mb main" type="button" id="bBuild"><em>🏗️</em>짓기</button>
  <button class="mb" type="button" id="bOrder"><em>📋</em>주문<span class="dot" id="ordDot" hidden>0</span></button>
  <button class="mb" type="button" id="bQuest"><em>🎯</em>미션<span class="dot" id="qDot" hidden>!</span></button>

<script>
/* ============ 기본 ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const TW=64,TH=32,N=18;
const store={get(k,d){try{const v=localStorage.getItem('etown_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('etown_'+k,JSON.stringify(v))}catch(e){}}};

/* ============ 땅 ============ */
const TERR={
  T:{n:'마을 땅',c:'#a8d98a',tip:'집과 마을 시설을 지을 수 있어요.'},
  R:{n:'길',c:'#b9bec4'},
  P:{n:'빈 땅',c:'#b7da86',tip:'평평한 빈 땅이에요. 화력 발전소나 태양광을 지을 수 있어요.'},
  S:{n:'햇살 들판',c:'#e9d870',tip:'햇빛이 하루 종일 잘 드는 들판이에요. 태양광 발전에 딱 좋아요.'},
  H:{n:'바람 언덕',c:'#6fbf62',tip:'바람이 세게 부는 언덕이에요. 풍력 발전기를 지어요.'},
  F:{n:'농장',c:'#c7a46b',tip:'밭을 일구고 볏짚을 모아요. 바이오 발전소도 지을 수 있어요.'},
  W:{n:'계곡 강',c:'#4aa3e0',tip:'높은 곳에서 물이 힘차게 흘러내려요. 수력 발전소를 지어요.'},
  G:{n:'온천 지대',c:'#c98a62',tip:'땅속 깊은 곳이 아주 뜨거워요. 지열 발전소를 지어요.'}
};
// 구역: 레벨이 되면 코인으로 넓혀요
const ZONES={
  hill:{n:'바람 언덕',lv:2,cost:120},
  farm2:{n:'넓은 농장',lv:3,cost:150},
  river:{n:'계곡 강',lv:4,cost:200},
  spring:{n:'온천 지대',lv:5,cost:250},
  east:{n:'동쪽 들판',lv:6,cost:300}
};
function terrainAt(i,j){
  if(j<=5&&i<=5&&i+j<=8)return['H','hill'];
  if(i>=14&&j>=11)return[(i===15||i===16)?'W':'P','river'];
  if(i<=3&&j>=12)return['G','spring'];
  if(j<=4&&i>=9)return['S',null];
  if(i>=15&&j<=10)return[i===15&&j<=3?'S':'P','east'];
  if(j>=13&&i>=4&&i<=13)return['F',i>=9?'farm2':null];
  if(j===8&&i>=2&&i<=14||i===8&&j>=3&&j<=13)return['R',null];
  if(i>=4&&i<=12&&j>=5&&j<=11)return['T',null];
  return['P',null];
}

/* ============ 건물 ============ */
// out: 한 번 생산량, cyc: 생산 시간(초), d: 수요(⚡/초)
const BD={
  house:{n:'주택',cat:'town',kd:'t',lv:1,cost:60,on:'T',tax:14,cyc:40,d:.06,bt:4,
    desc:'마을 사람이 사는 집이에요. 전기가 있어야 세금(코인)을 내요.',good:'집이 많을수록 코인을 많이 벌어요.',bad:'집마다 전기를 계속 써요. 전기가 떨어지면 정전!'},
  park:{n:'공원',cat:'town',kd:'t',lv:2,cost:90,on:'TP',pop:2,absorb:.03,happy:8,bt:5,
    desc:'나무와 풀이 가득한 공원이에요. 이산화 탄소를 흡수하고 사람들이 행복해져요.',good:'탄소를 줄이고 행복이 올라요. 집을 2채 더 지을 수 있어요.',bad:'전기를 만들지는 않아요.'},
  school:{n:'에너지 학교',cat:'town',kd:'t',lv:3,cost:220,on:'T',pop:4,d:.03,quiz:90,bt:8,
    desc:'에너지를 배우는 학교예요. 가끔 ? 표시가 뜨면 눌러서 퀴즈를 풀어요.',good:'퀴즈를 맞히면 코인과 경험치! 집을 4채 더 지을 수 있어요.',bad:'전기를 조금 써요.'},
  ess:{n:'배터리 저장소',cat:'town',kd:'t',lv:5,cost:280,on:'TP',cap:150,bt:8,
    desc:'남는 전기를 저장했다가 필요할 때 꺼내 써요(ESS).',good:'⚡ 저장 칸이 150 늘어나요. 밤이나 바람 없는 날에 든든해요.',bad:'전기를 만들지는 않아요. 짓는 값이 비싸요.'},
  charger:{n:'전기차 충전소',cat:'town',kd:'t',lv:6,cost:300,on:'T',pop:4,absorb:.02,d:.04,bt:8,
    desc:'휘발유 대신 전기로 달리는 자동차를 충전해요.',good:'자동차 매연이 줄어 탄소가 줄어요. 집을 4채 더 지을 수 있어요.',bad:'충전에 전기를 써요. 전기를 재생에너지로 만들어야 진짜 깨끗해요.'},
  solar:{n:'태양광',cat:'power',kd:'r',lv:1,cost:80,on:'SP',out:7,outP:5,cyc:30,vary:'sun',bt:5,
    desc:'햇빛을 받은 태양 전지가 바로 전기를 만들어요.',good:'연료가 필요 없고 이산화 탄소가 나오지 않아요.',bad:'밤에는 못 만들고, 흐린 날에는 많이 줄어요. 햇살 들판에서 더 많이 만들어요.'},
  wind:{n:'풍력',cat:'power',kd:'r',lv:2,cost:120,on:'H',out:10,cyc:35,vary:'wind',bt:6,
    desc:'바람이 커다란 날개를 돌리면 발전기가 전기를 만들어요.',good:'밤에도 바람만 불면 전기를 만들어요. 이산화 탄소가 없어요.',bad:'바람이 약한 날에는 거의 못 만들어요. 바람 센 언덕에만 지어요.'},
  bio:{n:'바이오',cat:'power',kd:'r',lv:3,cost:110,on:'F',out:9,cyc:35,straw:2,co2:.4,bt:6,

/* ============ 상태 ============ */
let G,BL=[],TL=[],people=[],fx=[],flyers=[],uid=1;
function freshState(){
  G={lv:1,xp:0,coins:180,bat:50,co2:8,fuel:{coal:FUEL.coal.max,gas:FUEL.gas.max},straw:0,T:0,
     zones:{},qi:0,qb:null,st:{energy:0,straw:0,orders:0},orders:[],seen:{},quizI:0,dark:false,wx:{sun:'sunny',wind:'normal',t:0},hint:0};
  BL=[];TL=[];
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const [t,z]=terrainAt(i,j);const tl={t,z,ob:null};
    if(t!=='R'&&t!=='W'&&!(t==='T'&&Math.abs(i-8)<3&&Math.abs(j-8)<3)&&Math.random()<(t==='T'?.06:.16))tl.ob=pick(t==='G'?['rock','rock','stump']:['bush','bush','rock','stump','bush']);
    TL.push(tl)}
  const add=(k,i,j)=>{tile(i,j).ob=null;BL.push(mkB(k,i,j,true))};
  add('house',6,7);add('house',7,6);add('house',9,7);add('house',10,9);
  add('coal',13,6);add('coal',14,10);
  add('field',6,14);add('field',7,14);add('field',6,15);
  add('tree',4,10);add('tree',12,11);
  G.qb={...G.st,house:cnt('house')};
  for(let k=0;k<3;k++)G.orders.push(genOrder());
}
function mkB(k,i,j,done){const d=BD[k];return {id:uid++,k,i,j,done:!!done,bt:done?0:d.bt,p:0,ready:false,plant:k==='field'?(done?1:0):0,amt:0,seed:Math.random()}}
const tile=(i,j)=>TL[j*N+i];
const inMap=(i,j)=>i>=0&&j>=0&&i<N&&j<N;
const cnt=k=>BL.filter(b=>b.k===k).length;
const dS=k=>G.st[k]-(G.qb[k]||0);
const bldAt=(i,j)=>BL.find(b=>b.i===i&&b.j===j);
const locked=t=>t.z&&!G.zones[t.z];
const xpNeed=()=>40+G.lv*45;
const popCap=()=>6+BL.filter(b=>b.done).reduce((s,b)=>s+(BD[b.k].pop||0),0);
const batCap=()=>120+BL.filter(b=>b.done).reduce((s,b)=>s+(BD[b.k].cap||0),0);
const demand=()=>BL.filter(b=>b.done).reduce((s,b)=>s+(BD[b.k].d||0),0)*(G.co2>=75?1.35:1);
function happy(){const parks=BL.filter(b=>b.k==='park'&&b.done).length,trees=cnt('tree');return Math.round(clamp(80-G.co2*.6-(G.dark?30:0)+parks*8+Math.min(10,trees),0,100))}

/* ============ 날씨와 시간 ============ */
const DAY=240;
const isNight=()=>(G.T%DAY)>DAY*.75;
function nightK(){const p=(G.T%DAY)/DAY;if(p<.68)return 0;if(p<.75)return (p-.68)/.07;if(p<.95)return 1;return 1-(p-.95)/.05}
function factor(b){const d=BD[b.k];
  if(d.vary==='sun'){if(isNight())return 0;return G.wx.sun==='sunny'?1:.35}
  if(d.vary==='wind')return G.wx.wind==='strong'?1.35:G.wx.wind==='normal'?1:.2;
  if(d.fuel)return G.fuel[d.fuel]>0?1:0;
  if(d.straw)return G.straw>=d.straw||b.p>0?1:0;
  return 1}
function outOf(b){const d=BD[b.k];return tile(b.i,b.j).t==='P'&&d.outP?d.outP:d.out}

/* ============ 진행 ============ */
let lastSave=0,qT=0;
function step(dt){
  G.T+=dt;
  G.wx.t-=dt;if(G.wx.t<=0){G.wx.t=rnd(70,100);const ps=G.wx.sun;G.wx.sun=Math.random()<.68?'sunny':'cloudy';const r=Math.random();G.wx.wind=r<.3?'strong':r<.75?'normal':'calm';
    if(ps!==G.wx.sun&&G.wx.sun==='cloudy'&&cnt('solar'))toast('구름이 많아졌어요. 태양광 발전이 느려져요 ☁️');if(G.wx.wind==='calm'&&cnt('wind'))toast('바람이 잠잠해요. 풍력 발전이 거의 멈췄어요 🍃')}
  for(const b of BL){const d=BD[b.k];
    if(!b.done){b.bt-=dt;if(b.bt<=0){b.done=true;b.bt=0;onBuilt(b)}continue}
    if(d.out&&!b.ready){const f=factor(b);if(f>0){
        if(b.p===0&&d.straw){if(G.straw<d.straw)continue;G.straw-=d.straw}
        b.p+=dt*f;if(b.p>=d.cyc){b.p=0;b.ready=true;b.amt=outOf(b);
          if(d.fuel){G.fuel[d.fuel]=Math.max(0,G.fuel[d.fuel]-1);if(G.fuel[d.fuel]===0)toast(`${FUEL[d.fuel].n}이(가) 모두 바닥났어요! ${d.n} 발전소가 멈춰요. 화석 연료는 유한한 자원이에요.`,'bad')}
          if(d.co2)G.co2=Math.min(100,G.co2+d.co2)}}}
    if(d.tax&&!b.ready&&!G.dark){b.p+=dt;if(b.p>=d.cyc){b.p=0;b.ready=true;b.amt=Math.round(d.tax*(.6+happy()/250))}}
    if(d.grow&&b.plant===1){b.p+=dt;if(b.p>=d.grow){b.plant=2;b.ready=true;b.amt=d.yield}}
    if(d.quiz&&!b.ready){b.p+=dt;if(b.p>=d.quiz){b.p=0;b.ready=true}}
    if(d.absorb)G.co2=Math.max(0,G.co2-d.absorb*dt)}
  G.co2=Math.max(0,G.co2-.004*dt);
  G.bat=Math.max(0,G.bat-demand()*dt);
  const wasDark=G.dark;G.dark=G.bat<=0&&demand()>0;
  if(G.dark&&!wasDark){toast('정전이에요! 발전소 위 ⚡를 눌러 전기를 모아요. 정전이면 집에서 코인이 안 나와요.','bad');sfx('bad')}
  if(!G.dark&&wasDark)toast('전기가 다시 들어왔어요! 💡','good');
  if(G.co2>=75&&!G.hw){G.hw=1;toast('탄소가 너무 많아 폭염이 왔어요! 에어컨 때문에 전기가 더 필요해요 🥵','bad')}else if(G.co2<70)G.hw=0;
  qT-=dt;if(qT<=0){qT=1;checkQuest();renderHud()}
  for(const o of G.orders)if(o.wait>0)o.wait-=dt;
  if(G.T-lastSave>5){lastSave=G.T;save()}
}
function onBuilt(b){const d=BD[b.k];sfx('built');addXP(Math.max(2,Math.round(d.cost/8)));
  burst(b.i,b.j,'#fde68a',14);
  if(!G.seen[b.k]&&b.k!=='field'&&b.k!=='tree'){G.seen[b.k]=1;learnCard(b.k)}
  if(b.k==='field'){b.plant=1;b.p=0}}
function addXP(n){G.xp+=n;while(G.xp>=xpNeed()){G.xp-=xpNeed();G.lv++;levelUp()}renderHud()}
function collect(b){const d=BD[b.k];const sp=w2s(b.i+.5,b.j+.5,bh(b)+18);
  if(d.out){const room=batCap()-G.bat;if(room<=0){toast('배터리가 가득 찼어요! 집을 더 짓거나 배터리 저장소를 지어요.');return}
    const got=Math.min(room,b.amt);G.bat+=got;G.st.energy+=got;b.ready=false;fly(sp,'⚡',$('batP'),`+${got}`);sfx('zap');addXP(1);
    if(got<b.amt)toast('배터리가 가득 차서 일부 전기를 버렸어요.')}
  else if(d.tax){G.coins+=b.amt;b.ready=false;fly(sp,'🪙',$('coinT'),`+${b.amt}`);sfx('coin');addXP(1)}
  else if(d.grow){G.straw+=b.amt;G.st.straw+=b.amt;b.ready=false;b.plant=0;b.p=0;fly(sp,'🌾',$('bOrder'),`볏짚 +${b.amt}`);sfx('pop');addXP(1);
    setTimeout(()=>{if(b.plant===0){b.plant=1;b.p=0}},250)}
  else if(d.quiz){b.ready=false;b.p=0;quizCard('school')}
  renderHud()}

/* ============ 주문 ============ */
const WHO=[['🏥','병원','밤에도 꺼지면 안 돼요!'],['🏫','초등학교','컴퓨터 수업이 있어요.'],['🥖','빵집','오븐을 데워야 해요.'],['🏭','공장','기계를 돌려야 해요.'],['🎡','놀이공원','회전목마를 돌려요!'],['📚','도서관','밤에도 불을 켜요.'],['🐄','목장','젖소 우리에 깔 볏짚이 필요해요.'],['🚉','기차역','전기 기차가 달려요.']];
function genOrder(){const w=pick(WHO),L=G?G.lv:1,o={w,need:{},wait:0};
  if(w[1]==='목장'){o.need.straw=2+Math.floor(rnd(0,2+L))}
  else{o.need.e=Math.round((12+rnd(0,8+L*7))/2)*2;if(L>=2&&Math.random()<.35)o.need.straw=1+Math.floor(rnd(0,L))}
  o.c=(o.need.e||0)*2+(o.need.straw||0)*9+5;o.xp=Math.round((o.need.e||0)/2+(o.need.straw||0)*3)+4;return o}
const canDo=o=>(!o.need.e||G.bat>=o.need.e)&&(!o.need.straw||G.straw>=o.need.straw)&&!(o.wait>0);
function doOrder(i){const o=G.orders[i];if(!canDo(o))return;
  if(o.need.e)G.bat-=o.need.e;if(o.need.straw)G.straw-=o.need.straw;G.coins+=o.c;G.st.orders++;sfx('coin');addXP(o.xp);
  toast(`${o.w[0]} ${o.w[1]}에 배달 완료! +${o.c}코인`,'good');G.orders[i]=genOrder();G.orders[i].wait=12;renderHud();showOrders()}

function checkQuest(){const q=QUESTS[G.qi];if(!q)return;if(q.ok()){G.coins+=q.r[0];addXP(q.r[1]);sfx('levelup');
  const prev=q;G.qi++;G.qb={...G.st,house:cnt('house')};
  openQ(`<div class="hd"><h2>🎯 미션 성공!</h2></div><p><b>${prev.t}</b></p><div class="note good">${prev.why}</div><p class="big">+${prev.r[0]} 🪙 · +${prev.r[1]} 경험치</p>
    ${QUESTS[G.qi]?`<div class="q now"><b>다음 미션: ${QUESTS[G.qi].t}</b><span class="small">${QUESTS[G.qi].why}</span></div>`:'<div class="note info"><b>모든 미션을 끝냈어요! 탄소 중립 마을의 시장님이에요 🌏</b></div>'}
    <button class="btn" type="button" data-x>좋아요!</button>`,true)}}

function tap(sx,sy){
  for(let k=BUB.length-1;k>=0;k--){const u=BUB[k];if(Math.hypot(sx-u.x,sy-u.y)<22){if(u.plant){u.b.plant=1;u.b.p=0;sfx('pop')}else collect(u.b);return}}
  const w=s2w(sx,sy),i=Math.floor(w.i),j=Math.floor(w.j);
  // 키 큰 건물: 위쪽을 눌러도 잡히게
  let b=null;for(const q of [...BL].sort((a,c)=>(c.i+c.j)-(a.i+a.j))){const s=w2s(q.i+.5,q.j+.5,0),h=bh(q)*cam.z;if(sx>s.x-TW*.4*cam.z&&sx<s.x+TW*.4*cam.z&&sy<s.y+TH*.4*cam.z&&sy>s.y-h){b=q;break}}
  if(placing){if(canPlace(placing,i,j)){if(build(placing,i,j)&&!(BD[placing].cat==='farm'&&G.coins>=BD[placing].cost))stopPlace()}else toast(`${BD[placing].n}은(는) ${BD[placing].on.split('').map(c=>TERR[c].n).join('·')}에만 지을 수 있어요`);return}
  if(!b&&!inMap(i,j))return;
  if(!b)b=bldAt(i,j);
  const T=inMap(i,j)?tile(i,j):null;
  if(b){sfx('tap');if(b.ready&&b.done)return collect(b);if(BD[b.k].grow&&b.done&&b.plant===0){b.plant=1;b.p=0;sfx('pop');return}return infoCard(b)}
  if(T&&locked(T))return zoneCard(T.z);
  if(T&&T.ob){const cost={bush:5,rock:15,stump:10}[T.ob];if(G.coins<cost){toast(`치우려면 ${cost}코인이 필요해요`,'bad');return}G.coins-=cost;T.ob=null;burst(i,j,'#a3a3a3',10);sfx('pop');addXP(2);toast(`땅을 치웠어요 (−${cost}코인)`);renderHud();return}
  if(T&&T.t!=='R'){const c={T:'town',P:'power',S:'power',H:'power',W:'power',G:'power',F:'farm'}[T.t];showBuild(c,i,j)}}

function load(){const s=store.get('save',null);if(!s||!s.G)return false;try{
  G=s.G;BL=s.BL.map(b=>({...b,id:uid++}));TL=[];for(let j=0;j<N;j++)for(let i=0;i<N;i++){const [t,z]=terrainAt(i,j);TL.push({t,z,ob:s.TL[j*N+i]||null})}
  const away=clamp((Date.now()-(s.at||Date.now()))/1000,0,1800);if(away>5){const bat=G.bat;for(let k=0;k<away;k+=1)step(1);G.bat=bat;toast(`돌아왔어요! 시장님이 없는 동안 ${Math.round(away/60)}분이 지났어요.`)}

let last=performance.now(),speed=1;
function frame(now){const dt=Math.min(.05,(now-last)/1000)*speed;last=now;const t=now/1000;
  if(sheet.hidden||!sheet.querySelector('.choice:not(:disabled)'))step(dt);

  for(const f of flyers)f.t+=dt;flyers=flyers.filter(f=>f.t<.75);
  draw(t);requestAnimationFrame(frame)}
function toast(m,c){const t=document.createElement('div');t.className='toast '+(c||'');t.textContent=m;$('toast').appendChild(t);while($('toast').children.length>3)$('toast').firstChild.remove();setTimeout(()=>t.remove(),4200)}

addEventListener('resize',resize);resize();
const fresh=!load();if(fresh)freshState();
initPeople();const c0=iso(9,8);cam.x=c0.x;cam.y=c0.y;cam.z=VW<700?.85:1.15;clampCam();
renderHud();requestAnimationFrame(frame);
if(fresh)showHelp(true);
// 새로 시작 (미션 창에서)
window.resetTown=()=>{try{localStorage.removeItem('etown_save')}catch(e){}freshState();initPeople();renderHud();closeSheet();showHelp(true)};
