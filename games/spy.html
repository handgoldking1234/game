<title>탄소 스파이를 찾아라</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 화면 가득 연구소 지도(카메라가 나를 따라감), 위에 임무 목록·진행 막대·작은 지도, 아래에 조이스틱과 행동 버튼 */
:root{
  color-scheme:dark;
  --night:#121826; --panel:#ffffff; --panel2:#f1f5f9; --ink:#1d2939; --muted:#5d6b7c; --line:#d6dee8;
  --sun:#ffc83d; --leaf:#22a065; --leaf-soft:#dcf5e8; --alarm:#ef4444; --alarm-soft:#fde2e2; --sky:#3e7bfa;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--night)}
body{margin:0;overflow:hidden;font-family:var(--f-body);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#game{position:fixed;inset:0;display:block;width:100%;height:100%}

.hud{position:fixed;z-index:5;pointer-events:none}
#tasks{left:max(12px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));background:rgba(255,255,255,.93);border-radius:14px;padding:10px 12px;width:min(250px,44vw);font-size:13px;line-height:1.45;pointer-events:auto}
#tasks h3{font-family:var(--f-display);font-weight:400;font-size:16px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:6px}
#tasks h3 button{border:0;background:var(--panel2);border-radius:6px;font-family:var(--f-body);font-size:12px;padding:1px 7px}
#tasks ul{margin:0;padding:0;list-style:none;display:grid;gap:2px}
#tasks li{display:flex;gap:6px}
#tasks li.done{color:#8b97a5;text-decoration:line-through}
#tasks li b{font-weight:400;color:var(--muted);white-space:nowrap}
#tasks.fold ul{display:none}
#bar{left:50%;transform:translateX(-50%);top:max(12px,env(safe-area-inset-top,0px));width:min(340px,40vw);display:grid;gap:5px}
.pbar{background:rgba(255,255,255,.93);border-radius:12px;padding:6px 10px;font-size:12.5px;display:grid;gap:3px}
.pbar .track{height:10px;border-radius:6px;background:#dde5ee;overflow:hidden}
.pbar .track i{display:block;height:100%;background:var(--leaf);transition:width .4s}
#alert{background:var(--alarm);color:#fff;border-radius:12px;padding:7px 10px;font-family:var(--f-display);font-size:16px;text-align:center;animation:blink 1s infinite}
@keyframes blink{50%{filter:brightness(1.25)}}
#mapWrap{right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));background:rgba(255,255,255,.93);border-radius:12px;padding:6px;line-height:0;pointer-events:auto}
#mini{width:170px;height:118px}
#topBtns{right:max(12px,env(safe-area-inset-right,0px));top:calc(max(12px,env(safe-area-inset-top,0px)) + 140px);display:flex;flex-direction:column;gap:6px;pointer-events:auto;align-items:flex-end}
.sbtn{background:rgba(255,255,255,.93);border:0;border-radius:10px;padding:6px 11px;font-size:13px}
#toast{left:50%;transform:translateX(-50%);bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 130px);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(560px,90vw)}
.toast{background:rgba(15,23,42,.88);color:#fff;border-radius:10px;padding:6px 12px;font-size:14px;text-align:center;animation:tin .25s}
.toast.bad{background:rgba(185,28,28,.92)}.toast.good{background:rgba(21,128,61,.92)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

#acts{right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.act{width:84px;height:84px;border-radius:22px;border:0;background:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:17px;line-height:1.1;box-shadow:0 5px 0 #9aa6b5;padding:4px}
.act small{font-family:var(--f-body);font-size:11px;color:var(--muted)}
.act:disabled{opacity:.35;cursor:not-allowed}
.act.use:not(:disabled){background:var(--sun);box-shadow:0 5px 0 #c08d10}
.act.rep:not(:disabled){background:var(--alarm);color:#fff;box-shadow:0 5px 0 #991b1b}
.act.rep:not(:disabled) small{color:#ffe1e1}
.act.emg:not(:disabled){background:#fff;box-shadow:0 5px 0 #9aa6b5}
#joy{left:max(20px,env(safe-area-inset-left,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.75)}
@media (hover:hover) and (pointer:fine){#joy{display:none}}

/* 팝업 */
#ov{position:fixed;inset:0;z-index:20;background:rgba(10,15,28,.78);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border-radius:22px;width:min(640px,100%);max-height:100%;overflow:auto;padding:22px;display:grid;gap:12px;position:relative}
.card.wide{width:min(900px,100%)}
.card h1,.card h2,.card h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.card h1{font-size:clamp(32px,6vw,46px);line-height:1.1}
.card h2{font-size:25px}
.card h3{font-size:18px}
.card p{margin:0;line-height:1.65}
.eyebrow{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.x{position:absolute;right:14px;top:12px;border:0;background:var(--panel2);border-radius:10px;width:36px;height:36px;font-size:18px}
.btn{font-family:var(--f-display);font-size:19px;border:0;border-radius:14px;padding:11px 18px;background:var(--ink);color:#fff}
.btn.go{background:var(--leaf)}.btn.alt{background:var(--panel2);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.box{background:var(--panel2);border-radius:14px;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.box ul,.box ol{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px;line-height:1.55}
.box.tip{background:#fff6d6}
.note{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6}
.note.good{background:var(--leaf-soft)}.note.bad{background:var(--alarm-soft)}.note.info{background:#e6efff}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px;font-size:13.5px}
.keys div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0}
.keys kbd{font-family:var(--f-display);color:var(--sky)}

/* 미니게임 */
.mg{display:grid;gap:12px;justify-items:center;text-align:center}
.mg .stage{width:100%;max-width:420px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.tile{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 8px;font-size:15px;display:grid;gap:4px;justify-items:center}
.tile .em{font-size:28px;line-height:1}
.tile.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.tile.no{border-color:var(--alarm);background:var(--alarm-soft)}
.tile:disabled{cursor:default}
.sortrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;background:var(--panel2);border-radius:10px;padding:6px 10px;text-align:left}
.sortrow.ok{background:var(--leaf-soft)}
.mini-btn{border:0;border-radius:8px;padding:6px 10px;font-size:14px;background:#fff;border:1px solid var(--line)}
.meter{width:100%;height:26px;border-radius:13px;background:#dde5ee;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--sky)}
.meter b{position:absolute;top:0;bottom:0;background:rgba(34,160,101,.35);border-left:2px solid var(--leaf);border-right:2px solid var(--leaf)}
input[type=range]{width:100%;accent-color:var(--sky)}
.switches{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sw{width:54px;height:86px;border-radius:12px;border:0;background:#4b5563;color:#fff;font-family:var(--f-display);font-size:15px}
.sw.on{background:var(--leaf)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* 회의 */
.meet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px}
.crew{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;align-content:start}
.cm{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:5px 8px;text-align:left;font-size:14px}
.cm canvas{width:44px;height:44px}
.cm small{display:block;color:var(--muted);font-size:11.5px}
.cm.dead{opacity:.45}
.cm.pick{border-color:var(--sky);background:#e6efff}
.cm:disabled{cursor:default}
.chat{background:#0f172a;color:#e2e8f0;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;font-size:14px;line-height:1.5}
.chat div{animation:tin .25s}
.chat b{font-family:var(--f-display);font-weight:400}
.chat .sys{color:#fcd34d}
.chat .hint{color:#93c5fd}
.votes{font-size:13px;color:var(--muted)}
@media (max-width:700px){
  #tasks{width:min(190px,50vw);font-size:12px}#tasks li b{display:none}
  .meet{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.keys{grid-template-columns:1fr}
  #mapWrap{display:none}#topBtns{top:max(12px,env(safe-area-inset-top,0px))}
  #bar{left:auto;right:max(12px,env(safe-area-inset-right,0px));transform:none;top:calc(max(12px,env(safe-area-inset-top,0px)) + 76px);width:min(200px,46vw)}
  .act{width:70px;height:70px;font-size:15px;border-radius:18px}
  #toast{bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 160px)}
  .toast{font-size:12.5px}
  .card{padding:18px}
}
@media (prefers-reduced-motion:reduce){#alert,.toast,.chat div,.shake{animation:none}}
/* 시작 화면 고르기, 회의 채팅, 스파이 버튼 */
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pk{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px;display:grid;gap:4px;text-align:left;font-size:13px;align-content:start}
.pk b{font-family:var(--f-display);font-weight:400;font-size:17px}
.pk small{color:var(--muted);line-height:1.4}
.pk canvas{width:100%;height:auto;aspect-ratio:3/2;border-radius:8px;background:#0f1522}
.pk[aria-pressed="true"]{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky) inset;background:#eef4ff}
.pk.spy[aria-pressed="true"]{border-color:#7c3aed;box-shadow:0 0 0 2px #7c3aed inset;background:#f3ecff}
.say{display:grid;gap:6px}
.say .row{gap:6px}
.say select,.say input{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff;color:var(--ink);min-width:0}
.say input{flex:1}
.qbtn{border:0;background:var(--panel2);border-radius:10px;padding:7px 10px;font-size:13.5px}
.qbtn:hover:not(:disabled){background:#e2e8f0}
.qbtn:disabled{opacity:.4;cursor:not-allowed}
.chat .me b{color:#ff9cc8}
.chat .warn{color:#fca5a5}
.act.kill:not(:disabled){background:#7c3aed;color:#fff;box-shadow:0 5px 0 #4c1d95}
.act.kill:not(:disabled) small{color:#e9d5ff}
.act.sab:not(:disabled){background:#1f2937;color:#fff;box-shadow:0 5px 0 #000}
.act.sab:not(:disabled) small{color:#cbd5e1}
#sabMenu{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 100px);background:#fff;border-radius:16px;padding:10px;display:grid;gap:6px;width:230px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#sabMenu button{border:0;border-radius:10px;padding:9px 10px;text-align:left;background:var(--panel2);font-size:14px;display:grid;gap:2px}
#sabMenu button small{color:var(--muted);font-size:12px}
#sabMenu button:disabled{opacity:.4;cursor:not-allowed}
#roleTag{display:inline-block;border-radius:6px;padding:0 6px;font-size:12px;font-family:var(--f-body)}
#roleTag.crew{background:#e6efff;color:#1e40af}#roleTag.spy{background:#ede4ff;color:#6d28d9}
@media (max-width:700px){.picks{grid-template-columns:1fr 1fr 1fr}.pk small{display:none}.pk b{font-size:15px}}
</style>

<canvas id="game" aria-label="게임 지도"></canvas>
<div class="hud" id="tasks"><h3><span>내 임무 <span id="roleTag"></span></span><button type="button" id="foldBtn">접기</button></h3><ul id="taskList"></ul></div>
<div class="hud" id="bar">
  <div class="pbar"><span>지킴이들의 임무 진행 <b id="pctTxt">0%</b></span><div class="track"><i id="pct"></i></div></div>
  <div id="alert" hidden></div>
</div>
<div class="hud" id="mapWrap"><canvas id="mini" aria-label="작은 지도"></canvas></div>
<div class="hud" id="topBtns"><button class="sbtn" id="helpBtn" type="button">게임 방법</button><button class="sbtn" id="pauseBtn" type="button">일시정지</button></div>
<div class="hud" id="toast" aria-live="polite"></div>
<div class="hud" id="joy"><i id="knob"></i></div>
<div class="hud" id="acts">
  <button class="act emg" id="emgBtn" type="button" disabled>긴급<br>회의<small>회의실</small></button>
  <button class="act sab" id="sabBtn" type="button" hidden>방해<small>F</small></button>
  <button class="act kill" id="killBtn" type="button" hidden>방전<small>K</small></button>
  <button class="act rep" id="repBtn" type="button" disabled>신고<small>R</small></button>
  <button class="act use" id="useBtn" type="button" disabled>사용<small>E · Space</small></button>
</div>
<div id="sabMenu" hidden>
  <button type="button" id="sabBlack"><b>정전 일으키기</b><small>지킴이 시야가 좁아져요</small></button>
  <button type="button" id="sabCarbon"><b>탄소 경보 울리기</b><small>60초 안에 못 막으면 스파이 승리</small></button>
</div>
<div id="ov"></div>

<script>
/* ============ 기본 ============ */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const bat=s=>{const c=s.charCodeAt(s.length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0};
const J=(s,a,b)=>s+(bat(s)?a:b);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
/* 봇이 말할 때 부르는 말 (플레이어는 '너') */
const nm=c=>c.me?'너':c.n, subj=c=>c.me?'네가':J(c.n,'이','가'), topc=c=>c.me?'너는':J(c.n,'은','는'),
      obj=c=>c.me?'너를':J(c.n,'을','를'), withc=c=>c.me?'너랑':J(c.n,'이랑','랑');

/* ============ 지도 ============ */
const THEME={solar:'#fdf3c4',lab:'#e3ecff',wind:'#dcf3e3',fossil:'#e8e2ea',meeting:'#f6e7d7',hydro:'#d8ecfb',bio:'#e6f2cf',power:'#e9edf2',geo:'#f8ded3'};
const MAPS={
  lab:{n:'에너지 연구소',d:'방 9개가 바둑판처럼 이어진 기본 지도',
    rooms:[['solar','태양광 옥상',0,0],['lab','에너지 연구실',1,0],['wind','풍력 언덕',2,0],['fossil','화력 발전실',0,1],['meeting','회의실',1,1],['hydro','수력 댐',2,1],['bio','바이오 농장',0,2],['power','배전반',1,2],['geo','지열실',2,2]],
    links:[[0,1],[1,2],[3,4],[4,5],[6,7],[7,8],[0,3],[3,6],[1,4],[4,7],[2,5],[5,8]]},
  sea:{n:'바다 발전 섬',d:'가로로 긴 섬. 오른쪽 끝 화력 발전소가 멀어요',
    rooms:[['wind','해상 풍력장',0,0],['solar','태양광 부두',1,0],['lab','바다 연구실',2,0],['hydro','수력 수문',0,1],['meeting','회의실',1,1],['power','배전반',2,1],['fossil','화력 발전소',3,1],['bio','해초 바이오실',1,2],['geo','해저 지열실',2,2]],
    links:[[0,1],[1,2],[0,3],[1,4],[2,5],[3,4],[4,5],[5,6],[4,7],[5,8],[7,8]]},
  hill:{n:'산골 에너지 마을',d:'세로로 긴 마을. 길이 좁고 막다른 곳이 많아요',
    rooms:[['wind','풍력 고개',1,0],['solar','태양광 들판',0,1],['meeting','마을 회관',1,1],['geo','지열 온천',2,1],['bio','바이오 축사',0,2],['lab','에너지 학교',1,2],['hydro','계곡 댐',2,2],['fossil','탄광 발전소',0,3],['power','변전소',1,3]],
    links:[[0,2],[1,2],[2,3],[1,4],[2,5],[3,6],[4,5],[5,6],[4,7],[5,8],[7,8]]}
};
const STT={
  solar:{t:'solar',dx:-80,dy:-40,n:'태양광 패널 방향 맞추기'},
  quiz:{t:'lab',dx:85,dy:-45,n:'에너지 퀴즈 풀기'},
  sort:{t:'lab',dx:-85,dy:35,n:'에너지 분류하기'},
  wind:{t:'wind',dx:70,dy:-45,n:'풍력 발전기 바람 맞추기'},
  plug:{t:'fossil',dx:-75,dy:45,n:'대기 전력 플러그 뽑기'},
  fossil:{t:'fossil',dx:80,dy:-40,n:'화력 발전 멈추기',fix:'carbon'},
  button:{t:'meeting',dx:0,dy:0,n:'긴급 회의 버튼'},
  dam:{t:'hydro',dx:75,dy:45,n:'수력 댐 수문 열기'},
  bio:{t:'bio',dx:80,dy:45,n:'바이오 연료 재료 고르기'},
  lights:{t:'power',dx:-80,dy:30,n:'빈 방 불 끄기'},
  power:{t:'power',dx:80,dy:-25,n:'배전반 스위치 올리기',fix:'blackout'},
  geo:{t:'geo',dx:70,dy:35,n:'지열 온도 확인하기'}
};
const TASKS=['solar','quiz','sort','wind','plug','dam','bio','lights','geo'];
let ROOMS=[],CORR=[],WALK=[],ADJ=[],ST={},WW=1600,WH=1100,MEET=4,MAPKEY='lab';
const R=13;
function layout(key){
  const m=MAPS[key],out={};
  out.rooms=m.rooms.map(([t,n,col,row],i)=>{const cx=240+col*560,cy=170+row*385,big=t==='meeting',w=big?340:320,h=big?260:220;return {i,t,n,c:THEME[t],col,row,cx,cy,x:cx-w/2,y:cy-h/2,w,h}});

function buildMap(key){

function walkable(x,y){return WALK.some(q=>x>=q.x+R&&x<=q.x+q.w-R&&y>=q.y+R&&y<=q.y+q.h-R)}

function bot(c,dt){

const keys={}; const joy={x:0,y:0};
function movePlayer(dt){
  let dx=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0)+joy.x;
  let dy=(keys.ArrowDown||keys.s||keys.S?1:0)-(keys.ArrowUp||keys.w||keys.W?1:0)+joy.y;
  const L=Math.hypot(dx,dy); if(L<.1) return; if(L>1){dx/=L;dy/=L}
  const sp=(P.alive?150:170)*dt, nx=P.x+dx*sp, ny=P.y+dy*sp;
  if(walkable(nx,ny)){P.x=nx;P.y=ny}else if(walkable(nx,P.y))P.x=nx;else if(walkable(P.x,ny))P.y=ny;
  P.face=dx<-.1?-1:dx>.1?1:P.face; P.walk+=dt;
}

  for(const k in ST){const s=ST[k],d=Math.hypot(s.x-P.x,s.y-P.y);if(d>=bd)continue;
    const mine=P.tasks.find(t=>t.k===k&&!t.done), fix=s.fix&&G.sab&&G.sab.type===s.fix&&P.alive;

}

/* ============ 회의 ============ */
function roomAt(c,T){for(let i=c.trail.length-1;i>=0;i--)if(c.trail[i].t<=T)return c.trail[i].r;return c.trail.length?c.trail[0].r:MEET}
let M=null;
function meeting(kind,who,body){
  G.paused=true; G.meetings++; $('sabMenu').hidden=true; if(G.mg){ov.innerHTML='';G.mg=null}
  const T=body?body.t:G.t, victim=body?G.chars[body.id]:null, S=spyC();
  M={T,body,victim,score:{},claims:{},vote:null,msgs:0,said:{},lines:[],playerClaim:null};
  const add=(id,v)=>M.score[id]=(M.score[id]||0)+v;
  const L=M.lines;
  if(kind==='body'){
    L.push({sys:1,s:`${who.me?'내가':subj(who)} ${RN(body.room)}에서 방전된 ${victim.me?'나를':obj(victim)} 발견했어요!`});
    if(!who.me){const near=G.chars.filter(o=>o!==who&&o!==victim&&o.alive&&Math.hypot(o.x-body.x,o.y-body.y)<170);
      if(near.length){const o=near[0];L.push({c:who,s:`그리고 ${subj(o)} 바로 옆에 있었어.`});add(o.id,1.5)}}
  } else L.push({sys:1,s:`${who.me?'내가':subj(who)} 긴급 회의 버튼을 눌렀어요!`});
  const bots=shuffle(G.chars.filter(c=>c.alive&&!c.me));
  const fake=(()=>{if(!S||S.me)return null;const real=roomAt(S,T);const opts=ROOMS.map(r=>r.i).filter(i=>i!==real&&(!body||i!==body.room));return pick(opts)})();
  for(const b of bots){
    if(b.spy){ M.claims[b.id]=fake; L.push({c:b,s:`나는 ${RN(fake)}에서 혼자 임무를 하고 있었어. 아무것도 못 봤어.`}); continue }
    if(b.wit&&victim&&b.wit.victim===victim.id){const k=G.chars[b.wit.killer];L.push({c:b,s:`내가 다 봤어! ${subj(k)} ${obj(victim)} 방전시켰어!`});add(k.id,6);b.wit=null;continue}
    const r=roomAt(b,T); M.claims[b.id]=r;
    const comp=G.chars.filter(o=>o!==b&&o.alive&&r>=0&&roomAt(o,T)===r);
    let s=`나는 ${RN(r)}에 있었어. `+(comp.length?`${comp.map(nm).join(', ')}${bat(nm(comp[comp.length-1]))?'이랑':'랑'} 같이 있었어.`:'혼자였어.');
    const seen=b.sight.filter(x=>Math.abs(x.t-T)<6&&roomAt(G.chars[x.id],T)===x.r&&!comp.some(o=>o.id===x.id)&&G.chars[x.id].alive&&x.r!==r).sort((a,c)=>Math.abs(a.t-T)-Math.abs(c.t-T));
    b.saw=null;
    if(seen.length){const x=seen[0],o=G.chars[x.id];s+=` 그리고 그때쯤 ${subj(o)} ${RN(x.r)}에 있는 걸 봤어.`;b.saw={id:x.id,r:x.r};if(body&&x.r===body.room)add(o.id,2)}
    L.push({c:b,s});
  }
  if(fake!=null){ for(const b of bots){ if(b.spy)continue;
    if(roomAt(b,T)===fake){L.push({c:b,s:`어? 나도 그때 ${RN(fake)}에 있었는데 ${S.n}${bat(S.n)?'은':'는'} 못 봤어!`});add(S.id,3)}
    else if(b.saw&&b.saw.id===S.id&&b.saw.r!==fake){L.push({c:b,s:`${topc(S)} ${RN(fake)}에 있었다고 했는데, 내가 본 곳은 ${RN(b.saw.r)}였어.`});add(S.id,3)} } }
  if(!P.spy&&G.playerSaw&&victim&&G.playerSaw.victim===victim.id) L.push({hint:1,s:`💡 너는 ${J(G.chars[G.playerSaw.killer].n,'이','가')} ${J(victim.n,'을','를')} 방전시키는 걸 직접 봤어요!`});
  G.playerSaw=null;
  if(P.spy&&P.alive){ L.push({c:pick(bots.filter(b=>b.alive))||bots[0],s:'너는 그때 어디 있었어?'}); L.push({hint:1,s:`💡 너는 스파이예요. 그때 진짜로는 ${RN(roomAt(P,T))}에 있었어요. 아래에서 어디 있었는지 말하거나, 다른 친구를 의심해 보세요. 거짓말은 다른 친구의 말과 부딪힐 수 있어요!`}) }
  else if(P.alive||P.ghost) L.push({hint:1,s:`💡 그때 나는 ${RN(roomAt(P,T))}에 있었어요. 아래 채팅으로 내 생각을 말하고, 누구 말이 이상한지 찾아보세요.`});
  showMeeting();
}
function portrait(c,cv,size){const x=cv.getContext('2d');cv.width=cv.height=size*2;x.scale(2,2);x.translate(size/2,size*.62);x.scale(size/52,size/52);drawBot(x,c,0,!c.alive)}
function chatPush(L){const chat=$('chat');if(!chat)return;const d=document.createElement('div');
  if(L.sys){d.className='sys';d.textContent=L.s}else if(L.hint){d.className='hint';d.textContent=L.s}
  else if(L.me){d.className='me';d.innerHTML=`<b>나</b> `;d.appendChild(document.createTextNode(L.s))}
  else d.innerHTML=`<b style="color:${L.c.c}">${L.c.n}</b> ${L.s}`;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function showMeeting(){

      if(sab==='carbon')for(let k=0;k<4;k++){circ(x,cx-22+(k%2)*40,cy-118-((t*30+k*18)%50),10+((t*30+k*18)%50)/5,'rgba(70,64,80,.5)')}break;
    case 'meeting': circ(x,cx,cy,62,'#d6b38a','#a07a50',3);break;

      x.strokeStyle='#fff';x.lineWidth=2;for(let k=0;k<4;k++){const o=(t*40+k*30)%120;x.beginPath();x.moveTo(r.x+40+o,r.y+40);x.lineTo(r.x+55+o,r.y+40);x.stroke()}break;
    case 'bio': for(let i=0;i<5;i++){x.fillStyle=i%2?'#a3c862':'#8fb651';x.fillRect(r.x+20+i*28,r.y+40,24,r.h-80)}rr(x,cx+40,cy-70,50,60,10,'#d9c79a','#8a7650');break;

      for(let k=0;k<3;k++)circ(x,r.x+60,r.y+30-((t*20+k*12)%36),6,'rgba(255,255,255,.7)');break;
  }
}
function drawFloor(x,t,labels){
  for(const c of CORR){x.fillStyle='#c4cdd8';x.fillRect(c.x,c.y,c.w,c.h)}
  for(const r of ROOMS){rr(x,r.x,r.y,r.w,r.h,18,r.c,'#2b3442',6)}
  for(const c of CORR){x.fillStyle='#c4cdd8';x.fillRect(c.x+3,c.y+3,c.w-6,c.h-6)}
  for(const r of ROOMS){drawRoomDecor(x,r,t);
    if(labels){x.font='20px Jua, sans-serif';x.textAlign='center';x.fillStyle='rgba(29,41,57,.55)';x.fillText(r.n,r.cx,r.y+r.h-14)}}
}
function draw(t){
  const x=ctx; x.setTransform(dpr,0,0,dpr,0,0); x.fillStyle='#0f1522';x.fillRect(0,0,VW,VH);
  const vw=VW/zoom,vh=VH/zoom;
  cam.x=clamp(P.x-vw/2,-100,Math.max(-100,WW-vw+100));cam.y=clamp(P.y-vh/2,-100,Math.max(-100,WH-vh+100));
  x.setTransform(dpr*zoom,0,0,dpr*zoom,-cam.x*dpr*zoom,-cam.y*dpr*zoom);
  drawFloor(x,t,true);
  for(const k in ST){const s=ST[k];
    if(k==='button'){circ(x,s.x,s.y,20,'#ef4444','#7f1d1d',3);circ(x,s.x,s.y,12,'#f87171');continue}
    rr(x,s.x-16,s.y-14,32,24,5,'#334155','#0f172a',2);rr(x,s.x-11,s.y-10,22,12,3,'#7dd3fc');
    const mine=P.tasks.find(q=>q.k===k&&!q.done), fix=s.fix&&G.sab&&G.sab.type===s.fix&&!P.spy;
    if(mine||fix){const a=.5+.5*Math.sin(t*5);x.strokeStyle=fix?`rgba(239,68,68,${.4+a*.6})`:`rgba(255,200,61,${.4+a*.6})`;x.lineWidth=4;x.beginPath();x.roundRect(s.x-22,s.y-20,44,36,8);x.stroke();
      x.font='22px Jua, sans-serif';x.textAlign='center';x.fillStyle=fix?'#ef4444':'#f59e0b';x.fillText('!',s.x,s.y-26-a*4)}}
  const V=vis();
  for(const b of G.bodies){ if(Math.hypot(b.x-P.x,b.y-P.y)>V+20)continue; x.save();x.translate(b.x,b.y);drawBot(x,G.chars[b.id],t,true);x.restore()}
  const list=G.chars.filter(c=>c.alive||c.me).sort((a,b)=>a.y-b.y);
  const prey=nearPrey();
  for(const c of list){ if(!c.me&&dist(c,P)>V+20) continue;
    x.save();x.translate(c.x,c.y);if(c.me&&!c.alive)x.globalAlpha=.5;x.scale(c.face<0?-1:1,1);drawBot(x,c,t,false);x.restore();
    if(c===prey&&G.pcd<=0){x.strokeStyle='#7c3aed';x.lineWidth=3;x.beginPath();x.ellipse(c.x,c.y+18,22,8,0,0,7);x.stroke()}
    const label=c.me?'나':c.n;
    x.font='15px Jua, sans-serif';x.textAlign='center';x.lineWidth=3;x.strokeStyle='rgba(255,255,255,.9)';x.strokeText(label,c.x,c.y-38);x.fillStyle=c.me?'#be185d':(P.spy&&c.spy?'#6d28d9':'#1d2939');x.fillText(label,c.x,c.y-38)}
  for(const s of sp){x.globalAlpha=Math.max(0,s.l);x.strokeStyle='#fde047';x.lineWidth=3;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x+s.dx,s.y+s.dy);x.stroke();x.globalAlpha=1}
  x.setTransform(dpr,0,0,dpr,0,0);
  if(P.alive){const px=(P.x-cam.x)*zoom,py=(P.y-cam.y)*zoom,rv=V*zoom;const g=x.createRadialGradient(px,py,rv*.7,px,py,rv);g.addColorStop(0,'rgba(8,12,24,0)');g.addColorStop(1,'rgba(8,12,24,.88)');
    x.fillStyle=g;x.fillRect(0,0,VW,VH);x.fillStyle='rgba(8,12,24,.88)';x.beginPath();x.rect(0,0,VW,VH);x.moveTo(px+rv,py);x.arc(px,py,rv,0,Math.PI*2,true);x.fill()}
  if(G.sab&&G.sab.type==='carbon'){x.fillStyle=`rgba(120,90,70,${.12+.08*Math.sin(t*4)})`;x.fillRect(0,0,VW,VH)}
}
let sp=[];
function sparks(X,Y){for(let i=0;i<12;i++){const a=Math.random()*7;sp.push({x:X,y:Y,dx:Math.cos(a)*rnd(10,30),dy:Math.sin(a)*rnd(10,30),l:1})}}
function fitScale(w,h,W2,H2){return Math.min(w/W2,h/H2)}
function drawMini(){
  const x=mx,s=fitScale(mini.width,mini.height,WW,WH),ox=(mini.width-WW*s)/2,oy=(mini.height-WH*s)/2;
  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,mini.width,mini.height);x.setTransform(s,0,0,s,ox,oy);
  x.fillStyle='#94a3b8';for(const c of CORR)x.fillRect(c.x,c.y,c.w,c.h);
  for(const r of ROOMS){x.fillStyle=r.c;x.strokeStyle='#334155';x.lineWidth=1/s;x.fillRect(r.x,r.y,r.w,r.h);x.strokeRect(r.x,r.y,r.w,r.h)}
  for(const k in ST){const st=ST[k];const mine=P.tasks.find(q=>q.k===k&&!q.done),fix=st.fix&&G.sab&&G.sab.type===st.fix&&!P.spy;if(mine||fix){x.fillStyle=fix?'#ef4444':'#f59e0b';x.beginPath();x.arc(st.x,st.y,3.5*dpr/s,0,7);x.fill()}}
  x.fillStyle=P.c;x.strokeStyle='#fff';x.lineWidth=1.5/s;x.beginPath();x.arc(P.x,P.y,4.5*dpr/s,0,7);x.fill();x.stroke();
}
function mapThumb(cvs,key){
  const L=layout(key),w=cvs.width,h=cvs.height,x=cvs.getContext('2d'),s=fitScale(w,h,L.ww,L.wh)*.92,ox=(w-L.ww*s)/2,oy=(h-L.wh*s)/2;
  x.clearRect(0,0,w,h);x.setTransform(s,0,0,s,ox,oy);x.fillStyle='#94a3b8';for(const c of L.corr)x.fillRect(c.x,c.y,c.w,c.h);
  for(const r of L.rooms){x.fillStyle=r.c;x.fillRect(r.x,r.y,r.w,r.h);x.strokeStyle='#334155';x.lineWidth=6;x.strokeRect(r.x,r.y,r.w,r.h)}
  x.setTransform(1,0,0,1,0,0);
}

(()=>{const j=$('joy'),k=$('knob');let id=null;

  j.addEventListener('pointerdown',e=>{id=e.pointerId;j.setPointerCapture(id);set(e)});

/* ============ 루프 ============ */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.started&&!G.paused&&!G.ended) step(dt);
  sp=sp.filter(s=>(s.l-=dt*1.5)>0);
  draw(now/1000);drawMini();
  if(G.sab&&!G.paused) renderAlert();
  requestAnimationFrame(frame);
}
addEventListener('resize',resize);
newGame();resize();showStart();requestAnimationFrame(frame);
</script>
