<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>에너지 점프</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* 레이아웃: 화면 가득 옆으로 흐르는 스테이지, 위에 얇은 상태 막대, 휴대폰에서는 아래 좌우에 터치 버튼 */
:root{
  color-scheme:light;
  --ink:#1d2939; --muted:#5d6b7c; --paper:#ffffff; --paper2:#f1f5f9; --line:#d6dee8;
  --leaf:#22a065; --leaf-soft:#dcf5e8; --alarm:#ef4444; --alarm-soft:#fde2e2; --sun:#ffc83d; --sky:#3e7bfa;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:#0f1522}
body{margin:0;overflow:hidden;font-family:var(--f-body);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:auto}

#hud{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chip{background:rgba(255,255,255,.92);border-radius:12px;padding:5px 11px;font-size:14px;display:flex;gap:7px;align-items:center;white-space:nowrap}
.chip b{font-family:var(--f-display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.hearts{color:var(--alarm);font-size:17px;letter-spacing:1px}
.gauge{width:90px;height:10px;border-radius:6px;background:#dde5ee;overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,#62c48a,#ffc83d 55%,#ef4444);transition:width .3s}
.spacer{flex:1}
.hb{pointer-events:auto;border:0;background:rgba(255,255,255,.92);border-radius:12px;padding:6px 12px;font-size:13px}
#pw[hidden]{display:none}

#toast{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top,0px)) + 52px);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(560px,90vw);pointer-events:none}
.toast{background:rgba(15,23,42,.9);color:#fff;border-radius:10px;padding:6px 12px;font-size:14px;text-align:center;animation:tin .25s}
.toast.bad{background:rgba(185,28,28,.94)}.toast.good{background:rgba(21,128,61,.94)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

#pad{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-bottom:max(18px,env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
#pad .grp{display:flex;gap:12px;pointer-events:auto}
.pb{width:74px;height:74px;border-radius:22px;border:0;background:rgba(255,255,255,.82);font-family:var(--f-display);font-size:24px;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:none}
.pb.jump{background:rgba(255,200,61,.95);width:86px;height:86px;font-size:20px}
.pb.shot{background:rgba(62,123,250,.9);color:#fff;font-size:17px}
.pb:active,.pb.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
@media (hover:hover) and (pointer:fine){#pad{display:none}}

#ov{position:fixed;inset:0;z-index:20;background:rgba(10,15,28,.72);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);border-radius:22px;width:min(620px,100%);max-height:100%;overflow:auto;padding:22px;display:grid;gap:12px}
.card.wide{width:min(860px,100%)}
.card h1,.card h2,.card h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.card h1{font-size:clamp(34px,7vw,52px);line-height:1.05}
.card h2{font-size:26px}
.card h3{font-size:18px}
.card p{margin:0;line-height:1.65}
.eyebrow{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.btn{font-family:var(--f-display);font-size:19px;border:0;border-radius:14px;padding:11px 20px;background:var(--leaf);color:#fff}
.btn.alt{background:var(--paper2);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.box{background:var(--paper2);border-radius:14px;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.box ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px;line-height:1.55}
.box.tip{background:#fff6d6}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:14px}
.items div{display:flex;gap:8px;align-items:center}
.items canvas{width:30px;height:30px;flex:none}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px;font-size:13.5px}
.keys div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0}
.keys kbd{font-family:var(--f-display);color:var(--sky)}
.choice{text-align:left;background:var(--paper2);border:2px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px}
.choice:hover:not(:disabled){border-color:var(--sky)}
.choice.right{border-color:var(--leaf);background:var(--leaf-soft)}
.choice.wrong{border-color:var(--alarm);background:var(--alarm-soft)}
.note{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6}
.note.good{background:var(--leaf-soft)}.note.bad{background:var(--alarm-soft)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--paper2);border-radius:12px;padding:10px;display:grid;gap:2px;text-align:center}
.stats b{font-family:var(--f-display);font-weight:400;font-size:24px}
.stats small{font-size:12px;color:var(--muted)}
.stars{font-size:42px;letter-spacing:6px;color:var(--sun);text-align:center}
.stars .off{color:var(--line)}
@media (max-width:640px){.hb{padding:5px 9px;font-size:12px}.cols,.items,.keys{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.chip{font-size:12.5px;padding:4px 8px}.chip b{font-size:16px}.gauge{width:60px}.card{padding:18px}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<script>
/* ============ 기본 ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const TS=32, ROWS=14;
const SOLID=new Set(['#','=','B','b','X','Y','K']);

/* ============ 아이템 ============ */
const ITEM={
  s:{n:'태양 에너지',pts:10,co2:0,r:1,tip:'햇빛으로 전기를 만들어요. 다시 채워지는 재생에너지!'},
  w:{n:'바람 에너지',pts:10,co2:0,r:1,tip:'바람이 날개를 돌려 전기를 만들어요.'},
  h:{n:'물 에너지',pts:10,co2:0,r:1,tip:'높은 곳에서 떨어지는 물의 힘으로 발전해요.'},
  g:{n:'지열 에너지',pts:10,co2:0,r:1,tip:'땅속 깊은 곳의 뜨거운 열을 이용해요.'},
  l:{n:'바이오 에너지',pts:10,co2:0,r:1,tip:'볏짚, 가축 분뇨 같은 생물 자원을 연료로 써요.'},
  c:{n:'석탄',pts:20,co2:25,r:0,tip:'석탄은 전기를 많이 주지만 태우면 이산화 탄소가 나와요! 탄소 게이지를 보세요.'},
  o:{n:'석유',pts:20,co2:20,r:0,tip:'석유도 화석 연료라서 이산화 탄소가 나오고, 언젠가 바닥나요.'},
  T:{n:'나무 묘목',pts:5,co2:-35,r:1,tip:'나무를 심었어요! 나무는 이산화 탄소를 흡수해서 탄소 게이지가 줄어요.'},
  F:{n:'바람개비',pts:5,pw:'wind',tip:'바람개비! 12초 동안 공중에서 한 번 더 점프할 수 있어요.'},
  P:{n:'정화 배터리',pts:5,pw:'clean',tip:'정화 배터리! 12초 동안 맑은 공기 방울을 쏠 수 있어요 (X 키 / 쏘기).'}
};
const QUIZ=[
  {q:'석탄, 석유, 천연가스처럼 아주 오래전 생물이 땅속에 묻혀 만들어진 연료는?',a:['화석 연료','재생에너지','바이오에너지'],c:0,e:'오래전 생물이 땅속에서 오랜 시간 열과 압력을 받아 만들어져서 화석 연료라고 해요.'},
  {q:'화석 연료를 계속 쓰면 언젠가 바닥나는 까닭은?',a:['매장량이 정해져 있어서','너무 무거워서','물에 녹아서'],c:0,e:'화석 연료는 만들어지는 데 아주 오래 걸려서 쓰는 만큼 다시 채워지지 않아요.'},
  {q:'화석 연료를 태울 때 많이 나와 지구 온난화를 일으키는 기체는?',a:['산소','이산화 탄소','질소'],c:1,e:'이산화 탄소 같은 온실가스가 많아지면 지구의 열이 빠져나가지 못해 기온이 올라가요.'},
  {q:'다음 중 재생에너지가 아닌 것은?',a:['햇빛','바람','석유'],c:2,e:'석유는 화석 연료예요. 햇빛, 바람, 물, 지열처럼 다시 채워지는 에너지가 재생에너지예요.'},
  {q:'풍력 발전기는 무엇의 힘으로 전기를 만들까요?',a:['땅속의 열','바람','떨어지는 물'],c:1,e:'바람이 커다란 날개를 돌리면 연결된 발전기가 돌면서 전기가 만들어져요.'},
  {q:'높은 곳에서 떨어지는 물의 힘으로 발전기를 돌리는 발전은?',a:['수력 발전','지열 발전','태양광 발전'],c:0,e:'물이 떨어지는 힘으로 발전기를 돌리는 것이 수력 발전이에요.'},
  {q:'땅속 깊은 곳의 뜨거운 열을 이용하는 에너지는?',a:['풍력 에너지','바이오 에너지','지열 에너지'],c:2,e:'지구 내부의 뜨거운 열로 난방을 하거나 전기를 만드는 것이 지열 에너지예요.'},
  {q:'볏짚이나 가축 분뇨 같은 생물 자원을 연료로 쓰는 에너지는?',a:['수력 에너지','바이오 에너지','태양열 에너지'],c:1,e:'생물 자원(바이오매스)을 연료로 쓰는 것이 바이오 에너지예요.'},
  {q:'밤이나 흐린 날 태양광 발전이 줄어드는 까닭은?',a:['바람이 없어서','햇빛이 약해서','물이 부족해서'],c:1,e:'태양광은 햇빛으로 전기를 만들어서 햇빛이 약하면 전기도 줄어요. 그래서 여러 에너지를 함께 써요.'},
  {q:'전기를 아끼는 생활 습관으로 알맞은 것은?',a:['빈 방에 불 켜 두기','쓰지 않는 플러그 뽑기','냉장고 문 자주 열기'],c:1,e:'꽂아 두기만 해도 새는 대기 전력이 있어요. 쓰지 않을 때는 뽑아 두면 좋아요.'},
  {q:'재생에너지의 좋은 점으로 알맞은 것은?',a:['아무 곳에나 지을 수 있다','날씨와 상관없이 늘 같은 양을 만든다','다시 채워져 계속 쓸 수 있다'],c:2,e:'재생에너지는 고갈될 걱정이 적고 온실가스도 거의 없어요. 하지만 알맞은 장소와 날씨가 필요해요.'},
  {q:'‘탄소 중립’의 뜻으로 알맞은 것은?',a:['내보낸 이산화 탄소만큼 줄이거나 흡수해 실제 배출량을 0으로 만드는 것','석탄만 골라 쓰는 것','탄소를 전혀 모르는 상태'],c:0,e:'배출은 줄이고 나무 심기 등으로 흡수는 늘려서 더하고 빼면 0이 되게 하는 것이 탄소 중립이에요.'}
];

/* ============ 소리 ============ */
let AC=null,muted=false;
function audio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(type,f0,f1,dur,vol,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02)}
function sfx(k){try{switch(k){
  case 'jump':tone('square',260,640,.16,.045);break;
  case 'coin':tone('square',988,988,.07,.05);tone('square',1319,1319,.25,.05,.07);break;
  case 'bump':tone('square',140,90,.08,.07);break;
  case 'up':[523,659,784,1047,1319].forEach((f,i)=>tone('square',f,f,.07,.04,i*.06));break;
  case 'pw':[392,523,659,784,1047].forEach((f,i)=>tone('triangle',f,f*1.02,.09,.07,i*.05));break;
  case 'stomp':tone('square',600,160,.12,.07);break;
  case 'bad':tone('sawtooth',220,110,.25,.05);break;
  case 'hurt':tone('square',400,90,.35,.06);break;
  case 'clear':[523,659,784,1047,784,1047].forEach((f,i)=>tone('square',f,f,.1,.05,i*.11));break;
}}catch(e){}}

/* ============ 스테이지 ============ */
function mk(w){return {w,g:Array.from({length:ROWS},()=>Array(w).fill(' '))}}
function ground(L,a,b,top=12){for(let x=a;x<=b;x++)for(let y=top;y<ROWS;y++)L.g[y][x]='#'}
function line(L,x,y,w,ch='='){for(let i=0;i<w;i++)L.g[y][x+i]=ch}
function put(L,x,y,s){for(let i=0;i<s.length;i++)if(s[i]!==' ')L.g[y][x+i]=s[i]}
function col(L,x,y0,y1,ch){for(let y=y0;y<=y1;y++)L.g[y][x]=ch}

const STAGES=[
  {n:'햇살 들판',sub:'1단계 · 태양광',sky:['#8fd3ff','#e3f6ff'],ground:['#6cbf4e','#9b6b43','#7d5536'],plat:'solar',tokens:'ssssl',
   intro:'햇빛이 가득한 들판이에요. <b>태양 에너지</b>를 모으고, 반짝이는 <b>석탄</b>은 조심하세요. 점수는 높지만 탄소 게이지가 올라가요!',
   lesson:'태양광 발전은 햇빛을 받은 태양 전지가 바로 전기를 만들어요. 연료가 필요 없고 이산화 탄소도 나오지 않아요.',
   build(){const L=mk(176);
    ground(L,0,38);ground(L,42,86);ground(L,90,128);ground(L,133,175);
    put(L,5,11,'  s s s');
    put(L,10,8,'BB=B'); put(L,11,7,' ');
    put(L,16,11,'e');
    line(L,20,9,4); put(L,20,8,'s  s');
    put(L,27,11,'c'); put(L,30,11,'e');
    put(L,35,8,'X=');
    put(L,40,9,'sss');
    put(L,46,11,'Q');
    line(L,52,9,5); put(L,52,8,'l s s'); put(L,58,11,'e  e');
    line(L,64,7,3); put(L,64,6,'s s'); put(L,66,11,'c');
    put(L,72,8,'B=B=B'); put(L,74,11,'e');
    put(L,80,11,'T');
    put(L,87,9,'ss'); line(L,87,10,2);
    put(L,93,11,'e'); line(L,96,9,3); put(L,96,8,'s s'); put(L,101,8,'Y');
    put(L,104,11,'e  e'); put(L,108,11,'c');
    put(L,112,11,'Q');
    line(L,116,9,6); put(L,116,8,'s s s ');
    put(L,124,11,'f'); put(L,126,9,'c');
    line(L,129,9,1); line(L,131,8,1); put(L,129,8,'s'); put(L,131,7,'s');

function toast(m,c){const t=document.createElement('div');t.className='toast '+(c||'');t.textContent=m;$('toast').appendChild(t);while($('toast').children.length>3)$('toast').firstChild.remove();setTimeout(()=>t.remove(),4500)}
function renderHud(){
  $('stName').textContent=`${S.stage+1}단계 · ${STAGES[S.stage].n}`;
  $('score').textContent=S.score;$('lives').textContent='♥'.repeat(Math.max(0,S.lives))+'♡'.repeat(Math.max(0,3-S.lives));
  $('co2').style.width=S.co2+'%';
  const pw=$('pw'); if(P&&P.pw){pw.hidden=false;pw.textContent=(P.pw==='wind'?'바람개비 · 이단 점프 ':'정화 배터리 · 쏘기 ')+Math.ceil(P.pwT)+'초'}else pw.hidden=true;
}
function togglePause(){if(!S.started||S.ended||!ov.hidden)return;S.paused=!S.paused;$('pauseBtn').textContent=S.paused?'계속하기':'일시정지'}
$('pauseBtn').onclick=togglePause;
$('helpBtn').onclick=()=>{if(S.started&&!ov.hidden)return;showHelp(S.started)};
function iconRow(list){return `<div class="items">${list.map(([t,txt])=>`<div><canvas data-ic="${t}" width="60" height="60"></canvas><span>${txt}</span></div>`).join('')}</div>`}
function paintIcons(){ov.querySelectorAll('canvas[data-ic]').forEach(c=>{const x=c.getContext('2d');x.clearRect(0,0,60,60);x.setTransform(2.4,0,0,2.4,4.8,4.8);
  const t=c.dataset.ic;if(t==='smog'){drawSmog(x,{x:-2,y:0,w:26,h:22,vx:-1},0,false)}else drawItem(x,.4,t,0,0,0)})}
const HELP_ITEMS=[['s','재생에너지 5종 (태양·바람·물·지열·바이오): +10'],['c','석탄·석유: +20 대신 탄소 +20~25'],['T','나무 묘목: 탄소 −35'],['F','바람개비: 12초 이단 점프'],['P','정화 배터리: 12초 공기 방울 쏘기'],['smog','스모그 괴물: 위에서 밟으면 정화 +15']];
function showHelp(inGame){
  const was=S.paused; S.paused=true; ov.hidden=false;
  ov.innerHTML=`<div class="card wide"><div class="eyebrow">게임 방법</div><h2>에너지 점프</h2>
    <div class="cols"><div class="box"><h3>목표</h3><ul><li>3단계를 달려 끝의 <b>충전소</b>까지 가요. 마지막 3단계에서는 <b>화력 발전소를 꺼요</b>.</li><li>목숨 ♥ 3개. 떨어지거나 스모그에 부딪히면 줄어요.</li><li><b>탄소 게이지</b>가 가득 차면 쓰러져요.</li></ul></div>
    <div class="box"><h3>보라색 퀴즈 문</h3><ul><li>문에 닿으면 에너지 퀴즈가 나와요.</li><li>맞히면 문이 열리고 +50점! 틀리면 설명을 읽고 다른 문제에 도전해요.</li></ul></div></div>
    <div class="box"><h3>아이템</h3>${iconRow(HELP_ITEMS)}<p style="font-size:13.5px;color:var(--muted)">번개 무늬 상자는 아래에서 머리로 치면 아이템이 나와요. 초록 상자는 에너지가 바로 들어오고, 파란 상자(바람개비)·하늘색 상자(정화 배터리)는 아이템이 튀어나와 옆으로 굴러가니 따라가서 먹어요.</p></div>
    <div class="cols"><div class="box"><h3>조작법</h3><div class="keys"><div><span>움직이기</span><kbd>← → · A D</kbd></div><div><span>점프</span><kbd>Space · ↑ · Z</kbd></div><div><span>공기 방울</span><kbd>X · J</kbd></div><div><span>일시정지</span><kbd>P</kbd></div></div><p style="font-size:13px;color:var(--muted)">점프 버튼을 길게 누르면 더 높이 뛰어요. 한쪽으로 계속 달리면(또는 Shift) 빨라지고, 빨리 달릴수록 더 높이 뛰어요. 스모그를 밟을 때 점프를 누르고 있으면 더 높이 튀어요. 휴대폰은 화면 아래 버튼을 써요.</p></div>
    <div class="box tip"><h3>꿀팁</h3><ul><li>석탄과 석유는 점수가 높지만 탄소가 쌓여 화면이 뿌옇게 되고 스모그가 빨라져요.</li><li>탄소가 많으면 나무 묘목을 찾아요.</li><li>3단계 굴뚝 연기는 피하거나 공기 방울로 없애요.</li></ul></div></div>
    <div class="row"><button class="btn" id="hb" type="button">${inGame?'게임으로 돌아가기':'처음 화면으로'}</button></div></div>`;
  paintIcons();
  $('hb').onclick=()=>{if(inGame){ov.hidden=true;S.paused=was}else showStart()};
}
function showStart(){
  ov.hidden=false;
  ov.innerHTML=`<div class="card"><div class="eyebrow">5학년 2학기 · 자원과 에너지</div><h1>에너지 점프</h1>
    <canvas id="heroPic" style="width:100%;height:110px"></canvas>
    <p>스모그 괴물이 마을의 전기를 빼앗아 갔어요! 콘센트 로봇이 되어 <b>재생에너지</b>를 모으며 달려요. 반짝이는 <b>석탄과 석유</b>는 점수가 높지만 탄소가 쌓여요.</p>
    ${iconRow([['s','태양·바람·물·지열·바이오 에너지'],['c','석탄·석유 (탄소 조심!)'],['T','나무 묘목 (탄소 줄이기)'],['smog','스모그 괴물 (위에서 밟기)']])}
    <div class="row"><button class="btn" id="goBtn" type="button">출발!</button><button class="btn alt" id="howBtn" type="button">게임 방법 자세히 보기</button></div></div>`;
  paintIcons();
  const pc=$('heroPic'),x=pc.getContext('2d'),w=pc.clientWidth;pc.width=w*2;pc.height=220;x.scale(2,2);
  const keep=P;P={x:w/2-11,y:60,w:22,h:30,vx:0,on:true,face:1,walk:0,inv:0,pw:'wind'};drawHero(x,.3);
  drawItem(x,0,'s',w/2-110,40,0);drawItem(x,.4,'w',w/2-70,20,0);drawItem(x,0,'h',w/2+60,25,0);drawItem(x,0,'g',w/2+95,45,0);drawSmog(x,{x:w/2+140,y:70,w:26,h:22,vx:-1},0,false);P=keep;
  $('goBtn').onclick=()=>{newRun();showStageIntro(0)};
  $('howBtn').onclick=()=>showHelp(false);
}
function showStageIntro(i){
  loadStage(i); S.paused=true; ov.hidden=false; const st=STAGES[i];
  ov.innerHTML=`<div class="card"><div class="eyebrow">${st.sub}</div><h2>${st.n}</h2><p>${st.intro}</p><div class="row"><button class="btn" id="goBtn" type="button">시작하기</button></div></div>`;
  $('goBtn').onclick=()=>{ov.hidden=true;S.started=true;S.paused=false;S.t0=performance.now()};
}
function openQuiz(g){
  S.paused=true; ov.hidden=false; S.quizTry++;
  const q=quizPool.shift()||shuffle(QUIZ.slice())[0]; quizPool.push(q);
  ov.innerHTML=`<div class="card"><div class="eyebrow">퀴즈 문</div><h2>${q.q}</h2><div style="display:grid;gap:8px">${q.a.map((a,i)=>`<button class="choice" data-i="${i}" type="button">${a}</button>`).join('')}</div><div id="qr"></div></div>`;
  ov.querySelector('.choice').focus();
  ov.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===q.c;
    ov.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(+x.dataset.i===q.c)x.classList.add('right')});if(!ok)b.classList.add('wrong');
    if(ok){g.open=true;S.score+=50;S.quizOK++;renderHud()}
    $('qr').innerHTML=`<div class="note ${ok?'good':'bad'}"><b>${ok?'정답! 문이 열렸어요 +50':'아쉬워요. 다른 문제로 다시 도전해요!'}</b><br>${q.e}</div><div class="row" style="margin-top:10px"><button class="btn" id="qg" type="button">${ok?'계속 달리기':'다시 도전'}</button></div>`;
    $('qg').focus();$('qg').onclick=()=>{if(ok){ov.hidden=true;S.paused=false}else openQuiz(g)}});
}
function stageClear(){
  S.paused=true;sfx('clear'); ov.hidden=false; const st=STAGES[S.stage], last=S.stage===STAGES.length-1;
  const bonus=Math.round((100-S.co2)/2); S.score+=bonus; renderHud();
  ov.innerHTML=`<div class="card"><div class="eyebrow">${st.sub} 완료</div><h2>${last?'화력 발전소를 껐어요!':'충전소 도착!'}</h2>
    <p>${st.lesson}</p><div class="note good">탄소 보너스 +${bonus} (탄소 게이지가 낮을수록 커요)</div>
    <div class="row"><button class="btn" id="goBtn" type="button">${last?'결과 보기':'다음 단계로'}</button></div></div>`;
  $('goBtn').onclick=()=>{ if(last) ending(true); else showStageIntro(S.stage+1) };
}
function gameOver(){ending(false)}
function ending(win){
  S.ended=true;S.paused=true;ov.hidden=false;
  const tot=S.ren+S.fos, share=tot?Math.round(S.ren/tot*100):100;
  const stars=[win,share>=80,S.quizOK>=S.quizTry&&S.quizTry>0];
  ov.innerHTML=`<div class="card"><div class="eyebrow">${win?'모든 단계 완료':'게임 끝'}</div><h1 style="color:${win?'var(--leaf)':'var(--alarm)'}">${win?'마을에 맑은 전기가 돌아왔어요!':'다시 도전해 볼까요?'}</h1>
    <div class="stars">${stars.map(s=>s?'★':'<span class="off">★</span>').join('')}</div>
    <p class="eyebrow" style="text-align:center">별: 끝까지 가기 · 모은 에너지 중 재생에너지 80% 이상 · 퀴즈 한 번에 다 맞히기</p>
    <div class="stats"><div><b>${S.score}</b><small>전기 점수</small></div><div><b>${share}%</b><small>재생에너지 비율</small></div><div><b>${S.cleaned}</b><small>정화한 스모그</small></div><div><b>${S.quizOK}/${S.quizTry}</b><small>퀴즈 정답</small></div></div>
    <div class="box"><h3>오늘 배운 것</h3><ul>
      <li>석탄·석유는 전기를 많이 주지만 태우면 <b>이산화 탄소</b>가 나와 지구가 뜨거워져요. 매장량도 정해져 있어요.</li>
      <li>햇빛·바람·물·지열·바이오 같은 <b>재생에너지</b>는 다시 채워지고 온실가스가 거의 없어요.</li>
      <li><b>나무</b>는 이산화 탄소를 흡수해요. 배출은 줄이고 흡수는 늘리면 <b>탄소 중립</b>에 가까워져요.</li></ul></div>
    <div class="row"><button class="btn" id="goBtn" type="button">처음부터 다시</button>${!win?`<button class="btn alt" id="retry" type="button">${S.stage+1}단계 다시 하기</button>`:''}</div></div>`;
  $('goBtn').onclick=()=>{newRun();showStageIntro(0)};
  if(!win)$('retry').onclick=()=>{const st=S.stage,sc=S.score;newRun();S.score=Math.floor(sc/2);showStageIntro(st)};
}

/* ============ 루프 ============ */
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(S.started&&!S.paused&&!S.ended){update(dt)}
  draw(now/1000);
  requestAnimationFrame(frame);
}
addEventListener('resize',resize);
newRun();resize();loadStage(0);showStart();requestAnimationFrame(frame);
</script>

</body></html>
