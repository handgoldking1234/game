<script>
/* ============ claude.ai 함께 하기 (room 기능을 PeerJS처럼 쓰는 연결 도구) ============ */
let NETR_=null;
(async()=>{try{if(window.claude&&claude.use){const r=await claude.use('room');if(r)NETR_=r}}catch(e){NETR_=null}})();
const RP_CLEAN=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F­​-‏‪-‮⁠-⁯﻿-]/g,'');
const RP_LATEST=new Set(['p','s','m','gs','ps','pos','st','mobs','in']);
class RPConn{constructor(pc,peer){this.pc=pc;this.peer=peer;this.open=false;this.h={}}
  on(ev,fn){(this.h[ev]=this.h[ev]||[]).push(fn);return this}
  fire(ev,a){for(const f of this.h[ev]||[])try{f(a)}catch(e){console.error(e)}}
  send(m){if(this.open)this.pc._q(this.peer,m)}
  close(){this.open=false}}
class RoomPeer{
  constructor(id){this.id=id||null;this.h={};this.conns=new Map();this.seq=0;this.win=[];this.pend=[];this.seen={};this.chunks={};this.room=null;this.dead=false;this.unsub=[];
    this._start().catch(e=>this.fire('error',{type:e&&e.type||'network'}))}
  on(ev,fn){(this.h[ev]=this.h[ev]||[]).push(fn);return this}
  fire(ev,a){for(const f of this.h[ev]||[])try{f(a)}catch(e){console.error(e)}}
  async _start(){await new Promise(r=>setTimeout(r,0));const R=NETR_;if(!R)throw{type:'network'};const host=!!this.id;this.host=host;
    const name=String(host?this.id:'x').toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);
    if(host){this.room=await R.join(name);await new Promise(r=>setTimeout(r,1200));
      if(this.room.peers().some(p=>!p.sameTab&&p.presence&&p.presence.h)){await this.room.leave().catch(()=>{});throw{type:'unavailable-id'}}
      await this.room.presence({h:1,o:[]});this.me=(this.room.peers().find(p=>p.sameTab)||{}).peer;this._listen();this.fire('open',this.id)}
    else this.fire('open','guest')}
  connect(hid){const c=new RPConn(this,null);(async()=>{try{const name=String(hid).toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);this.room=await NETR_.join(name);
      let hp=null;for(let i=0;i<40&&!hp;i++){hp=this.room.peers().find(p=>!p.sameTab&&p.presence&&p.presence.h);if(!hp)await new Promise(r=>setTimeout(r,250))}
      if(!hp){await this.room.leave().catch(()=>{});this.fire('error',{type:'peer-unavailable'});return}
      this.me=(this.room.peers().find(p=>p.sameTab)||{}).peer;c.peer=hp.peer;this.conns.set(hp.peer,c);await this.room.presence({g:1,o:[]});this._listen();c.open=true;c.fire('open')}catch(e){this.fire('error',{type:'network'})}})();return c}
  _listen(){const r=this.room;this.unsub.push(r.onPeers(ch=>this._peers(ch),()=>{for(const c of this.conns.values()){c.open=false;c.fire('close')}}));this._peers({peers:r.peers(),joined:r.peers(),left:[],updated:[]});
    this.timer=setInterval(()=>this._flush(),100)}
  _peers(ch){for(const p of ch.left||[]){const c=this.conns.get(p.peer);if(c){c.open=false;this.conns.delete(p.peer);c.fire('close')}}
    for(const p of ch.peers){if(p.sameTab)continue;const pr=p.presence||{};
      if(this.host&&pr.g&&!this.conns.has(p.peer)){const c=new RPConn(this,p.peer);this.conns.set(p.peer,c);this.fire('connection',c);setTimeout(()=>{c.open=true;c.fire('open')},50)}
      const c=this.conns.get(p.peer);if(!c)continue;const o=Array.isArray(pr.o)?pr.o.slice().sort((x,y)=>x.s-y.s):[];const sn=this.seen[p.peer]||(this.seen[p.peer]={set:new Set(),floor:0});
      for(const e of o){if(!e||!(e.s>sn.floor)||sn.set.has(e.s))continue;sn.set.add(e.s);if(e.to!=='*'&&!(Array.isArray(e.to)&&e.to.includes(this.me)))continue;let txt=e.x;
        if(e.c){const k=p.peer+':'+e.c[0];const bk=this.chunks[k]||(this.chunks[k]=[]);bk[e.c[1]]=e.x;if(bk.filter(v=>v!=null).length<e.c[2])continue;txt=bk.join('');delete this.chunks[k]}
        try{c.fire('data',JSON.parse(txt))}catch(err){}}
      if(sn.set.size>600){const arr=[...sn.set].sort((x,y)=>x-y);sn.floor=arr[arr.length-400];sn.set=new Set(arr.slice(-400))}}}
  _q(to,m){const t=m&&m.t,key=RP_LATEST.has(t)?t+'|'+(m.id??''):null;
    for(const e of this.pend)if(e.ref===m){if(!e.to.includes(to))e.to.push(to);return}
    let txt;try{txt=RP_CLEAN(JSON.stringify(m))}catch(e){return}
    if(key){const e=this.pend.find(q=>q.key===key);if(e){e.ref=m;e.txt=txt;if(!e.to.includes(to))e.to.push(to);return}}
    this.pend.push({ref:m,key,to:[to],txt})}
  _flush(){if(!this.room||this.dead)return;const now=Date.now();
    for(const e of this.pend){const to=e.to.length>=this.conns.size&&this.host?'*':e.to.slice();

function admit(id,pid){const a=ani(id);if(!a||a.st!=='window')return;S.queue.shift();S.doorT=2.5;a.wait=0;

function doAct(pid,act,P){if(!S||S.phase==='over')return;const pl=P||S.pl[pid];if(!pl)return;const near=(x,z,r)=>Math.hypot(pl.x-x,pl.z-z)<r;const a=act.id!=null?ani(act.id):null;

      else{a.hp-=25;evTo(pid,{k:'toast',m:`❌ ${ITEMS[act.it].n}은(는) 필요 없었어요! 환자가 힘들어해요`,c:'bad'});if(a.hp<=0)patientDie(a)}break}

    case'tase':{if(!a||!near(a.x,a.z,3.6)||a.st==='gone'||a.st==='leave')return;evAll({k:'zap',x:a.x,z:a.z});

      else{a.hp-=30;evTo(pid,{k:'toast',m:'😣 진짜 환자였어요! 깜짝 놀랐대요',c:'bad'});if(a.hp<=0&&a.st==='bed')patientDie(a)}break}
    case'carry':{if(!a||a.st!=='faint'||!near(a.x,a.z,2.4))return;a.st='carried';a.by=pid;break}
    case'drop':{if(!a||a.st!=='carried'||a.by!==pid)return;const r=WARDS.find(w=>!S.rooms[w.id]&&near(bedPos(w).x,bedPos(w).z,2.8));if(r){S.rooms[r.id]=a.id;a.room=r.id;a.lastRoom=r.id;const b=bedPos(r);a.x=b.x;a.z=b.z;a.st='bed';a.faint=0;evTo(pid,{k:'toast',m:`🛏️ ${a.name}를 침대에 눕혔어요`,c:'good'})}else{a.st='faint'}break}
    case'ext':{const f=S.fires[act.room];if(!f)return;const r=ROOMS.find(x=>x.id===act.room);if(!near(f.x,f.z,4.6))return;f.lvl--;evAll({k:'puff',x:f.x,z:f.z});if(f.lvl<=0){delete S.fires[act.room];S.money+=3;say('🧯 불을 껐어요! 💰+3','good')}break}

function evTo(pid,e){if(pid==='me'||pid===NET.myPid)onEv(e);else netTo(pid,{t:'ev',e})}
function gameOver(){S.phase='over';const best=Math.max(store.get('best',0),S.day);store.set('best',best);store.set('run',null);evAll({k:'over',day:S.day,st:S.stats,best})}
function endShift(){S.phase='end';const avg=S.stats.useN?S.stats.useSum/S.stats.useN:100;const eb=avg<75?Math.round(clamp((75-avg)*1.3,0,40)):0;const wage=20+S.day*2;S.money+=eb+wage;

// 매 프레임
function moveAlong(a,dt){const p=a.path[0];if(!p)return true;const dx=p.x-a.x,dz=p.z-a.z,d=Math.hypot(dx,dz);const st=a.spd*dt;if(d<=st){a.x=p.x;a.z=p.z;a.path.shift();return!a.path.length}a.x+=dx/d*st;a.z+=dz/d*st;a.yaw=Math.atan2(dx,dz);return false}
function routeTo(a,tx,tz){const rf=roomAt(a.x,a.z),rt=roomAt(tx,tz);const pts=[];if(rf!==rt){if(rf&&rf.door){pts.push({x:rf.door.x,z:rf.door.z+(rf.z0>=12?1:-1)});pts.push({x:rf.door.x,z:10})}else if(rf&&rf.kind==='lobby'&&a.z<7)pts.push({x:clamp(a.x,-4,4),z:7.6});
  if(rt&&rt.door){pts.push({x:rt.door.x,z:10});pts.push({x:rt.door.x,z:rt.door.z+(rt.z0>=12?1:-1)})}}pts.push({x:tx,z:tz});a.path=pts}
function hostStep(dt){if(!S||S.phase==='over'||S.phase==='end')return;const c=dayCfg(S.day);
  if(S.shutT>0)S.shutT-=dt;if(S.doorT>0)S.doorT-=dt;for(const k in S.mach)if(S.mach[k]>0)S.mach[k]-=dt;

    if(i===0&&!a.path.length&&Math.hypot(a.x-q.x,a.z-q.z)<.3){a.st='window';a.wait=0;evAll({k:'bell'})}else if(i>0)a.st='queue'});

      if(done&&a.st==='walk'){if(a.after==='bed'){a.st='bed';a.lastRoom=a.room;a.yaw=Math.PI}else if(a.after==='wait'){a.st='wait'}else if(a.after==='faint'){a.st='faint';say(`💫 ${a.name}가 로비에서 쓰러졌어요! 업어서(E) 빈 침대로 옮겨요`,'warn')}}
      if(done&&a.st==='leave')a.st='gone'}
    else if(a.st==='window'){a.wait+=dt;const q=queueSpot(0);a.x=lerp(a.x,q.x,.1);a.z=lerp(a.z,q.z,.1);a.yaw=0;
      if(a.mimic&&a.wait>22)S.bang=1;

    else if(a.st==='wait'){if(freeWard()){a.chair=null;sendToWard(a)}a.hp-=c.decay*.35*dt;if(!a.mimic&&a.hp<=0)patientDie(a);if(a.mimic){a.revealT-=dt*.5;if(a.revealT<=0)reveal(a)}}
    else if(a.st==='bed'){if(a.mimic){a.revealT-=dt*(S.power.out?2:1);if(a.revealT<=0)reveal(a)}
      else{let k=c.decay;if(!S.lights[a.room])k*=1.4;if(S.fires[a.room])k+=1.5;if(S.power.out)k*=1.2;a.hp-=k*dt;if(a.hp<=0)patientDie(a)}}
    else if(a.st==='faint'){a.hp-=c.decay*.8*dt;if(a.hp<=0){a.st='gone';S.deaths++;S.stats.dead++;say(`😢 ${a.name}를 지키지 못했어요… (${S.deaths}/3)`,'bad');if(S.deaths>=3)gameOver()}}
    else if(a.st==='carried'){const p=S.pl[a.by];if(!p){a.st='faint';continue}a.x=p.x+Math.sin(p.yaw)*-.6;a.z=p.z+Math.cos(p.yaw)*-.6;a.hp-=c.decay*.5*dt}
    else if(a.st==='reveal'){a.spd=S.power.out?2.4:1.7;a.retT-=dt;if(a.retT<=0){a.retT=1;let best=null,bd=16;for(const id in S.pl){const p=S.pl[id];if(p.dead)continue;const d=Math.hypot(p.x-a.x,p.z-a.z);if(d<bd){bd=d;best=p}}
        if(!best){const ps=S.animals.filter(b=>b.st==='bed'&&!b.mimic);if(ps.length){const b=ps[(a.id*7)%ps.length];best=b}}if(best)routeTo(a,best.x,best.z)}
      moveAlong(a,dt);if(a.scare>0)a.scare-=dt;else for(const b of S.animals){if(b.st==='bed'&&!b.mimic&&Math.hypot(b.x-a.x,b.z-a.z)<1.4){b.hp-=35;a.scare=7;say(`😱 그림자 흉내쟁이가 ${b.name}를 놀라게 했어요!`,'bad');if(b.hp<=0)patientDie(b);break}}}}

let AC=null,rainN=null,master=null;
function audio(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination)}if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(type,f1,f2,d,v,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
function noise(d,v,f,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const b=AC.createBuffer(1,AC.sampleRate*d|0,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f||1200;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t)}
function sfx(k){if(!AC)return;switch(k){
  case'good':tone('triangle',660,990,.15,.15);tone('triangle',990,1320,.18,.12,.12);break;case'bad':tone('sawtooth',300,120,.4,.12);break;
  case'beep':tone('square',880,880,.08,.06);break;case'shutter':noise(.8,.25,500);tone('sawtooth',90,60,.8,.05);break;case'door':noise(.3,.08,2000);break;
  case'zap':tone('square',1800,200,.25,.12);noise(.2,.12,4000);break;case'puff':noise(.4,.18,900);break;case'alarm':for(let i=0;i<3;i++)tone('square',900,700,.25,.08,i*.35);break;
  case'reveal':tone('sawtooth',200,50,1.2,.12);noise(1,.08,300);break;case'whisper':noise(.8,.05,400);tone('sine',120,90,.8,.03);break;case'bang':noise(.15,.35,300);tone('square',80,50,.15,.1);break;
  case'heart':tone('sine',70,50,.12,.25);tone('sine',70,50,.12,.2,.18);break;case'power':tone('sawtooth',400,60,.8,.12);break;case'on':tone('triangle',200,600,.4,.1);break;
  case'pick':tone('triangle',520,780,.08,.08);break;case'drink':noise(.3,.06,700);tone('sine',400,500,.2,.05);break;
  case'animal':tone('triangle',500+Math.random()*300,700,.12,.08);tone('triangle',600,450,.15,.06,.15);break;
  case'weird':tone('sawtooth',500,90,.7,.08);tone('triangle',700,1300,.5,.05,.3);break}}
function rainSound(on){if(!AC)return;if(on&&!rainN){const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1600;const g=AC.createGain();g.gain.value=.05;s.connect(f);f.connect(g);g.connect(master);s.start();rainN=s}else if(!on&&rainN){rainN.stop();rainN=null}}

function inspectCard(id){const a=animalById(id);if(!a)return;const S0=SPECIES[a.sp];const w=W();
  openCard(`<div class="hd"><h2>🔍 방문 동물 살펴보기</h2><button class="x" type="button" data-x aria-label="닫기">✕</button></div>
   <div class="vis"><div class="pic">${S0.e}</div><div><h3>${esc(a.name)} <small class="small">(${S0.n})</small></h3><p>📝 보호자 메모: <b>${esc(a.sym)}</b></p><p class="small">🏥 지금 입원 중: ${wardNames().map(esc).join(', ')||'없음'}</p><p class="small">👀 창밖의 동물을 직접 보세요 — 눈 색, 그림자, 다리 개수, 털 색, 웃는 입, 고개 방향! 입원 명단·메모도 확인해요</p></div></div>
   <div class="row"><button class="btn alt sm" id="iS" type="button">👂 소리 듣기</button><button class="btn alt sm" id="iC" type="button">📹 CCTV 보기</button><button class="btn alt sm" id="iD" type="button">🧬 DNA 검사 (남은 ${w.dna}번 · 전기 많이 씀)</button></div>
   <div class="res" id="iR"></div>
   <div class="row"><button class="btn green" id="iA" type="button">✅ 들여보내기</button><button class="btn red" id="iX" type="button">⛔ 셔터 내리기</button></div>`);
  const R=$('iR');
  $('iS').onclick=()=>{if(a.tells.sound){sfx('weird');R.className='res bad';R.textContent=`👂 "${S0.snd.replace(/[!~]/g,'')}… ${S0.snd.slice(0,1)}…으으… 끼이이익…?" 소리가 이상해요!`}else{sfx('animal');R.className='res';R.textContent=`👂 "${S0.snd}" 평범한 ${S0.n} 소리예요`}};
  $('iC').onclick=()=>{sfx('beep');let m=a.tells.shadow?'📹 CCTV: 바닥에 그림자가 비치지 않아요!':'📹 CCTV: 그림자 이상 없음';if(ME.cls==='guard')m+=a.tells.legs?` · 다리가 ${SPECIES[a.sp].legs===2?3:5}개로 보여요!`:` · 다리 ${SPECIES[a.sp].legs}개 정상`;R.className='res '+(a.tells.shadow||(ME.cls==='guard'&&a.tells.legs)?'bad':'');R.textContent=m};
  $('iD').onclick=()=>{if(W().dna<=0){R.className='res bad';R.textContent='🧬 오늘은 DNA 검사를 다 썼어요';return}R.className='res';R.textContent='🧬 검사 중… (전기를 많이 써요)';$('iD').disabled=true;INS.id=a.id;act({k:'dna',id:a.id})};
  $('iA').onclick=()=>{act({k:'admit',id:a.id});sfx('door');closeCard()};$('iX').onclick=()=>{act({k:'reject',id:a.id});sfx('shutter');closeCard()}}
const INS={id:0};

/* ============ 카드: 병실 ============ */
function bedAct(a){const sel=ME.slots[ME.sel];if(!a.diag){act({k:'diag',id:a.id});sfx('beep');return}
  if(ITEMS[sel]&&ITEMS[sel].med){const sv=stepsV(a);if(ME.cls==='vet'&&sv&&sv[0]!=='?'&&!sv.includes(sel)){toast(`🩺 수의사의 감: ${ITEMS[sel].n}은(는) 필요 없어 보여요!`,'warn');return}act({k:'item',id:a.id,it:sel});removeSel();return}bedCard(a.id)}
const stepsV=a=>a.diag&&a.mimic&&ROLE.r!=='guest'?['?']:a.steps;
function bedCard(id){const a=animalById(id);if(!a)return;const S0=SPECIES[a.sp];const st=stepsV(a);const weird=st&&st[0]==='?';
  const need=(st||[]).filter(s=>s!=='?').map(s=>ITEMS[s]?`${ITEMS[s].e} ${ITEMS[s].n}`:`${STATIONS[s].e} ${STATIONS[s].n}${s==='oxy'?'':' (해당 방에서)'}`);
  const meds=ME.slots.map((k,i)=>({k,i})).filter(o=>ITEMS[o.k].med);
  openCard(`<div class="hd"><h2>📋 ${esc(a.name)} ${S0.e} 진찰 결과</h2><button class="x" type="button" data-x aria-label="닫기">✕</button></div>
   <p>📝 ${esc(a.sym)}</p><div class="prog"><b style="width:${clamp(a.hp,0,100)}%;background:${a.hp<35?'#ef4444':'#22c55e'}"></b></div>
   ${weird?'<div class="note" style="background:#2e1065;color:#e9d5ff">🩺 ??? 맥박이 느껴지지 않고 몸이 얼음처럼 차가워요… <b>그림자 흉내쟁이일지도!</b> 🔆 빛 막대로 쫓아내요</div>':`<div class="note"><b>필요한 치료</b><br>${need.join('<br>')||'✅ 다 나았어요!'}</div>`}
   ${!weird&&meds.length?`<div class="row">${meds.map(o=>`<button class="btn alt sm" type="button" data-m="${o.i}">${ITEMS[o.k].e} ${ITEMS[o.k].n} 주기</button>`).join('')}</div>`:''}
   ${!weird&&(st||[]).includes('oxy')?'<button class="btn blue" id="bO" type="button">🫧 산소 치료 시작</button>':''}
   <p class="small">약은 💊 물품실 선반에서 꺼내요. 📷 엑스레이·💓 심장 검사는 6·7번 방, 🔪 수술은 8번 수술실에서 해요.</p>`);
  ov.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;const k=ME.slots[i];if(ME.cls==='vet'&&!a.steps.includes(k)){toast(`🩺 수의사의 감: ${ITEMS[k].n}은(는) 필요 없어 보여요!`,'warn');return}act({k:'item',id:a.id,it:k});ME.slots.splice(i,1);ME.sel=0;renderBar();closeCard()});
  const o=$('bO');if(o)o.onclick=()=>mgOxy(a.id)}

/* ============ 카드: 물품·자판기·주문·발전기 ============ */
function cabinetCard(){openCard(`<div class="hd"><h2>💊 물품실 선반</h2><button class="x" type="button" data-x aria-label="닫기">✕</button></div><p class="small">필요한 약을 가방에 넣어요. 가방 ${ME.slots.length-1}/${bagMax()-1}칸</p>
  <div class="pal">${[...MED,'ext','mop'].map(k=>`<button type="button" data-k="${k}">${ITEMS[k].e}<small>${ITEMS[k].n}</small></button>`).join('')}</div>`);ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(addItem(b.dataset.k))cabinetCard()})}
function vendCard(){openCard(`<div class="hd"><h2>☕ 휴게실 자판기</h2><button class="x" type="button" data-x aria-label="닫기">✕</button></div><p>정신력 🧠을 채워 줘요. 💰 ${W().money}</p>
  <div class="row"><button class="btn alt" data-v="coffee" type="button">☕ 코코아 💰5</button><button class="btn alt" data-v="tea" type="button">🍵 허브차 💰6</button><button class="btn alt" data-v="choco" type="button">🍫 초콜릿 💰8</button></div>
  <button class="btn purple" id="vQ" type="button" ${ME.quizCD>0?'disabled':''}>❓ 에너지 퀴즈 (무료! 맞히면 🧠+25 · 💰+3)${ME.quizCD>0?` — ${Math.ceil(ME.quizCD)}초 뒤`:''}</button>`);
  ov.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(ME.slots.length>=bagMax()){toast('🎒 가방이 꽉 찼어요','warn');return}act({k:'vend',it:b.dataset.v});closeCard()});$('vQ').onclick=()=>quizCard('vend')}
function shopCard(){const w=W();if(w.phase!=='prep'){toast('📦 주문은 근무 시작 전 준비 시간에만 할 수 있어요','warn');return}
  openCard(`<div class="hd"><h2>📦 주문 단말기</h2><button class="x" type="button" data-x aria-label="닫기">✕</button></div><p>💰 ${w.money} · 근무 시작까지 <b id="shT">${Math.ceil(w.prepT)}</b>초</p>
  <div class="shop">${Object.entries(UPG).map(([k,u])=>`<div><b>${u.e} ${u.n}</b><small>${u.d}</small>${!['bat','dna'].includes(k)&&w.up[k]?'<b class="g">✅ 설치됨</b>':`<button class="btn sm" data-u="${k}" type="button" ${w.money<u.c?'disabled':''}>💰 ${u.c}</button>`}</div>`).join('')}</div>`);
  ov.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{act({k:'buy',it:b.dataset.u});setTimeout(()=>{if(!ov.hidden&&$('shT'))shopCard()},ROLE.r==='guest'?500:50)});cardTimer=setInterval(()=>{const t=$('shT');if(t)t.textContent=Math.ceil(W().prepT);if(W().phase!=='prep')closeCard()},500)}
function genCard(){const w=W();const P=w.power;
  openCard(`<div class="hd"><h2>⚡ 발전실 · 전기 계기판</h2><button class="x" type="button" data-x aria-label="닫기">✕</button></div>
   <p>지금 전기 사용량 <b>${P.use}</b> / 한도 <b>${P.cap}</b> ${P.out?'<b class="r">— 정전!</b>':''}</p><div class="prog"><b style="width:${clamp(P.use/P.cap*100,0,100)}%;background:${P.use>P.cap?'#ef4444':'#facc15'}"></b></div>
   <div class="note">💡 쓰지 않는 방의 불을 끄면 전기를 아낄 수 있어요. 근무가 끝날 때 <b>전기를 아낀 만큼 보너스</b>를 받아요!<br>⚠️ 한도를 넘게 쓰면 정전이 돼요. 정전되면 그림자 흉내쟁이가 더 대담해져요.</div>
   ${P.out?`<div class="row"><button class="btn" id="gF" type="button">🔧 발전기 고치기</button><button class="btn purple" id="gQ" type="button">❓ 정전 퀴즈 (2문제 맞히면 복구)</button>${w.up.solar&&!P.batUsed?'<button class="btn green" id="gB" type="button">🔋 배터리 비상 전원</button>':''}</div>`:'<p class="g"><b>✅ 발전기가 잘 돌아가고 있어요</b></p>'}
   ${w.up.solar?'<p class="small">🔋 밤에는 태양광 패널이 전기를 못 만들어요. 그래서 낮에 모아 둔 배터리를 써요!</p>':''}`);
  const f=$('gF');if(f)f.onclick=mgGen;const q=$('gQ');if(q)q.onclick=()=>{PQ.ok=0;quizCard('power')};const b=$('gB');if(b)b.onclick=()=>{act({k:'battery'});closeCard()}}

/* ============ 미니게임 ============ */
const MG={on:null};
function stationStart(st){const w=W();const ok=w.animals.some(a=>a.st==='bed'&&a.diag&&a.steps&&a.steps.includes(st));if(!ok){toast(`${STATIONS[st].e} ${STATIONS[st].n}이 필요한 (진찰한) 환자가 없어요`,'warn');return}
  if(w.power.out){toast('⚡ 정전이라 기계가 안 켜져요! 발전실로!','bad');return}act({k:'mgStart',st});({xray:mgXray,heart:mgHeart,surg:mgSurg})[st]()}
function mgEnd(st,ok,id){act({k:'mg',st,ok:ok?1:0,id});sfx(ok?'good':'bad');setTimeout(closeCard,ok?700:1100)}
function mgXray(){const d=W().day;const n=Math.min(7,3+Math.floor(d/3));const seq=[...Array(n)].map(()=>Math.random()*4|0);let inp=[],show=true;const C=['#ef4444','#3b82f6','#22c55e','#facc15'];MG.on='xray';
  openCard(`<div class="mgw"><h2>📷 엑스레이 — 불빛 순서 기억하기</h2><p id="mT">잘 보세요…</p><div class="simon">${C.map((c,i)=>`<button type="button" data-i="${i}" style="background:${c};color:${c}"></button>`).join('')}</div><button class="btn alt sm" data-x type="button">그만두기</button></div>`,{x:()=>act({k:'mg',st:'xray',ok:0})});
  const B=[...ov.querySelectorAll('[data-i]')];const lit=(i,t)=>{B[i].classList.add('lit');tone('triangle',[330,440,550,660][i],[330,440,550,660][i],.2,.1);setTimeout(()=>B[i]&&B[i].classList.remove('lit'),t)};
  seq.forEach((v,k)=>setTimeout(()=>{if(MG.on==='xray')lit(v,380)},500+k*600));setTimeout(()=>{show=false;if($('mT'))$('mT').textContent='이제 같은 순서로 눌러요!'},500+n*600);
  B.forEach(b=>b.onclick=()=>{if(show)return;const i=+b.dataset.i;lit(i,180);inp.push(i);if(seq[inp.length-1]!==i){$('mT').textContent='❌ 순서가 틀렸어요!';show=true;mgEnd('xray',0);return}if(inp.length===seq.length){$('mT').textContent='✅ 엑스레이 완벽해요!';show=true;mgEnd('xray',1)}})}
function mgHeart(){let p=0,t=20,cells=Array(12).fill(0);MG.on='heart';
  openCard(`<div class="mgw"><h2>💓 심장 검사 — 하얀 칸만 눌러요!</h2><p>💀 빨간 해골은 누르면 안 돼요 · <b id="hT">20</b>초</p><div class="prog" style="width:300px"><b id="hP" style="width:0%"></b></div><div class="hgrid">${cells.map((_,i)=>`<button type="button" data-i="${i}"></button>`).join('')}</div><button class="btn alt sm" data-x type="button">그만두기</button></div>`,{x:()=>act({k:'mg',st:'heart',ok:0})});
  const B=[...ov.querySelectorAll('[data-i]')];const draw=()=>B.forEach((b,i)=>{b.className=cells[i]===1?'w':cells[i]===2?'s':'';b.textContent=cells[i]===2?'💀':cells[i]===1?'🤍':''});
  const tick=()=>{cells=cells.map(()=>{const r=Math.random();return r<.22?1:r<.32?2:0});draw()};tick();let acc=0;
  cardTimer=setInterval(()=>{acc+=.1;t-=.1;if($('hT'))$('hT').textContent=Math.ceil(t);if(acc>=.7){acc=0;tick()}if(t<=0){clearInterval(cardTimer);mgEnd('heart',0)}},100);
  B.forEach((b,i)=>b.onclick=()=>{if(cells[i]===1){p+=13;tone('sine',600,900,.08,.07);cells[i]=0}else if(cells[i]===2){p=Math.max(0,p-22);sfx('bad');cells[i]=0}draw();$('hP').style.width=Math.min(100,p)+'%';if(p>=100){clearInterval(cardTimer);mgEnd('heart',1)}})}
function mgSurg(){const extra=MED.filter(k=>k!=='iv').sort(()=>Math.random()-.5);const plan=['iv',extra[0],extra[1],'tri'];const tri=MED.slice().sort(()=>Math.random()-.5).slice(0,3);let step=0,t=45,picked=[];MG.on='surg';
  const lab=s=>s==='tri'?`마지막: ${tri.map(k=>ITEMS[k].e).join(' + ')} 세 가지 함께!`:`${ITEMS[s].e} ${ITEMS[s].n}`;
  openCard(`<div class="mgw"><h2>🔪 수술 — 45초 안에 순서대로!</h2><p>⏱ <b id="sT">45</b>초 · 단계 <b id="sN">1</b>/5</p><p id="sW" style="font-size:20px;font-weight:900"></p><div class="pal">${MED.map(k=>`<button type="button" data-k="${k}">${ITEMS[k].e}<small>${ITEMS[k].n}</small></button>`).join('')}</div><p class="small">순서: ${['iv',extra[0],extra[1]].map(k=>ITEMS[k].e).join(' → ')} → (${tri.map(k=>ITEMS[k].e).join('+')}) → 마무리</p><button class="btn alt sm" data-x type="button">그만두기</button></div>`,{x:()=>act({k:'mg',st:'surg',ok:0})});
  const show=()=>{$('sN').textContent=Math.min(5,step+1);$('sW').textContent=step<4?'필요한 것: '+lab(plan[step]):'✅ 봉합 완료!'};show();
  cardTimer=setInterval(()=>{t-=.2;if($('sT'))$('sT').textContent=Math.ceil(t);if(t<=0){clearInterval(cardTimer);$('sW').textContent='⏰ 시간이 다 됐어요';mgEnd('surg',0)}},200);
  ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(plan[step]==='tri'){if(tri.includes(k)&&!picked.includes(k)){picked.push(k);b.classList.add('pick');sfx('pick');if(picked.length===3){step++;step++;show();clearInterval(cardTimer);mgEnd('surg',1)}}else{t-=5;sfx('bad')}return}
    if(k===plan[step]){step++;sfx('pick');show()}else{t-=5;sfx('bad');$('sW').textContent='❌ 아니에요! (-5초) '+lab(plan[step])}})}
function mgOxy(id){let hits=0,pos=0,dir=1,miss=0;const W0=Math.max(14,30-W().day);const z0=rnd(15,85-W0);MG.on='oxy';act({k:'mgStart',st:'oxy'});
  openCard(`<div class="mgw"><h2>🫧 산소 치료 — 초록 칸에서 누르기!</h2><p>3번 성공하면 숨쉬기가 편해져요 · 성공 <b id="oN">0</b>/3</p><div class="oxy" style="width:320px"><div class="z" style="left:${z0}%;width:${W0}%"></div><div class="k" id="oK"></div></div><button class="btn blue" id="oP" type="button">🫧 지금 펌프!</button><button class="btn alt sm" data-x type="button">그만두기</button></div>`,{x:()=>act({k:'mg',st:'oxy',ok:0,id})});
  cardTimer=setInterval(()=>{pos+=dir*2.2;if(pos>=100||pos<=0)dir*=-1;const k=$('oK');if(k)k.style.left=pos+'%'},30);
  const press=()=>{if(pos>=z0&&pos<=z0+W0){hits++;tone('sine',500,800,.1,.08);$('oN').textContent=hits;if(hits>=3){clearInterval(cardTimer);mgEnd('oxy',1,id)}}else{miss++;sfx('bad');if(miss>=4){clearInterval(cardTimer);mgEnd('oxy',0,id)}}};$('oP').onclick=press;MG.press=press}
function mgGen(){const n=5;const tgt=[...Array(n)].map(()=>Math.random()<.5?1:0);if(tgt.every(v=>!v))tgt[2]=1;let cur=[...Array(n)].map(()=>Math.random()<.5?1:0);let t=ME.cls==='elec'?30:18;MG.on='gen';
  openCard(`<div class="mgw"><h2>🔧 발전기 고치기 — 램프와 똑같이 맞춰요!</h2><p>위 램프처럼 스위치를 켜고 꺼요 · ⏱ <b id="gT">${t}</b>초</p><div class="lamps">${tgt.map(v=>`<i class="${v?'on':''}"></i>`).join('')}</div><div class="sw">${cur.map((v,i)=>`<button type="button" data-i="${i}" class="${v?'on':''}">${v?'ON':'OFF'}</button>`).join('')}</div>${ME.cls==='elec'?'<p class="small">⚡ 전기 기사: 시간이 더 넉넉해요</p>':''}<button class="btn alt sm" data-x type="button">그만두기</button></div>`);
  const B=[...ov.querySelectorAll('[data-i]')];const check=()=>{if(cur.every((v,i)=>v===tgt[i])){clearInterval(cardTimer);act({k:'gen',ok:1});sfx('on');setTimeout(closeCard,600)}};
  B.forEach((b,i)=>b.onclick=()=>{cur[i]^=1;b.className=cur[i]?'on':'';b.textContent=cur[i]?'ON':'OFF';tone('square',300,300,.04,.05);check()});
  cardTimer=setInterval(()=>{t-=.2;if($('gT'))$('gT').textContent=Math.ceil(t);if(t<=0){clearInterval(cardTimer);toast('🔧 다시 해 봐요!','bad');closeCard()}},200)}

/* ============ ❓ 에너지 퀴즈 (자판기 · 정전 퀴즈) ============ */
const ABC=['①','②','③','④'];const QZS=Object.assign({n:0,ok:0,seen:[]},store.get('quiz',{}));const PQ={ok:0};
function quizCard(mode){const pool=QB.map((_,i)=>i).filter(i=>!QZS.seen.includes(i));const qi=pool.length?pick(pool):Math.random()*QB.length|0;const Q=QB[qi];let done=false;const pw=mode==='power';
  if(pw&&!W().power.out){closeCard();return}

   <div><div class="small" style="margin-bottom:4px">직업 고르기</div><div class="seg" id="cls">${CLASSES.map(c=>`<button type="button" data-c="${c.k}" aria-pressed="${ME.cls===c.k}"><b>${c.e} ${c.n}</b><small>${c.d}</small></button>`).join('')}</div></div>
   <div class="row"><button class="btn" id="solo" type="button">▶ 혼자 새로 시작</button>${sv?`<button class="btn alt" id="cont" type="button">⏩ ${sv.day}일째부터 이어하기</button>`:''}<button class="btn blue" id="host" type="button">👥 방 만들기</button></div>
   <div class="row"><input class="inp" id="code" inputmode="numeric" maxlength="4" placeholder="방 번호 4자리" style="width:150px"><button class="btn alt" id="join" type="button">🚪 방 들어가기</button></div>
   <div class="row"><button class="btn alt sm" id="gd" type="button">📖 근무 안내서</button><button class="btn alt sm" id="hp" type="button">🎮 조작법</button></div>`,()=>{
   ov.querySelectorAll('#cls button').forEach(b=>b.onclick=()=>{ME.cls=b.dataset.c;store.set('cls',ME.cls);ov.querySelectorAll('#cls button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
   $('solo').onclick=()=>{nick();audio();beginHost(false)};const c=$('cont');if(c)c.onclick=()=>{nick();audio();beginHost(true)};$('host').onclick=()=>{nick();audio();netStart(true)};$('join').onclick=()=>{nick();audio();netStart(false,$('code').value)};
   $('gd').onclick=()=>{guideCard();ov.querySelector('[data-x]').onclick=lobby};$('hp').onclick=()=>{helpCard();ov.querySelector('[data-x]').onclick=lobby}})}

/* ============ 루프 ============ */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let last=performance.now(),hudT=0;const T0=performance.now();
function frame(nw){const dt=Math.min(.05,Math.max(0,(nw-last)/1000));last=nw;const t=(nw-T0)/1000;
  try{if(GAME.on){moveMe(dt);if(ROLE.r!=='guest'&&S){S.pl.me=Object.assign(S.pl.me||{},{n:NET.nick,cls:ME.cls,x:ME.x,z:ME.z,yaw:ME.yaw});S.plist=Object.entries(S.pl).map(([id,p])=>({id,x:p.x,z:p.z,yaw:p.yaw,n:p.n,cls:p.cls,me:id==='me'}));hostStep(dt);if(!NET.on)S.evq.length=0}
      sanityStep(dt);syncWorld(dt,t);hudT-=dt;if(hudT<=0){hudT=.15;hud()}}
    else{camera.position.set(Math.sin(t*.05)*3,2.2,-7.5);camera.rotation.set(-.05,Math.PI+Math.sin(t*.05)*.2,0)}
    netTick(dt);renderer.render(scene,camera)}catch(err){console.error(err)}
  requestAnimationFrame(frame)}
buildHospital();setSan(100);renderBar();requestAnimationFrame(frame);lobby();

</script>
