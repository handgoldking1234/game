<style>
:root{--ink:#0f172a;--paper:#fff;--paper2:#f1f5f9;--muted:#64748b;--acc:#facc15;--night:#0b1020;--good:#22c55e;--bad:#ef4444;--f:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--night);font-family:var(--f);color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#tags{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:13px;font-weight:800;text-shadow:0 1px 3px #000,0 0 2px #000;white-space:nowrap;text-align:center;line-height:1.25}
.tag .nd{display:block;font-size:17px;letter-spacing:1px}.tag .hb{display:block;width:54px;height:6px;border-radius:4px;background:rgba(0,0,0,.6);margin:2px auto 0;overflow:hidden}.tag .hb i{display:block;height:100%;background:#4ade80}
#hud{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;background:rgba(15,23,42,.72);border-radius:14px;padding:7px 12px;font-size:15px;font-weight:700;pointer-events:none;max-width:96vw}
#hud .pw{display:inline-flex;align-items:center;gap:5px}#hud .pw i{display:inline-block;width:70px;height:9px;border-radius:5px;background:#334155;overflow:hidden;position:relative}#hud .pw i b{position:absolute;left:0;top:0;bottom:0;background:#facc15}
#hud .pw.over i b{background:#ef4444}#hud .ph{color:#fde68a}
#san{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(60px,calc(env(safe-area-inset-top) + 52px));z-index:5;background:rgba(15,23,42,.72);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:800;pointer-events:none;width:150px}
#san i{display:block;height:8px;border-radius:5px;background:#334155;margin-top:4px;overflow:hidden}#san i b{display:block;height:100%;background:#a78bfa;transition:width .3s}
#san.low i b{background:#f43f5e}
#bar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;gap:5px}
#bar button{width:52px;height:52px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(15,23,42,.7);color:#fff;font-size:24px;position:relative;cursor:pointer;font-family:inherit;padding:0}
#bar button.on{border-color:#facc15;background:rgba(250,204,21,.25)}#bar button small{position:absolute;left:3px;top:1px;font-size:10px;opacity:.7}#bar button em{position:absolute;right:3px;bottom:1px;font-size:11px;font-style:normal;font-weight:800}
#prompt{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 66px);transform:translateX(-50%);z-index:5;background:rgba(15,23,42,.8);border-radius:12px;padding:7px 14px;font-size:15px;font-weight:800;pointer-events:none;white-space:nowrap}
#prompt:empty{display:none}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.75);z-index:4;pointer-events:none}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;z-index:8;pointer-events:none;width:min(560px,94vw)}
.toast{background:rgba(15,23,42,.9);border-radius:12px;padding:8px 14px;font-size:14.5px;font-weight:700;border:2px solid rgba(255,255,255,.15);animation:tin .25s}.toast.good{border-color:#22c55e}.toast.bad{border-color:#ef4444}.toast.warn{border-color:#f59e0b}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-size:clamp(26px,5vw,44px);font-weight:900;text-align:center;opacity:0;transition:opacity .4s;z-index:7;pointer-events:none;text-shadow:0 4px 18px rgba(0,0,0,.9);width:min(760px,94vw)}#banner small{display:block;font-size:16px;font-weight:700;margin-top:6px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:6;transition:opacity .5s}
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 160px 40px rgba(88,28,135,0);transition:box-shadow .4s}
#ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(2,6,23,.55);padding:12px;overflow:auto}
#ov[hidden]{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:22px;padding:20px;width:min(600px,96vw);max-height:94vh;overflow:auto;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
.card h1{margin:0;font-size:30px}.card h2{margin:0;font-size:22px}.card h3{margin:0;font-size:17px}.card p{margin:0;line-height:1.6}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.x{border:0;background:var(--paper2);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.btn{border:0;border-radius:12px;padding:11px 16px;font-size:16px;font-weight:800;background:#facc15;color:#1f1300;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #ca8a04}
.btn.blue{background:#3b82f6;color:#fff;box-shadow:0 4px 0 #1d4ed8}.btn.alt{background:var(--paper2);color:var(--ink);box-shadow:0 4px 0 #cbd5e1}.btn.red{background:#ef4444;color:#fff;box-shadow:0 4px 0 #b91c1c}.btn.green{background:#22c55e;color:#fff;box-shadow:0 4px 0 #15803d}.btn.purple{background:#a855f7;color:#fff;box-shadow:0 4px 0 #7e22ce}
.btn:disabled{opacity:.45;cursor:default}.btn.sm{padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.small{font-size:13px;color:var(--muted)}
.note{border-radius:12px;padding:10px 12px;background:#f1f5f9;font-size:14px;line-height:1.6}
.inp{border:2px solid #cbd5e1;border-radius:12px;padding:10px 12px;font-size:16px;font-family:inherit;width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:2px solid #cbd5e1;background:#fff;border-radius:12px;padding:8px 10px;font-size:14px;cursor:pointer;font-family:inherit;display:grid;justify-items:center;gap:2px;min-width:110px;flex:1;color:var(--ink)}
.seg button[aria-pressed=true]{border-color:#facc15;background:#fef9c3}.seg button b{font-size:15px}.seg button small{font-size:11.5px;color:var(--muted);line-height:1.3}
.vis{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}.vis .pic{font-size:66px;text-align:center;background:#0f172a;border-radius:16px;height:110px;display:grid;place-items:center}
.res{min-height:22px;font-weight:800}.res.good{color:#15803d}.res.bad{color:#dc2626}
.mgw{display:grid;gap:10px;justify-items:center;text-align:center}
.simon{display:grid;grid-template-columns:repeat(2,110px);gap:10px}.simon button{height:90px;border-radius:18px;border:0;cursor:pointer;opacity:.55;transition:opacity .1s,transform .1s}.simon button.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 30px currentColor}
.hgrid{display:grid;grid-template-columns:repeat(4,70px);gap:8px}.hgrid button{height:62px;border-radius:12px;border:0;background:#1e293b;font-size:30px;cursor:pointer;color:#fff}.hgrid button.w{background:#f8fafc}.hgrid button.s{background:#7f1d1d}
.prog{width:100%;height:14px;border-radius:8px;background:#e2e8f0;overflow:hidden}.prog b{display:block;height:100%;background:#22c55e;transition:width .15s}
.pal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.pal button{width:64px;height:64px;border-radius:14px;border:2px solid #e2e8f0;background:#f8fafc;font-size:30px;cursor:pointer;display:grid;place-items:center}.pal button small{font-size:10.5px;color:#334155}.pal button.pick{border-color:#22c55e;background:#dcfce7}
.oxy{position:relative;width:100%;height:34px;border-radius:10px;background:#e2e8f0;overflow:hidden}.oxy .z{position:absolute;top:0;bottom:0;background:#86efac}.oxy .k{position:absolute;top:-2px;bottom:-2px;width:6px;background:#0f172a;border-radius:3px}
.sw{display:flex;gap:10px;justify-content:center}.sw button{width:54px;height:84px;border-radius:12px;border:3px solid #334155;background:#1e293b;color:#fff;font-size:22px;cursor:pointer}.sw button.on{background:#facc15;color:#1f1300}
.lamps{display:flex;gap:10px;justify-content:center}.lamps i{width:54px;height:16px;border-radius:8px;background:#334155}.lamps i.on{background:#facc15;box-shadow:0 0 12px #facc15}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}.shop div{background:#f8fafc;border-radius:12px;padding:10px;display:grid;gap:4px}.shop small{color:var(--muted);line-height:1.35}
.ent{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;background:#0f172a;color:#e2e8f0;border-radius:16px;padding:12px}.ent .pic{font-size:60px;text-align:center}.ent b{color:#c4b5fd}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}.tbl td{padding:6px 4px;border-bottom:1px solid #e2e8f0}.tbl td:last-child{text-align:right;font-weight:800}
.qq{font-size:18px;font-weight:800;margin:0;line-height:1.45}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:6px}.qa button{border:2px solid #e2e8f0;background:#f8fafc;border-radius:12px;padding:10px;font:inherit;font-size:15px;font-weight:700;text-align:left;cursor:pointer;color:var(--ink);min-height:48px}
.qa button.ok{background:#dcfce7;border-color:#22c55e}.qa button.no{background:#fee2e2;border-color:#ef4444}.qa button b{color:#7e22ce}
.g{color:#15803d}.r{color:#dc2626}
#chatBar{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 70px);transform:translateX(-50%);z-index:9;width:min(520px,94vw);background:rgba(15,23,42,.92);border-radius:14px;padding:8px;display:grid;gap:6px}
#chatBar[hidden]{display:none}.qk{display:flex;gap:5px;flex-wrap:wrap}.qb{border:0;border-radius:10px;background:#334155;color:#fff;padding:6px 9px;font-size:13px;cursor:pointer;font-family:inherit}
#chatF{display:flex;gap:6px}#chatIn{flex:1;border:0;border-radius:10px;padding:9px;font-size:15px;font-family:inherit}#chatF button{border:0;border-radius:10px;background:#facc15;font-weight:800;padding:0 12px;font-family:inherit}
#chatLog{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 140px);z-index:4;display:grid;gap:3px;max-width:min(360px,70vw);pointer-events:none}
#chatLog div{background:rgba(15,23,42,.7);border-radius:8px;padding:4px 8px;font-size:13.5px}#chatLog b{color:#fde68a}
#touch{position:fixed;inset:0;z-index:4;pointer-events:none}#touch[hidden]{display:none}
.joy{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:max(90px,calc(env(safe-area-inset-bottom) + 80px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);pointer-events:auto}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.4)}
#look{position:absolute;right:0;top:0;bottom:0;width:58%;pointer-events:auto}
.tb{position:absolute;pointer-events:auto;border:0;border-radius:50%;width:66px;height:66px;background:rgba(15,23,42,.7);color:#fff;font-size:15px;font-weight:900;border:2px solid rgba(255,255,255,.35);font-family:inherit}
#tE{right:max(22px,env(safe-area-inset-right));bottom:max(150px,calc(env(safe-area-inset-bottom) + 140px));width:84px;height:84px;font-size:18px;background:rgba(250,204,21,.35)}
#tU{right:max(118px,calc(env(safe-area-inset-right) + 96px));bottom:max(120px,calc(env(safe-area-inset-bottom) + 110px))}
#tF{right:max(22px,env(safe-area-inset-right));bottom:max(250px,calc(env(safe-area-inset-bottom) + 240px));width:54px;height:54px;font-size:20px}
#tC{right:max(86px,calc(env(safe-area-inset-right) + 64px));bottom:max(250px,calc(env(safe-area-inset-bottom) + 240px));width:54px;height:54px;font-size:20px}

<script>/* ===== 민왕게임월드 온라인 연결 도우미 v2 =====

(function(){

function Em(){this._h={}}

/* ---------- 아주 작은 MQTT 3.1.1 (웹소켓) ---------- */
var te=new TextEncoder(),td=new TextDecoder();
function str(s){var b=te.encode(s);var o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o}
function cat(arr){var n=0,i;for(i=0;i<arr.length;i++)n+=arr[i].length;var o=new Uint8Array(n),p=0;for(i=0;i<arr.length;i++){o.set(arr[i],p);p+=arr[i].length}return o}

function Mqtt(clientId){Em.call(this);this.cid=clientId;this.bi=0;this.ok=false;this.subs=[];this.buf=new Uint8Array(0);this.pid=1;this.dead=false;this._go()}
inherit(Mqtt);
Mqtt.prototype._go=function(){var self=this;if(this.dead)return;if(this.bi>=BROKERS.length){this.emit('fail');return}
  var url=BROKERS[this.bi],ws,done=false;try{ws=new WebSocket(url,'mqtt')}catch(e){this.bi++;return this._go()}

  var to=setTimeout(function(){if(!done){done=true;try{ws.close()}catch(e){}self.bi++;self._go()}},6000);
  ws.onopen=function(){var body=cat([str('MQTT'),new Uint8Array([4,2,0,40]),str(self.cid)]);ws.send(pkt(0x10,body))};
  ws.onmessage=function(ev){self._rx(new Uint8Array(ev.data),function(){if(!done){done=true;clearTimeout(to)}})};
  ws.onerror=function(){};
  ws.onclose=function(){clearTimeout(to);var was=self.ok;self.ok=false;clearInterval(self.pt);if(self.dead)return;if(!done){done=true;self.bi++;self._go();return}
    if(was){self.emit('down');setTimeout(function(){if(!self.dead){self.bi=0;self._go()}},1500)}}};
Mqtt.prototype._rx=function(chunk,onConn){var b=cat([this.buf,chunk]);var p=0;
  while(p<b.length){var h=b[p],mul=1,len=0,q=p+1,d;do{if(q>=b.length){this.buf=b.slice(p);return}d=b[q++];len+=(d&127)*mul;mul*=128}while(d&128);
    if(q+len>b.length){this.buf=b.slice(p);return}var body=b.subarray(q,q+len);p=q+len;var t=h>>4;
    if(t===2){if(body[1]===0){onConn();var first=!this.everOk;this.ok=true;this.everOk=true;var self=this;this.pt=setInterval(function(){try{self.ws.send(new Uint8Array([0xC0,0]))}catch(e){}},20000);for(var i=0;i<this.subs.length;i++)this._sub(this.subs[i]);this.emit(first?'ready':'up')}else{try{this.ws.close()}catch(e){}}}
    else if(t===3){var tl=(body[0]<<8)|body[1];var topic=td.decode(body.subarray(2,2+tl));var off=2+tl+((h>>1)&3?2:0);this.emit('msg',topic,td.decode(body.subarray(off)))}}
  this.buf=new Uint8Array(0)};
Mqtt.prototype._sub=function(t){var id=this.pid++&65535||1;this.ws.send(pkt(0x82,cat([new Uint8Array([id>>8,id&255]),str(t),new Uint8Array([0])])))};
Mqtt.prototype.sub=function(t){this.subs.push(t);if(this.ok)this._sub(t)};
Mqtt.prototype.pub=function(t,s){if(!this.ok)return false;try{this.ws.send(pkt(0x30,cat([str(t),te.encode(s)])));return true}catch(e){return false}};
Mqtt.prototype.close=function(){this.dead=true;clearInterval(this.pt);try{this.ws.send(new Uint8Array([0xE0,0]));this.ws.close()}catch(e){}};

/* ---------- 연결 하나 (PeerJS 또는 MQTT를 감싸요) ---------- */
function Conn(peer,remote){Em.call(this);this.peer=remote;this.open=false;this.reliable=true;this._p=peer;this._k=null;this._rc=null;this.closed=false;this.via=''}
inherit(Conn);
Conn.prototype.send=function(d){if(!this.open||this.closed)return;if(this._rc){try{this._rc.send(d)}catch(e){}}else if(this._k){this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'d',c:this._k,f:this._p.id,d:d}));this._tx=Date.now()}};
Conn.prototype.close=function(){if(this.closed)return;this.closed=true;var was=this.open;this.open=false;if(this._rc){try{this._rc.close()}catch(e){}}if(this._k){this._p._mq&&this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'fin',c:this._k,f:this._p.id}));delete this._p._mc[this._k]}clearInterval(this._ka);if(was)this.emit('close')};
Conn.prototype._useReal=function(rc){var self=this;this._rc=rc;this.via='webrtc';
  rc.on('data',function(d){self.emit('data',d)});rc.on('close',function(){if(!self.closed){self.closed=true;self.open=false;self.emit('close')}});rc.on('error',function(e){self.emit('error',e)})};
Conn.prototype._setOpen=function(){var self=this;if(this.open||this.closed)return;this.open=true;setTimeout(function(){self.emit('open')},0)};
Conn.prototype._useMq=function(k){var self=this;this._k=k;this.via='relay';this._rx=Date.now();this._p._mc[k]=this;
  this._ka=setInterval(function(){if(!self.open)return;if(Date.now()-(self._tx||0)>3000)self._p._mq.pub(TOPIC+self.peer,JSON.stringify({t:'png',c:k,f:self._p.id}));if(Date.now()-self._rx>16000){self.close()}},2000)};

/* ---------- Peer 대신 쓰는 SmartPeer ---------- */
function SmartPeer(id,opts){if(!(this instanceof SmartPeer))return new SmartPeer(id,opts);Em.call(this);var self=this;
  if(id&&typeof id==='object'){opts=id;id=undefined}
  this.id=id||('g'+rid(11));this.isHost=!!id;this.opts=opts||{};this.destroyed=false;this.open=false;this._mc={};this._openSent=false;this._rpOpen=false;this._mqReady=false;
  // 1) PeerJS
  if(RealPeer){try{var o={};for(var k in this.opts)o[k]=this.opts[k];o.config=o.config||{iceServers:ICE};
    this._rp=new RealPeer(this.id,o);
    this._rp.on('open',function(){self._rpOpen=true;self._open()});
    this._rp.on('connection',function(rc){var c=new Conn(self,rc.peer);rc.on('open',function(){if(c.closed)return;c._useReal(rc);c._setOpen();self.emit('connection',c)})});
    this._rp.on('error',function(e){var t=e&&e.type;if(t==='unavailable-id'){self.emit('error',e);return}if(t==='peer-unavailable'){var m=/peer\s+(\S+)/i.exec(e.message||'');self.emit('_pu',m?m[1]:'');return}self._rpBad=true;if(!self._rpOpen)self._maybeOpen()});
    this._rp.on('disconnected',function(){if(!self.destroyed){try{self._rp.reconnect()}catch(e){}}});
  }catch(e){this._rp=null;this._rpBad=true}}else this._rpBad=true;
  // 2) MQTT 중계 (항상 함께 켜 둬요)
  this._mq=new Mqtt('mw'+rid(12));
  this._mq.on('ready',function(){self._mqReady=true;self._maybeOpen()});
  this._mq.on('fail',function(){self._mqBad=true;if(!self._openSent&&(self._rpBad||!RealPeer))self.emit('error',{type:'network',message:'연결 서버에 닿지 못했어요'})});
  this._mq.on('msg',function(t,s){self._onMsg(s)});
  this._mq.sub(TOPIC+this.id);
  setTimeout(function(){self._waited=true;self._maybeOpen()},3500)}
inherit(SmartPeer);
SmartPeer.prototype._maybeOpen=function(){if(this._openSent||this.destroyed)return;if(this._rpOpen)return this._open();if(this._mqReady&&(this._waited||this._rpBad))this._open()};
SmartPeer.prototype._open=function(){if(this._openSent||this.destroyed)return;this._openSent=true;this.open=true;var self=this;setTimeout(function(){self.emit('open',self.id)},0)};
SmartPeer.prototype._onMsg=function(s){var m;try{m=JSON.parse(s)}catch(e){return}if(!m||!m.c)return;var c=this._mc[m.c];
  if(m.t==='syn'){if(!this.isHost&&!this._acceptAll)return;if(!c){c=new Conn(this,String(m.f));c._useMq(m.c);c._setOpen();this.emit('connection',c)}c._rx=Date.now();this._mq.pub(TOPIC+m.f,JSON.stringify({t:'ack',c:m.c,f:this.id}));return}
  if(!c)return;c._rx=Date.now();
  if(m.t==='ack'){if(c._wait){c._wait=false;clearInterval(c._synT);c._setOpen()}}
  else if(m.t==='d'){if(c.open)c.emit('data',m.d)}
  else if(m.t==='fin'){if(!c.closed){c.closed=true;var was=c.open;c.open=false;clearInterval(c._ka);delete this._mc[m.c];if(was)c.emit('close')}}};
SmartPeer.prototype.connect=function(remote,opts){var self=this,c=new Conn(this,remote);var fellBack=false;
  function relay(){if(fellBack||c.closed||c.open)return;fellBack=true;
    var go=function(){var k=rid(12);c._useMq(k);c._wait=true;var n=0;var syn=function(){if(!c._wait||c.closed){clearInterval(c._synT);return}if(++n>8){clearInterval(c._synT);c._wait=false;c.closed=true;self.emit('error',{type:'peer-unavailable',message:'Could not connect to peer '+remote});c.emit('error',{type:'peer-unavailable'});return}self._mq.pub(TOPIC+remote,JSON.stringify({t:'syn',c:k,f:self.id}))};syn();c._synT=setInterval(syn,1300)};
    if(self._mqReady)go();else{var w=setInterval(function(){if(self._mqReady){clearInterval(w);go()}else if(self._mqBad){clearInterval(w);self.emit('error',{type:'network'})}},300)}}
  if(this._rp&&this._rpOpen&&!this._rpBad){try{var rc=this._rp.connect(remote,opts||{reliable:true});
      rc.on('open',function(){if(c.open||c.closed){try{rc.close()}catch(e){}return}if(fellBack){if(c._wait){c._wait=false;clearInterval(c._synT);if(c._k)delete self._mc[c._k];clearInterval(c._ka);c._k=null}else{try{rc.close()}catch(e){}return}}c._useReal(rc);c._setOpen()});
      var pu=function(who){if(!who||who===remote)relay()};this.on('_pu',pu);
      setTimeout(relay,7000)}catch(e){relay()}}
  else relay();
  return c};
SmartPeer.prototype.destroy=function(){if(this.destroyed)return;this.destroyed=true;for(var k in this._mc){try{this._mc[k].close()}catch(e){}}if(this._rp){try{this._rp.destroy()}catch(e){}}if(this._mq)this._mq.close();this.emit('close')};
SmartPeer.prototype.disconnect=function(){this.destroy()};
SmartPeer.prototype.reconnect=function(){};
window.Peer=SmartPeer;window.MWG_RealPeer=RealPeer;
})();

<script>
/* ============ claude.ai 함께 하기 (room 기능을 PeerJS처럼 쓰는 연결 도구) ============ */
let NETR_=null;
(async()=>{try{if(window.claude&&claude.use){const r=await claude.use('room');if(r)NETR_=r}}catch(e){NETR_=null}})();
const RP_CLEAN=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F­​-‏‪-‮⁠-⁯﻿-]/g,'');
const RP_LATEST=new Set(['p','s','m','gs','ps','pos','st','mobs','in']);
class RPConn{constructor(pc,peer){this.pc=pc;this.peer=peer;this.open=false;this.h={}}
  on(ev,fn){(this.h[ev]=this.h[ev]||[]).push(fn);return this}
  fire(ev,a){for(const f of this.h[ev]||[])try{f(a)}catch(e){console.error(e)}}
  send(m){if(this.open)this.pc._q(this.peer,m)}
  close(){this.open=false}}
class RoomPeer{
  constructor(id){this.id=id||null;this.h={};this.conns=new Map();this.seq=0;this.win=[];this.pend=[];this.seen={};this.chunks={};this.room=null;this.dead=false;this.unsub=[];
    this._start().catch(e=>this.fire('error',{type:e&&e.type||'network'}))}
  on(ev,fn){(this.h[ev]=this.h[ev]||[]).push(fn);return this}
  fire(ev,a){for(const f of this.h[ev]||[])try{f(a)}catch(e){console.error(e)}}
  async _start(){await new Promise(r=>setTimeout(r,0));const R=NETR_;if(!R)throw{type:'network'};const host=!!this.id;this.host=host;
    const name=String(host?this.id:'x').toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);
    if(host){this.room=await R.join(name);await new Promise(r=>setTimeout(r,1200));
      if(this.room.peers().some(p=>!p.sameTab&&p.presence&&p.presence.h)){await this.room.leave().catch(()=>{});throw{type:'unavailable-id'}}
      await this.room.presence({h:1,o:[]});this.me=(this.room.peers().find(p=>p.sameTab)||{}).peer;this._listen();this.fire('open',this.id)}
    else this.fire('open','guest')}
  connect(hid){const c=new RPConn(this,null);(async()=>{try{const name=String(hid).toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);this.room=await NETR_.join(name);
      let hp=null;for(let i=0;i<40&&!hp;i++){hp=this.room.peers().find(p=>!p.sameTab&&p.presence&&p.presence.h);if(!hp)await new Promise(r=>setTimeout(r,250))}
      if(!hp){await this.room.leave().catch(()=>{});this.fire('error',{type:'peer-unavailable'});return}
      this.me=(this.room.peers().find(p=>p.sameTab)||{}).peer;c.peer=hp.peer;this.conns.set(hp.peer,c);await this.room.presence({g:1,o:[]});this._listen();c.open=true;c.fire('open')}catch(e){this.fire('error',{type:'network'})}})();return c}
  _listen(){const r=this.room;this.unsub.push(r.onPeers(ch=>this._peers(ch),()=>{for(const c of this.conns.values()){c.open=false;c.fire('close')}}));this._peers({peers:r.peers(),joined:r.peers(),left:[],updated:[]});
    this.timer=setInterval(()=>this._flush(),100)}
  _peers(ch){for(const p of ch.left||[]){const c=this.conns.get(p.peer);if(c){c.open=false;this.conns.delete(p.peer);c.fire('close')}}
    for(const p of ch.peers){if(p.sameTab)continue;const pr=p.presence||{};
      if(this.host&&pr.g&&!this.conns.has(p.peer)){const c=new RPConn(this,p.peer);this.conns.set(p.peer,c);this.fire('connection',c);setTimeout(()=>{c.open=true;c.fire('open')},50)}
      const c=this.conns.get(p.peer);if(!c)continue;const o=Array.isArray(pr.o)?pr.o.slice().sort((x,y)=>x.s-y.s):[];const sn=this.seen[p.peer]||(this.seen[p.peer]={set:new Set(),floor:0});
      for(const e of o){if(!e||!(e.s>sn.floor)||sn.set.has(e.s))continue;sn.set.add(e.s);if(e.to!=='*'&&!(Array.isArray(e.to)&&e.to.includes(this.me)))continue;let txt=e.x;
        if(e.c){const k=p.peer+':'+e.c[0];const bk=this.chunks[k]||(this.chunks[k]=[]);bk[e.c[1]]=e.x;if(bk.filter(v=>v!=null).length<e.c[2])continue;txt=bk.join('');delete this.chunks[k]}
        try{c.fire('data',JSON.parse(txt))}catch(err){}}
      if(sn.set.size>600){const arr=[...sn.set].sort((x,y)=>x-y);sn.floor=arr[arr.length-400];sn.set=new Set(arr.slice(-400))}}}
  _q(to,m){const t=m&&m.t,key=RP_LATEST.has(t)?t+'|'+(m.id??''):null;
    for(const e of this.pend)if(e.ref===m){if(!e.to.includes(to))e.to.push(to);return}
    let txt;try{txt=RP_CLEAN(JSON.stringify(m))}catch(e){return}
    if(key){const e=this.pend.find(q=>q.key===key);if(e){e.ref=m;e.txt=txt;if(!e.to.includes(to))e.to.push(to);return}}
    this.pend.push({ref:m,key,to:[to],txt})}
  _flush(){if(!this.room||this.dead)return;const now=Date.now();
    for(const e of this.pend){const to=e.to.length>=this.conns.size&&this.host?'*':e.to.slice();
      if(e.key){this.win=this.win.filter(w=>!(w.key===e.key));}
      if(e.txt.length>1500){const id=(++this.seq);const n=Math.ceil(e.txt.length/1500);for(let i=0;i<n;i++)this.win.push({s:++this.seq,to,c:[id,i,n],x:e.txt.slice(i*1500,(i+1)*1500),t:now,big:1})}
      else this.win.push({s:++this.seq,to,x:e.txt,t:now,key:e.key})}
    this.pend=[];
    this.win=this.win.filter(w=>w.big?(w.n||0)<3:now-w.t<900);
    let out=[],size=40;const big=this.win.filter(w=>w.big).sort((x,y)=>(x.n||0)-(y.n||0)||x.s-y.s),small=this.win.filter(w=>!w.big);
    const L=w=>w.L||(w.L=JSON.stringify(w.x).length+60);const hasBig=big.length>0;
    for(const w of small.slice().reverse()){const l=L(w);if(size+l>(hasBig?2000:3800))break;size+=l;out.push(w)}
    for(const w of big){const l=L(w);if(size+l>3850)continue;size+=l;out.push(w);w.n=(w.n||0)+1}
    out.sort((a,b)=>a.s-b.s);const pl=out.map(w=>({s:w.s,to:w.to,x:w.x,...(w.c?{c:w.c}:{})}));const sig=pl.map(q=>q.s).join(',');
    if(sig===this.sig)return;this.sig=sig;this.room.presence({o:pl}).catch(()=>{})}
  destroy(){this.dead=true;clearInterval(this.timer);for(const u of this.unsub)try{u()}catch(e){}if(this.room)this.room.leave().catch(()=>{})}}

/* ============ 📚 에너지 문제 은행 (에너지 브롤과 같은 문제) ============ */
/* 개념 카드 */

function powerStep(dt){const P=S.power;let use=16;const lu=S.up.led?2:4;for(const r of ROOMS){if(!S.lights[r.id])continue;use+=r.kind==='hall'?(S.up.led?3:6):r.kind==='lobby'?(S.up.led?2.5:5):lu}

let AC=null,rainN=null,master=null;

function tone(type,f1,f2,d,v,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
function noise(d,v,f,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const b=AC.createBuffer(1,AC.sampleRate*d|0,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f||1200;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t)}
function sfx(k){if(!AC)return;switch(k){
  case'good':tone('triangle',660,990,.15,.15);tone('triangle',990,1320,.18,.12,.12);break;case'bad':tone('sawtooth',300,120,.4,.12);break;
  case'beep':tone('square',880,880,.08,.06);break;case'shutter':noise(.8,.25,500);tone('sawtooth',90,60,.8,.05);break;case'door':noise(.3,.08,2000);break;
  case'zap':tone('square',1800,200,.25,.12);noise(.2,.12,4000);break;case'puff':noise(.4,.18,900);break;case'alarm':for(let i=0;i<3;i++)tone('square',900,700,.25,.08,i*.35);break;
  case'reveal':tone('sawtooth',200,50,1.2,.12);noise(1,.08,300);break;case'whisper':noise(.8,.05,400);tone('sine',120,90,.8,.03);break;case'bang':noise(.15,.35,300);tone('square',80,50,.15,.1);break;
  case'heart':tone('sine',70,50,.12,.25);tone('sine',70,50,.12,.2,.18);break;case'power':tone('sawtooth',400,60,.8,.12);break;case'on':tone('triangle',200,600,.4,.1);break;
  case'pick':tone('triangle',520,780,.08,.08);break;case'drink':noise(.3,.06,700);tone('sine',400,500,.2,.05);break;
  case'animal':tone('triangle',500+Math.random()*300,700,.12,.08);tone('triangle',600,450,.15,.06,.15);break;
  case'weird':tone('sawtooth',500,90,.7,.08);tone('triangle',700,1300,.5,.05,.3);break}}
function rainSound(on){if(!AC)return;if(on&&!rainN){const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1600;const g=AC.createGain();g.gain.value=.05;s.connect(f);f.connect(g);g.connect(master);s.start();rainN=s}else if(!on&&rainN){rainN.stop();rainN=null}}

function genCard(){const w=W();const P=w.power;

   <p>지금 전기 사용량 <b>${P.use}</b> / 한도 <b>${P.cap}</b> ${P.out?'<b class="r">— 정전!</b>':''}</p><div class="prog"><b style="width:${clamp(P.use/P.cap*100,0,100)}%;background:${P.use>P.cap?'#ef4444':'#facc15'}"></b></div>

   ${P.out?`<div class="row"><button class="btn" id="gF" type="button">🔧 발전기 고치기</button><button class="btn purple" id="gQ" type="button">❓ 정전 퀴즈 (2문제 맞히면 복구)</button>${w.up.solar&&!P.batUsed?'<button class="btn green" id="gB" type="button">🔋 배터리 비상 전원</button>':''}</div>`:'<p class="g"><b>✅ 발전기가 잘 돌아가고 있어요</b></p>'}
   ${w.up.solar?'<p class="small">🔋 밤에는 태양광 패널이 전기를 못 만들어요. 그래서 낮에 모아 둔 배터리를 써요!</p>':''}`);
  const f=$('gF');if(f)f.onclick=mgGen;const q=$('gQ');if(q)q.onclick=()=>{PQ.ok=0;quizCard('power')};const b=$('gB');if(b)b.onclick=()=>{act({k:'battery'});closeCard()}}

/* ============ 미니게임 ============ */
const MG={on:null};
function stationStart(st){const w=W();const ok=w.animals.some(a=>a.st==='bed'&&a.diag&&a.steps&&a.steps.includes(st));if(!ok){toast(`${STATIONS[st].e} ${STATIONS[st].n}이 필요한 (진찰한) 환자가 없어요`,'warn');return}
  if(w.power.out){toast('⚡ 정전이라 기계가 안 켜져요! 발전실로!','bad');return}act({k:'mgStart',st});({xray:mgXray,heart:mgHeart,surg:mgSurg})[st]()}
function mgEnd(st,ok,id){act({k:'mg',st,ok:ok?1:0,id});sfx(ok?'good':'bad');setTimeout(closeCard,ok?700:1100)}
function mgXray(){const d=W().day;const n=Math.min(7,3+Math.floor(d/3));const seq=[...Array(n)].map(()=>Math.random()*4|0);let inp=[],show=true;const C=['#ef4444','#3b82f6','#22c55e','#facc15'];MG.on='xray';
  openCard(`<div class="mgw"><h2>📷 엑스레이 — 불빛 순서 기억하기</h2><p id="mT">잘 보세요…</p><div class="simon">${C.map((c,i)=>`<button type="button" data-i="${i}" style="background:${c};color:${c}"></button>`).join('')}</div><button class="btn alt sm" data-x type="button">그만두기</button></div>`,{x:()=>act({k:'mg',st:'xray',ok:0})});
  const B=[...ov.querySelectorAll('[data-i]')];const lit=(i,t)=>{B[i].classList.add('lit');tone('triangle',[330,440,550,660][i],[330,440,550,660][i],.2,.1);setTimeout(()=>B[i]&&B[i].classList.remove('lit'),t)};
  seq.forEach((v,k)=>setTimeout(()=>{if(MG.on==='xray')lit(v,380)},500+k*600));setTimeout(()=>{show=false;if($('mT'))$('mT').textContent='이제 같은 순서로 눌러요!'},500+n*600);
  B.forEach(b=>b.onclick=()=>{if(show)return;const i=+b.dataset.i;lit(i,180);inp.push(i);if(seq[inp.length-1]!==i){$('mT').textContent='❌ 순서가 틀렸어요!';show=true;mgEnd('xray',0);return}if(inp.length===seq.length){$('mT').textContent='✅ 엑스레이 완벽해요!';show=true;mgEnd('xray',1)}})}
function mgHeart(){let p=0,t=20,cells=Array(12).fill(0);MG.on='heart';
  openCard(`<div class="mgw"><h2>💓 심장 검사 — 하얀 칸만 눌러요!</h2><p>💀 빨간 해골은 누르면 안 돼요 · <b id="hT">20</b>초</p><div class="prog" style="width:300px"><b id="hP" style="width:0%"></b></div><div class="hgrid">${cells.map((_,i)=>`<button type="button" data-i="${i}"></button>`).join('')}</div><button class="btn alt sm" data-x type="button">그만두기</button></div>`,{x:()=>act({k:'mg',st:'heart',ok:0})});
  const B=[...ov.querySelectorAll('[data-i]')];const draw=()=>B.forEach((b,i)=>{b.className=cells[i]===1?'w':cells[i]===2?'s':'';b.textContent=cells[i]===2?'💀':cells[i]===1?'🤍':''});
  const tick=()=>{cells=cells.map(()=>{const r=Math.random();return r<.22?1:r<.32?2:0});draw()};tick();let acc=0;
  cardTimer=setInterval(()=>{acc+=.1;t-=.1;if($('hT'))$('hT').textContent=Math.ceil(t);if(acc>=.7){acc=0;tick()}if(t<=0){clearInterval(cardTimer);mgEnd('heart',0)}},100);
  B.forEach((b,i)=>b.onclick=()=>{if(cells[i]===1){p+=13;tone('sine',600,900,.08,.07);cells[i]=0}else if(cells[i]===2){p=Math.max(0,p-22);sfx('bad');cells[i]=0}draw();$('hP').style.width=Math.min(100,p)+'%';if(p>=100){clearInterval(cardTimer);mgEnd('heart',1)}})}
function mgSurg(){const extra=MED.filter(k=>k!=='iv').sort(()=>Math.random()-.5);const plan=['iv',extra[0],extra[1],'tri'];const tri=MED.slice().sort(()=>Math.random()-.5).slice(0,3);let step=0,t=45,picked=[];MG.on='surg';
  const lab=s=>s==='tri'?`마지막: ${tri.map(k=>ITEMS[k].e).join(' + ')} 세 가지 함께!`:`${ITEMS[s].e} ${ITEMS[s].n}`;
  openCard(`<div class="mgw"><h2>🔪 수술 — 45초 안에 순서대로!</h2><p>⏱ <b id="sT">45</b>초 · 단계 <b id="sN">1</b>/5</p><p id="sW" style="font-size:20px;font-weight:900"></p><div class="pal">${MED.map(k=>`<button type="button" data-k="${k}">${ITEMS[k].e}<small>${ITEMS[k].n}</small></button>`).join('')}</div><p class="small">순서: ${['iv',extra[0],extra[1]].map(k=>ITEMS[k].e).join(' → ')} → (${tri.map(k=>ITEMS[k].e).join('+')}) → 마무리</p><button class="btn alt sm" data-x type="button">그만두기</button></div>`,{x:()=>act({k:'mg',st:'surg',ok:0})});
  const show=()=>{$('sN').textContent=Math.min(5,step+1);$('sW').textContent=step<4?'필요한 것: '+lab(plan[step]):'✅ 봉합 완료!'};show();
  cardTimer=setInterval(()=>{t-=.2;if($('sT'))$('sT').textContent=Math.ceil(t);if(t<=0){clearInterval(cardTimer);$('sW').textContent='⏰ 시간이 다 됐어요';mgEnd('surg',0)}},200);
  ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(plan[step]==='tri'){if(tri.includes(k)&&!picked.includes(k)){picked.push(k);b.classList.add('pick');sfx('pick');if(picked.length===3){step++;step++;show();clearInterval(cardTimer);mgEnd('surg',1)}}else{t-=5;sfx('bad')}return}
    if(k===plan[step]){step++;sfx('pick');show()}else{t-=5;sfx('bad');$('sW').textContent='❌ 아니에요! (-5초) '+lab(plan[step])}})}
function mgOxy(id){let hits=0,pos=0,dir=1,miss=0;const W0=Math.max(14,30-W().day);const z0=rnd(15,85-W0);MG.on='oxy';act({k:'mgStart',st:'oxy'});
  openCard(`<div class="mgw"><h2>🫧 산소 치료 — 초록 칸에서 누르기!</h2><p>3번 성공하면 숨쉬기가 편해져요 · 성공 <b id="oN">0</b>/3</p><div class="oxy" style="width:320px"><div class="z" style="left:${z0}%;width:${W0}%"></div><div class="k" id="oK"></div></div><button class="btn blue" id="oP" type="button">🫧 지금 펌프!</button><button class="btn alt sm" data-x type="button">그만두기</button></div>`,{x:()=>act({k:'mg',st:'oxy',ok:0,id})});
  cardTimer=setInterval(()=>{pos+=dir*2.2;if(pos>=100||pos<=0)dir*=-1;const k=$('oK');if(k)k.style.left=pos+'%'},30);
  const press=()=>{if(pos>=z0&&pos<=z0+W0){hits++;tone('sine',500,800,.1,.08);$('oN').textContent=hits;if(hits>=3){clearInterval(cardTimer);mgEnd('oxy',1,id)}}else{miss++;sfx('bad');if(miss>=4){clearInterval(cardTimer);mgEnd('oxy',0,id)}}};$('oP').onclick=press;MG.press=press}
function mgGen(){const n=5;const tgt=[...Array(n)].map(()=>Math.random()<.5?1:0);if(tgt.every(v=>!v))tgt[2]=1;let cur=[...Array(n)].map(()=>Math.random()<.5?1:0);let t=ME.cls==='elec'?30:18;MG.on='gen';
  openCard(`<div class="mgw"><h2>🔧 발전기 고치기 — 램프와 똑같이 맞춰요!</h2><p>위 램프처럼 스위치를 켜고 꺼요 · ⏱ <b id="gT">${t}</b>초</p><div class="lamps">${tgt.map(v=>`<i class="${v?'on':''}"></i>`).join('')}</div><div class="sw">${cur.map((v,i)=>`<button type="button" data-i="${i}" class="${v?'on':''}">${v?'ON':'OFF'}</button>`).join('')}</div>${ME.cls==='elec'?'<p class="small">⚡ 전기 기사: 시간이 더 넉넉해요</p>':''}<button class="btn alt sm" data-x type="button">그만두기</button></div>`);
  const B=[...ov.querySelectorAll('[data-i]')];const check=()=>{if(cur.every((v,i)=>v===tgt[i])){clearInterval(cardTimer);act({k:'gen',ok:1});sfx('on');setTimeout(closeCard,600)}};
  B.forEach((b,i)=>b.onclick=()=>{cur[i]^=1;b.className=cur[i]?'on':'';b.textContent=cur[i]?'ON':'OFF';tone('square',300,300,.04,.05);check()});
  cardTimer=setInterval(()=>{t-=.2;if($('gT'))$('gT').textContent=Math.ceil(t);if(t<=0){clearInterval(cardTimer);toast('🔧 다시 해 봐요!','bad');closeCard()}},200)}

/* ============ ❓ 에너지 퀴즈 (자판기 · 정전 퀴즈) ============ */
const ABC=['①','②','③','④'];const QZS=Object.assign({n:0,ok:0,seen:[]},store.get('quiz',{}));const PQ={ok:0};
function quizCard(mode){const pool=QB.map((_,i)=>i).filter(i=>!QZS.seen.includes(i));const qi=pool.length?pick(pool):Math.random()*QB.length|0;const Q=QB[qi];let done=false;const pw=mode==='power';
  if(pw&&!W().power.out){closeCard();return}
  openCard(`<div class="hd"><h2>${pw?'⚡ 정전 퀴즈':'❓ 에너지 퀴즈'}</h2><button class="x" type="button" data-x aria-label="닫기">✕</button></div><p class="small">${esc(Q.k)} · ${pw?`2문제를 맞히면 전기가 돌아와요! (맞힌 문제 ${PQ.ok}/2)`:'맞히면 🧠 정신력 +25 · 💰+3'}</p><p class="qq">${esc(Q.q)}</p><div class="qa">${Q.a.map((a,i)=>`<button type="button" data-i="${i}"><b>${ABC[i]}</b> ${esc(a)}</button>`).join('')}</div><div id="qR"></div>`);
  const ans=i=>{if(done)return;done=true;QUIZ.ans=null;const ok=i===Q.c;QZS.n++;if(ok)QZS.ok++;if(!QZS.seen.includes(qi))QZS.seen.push(qi);store.set('quiz',QZS);
    ov.querySelectorAll('[data-i]').forEach(b=>{const n=+b.dataset.i;b.disabled=true;if(n===Q.c)b.classList.add('ok');else if(n===i)b.classList.add('no')});
    if(pw){if(ok)PQ.ok++;const fin=PQ.ok>=2;$('qR').innerHTML=`<div class="note"><b class="${ok?'g':'r'}">${ok?'⭕ 정답!':'❌ 정답은 '+ABC[Q.c]}</b> ${esc(Q.x)}</div><div class="row"><button class="btn ${fin?'green':''}" id="qN" type="button">${fin?'⚡ 전기 다시 켜기!':'다음 문제 ▶'}</button></div>`;sfx(ok?'good':'bad');
      $('qN').onclick=()=>{if(fin){act({k:'gen',ok:1});act({k:'quiz',ok:1});sfx('on');closeCard()}else quizCard('power')};return}
    ME.quizCD=ok?20:30;$('qR').innerHTML=`<div class="note"><b class="${ok?'g':'r'}">${ok?'⭕ 정답! 마음이 편해져요 🧠+25':'❌ 정답은 '+ABC[Q.c]}</b> ${esc(Q.x)}</div>`;if(ok){setSan(ME.san+25);act({k:'quiz',ok:1});sfx('good')}else sfx('bad')};
  ov.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>ans(+b.dataset.i));QUIZ.ans=ans}
const QUIZ={ans:null};
