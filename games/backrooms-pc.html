<style>
:root{--bg:#0e0d0a;--ink:#1f1a10;--paper:#fffaf0;--paper2:#f3ecd9;--muted:#6b6250;--acc:#e8c547;--good:#22c55e;--bad:#ef4444;--f:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--f);color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 85%,rgba(0,0,0,.85) 100%);z-index:2}
#noise{position:fixed;inset:-50%;pointer-events:none;opacity:0;z-index:3;background-size:160px 160px;mix-blend-mode:screen}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.panel{background:rgba(14,12,8,.72);border:1px solid rgba(232,197,71,.25);border-radius:14px;padding:10px 12px;backdrop-filter:blur(4px)}
#top{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);text-align:center;min-width:min(560px,92vw)}
#lvT{font-size:13px;color:var(--acc);letter-spacing:.08em}#objT{font-size:16px;font-weight:700;margin-top:3px;line-height:1.35}
#bars{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:230px;display:grid;gap:6px;font-size:12.5px}
.bar{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:6px}.bar i{display:block;height:9px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.bar i b{display:block;height:100%;border-radius:9px;transition:width .2s}
#sideR{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));font-size:12.5px;display:grid;gap:4px;text-align:right}
#prompt{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);font-size:15px;text-align:center}#prompt kbd{display:inline-block;background:var(--acc);color:#111;border-radius:6px;padding:1px 7px;margin-right:6px;font-weight:800;font-family:inherit}
#hold{position:fixed;left:50%;bottom:calc(22% - 18px);transform:translateX(-50%);width:180px;height:7px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden}#hold b{display:block;height:100%;width:0;background:var(--acc)}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.55);z-index:4;pointer-events:none}
#toast{position:fixed;left:50%;top:92px;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;z-index:8;pointer-events:none;width:min(600px,94vw)}
.toast{background:rgba(14,12,8,.85);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 14px;font-size:14.5px;text-align:center;animation:tin .25s}.toast.good{border-color:var(--good)}.toast.bad{border-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-size:clamp(26px,5vw,46px);font-weight:900;text-align:center;opacity:0;transition:opacity .5s;z-index:7;pointer-events:none;text-shadow:0 4px 18px rgba(0,0,0,.8)}#banner small{display:block;font-size:16px;font-weight:600;margin-top:6px;color:#f3e7b8}
#scare{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);pointer-events:none}#scare canvas{width:min(70vw,70vh);height:min(70vw,70vh)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:15;transition:opacity .35s}
#ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(5,4,2,.6);padding:14px}
#ov[hidden]{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:20px;padding:20px;width:min(760px,96vw);max-height:92vh;overflow:auto;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}.card.narrow{width:min(470px,96vw)}
.card h1{margin:0;font-size:32px}.card h2{margin:0;font-size:22px}.card h3{margin:4px 0 0;font-size:16px}.card p{margin:0;line-height:1.55}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.x{border:0;background:var(--paper2);border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer}
.btn{border:0;border-radius:12px;padding:11px 18px;font-size:16px;font-weight:700;background:#c9a227;color:#1b1406;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #8a6b12}.btn.alt{background:var(--paper2);color:var(--ink);box-shadow:0 3px 0 #cfc5a6}.btn.blue{background:#2563eb;color:#fff;box-shadow:0 3px 0 #1e3a8a}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.inp{border:2px solid #d8cfb4;border-radius:12px;padding:10px 12px;font-size:16px;font-family:inherit;background:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:2px solid #d8cfb4;background:#fff;border-radius:12px;padding:8px 12px;font-size:14.5px;cursor:pointer;font-family:inherit}.seg button[aria-pressed=true]{border-color:#c9a227;background:#fff4c8;font-weight:700}
.note{border-radius:12px;padding:10px 12px;background:#f1ead2;font-size:14.5px;line-height:1.55}.note.good{background:#dcfce7}.note.bad{background:#fee2e2}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.box{background:var(--paper2);border-radius:12px;padding:10px 12px}.box ul{margin:6px 0 0;padding-left:18px;line-height:1.55;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:8px;justify-content:center}.pad button{height:58px;font-size:24px;font-weight:800;border-radius:12px;border:0;background:#e9e2cb;cursor:pointer;font-family:inherit}
.code{font-size:40px;letter-spacing:14px;text-align:center;font-weight:900;font-family:ui-monospace,monospace;background:#1b1a14;color:#7cff8a;border-radius:12px;padding:8px}
.wires{display:grid;grid-template-columns:1fr 1fr;gap:40px;position:relative;padding:6px 10px}.wcol{display:grid;gap:14px}.wn{height:46px;border-radius:12px;border:3px solid #333;cursor:pointer;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;background:#fff}.wn.sel{outline:4px solid #f59e0b}.wn.done{opacity:.55}
#wsvg{position:absolute;inset:0;pointer-events:none}
#chatLog{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:150px;width:min(360px,70vw);display:grid;gap:4px;font-size:14px;z-index:6;pointer-events:none;opacity:0;transition:opacity .4s}#chatLog.show{opacity:1}#chatLog .cm{background:rgba(0,0,0,.55);border-radius:8px;padding:4px 8px}#chatLog .cm b{color:var(--acc)}#chatLog .cm.me b{color:#7dd3fc}
#chatBar[hidden],#hold[hidden],#prompt[hidden]{display:none}
#chatBar{position:fixed;z-index:31;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 120px);width:min(560px,92vw);display:grid;gap:6px}#chatBar .qk{display:flex;flex-wrap:wrap;gap:5px}#chatBar .qb{border:0;border-radius:999px;padding:5px 11px;background:rgba(255,255,255,.92);color:#111;font-size:13.5px}
#chatBar form{display:flex;gap:6px}#chatBar input{flex:1;border:0;border-radius:12px;padding:10px 12px;font-size:16px}
#net{font-size:12.5px}
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}#touch[hidden]{display:none}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(110px,calc(env(safe-area-inset-bottom) + 100px));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none}#knob{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.45)}
#tbtns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,64px);gap:8px;pointer-events:auto}
.tb{height:56px;border-radius:14px;border:0;background:rgba(255,255,255,.82);color:#111;font-size:14px;font-weight:700;font-family:inherit;touch-action:none}.tb.on{background:var(--acc)}
#lockHint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font-size:13px;opacity:.8;z-index:5}
@media (max-width:640px){.cols{grid-template-columns:1fr}#bars{width:180px}#objT{font-size:14px}}

<script>/* ===== 민왕게임월드 온라인 연결 도우미 v2 =====

(function(){

 {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}];
var TOPIC='mwgame/v2/';
function rid(n){var s='',c='abcdefghijkmnpqrstuvwxyz23456789';for(var i=0;i<(n||10);i++)s+=c[Math.random()*c.length|0];return s}
function Em(){this._h={}}
Em.prototype.on=function(e,f){(this._h[e]=this._h[e]||[]).push(f);return this};
Em.prototype.off=function(e,f){var a=this._h[e];if(a){var i=a.indexOf(f);if(i>=0)a.splice(i,1)}return this};
Em.prototype.emit=function(e){var a=(this._h[e]||[]).slice(),args=[].slice.call(arguments,1);for(var i=0;i<a.length;i++){try{a[i].apply(this,args)}catch(err){console.error(err)}}};
function inherit(C){C.prototype=Object.create(Em.prototype);C.prototype.constructor=C}

/* ---------- 아주 작은 MQTT 3.1.1 (웹소켓) ---------- */
var te=new TextEncoder(),td=new TextDecoder();
function str(s){var b=te.encode(s);var o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o}
function cat(arr){var n=0,i;for(i=0;i<arr.length;i++)n+=arr[i].length;var o=new Uint8Array(n),p=0;for(i=0;i<arr.length;i++){o.set(arr[i],p);p+=arr[i].length}return o}
function pkt(h,body){var len=body.length,lb=[];do{var d=len%128;len=Math.floor(len/128);if(len>0)d|=128;lb.push(d)}while(len>0);return cat([new Uint8Array([h].concat(lb)),body])}
function Mqtt(clientId){Em.call(this);this.cid=clientId;this.bi=0;this.ok=false;this.subs=[];this.buf=new Uint8Array(0);this.pid=1;this.dead=false;this._go()}
inherit(Mqtt);
Mqtt.prototype._go=function(){var self=this;if(this.dead)return;if(this.bi>=BROKERS.length){this.emit('fail');return}
  var url=BROKERS[this.bi],ws,done=false;try{ws=new WebSocket(url,'mqtt')}catch(e){this.bi++;return this._go()}
  ws.binaryType='arraybuffer';this.ws=ws;
  var to=setTimeout(function(){if(!done){done=true;try{ws.close()}catch(e){}self.bi++;self._go()}},6000);
  ws.onopen=function(){var body=cat([str('MQTT'),new Uint8Array([4,2,0,40]),str(self.cid)]);ws.send(pkt(0x10,body))};
  ws.onmessage=function(ev){self._rx(new Uint8Array(ev.data),function(){if(!done){done=true;clearTimeout(to)}})};
  ws.onerror=function(){};
  ws.onclose=function(){clearTimeout(to);var was=self.ok;self.ok=false;clearInterval(self.pt);if(self.dead)return;if(!done){done=true;self.bi++;self._go();return}
    if(was){self.emit('down');setTimeout(function(){if(!self.dead){self.bi=0;self._go()}},1500)}}};
Mqtt.prototype._rx=function(chunk,onConn){var b=cat([this.buf,chunk]);var p=0;
  while(p<b.length){var h=b[p],mul=1,len=0,q=p+1,d;do{if(q>=b.length){this.buf=b.slice(p);return}d=b[q++];len+=(d&127)*mul;mul*=128}while(d&128);
    if(q+len>b.length){this.buf=b.slice(p);return}var body=b.subarray(q,q+len);p=q+len;var t=h>>4;
    if(t===2){if(body[1]===0){onConn();var first=!this.everOk;this.ok=true;this.everOk=true;var self=this;this.pt=setInterval(function(){try{self.ws.send(new Uint8Array([0xC0,0]))}catch(e){}},20000);for(var i=0;i<this.subs.length;i++)this._sub(this.subs[i]);this.emit(first?'ready':'up')}else{try{this.ws.close()}catch(e){}}}
    else if(t===3){var tl=(body[0]<<8)|body[1];var topic=td.decode(body.subarray(2,2+tl));var off=2+tl+((h>>1)&3?2:0);this.emit('msg',topic,td.decode(body.subarray(off)))}}
  this.buf=new Uint8Array(0)};
Mqtt.prototype._sub=function(t){var id=this.pid++&65535||1;this.ws.send(pkt(0x82,cat([new Uint8Array([id>>8,id&255]),str(t),new Uint8Array([0])])))};
Mqtt.prototype.sub=function(t){this.subs.push(t);if(this.ok)this._sub(t)};
Mqtt.prototype.pub=function(t,s){if(!this.ok)return false;try{this.ws.send(pkt(0x30,cat([str(t),te.encode(s)])));return true}catch(e){return false}};
Mqtt.prototype.close=function(){this.dead=true;clearInterval(this.pt);try{this.ws.send(new Uint8Array([0xE0,0]));this.ws.close()}catch(e){}};

/* ---------- 연결 하나 (PeerJS 또는 MQTT를 감싸요) ---------- */
function Conn(peer,remote){Em.call(this);this.peer=remote;this.open=false;this.reliable=true;this._p=peer;this._k=null;this._rc=null;this.closed=false;this.via=''}
inherit(Conn);
Conn.prototype.send=function(d){if(!this.open||this.closed)return;if(this._rc){try{this._rc.send(d)}catch(e){}}else if(this._k){this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'d',c:this._k,f:this._p.id,d:d}));this._tx=Date.now()}};
Conn.prototype.close=function(){if(this.closed)return;this.closed=true;var was=this.open;this.open=false;if(this._rc){try{this._rc.close()}catch(e){}}if(this._k){this._p._mq&&this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'fin',c:this._k,f:this._p.id}));delete this._p._mc[this._k]}clearInterval(this._ka);if(was)this.emit('close')};
Conn.prototype._useReal=function(rc){var self=this;this._rc=rc;this.via='webrtc';
  rc.on('data',function(d){self.emit('data',d)});rc.on('close',function(){if(!self.closed){self.closed=true;self.open=false;self.emit('close')}});rc.on('error',function(e){self.emit('error',e)})};
Conn.prototype._setOpen=function(){var self=this;if(this.open||this.closed)return;this.open=true;setTimeout(function(){self.emit('open')},0)};
Conn.prototype._useMq=function(k){var self=this;this._k=k;this.via='relay';this._rx=Date.now();this._p._mc[k]=this;
  this._ka=setInterval(function(){if(!self.open)return;if(Date.now()-(self._tx||0)>3000)self._p._mq.pub(TOPIC+self.peer,JSON.stringify({t:'png',c:k,f:self._p.id}));if(Date.now()-self._rx>16000){self.close()}},2000)};

/* ---------- Peer 대신 쓰는 SmartPeer ---------- */
function SmartPeer(id,opts){if(!(this instanceof SmartPeer))return new SmartPeer(id,opts);Em.call(this);var self=this;
  if(id&&typeof id==='object'){opts=id;id=undefined}
  this.id=id||('g'+rid(11));this.isHost=!!id;this.opts=opts||{};this.destroyed=false;this.open=false;this._mc={};this._openSent=false;this._rpOpen=false;this._mqReady=false;
  // 1) PeerJS
  if(RealPeer){try{var o={};for(var k in this.opts)o[k]=this.opts[k];o.config=o.config||{iceServers:ICE};
    this._rp=new RealPeer(this.id,o);
    this._rp.on('open',function(){self._rpOpen=true;self._open()});
    this._rp.on('connection',function(rc){var c=new Conn(self,rc.peer);rc.on('open',function(){if(c.closed)return;c._useReal(rc);c._setOpen();self.emit('connection',c)})});
    this._rp.on('error',function(e){var t=e&&e.type;if(t==='unavailable-id'){self.emit('error',e);return}if(t==='peer-unavailable'){var m=/peer\s+(\S+)/i.exec(e.message||'');self.emit('_pu',m?m[1]:'');return}self._rpBad=true;if(!self._rpOpen)self._maybeOpen()});
    this._rp.on('disconnected',function(){if(!self.destroyed){try{self._rp.reconnect()}catch(e){}}});
  }catch(e){this._rp=null;this._rpBad=true}}else this._rpBad=true;
  // 2) MQTT 중계 (항상 함께 켜 둬요)
  this._mq=new Mqtt('mw'+rid(12));
  this._mq.on('ready',function(){self._mqReady=true;self._maybeOpen()});
  this._mq.on('fail',function(){self._mqBad=true;if(!self._openSent&&(self._rpBad||!RealPeer))self.emit('error',{type:'network',message:'연결 서버에 닿지 못했어요'})});
  this._mq.on('msg',function(t,s){self._onMsg(s)});
  this._mq.sub(TOPIC+this.id);
  setTimeout(function(){self._waited=true;self._maybeOpen()},3500)}
inherit(SmartPeer);
SmartPeer.prototype._maybeOpen=function(){if(this._openSent||this.destroyed)return;if(this._rpOpen)return this._open();if(this._mqReady&&(this._waited||this._rpBad))this._open()};
SmartPeer.prototype._open=function(){if(this._openSent||this.destroyed)return;this._openSent=true;this.open=true;var self=this;setTimeout(function(){self.emit('open',self.id)},0)};
SmartPeer.prototype._onMsg=function(s){var m;try{m=JSON.parse(s)}catch(e){return}if(!m||!m.c)return;var c=this._mc[m.c];
  if(m.t==='syn'){if(!this.isHost&&!this._acceptAll)return;if(!c){c=new Conn(this,String(m.f));c._useMq(m.c);c._setOpen();this.emit('connection',c)}c._rx=Date.now();this._mq.pub(TOPIC+m.f,JSON.stringify({t:'ack',c:m.c,f:this.id}));return}
  if(!c)return;c._rx=Date.now();
  if(m.t==='ack'){if(c._wait){c._wait=false;clearInterval(c._synT);c._setOpen()}}
  else if(m.t==='d'){if(c.open)c.emit('data',m.d)}
  else if(m.t==='fin'){if(!c.closed){c.closed=true;var was=c.open;c.open=false;clearInterval(c._ka);delete this._mc[m.c];if(was)c.emit('close')}}};
SmartPeer.prototype.connect=function(remote,opts){var self=this,c=new Conn(this,remote);var fellBack=false;
  function relay(){if(fellBack||c.closed||c.open)return;fellBack=true;
    var go=function(){var k=rid(12);c._useMq(k);c._wait=true;var n=0;var syn=function(){if(!c._wait||c.closed){clearInterval(c._synT);return}if(++n>8){clearInterval(c._synT);c._wait=false;c.closed=true;self.emit('error',{type:'peer-unavailable',message:'Could not connect to peer '+remote});c.emit('error',{type:'peer-unavailable'});return}self._mq.pub(TOPIC+remote,JSON.stringify({t:'syn',c:k,f:self.id}))};syn();c._synT=setInterval(syn,1300)};
    if(self._mqReady)go();else{var w=setInterval(function(){if(self._mqReady){clearInterval(w);go()}else if(self._mqBad){clearInterval(w);self.emit('error',{type:'network'})}},300)}}
  if(this._rp&&this._rpOpen&&!this._rpBad){try{var rc=this._rp.connect(remote,opts||{reliable:true});
      rc.on('open',function(){if(c.open||c.closed){try{rc.close()}catch(e){}return}if(fellBack){if(c._wait){c._wait=false;clearInterval(c._synT);if(c._k)delete self._mc[c._k];clearInterval(c._ka);c._k=null}else{try{rc.close()}catch(e){}return}}c._useReal(rc);c._setOpen()});
      var pu=function(who){if(!who||who===remote)relay()};this.on('_pu',pu);
      setTimeout(relay,7000)}catch(e){relay()}}
  else relay();
  return c};
SmartPeer.prototype.destroy=function(){if(this.destroyed)return;this.destroyed=true;for(var k in this._mc){try{this._mc[k].close()}catch(e){}}if(this._rp){try{this._rp.destroy()}catch(e){}}if(this._mq)this._mq.close();this.emit('close')};
SmartPeer.prototype.disconnect=function(){this.destroy()};
SmartPeer.prototype.reconnect=function(){};
window.Peer=SmartPeer;window.MWG_RealPeer=RealPeer;
})();

<script>
/* ============ 기본 ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const V3=THREE.Vector3;

/* ============ 레벨 정의 ============ */
const LV=[
  {n:'레벨 0 · 노란 로비',type:'maze',N:29,open:.42,rooms:7,fog:0x8f7f3e,fogD:.05,amb:0xfff0c0,ambI:.42,light:0xffe9b0,lightI:1.05,lightD:11,panelCol:0xfff6d5,every:2,offP:.12,flickP:.12,ent:'smiler',puz:'fuse',wall:'paper',floor:'carpet',ceil:'tiles',hum:1},
  {n:'레벨 1 · 버려진 창고',type:'open',N:27,fog:0x2e3238,fogD:.048,amb:0xd7e6ff,ambI:.26,light:0xd7ecff,lightI:1.1,lightD:12,panelCol:0xe0f2ff,every:3,offP:.25,flickP:.18,ent:'ghost',puz:'code',wall:'concrete',floor:'pconcrete',ceil:'dark',hum:.6},
  {n:'레벨 2 · 파이프 통로',type:'maze',N:27,open:.18,rooms:3,fog:0x140c0a,fogD:.075,amb:0xffc4b0,ambI:.12,light:0xff5a3c,lightI:1.2,lightD:9,panelCol:0xff6a4a,every:4,offP:.3,flickP:.25,ent:'blob',puz:'wire',wall:'pipe',floor:'grate',ceil:'dark',hum:.35,pipes:1}];
const MEMOS=['⚡ 퓨즈는 전기가 너무 많이 흐르면 스스로 끊어져서, 불이 나지 않게 막아 줘요.','💡 형광등은 백열등보다 전기를 적게 써요. LED 전등은 그보다 더 적게 써요!','🔌 전기가 흐르려면 전지·전선·전구가 끊김 없이 이어진 길, 곧 <b>전기 회로</b>가 필요해요.','⚙️ 발전기는 돌리는 힘(운동 에너지)을 <b>전기 에너지</b>로 바꿔요.','☀️ 태양광 · 🌬️ 풍력 · 💧 수력은 다시 채워지는 <b>재생에너지</b>예요.','🛢️ 석유·석탄 같은 화석 연료는 쓰면 언젠가 바닥나고, 탄소를 많이 내보내요.','🔋 배터리는 화학 에너지를 전기 에너지로 바꿔 모아 둬요.','🏠 쓰지 않는 플러그를 뽑으면 새어 나가는 대기 전력을 아낄 수 있어요.'];
const SWK={sun:{e:'☀️',n:'태양광'},wind:{e:'🌬️',n:'풍력'},water:{e:'💧',n:'수력'}};

/* ============ 레벨 생성 ============ */
let L=null;// 현재 레벨 데이터
function genLevel(lv,seed){const D=LV[lv],R=mulberry(seed),N=D.N,g=new Uint8Array(N*N).fill(1);const at=(x,z)=>x<0||z<0||x>=N||z>=N?1:g[z*N+x],set=(x,z,v)=>{g[z*N+x]=v};
  if(D.type==='open'){for(let z=1;z<N-1;z++)for(let x=1;x<N-1;x++)set(x,z,0);
    for(let z=3;z<N-2;z+=4)for(let x=3;x<N-2;x+=4)if(R()<.85)set(x,z,1);
    for(let k=0;k<20;k++){const hz=R()<.5,len=3+(R()*5|0),x0=2+(R()*(N-4)|0),z0=2+(R()*(N-4)|0);for(let i=0;i<len;i++){const x=hz?x0+i:x0,z=hz?z0:z0+i;if(x>0&&z>0&&x<N-1&&z<N-1)set(x,z,1)}}
    for(let k=0;k<26;k++){const x=1+(R()*(N-2)|0),z=1+(R()*(N-2)|0);if(at(x,z)===0&&x+z>4)set(x,z,2)}}
  else{set(1,1,0);const st=[[1,1]];while(st.length){const [x,z]=st[st.length-1];const d=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dz])=>{const nx=x+dx,nz=z+dz;return nx>0&&nz>0&&nx<N-1&&nz<N-1&&at(nx,nz)===1});if(!d.length){st.pop();continue}const [dx,dz]=d[R()*d.length|0];set(x+dx/2,z+dz/2,0);set(x+dx,z+dz,0);st.push([x+dx,z+dz])}
    for(let z=1;z<N-1;z++)for(let x=1;x<N-1;x++)if(at(x,z)===1&&R()<D.open){const h=at(x-1,z)===0&&at(x+1,z)===0,v=at(x,z-1)===0&&at(x,z+1)===0;if(h!==v)set(x,z,0)}
    for(let k=0;k<D.rooms;k++){const w=2+(R()*3|0),h=2+(R()*3|0),x0=1+(R()*(N-2-w)|0),z0=1+(R()*(N-2-h)|0);for(let z=z0;z<z0+h;z++)for(let x=x0;x<x0+w;x++)set(x,z,0)}}
  set(1,1,0);set(2,1,0);set(1,2,0);
  const bfs=()=>{const d=new Int16Array(N*N).fill(-1),q=[1+N];d[1+N]=0;for(let i=0;i<q.length;i++){const c=q[i],x=c%N,z=c/N|0;for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=(z+dz)*N+x+dx;if(at(x+dx,z+dz)===0&&d[n]<0){d[n]=d[c]+1;q.push(n)}}}return d};
  let dist=bfs();for(let i=0;i<N*N;i++)if(g[i]===0&&dist[i]<0)g[i]=1;
  // 출구: 가장 먼 칸, 막다른 곳으로
  let ex=0;for(let i=0;i<N*N;i++)if(dist[i]>dist[ex])ex=i;const exX=ex%N,exZ=ex/N|0;let pre=null;
  for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=(exZ+dz)*N+exX+dx;if(at(exX+dx,exZ+dz)===0&&dist[n]===dist[ex]-1&&!pre)pre=[exX+dx,exZ+dz,dx,dz]}
  for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){if(pre&&exX+dx===pre[0]&&exZ+dz===pre[1])continue;const x=exX+dx,z=exZ+dz;if(x>0&&z>0&&x<N-1&&z<N-1&&at(x,z)!==1)set(x,z,1)}
  dist=bfs();for(let i=0;i<N*N;i++)if(g[i]===0&&dist[i]<0)g[i]=1;
  const maxD=dist[ex];const used=new Set([ex,1+N,2+N,1+2*N]);const objs=[];let oid=1;
