<title>탄소 제로 비행단</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 가운데 세로 비행 화면(480×720 비율), 그 위에 얇은 상태 표시, 휴대폰은 화면을 끌어서 조종 */
:root{
  color-scheme:dark;
  --night:#0b1220; --ink:#1d2939; --muted:#5d6b7c; --paper:#ffffff; --paper2:#f1f5f9; --line:#d6dee8;
  --leaf:#22a065; --leaf-soft:#dcf5e8; --alarm:#ef4444; --alarm-soft:#fde2e2; --sun:#ffc83d; --sky:#3e7bfa;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--night)}
body{margin:0;overflow:hidden;font-family:var(--f-body);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#hud{position:fixed;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none;padding:8px}
.chip{background:rgba(255,255,255,.9);border-radius:10px;padding:4px 9px;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip b{font-family:var(--f-display);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums}
.gauge{width:70px;height:9px;border-radius:5px;background:#dde5ee;overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,#62c48a,#ffc83d 55%,#ef4444);transition:width .3s}
.spacer{flex:1}
.hb{pointer-events:auto;border:0;background:rgba(255,255,255,.9);border-radius:10px;padding:5px 10px;font-size:12.5px}
#pad{position:fixed;z-index:5;display:flex;gap:12px;align-items:center;pointer-events:none}
#pad button{pointer-events:auto;border:0;border-radius:50%;color:#fff;font-family:var(--f-display);line-height:1.1;touch-action:none}
#pad button small{display:block;font-family:var(--f-body);font-size:11px}
#pad button:disabled{opacity:.4}
#pad button.on{transform:translateY(3px)}
#fireBtn{width:96px;height:96px;font-size:22px;background:rgba(239,68,68,.92);box-shadow:0 5px 0 #7f1d1d}
#mslBtn{width:66px;height:66px;font-size:15px;background:rgba(62,123,250,.92);box-shadow:0 4px 0 #1e3a8a}
#bombBtn{width:66px;height:66px;font-size:14px;background:rgba(34,160,101,.92);box-shadow:0 4px 0 #14532d}
#toast{position:fixed;z-index:6;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.toast{background:rgba(15,23,42,.9);color:#fff;border-radius:10px;padding:6px 12px;font-size:13.5px;text-align:center;animation:tin .25s;max-width:100%}
.toast.bad{background:rgba(185,28,28,.94)}.toast.good{background:rgba(21,128,61,.94)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

#ov{position:fixed;inset:0;z-index:20;background:rgba(6,10,20,.72);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);border-radius:22px;width:min(600px,100%);max-height:100%;overflow:auto;padding:22px;display:grid;gap:12px}
.card.wide{width:min(840px,100%)}
.card h1,.card h2,.card h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.card h1{font-size:clamp(32px,7vw,50px);line-height:1.05}
.card h2{font-size:25px}.card h3{font-size:18px}
.card p{margin:0;line-height:1.65}
.eyebrow{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.btn{font-family:var(--f-display);font-size:19px;border:0;border-radius:14px;padding:11px 20px;background:var(--sky);color:#fff}
.btn.alt{background:var(--paper2);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.box{background:var(--paper2);border-radius:14px;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.box ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px;line-height:1.55}
.box.tip{background:#fff6d6}
.wpn{display:grid;gap:6px}
.wpn div{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;font-size:13.5px;line-height:1.45}
.wpn canvas{width:34px;height:34px}
.wpn b{font-weight:400;font-family:var(--f-display);font-size:15px}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px;font-size:13.5px}
.keys div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0}
.keys kbd{font-family:var(--f-display);color:var(--sky)}
.choice{text-align:left;background:var(--paper2);border:2px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px}
.choice:hover:not(:disabled){border-color:var(--sky)}
.choice.right{border-color:var(--leaf);background:var(--leaf-soft)}
.choice.wrong{border-color:var(--alarm);background:var(--alarm-soft)}
.note{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6}
.note.good{background:var(--leaf-soft)}.note.bad{background:var(--alarm-soft)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--paper2);border-radius:12px;padding:10px;display:grid;gap:2px;text-align:center}
.stats b{font-family:var(--f-display);font-weight:400;font-size:24px}
.stats small{font-size:12px;color:var(--muted)}
.stars{font-size:42px;letter-spacing:6px;color:var(--sun);text-align:center}
.stars .off{color:var(--line)}
@media (max-width:640px){.cols,.keys{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:18px}.chip{font-size:12px;padding:3px 7px}.chip b{font-size:14px}.gauge{width:48px}}
@media (hover:hover) and (pointer:fine){#pad{display:none}}
#autoBtn.on{background:#fde047}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<canvas id="game" aria-label="비행 화면"></canvas>
<div id="hud">
  <div class="chip" id="stName">1단계</div>
  <div class="chip">점수 <b id="score">0</b></div>
  <div class="chip"><span id="lives" style="color:#ef4444">♥♥♥♥♥</span> <span id="bombs">🌳🌳</span></div>
  <div class="chip" id="wpn">태양 Lv1</div>
  <div class="chip">탄소 <span class="gauge"><i id="co2"></i></span></div>
  <div class="chip" id="msl">미사일 준비</div>
  <span class="spacer"></span>
  <button class="hb" id="autoBtn" type="button" aria-pressed="false">자동 쏘기 끔</button>
  <button class="hb" id="helpBtn" type="button">게임 방법</button>
  <button class="hb" id="pauseBtn" type="button">일시정지</button>
</div>
<div id="pad"><button id="mslBtn" type="button" aria-label="유도 미사일">미사일<small id="mslN">준비</small></button><button id="fireBtn" type="button" aria-label="쏘기">쏘기</button><button id="bombBtn" type="button" aria-label="나무 폭탄">나무<br>폭탄<small id="bombN">2개</small></button></div>
<div id="toast" aria-live="polite"></div>
<div id="ov"></div>

<script>
/* ============ 기본 ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const W=480,H=720;
const dist2=(a,b)=>(a.x-b.x)**2+(a.y-b.y)**2;

/* ============ 에너지 무기 ============ */
const WPN={
  sun:{n:'태양',c:'#ffc83d',tip:'햇빛은 사방으로 퍼져요. 태양 무기는 부채꼴로 넓게 쏴요.',fact:'태양광은 햇빛을 받은 태양 전지가 바로 전기를 만들어요.'},
  wind:{n:'바람',c:'#e2e8f0',tip:'바람은 빠르고 멈추지 않아요. 바람 무기는 적을 뚫고 지나가요.',fact:'풍력은 바람이 날개를 돌려 전기를 만들어요.'},
  hydro:{n:'물',c:'#38bdf8',tip:'물은 낮은 곳을 찾아 흘러가요. 물 무기는 적을 따라가요.',fact:'수력은 높은 곳에서 떨어지는 물의 힘으로 발전해요.'},
  geo:{n:'지열',c:'#f97316',tip:'땅속 열은 아주 뜨겁고 강해요. 지열 무기는 느리지만 아주 세요.',fact:'지열은 땅속 깊은 곳의 뜨거운 열을 이용해요. 날씨와 상관없이 일정해요.'},
  bio:{n:'바이오',c:'#22a065',tip:'버려지는 생물 자원을 다시 써요. 바이오 무기는 빙글빙글 돌며 주변을 지켜요.',fact:'바이오 에너지는 볏짚, 가축 분뇨 같은 생물 자원을 연료로 써요.'}
};
const WKEYS=Object.keys(WPN);
const QUIZ=[
  {q:'석탄, 석유, 천연가스처럼 아주 오래전 생물이 땅속에 묻혀 만들어진 연료는?',a:['화석 연료','재생에너지','바이오에너지'],c:0,e:'오래전 생물이 땅속에서 오랜 시간 열과 압력을 받아 만들어져서 화석 연료라고 해요.'},
  {q:'화석 연료를 계속 쓰면 언젠가 바닥나는 까닭은?',a:['매장량이 정해져 있어서','너무 무거워서','물에 녹아서'],c:0,e:'화석 연료는 만들어지는 데 아주 오래 걸려서 쓰는 만큼 다시 채워지지 않아요.'},
  {q:'화석 연료를 태울 때 많이 나와 지구 온난화를 일으키는 기체는?',a:['산소','이산화 탄소','질소'],c:1,e:'이산화 탄소 같은 온실가스가 많아지면 지구의 열이 빠져나가지 못해 기온이 올라가요.'},
  {q:'다음 중 재생에너지가 아닌 것은?',a:['햇빛','바람','석유'],c:2,e:'석유는 화석 연료예요. 햇빛, 바람, 물, 지열처럼 다시 채워지는 에너지가 재생에너지예요.'},
  {q:'풍력 발전기는 무엇의 힘으로 전기를 만들까요?',a:['땅속의 열','바람','떨어지는 물'],c:1,e:'바람이 커다란 날개를 돌리면 연결된 발전기가 돌면서 전기가 만들어져요.'},
  {q:'높은 곳에서 떨어지는 물의 힘으로 발전기를 돌리는 발전은?',a:['수력 발전','지열 발전','태양광 발전'],c:0,e:'물이 떨어지는 힘으로 발전기를 돌리는 것이 수력 발전이에요.'},
  {q:'땅속 깊은 곳의 뜨거운 열을 이용하는 에너지는?',a:['풍력 에너지','바이오 에너지','지열 에너지'],c:2,e:'지구 내부의 뜨거운 열로 난방을 하거나 전기를 만드는 것이 지열 에너지예요.'},
  {q:'볏짚이나 가축 분뇨 같은 생물 자원을 연료로 쓰는 에너지는?',a:['수력 에너지','바이오 에너지','태양열 에너지'],c:1,e:'생물 자원(바이오매스)을 연료로 쓰는 것이 바이오 에너지예요.'},
  {q:'밤이나 흐린 날 태양광 발전이 줄어드는 까닭은?',a:['바람이 없어서','햇빛이 약해서','물이 부족해서'],c:1,e:'태양광은 햇빛으로 전기를 만들어서 햇빛이 약하면 전기도 줄어요. 그래서 여러 에너지를 함께 써요.'},
  {q:'전기를 아끼는 생활 습관으로 알맞은 것은?',a:['빈 방에 불 켜 두기','쓰지 않는 플러그 뽑기','냉장고 문 자주 열기'],c:1,e:'꽂아 두기만 해도 새는 대기 전력이 있어요. 쓰지 않을 때는 뽑아 두면 좋아요.'},
  {q:'재생에너지의 좋은 점으로 알맞은 것은?',a:['아무 곳에나 지을 수 있다','날씨와 상관없이 늘 같은 양을 만든다','다시 채워져 계속 쓸 수 있다'],c:2,e:'재생에너지는 고갈될 걱정이 적고 온실가스도 거의 없어요. 하지만 알맞은 장소와 날씨가 필요해요.'},
  {q:'‘탄소 중립’의 뜻으로 알맞은 것은?',a:['내보낸 이산화 탄소만큼 줄이거나 흡수해 실제 배출량을 0으로 만드는 것','석탄만 골라 쓰는 것','탄소를 전혀 모르는 상태'],c:0,e:'배출은 줄이고 나무 심기 등으로 흡수는 늘려서 더하고 빼면 0이 되게 하는 것이 탄소 중립이에요.'}
];

/* ============ 스테이지 ============ */
const STAGES=[
  {n:'스모그 하늘',sub:'1단계',boss:'왕 스모그 구름',bossHp:260,len:55,
   intro:'하늘이 스모그로 뿌옇게 덮였어요. 스모그를 정화하고, 풍선에 실린 <b>에너지 캡슐</b>을 모아 무기를 바꿔 보세요.',
   lesson:'공기 속 오염 물질과 매연이 뭉치면 스모그가 생겨요. 화석 연료를 덜 태우면 하늘이 다시 맑아져요.'},
  {n:'기름 바다',sub:'2단계',boss:'기름 시추 비행선',bossHp:380,len:60,
   intro:'바다 위 석유 시추선에서 기름 비행체가 날아와요. 반짝이는 <b>석유통</b>은 힘을 주지만 탄소 게이지를 올려요.',
   lesson:'석유는 오래전 바다 생물이 묻혀 만들어진 화석 연료예요. 매장량이 정해져 있고, 태우면 이산화 탄소가 나와요.'},
  {n:'굴뚝 공장 지대',sub:'3단계 · 마지막',boss:'거대 화력 발전소',bossHp:520,len:65,
   intro:'석탄을 마구 태우는 공장 지대예요. 땅 위의 <b>굴뚝 포대</b>를 부수고, 마지막에 거대 화력 발전소를 멈추세요!',
   lesson:'석탄 화력 발전은 이산화 탄소를 가장 많이 내뿜어요. 햇빛·바람·물·지열·바이오 같은 재생에너지로 바꾸면 탄소를 크게 줄일 수 있어요.'}
];

/* ============ 상태 ============ */
let S,P,en=[],pb=[],eb=[],items=[],parts=[],floats=[],boss=null,spawnQ=[],quizPool;
function newRun(){S={stage:0,score:0,lives:5,bombs:2,co2:0,ren:0,fos:0,cleaned:0,quizOK:0,quizTry:0,seen:{},paused:true,started:false,ended:false,t:0,scroll:0,shake:0};quizPool=shuffle(QUIZ.slice())}
function startStage(i){
  S.stage=i;S.t=0;S.bossOn=false;en=[];pb=[];eb=[];items=[];parts=[];floats=[];boss=null;
  P=P&&S.keepP?P:{x:W/2,y:H-110,r:9,inv:2,w:'sun',lv:1,ft:0,boost:0,mcd:0};
  P.x=W/2;P.y=H-110;P.inv=2;
  spawnQ=buildScript(i); renderHud();
}
function buildScript(i){
  const q=[],len=STAGES[i].len;
  let t=2;
  while(t<len){
    const r=Math.random(), k=i===0?(r<.55?'smogLine':r<.8?'smogSine':'coalRain'):i===1?(r<.35?'smogSine':r<.65?'oiler':r<.85?'smogLine':'coalRain'):(r<.3?'turret':r<.55?'oiler':r<.8?'smogSine':'coalRain');
    q.push({t,k}); t+=rnd(1.6,2.6)-i*.15;
  }
  for(let c=6;c<len;c+=rnd(8,11))q.push({t:c,k:'carrier'});
  for(let c=12;c<len;c+=rnd(13,17))q.push({t:c,k:'fossil'});
  q.push({t:len+2,k:'boss'});
  return q.sort((a,b)=>a.t-b.t);
}
function spawn(k){
  const st=S.stage;
  if(k==='smogLine'){const n=4+st,x0=rnd(60,W-60-((n-1)*36));for(let j=0;j<n;j++)en.push(E('smog',x0+j*36,-30-j*26,{vy:110+st*15}))}
  if(k==='smogSine'){const n=5,s=Math.random()<.5?1:-1;for(let j=0;j<n;j++)en.push(E('smog',W/2,-30-j*40,{vy:95,sx:W/2,amp:150*s,ph:j*.5,sine:1}))}
  if(k==='coalRain'){for(let j=0;j<3+st;j++)en.push(E('coal',rnd(30,W-30),-30-j*60,{vy:rnd(220,300),rot:rnd(-4,4)}))}
  if(k==='oiler'){const x=rnd(70,W-70);en.push(E('oiler',x,-40,{vy:60,stop:rnd(140,240)}))}
  if(k==='turret'){const x=rnd(50,W-50);en.push(E('turret',x,-40,{vy:60}))}
  if(k==='carrier'){en.push(E('carrier',rnd(60,W-60),-40,{vy:70,wk:pick(WKEYS)}))}
  if(k==='fossil'){items.push({k:Math.random()<.5?'coal':'oil',x:rnd(40,W-40),y:-20,vy:110,r:13})}
  if(k==='boss'){boss={x:W/2,y:-140,hp:STAGES[st].bossHp,max:STAGES[st].bossHp,t:0,ph:0,st};S.bossOn=true;toast(`${STAGES[st].boss} 등장!`,'bad')}
}

function drawSmog(x,e,t,big){
  const r=big||e.r,X=e.x,Y=e.y+Math.sin(t*5+e.x)*2,c1=S.co2>60?'#4b4157':'#7b7088',c2=S.co2>60?'#3a3244':'#655a73';

  for(const [a,b,s] of [[-.5,.15,.62],[.5,.15,.6],[0,-.3,.7],[-.25,.4,.55],[.3,.4,.55]])circ(x,X+a*r,Y+b*r,s*r,c2);
  for(const [a,b,s] of [[-.45,0,.5],[.45,0,.5],[0,-.3,.58]])circ(x,X+a*r,Y+b*r,s*r,c1);
  circ(x,X-.3*r,Y,.2*r,'#fff');circ(x,X+.3*r,Y,.2*r,'#fff');
  circ(x,X-.3*r,Y+.06*r,.09*r,big?'#ef4444':'#2a2230');circ(x,X+.3*r,Y+.06*r,.09*r,big?'#ef4444':'#2a2230');
  x.strokeStyle='#2a2230';x.lineWidth=Math.max(1.5,r*.07);x.beginPath();x.moveTo(X-.5*r,Y-.3*r);x.lineTo(X-.15*r,Y-.16*r);x.moveTo(X+.5*r,Y-.3*r);x.lineTo(X+.15*r,Y-.16*r);x.stroke();

}
function drawEnemy(x,e,t){

    x.fillStyle='rgba(249,115,22,.6)';x.fillRect(-10,6,6,3)}
  if(e.k==='oiler'){x.fillStyle='#111827';x.beginPath();x.moveTo(0,22);x.bezierCurveTo(20,4,18,-18,0,-20);x.bezierCurveTo(-18,-18,-20,4,0,22);x.fill();
    x.strokeStyle='rgba(167,139,250,.7)';x.lineWidth=2;x.stroke();rr(x,-30,-6,60,8,3,'#374151');circ(x,-6,-4,4,'#fff');circ(x,6,-4,4,'#fff');circ(x,-6,-3,2,'#ef4444');circ(x,6,-3,2,'#ef4444')}
  if(e.k==='turret'){rr(x,-22,-16,44,32,6,'#57534e','#292524',2);rr(x,-7,-34,14,26,2,'#44403c');x.fillStyle='#ef4444';x.fillRect(-7,-30,14,3);
    for(let k=0;k<2;k++)circ(x,0,-40-((t*30+k*14)%28),6+((t*30+k*14)%28)/5,'rgba(70,64,80,.45)')}
  if(e.k==='carrier'){x.strokeStyle='#e2e8f0';x.lineWidth=1.5;x.beginPath();x.moveTo(0,-2);x.lineTo(0,10);x.stroke();
    circ(x,0,-14,16,'rgba(255,255,255,.85)','#94a3b8',2);drawCap(x,0,16,e.wk,t,.8)}
  x.restore();
}
function drawCap(x,X,Y,w,t,s=1){
  x.save();x.translate(X,Y);x.scale(s,s);const c=WPN[w].c;
  circ(x,0,0,14,'#fff',c,3);
  if(w==='sun'){circ(x,0,0,6,c);x.strokeStyle=c;x.lineWidth=2;for(let i=0;i<8;i++){const a=i*Math.PI/4;x.beginPath();x.moveTo(Math.cos(a)*8,Math.sin(a)*8);x.lineTo(Math.cos(a)*11,Math.sin(a)*11);x.stroke()}}
  if(w==='wind'){x.save();x.rotate(t*4);for(let k=0;k<3;k++){x.rotate(Math.PI*2/3);rr(x,-1.5,-10,3,10,1.5,'#64748b')}x.restore()}
  if(w==='hydro'){x.beginPath();x.moveTo(0,-9);x.bezierCurveTo(8,1,6,8,0,8);x.bezierCurveTo(-6,8,-8,1,0,-9);x.fillStyle=c;x.fill()}
  if(w==='geo'){x.beginPath();x.moveTo(0,-9);x.bezierCurveTo(9,0,7,9,0,9);x.bezierCurveTo(-7,9,-9,0,0,-9);x.fillStyle=c;x.fill();circ(x,0,4,3,'#fde047')}
  if(w==='bio'){x.beginPath();x.moveTo(-7,7);x.bezierCurveTo(-8,-4,2,-8,8,-8);x.bezierCurveTo(8,2,2,8,-7,7);x.fillStyle=c;x.fill()}
  x.restore();
}
function drawItem(x,it,t){
  const b=Math.sin(t*5+it.x)*2;

  if(it.k==='coal'||it.k==='oil'){circ(x,it.x,it.y+b,15,'rgba(248,113,113,.25)');
    if(it.k==='coal'){x.fillStyle='#111827';x.beginPath();x.moveTo(it.x-10,it.y+8+b);x.lineTo(it.x-7,it.y-7+b);x.lineTo(it.x+4,it.y-10+b);x.lineTo(it.x+11,it.y-2+b);x.lineTo(it.x+8,it.y+9+b);x.closePath();x.fill()}
    else{rr(x,it.x-8,it.y-11+b,16,22,3,'#374151','#111827',1.5);x.fillStyle='#fbbf24';x.fillRect(it.x-8,it.y-4+b,16,3)}
    x.fillStyle='#fde047';x.font='10px Jua';x.textAlign='center';x.fillText(it.k==='coal'?'석탄':'석유',it.x,it.y+24+b)}
  if(it.k==='tree'){x.fillStyle='#7c4a1e';x.fillRect(it.x-2,it.y+b,4,10);circ(x,it.x,it.y-3+b,8,'#22a065');circ(x,it.x-6,it.y+2+b,5,'#16a34a');circ(x,it.x+6,it.y+2+b,5,'#16a34a')}
}
function drawBoss(x,b,t){
  x.save();if(b.fl>0)x.filter='brightness(1.7)';
  if(b.st===0){drawSmog(x,{x:b.x,y:b.y,fl:0},t,80);x.fillStyle='#fff';x.font='13px Jua';x.textAlign='center'}
  if(b.st===1){x.translate(b.x,b.y);x.fillStyle='#374151';x.beginPath();x.ellipse(0,0,100,46,0,0,7);x.fill();x.strokeStyle='#9ca3af';x.lineWidth=3;x.stroke();
    x.fillStyle='#1f2937';x.fillRect(-60,30,120,24);x.strokeStyle='#d1d5db';x.lineWidth=4;x.beginPath();x.moveTo(-20,30);x.lineTo(0,-4);x.lineTo(20,30);x.stroke();
    for(const s of [-1,1]){x.save();x.translate(s*95,-10);x.rotate(t*12);x.fillStyle='#6b7280';x.fillRect(-2,-18,4,36);x.restore()}
    circ(x,-30,-8,9,'#fff');circ(x,30,-8,9,'#fff');circ(x,-30,-6,4,'#ef4444');circ(x,30,-6,4,'#ef4444');
    x.fillStyle='#fbbf24';x.font='13px Jua';x.textAlign='center';x.fillText('석유 시추선',0,20)}
  if(b.st===2){x.translate(b.x,b.y);rr(x,-120,-40,240,100,10,'#57534e','#1c1917',3);
    for(const cx of [-80,-25,30,85]){rr(x,cx-12,-100,24,64,3,'#44403c');x.fillStyle='#ef4444';x.fillRect(cx-12,-96,24,4);
      for(let k=0;k<3;k++){const p=(t*40+k*20+cx)%60;circ(x,cx,-108-p,10+p/5,`rgba(60,55,65,${.55-p/130})`)}}
    for(let i=0;i<5;i++)rr(x,-100+i*42,-10,26,20,3,'#f59e0b');
    circ(x,-40,30,10,'#fff');circ(x,40,30,10,'#fff');circ(x,-40,32,5,'#ef4444');circ(x,40,32,5,'#ef4444');
    x.fillStyle='#fde047';x.font='14px Jua';x.textAlign='center';x.fillText('거대 화력 발전소',0,55)}
  x.restore();
  // 체력
  rr(x,40,H-22,W-80,10,5,'rgba(0,0,0,.55)');rr(x,40,H-22,(W-80)*clamp(b.hp/b.max,0,1),10,5,'#ef4444');
  x.font='13px Jua';x.textAlign='center';x.lineWidth=3;x.strokeStyle='rgba(0,0,0,.6)';x.strokeText(STAGES[b.st].boss,W/2,H-28);x.fillStyle='#fff';x.fillText(STAGES[b.st].boss,W/2,H-28);
}
function draw(t){
  const x=ctx;x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle='#0b1220';x.fillRect(0,0,VW,VH);
  if(!P)return;
  const sh=S.shake>0?rnd(-4,4):0;
  x.setTransform(sc*dpr,0,0,sc*dpr,(OX+sh)*dpr,OY*dpr);
  x.save();x.beginPath();x.rect(0,0,W,H);x.clip();
  drawBg(x,t);
  for(const it of items)drawItem(x,it,t);
  for(const e of en)drawEnemy(x,e,t);
  if(boss)drawBoss(x,boss,t);
  for(const b of pb){
    if(b.w==='missile'){x.save();x.translate(b.x,b.y);x.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);rr(x,-3.5,-10,7,18,3,'#e2e8f0','#1e3a8a',1.5);x.fillStyle='#3e7bfa';x.beginPath();x.moveTo(-3.5,-10);x.lineTo(0,-15);x.lineTo(3.5,-10);x.fill();x.fillStyle='#f97316';x.fillRect(-2.5,8,5,4);x.restore();continue}
    const c=WPN[b.w].c;
    if(b.w==='wind'){x.save();x.translate(b.x,b.y);x.rotate(t*20);rr(x,-2,-9,4,18,2,'#fff','#64748b',1);rr(x,-9,-2,18,4,2,'#fff','#64748b',1);x.restore()}
    else if(b.w==='geo'){circ(x,b.x,b.y,b.r,'#f97316');circ(x,b.x,b.y,b.r*.55,'#fde047')}
    else if(b.w==='hydro'){x.beginPath();x.moveTo(b.x,b.y-8);x.bezierCurveTo(b.x+6,b.y,b.x+5,b.y+6,b.x,b.y+6);x.bezierCurveTo(b.x-5,b.y+6,b.x-6,b.y,b.x,b.y-8);x.fillStyle=c;x.fill()}
    else if(b.w==='bio'){x.save();x.translate(b.x,b.y);x.rotate(t*8);x.beginPath();x.moveTo(-6,5);x.bezierCurveTo(-7,-3,1,-6,6,-6);x.bezierCurveTo(6,2,1,6,-6,5);x.fillStyle=c;x.fill();x.restore()}
    else{circ(x,b.x,b.y,b.r,c);circ(x,b.x,b.y,b.r*.5,'#fff')}}
  for(const b of eb){if(b.k==='puff'){circ(x,b.x,b.y,b.r+2,'#5b5168');circ(x,b.x-2,b.y-2,b.r*.5,'#8a7f98')}else{circ(x,b.x,b.y,b.r,'#111827','#a78bfa',1.5)}}
  drawPlane(x,P.x,P.y,t,P.inv);
  for(const p of parts){x.globalAlpha=clamp(p.l*2,0,1);if(p.leaf){x.save();x.translate(p.x,p.y);x.rotate(p.x*.1);x.fillStyle=p.c;x.beginPath();x.ellipse(0,0,p.r,p.r*.5,0,0,7);x.fill();x.restore()}else circ(x,p.x,p.y,p.r,p.c)}x.globalAlpha=1;
  x.font='15px Jua, sans-serif';x.textAlign='center';for(const f of floats){x.globalAlpha=clamp(f.l,0,1);x.lineWidth=3;x.strokeStyle='rgba(0,0,0,.6)';x.strokeText(f.s,f.x,f.y);x.fillStyle=f.c;x.fillText(f.s,f.x,f.y)}x.globalAlpha=1;
  if(S.started&&!S.bossOn&&S.t<STAGES[S.stage].len){const p=S.t/STAGES[S.stage].len;rr(x,W-14,90,6,H-200,3,'rgba(255,255,255,.25)');rr(x,W-14,90+(H-200)*(1-p),6,(H-200)*p,3,'#fde047')}
  x.restore();
  x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=2;x.strokeRect(0,0,W,H);
}

  $('howBtn').onclick=()=>showHelp(false);
}
function showStageIntro(i){
  S.keepP=i>0;startStage(i);S.paused=true;ov.hidden=false;const st=STAGES[i];
  ov.innerHTML=`<div class="card"><div class="eyebrow">${st.sub}</div><h2>${st.n}</h2><p>${st.intro}</p><div class="row"><button class="btn" id="goBtn" type="button">출발</button></div></div>`;
  $('goBtn').onclick=()=>{ov.hidden=true;S.started=true;S.paused=false};
}
function stageClear(){
  if(S.ended)return;S.paused=true;ov.hidden=false;const st=STAGES[S.stage],last=S.stage===STAGES.length-1;
  ov.innerHTML=`<div class="card"><div class="eyebrow">${st.sub} 완료</div><h2>${st.boss}${last?'를 멈췄어요!':' 정화 성공!'}</h2><p>${st.lesson}</p>
    <div class="row"><button class="btn" id="goBtn" type="button">${last?'마지막 퀴즈':'퀴즈 풀고 다음 단계로'}</button></div></div>`;
  $('goBtn').onclick=()=>quiz(2,()=>last?ending(true):showStageIntro(S.stage+1));
}
function quiz(n,done){
  if(n<=0)return done();
  const q=quizPool.shift()||shuffle(QUIZ.slice())[0];quizPool.push(q);S.quizTry++;
  ov.innerHTML=`<div class="card"><div class="eyebrow">에너지 퀴즈 · 맞히면 나무 폭탄 +1</div><h2>${q.q}</h2><div style="display:grid;gap:8px">${q.a.map((a,i)=>`<button class="choice" data-i="${i}" type="button">${a}</button>`).join('')}</div><div id="qr"></div></div>`;
  ov.querySelector('.choice').focus();
  ov.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===q.c;
    ov.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(+x.dataset.i===q.c)x.classList.add('right')});if(!ok)b.classList.add('wrong');
    if(ok){S.quizOK++;S.bombs=Math.min(5,S.bombs+1);S.score+=300;renderHud()}
    $('qr').innerHTML=`<div class="note ${ok?'good':'bad'}"><b>${ok?'정답! 나무 폭탄 +1':'아쉬워요'}</b><br>${q.e}</div><div class="row" style="margin-top:10px"><button class="btn" id="goBtn" type="button">다음</button></div>`;
    $('goBtn').focus();$('goBtn').onclick=()=>quiz(n-1,done)});
}
function ending(win){
  S.ended=true;S.paused=true;ov.hidden=false;
  const tot=S.ren+S.fos,share=tot?Math.round(S.ren/tot*100):100;
  const stars=[win,share>=80,S.quizTry>0&&S.quizOK===S.quizTry];
  ov.innerHTML=`<div class="card"><div class="eyebrow">${win?'모든 단계 완료':'게임 끝'}</div><h1 style="color:${win?'var(--leaf)':'var(--alarm)'}">${win?'하늘이 다시 맑아졌어요!':'다시 출격해 볼까요?'}</h1>
    <div class="stars">${stars.map(s=>s?'★':'<span class="off">★</span>').join('')}</div>
    <p class="eyebrow" style="text-align:center">별: 끝까지 가기 · 먹은 에너지 중 재생에너지 80% 이상 · 퀴즈 모두 맞히기</p>
    <div class="stats"><div><b>${S.score}</b><small>점수</small></div><div><b>${share}%</b><small>재생에너지 비율</small></div><div><b>${S.cleaned}</b><small>정화한 스모그</small></div><div><b>${S.quizOK}/${S.quizTry}</b><small>퀴즈 정답</small></div></div>
    <div class="box"><h3>오늘 배운 것</h3><ul>
      <li>석탄·석유 같은 <b>화석 연료</b>는 힘이 세지만, 태우면 <b>이산화 탄소</b>가 나오고 매장량도 정해져 있어요.</li>
      <li>햇빛·바람·물·지열·바이오 같은 <b>재생에너지</b>는 저마다 특징이 달라요. 여러 가지를 함께 쓰면 든든해요.</li>
      <li><b>나무</b>는 이산화 탄소를 흡수해요. 배출은 줄이고 흡수는 늘리면 <b>탄소 중립</b>에 가까워져요.</li></ul></div>
    <div class="row"><button class="btn" id="goBtn" type="button">처음부터 다시</button>${!win?`<button class="btn alt" id="retry" type="button">${S.stage+1}단계부터 다시</button>`:''}</div></div>`;
  $('goBtn').onclick=()=>{newRun();P=null;showStageIntro(0)};
  if(!win)$('retry').onclick=()=>{const st=S.stage;newRun();P=null;S.stage=st;showStageIntro(st)};
}

/* ============ 루프 ============ */
let last=performance.now(),hudT=0;
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(S.started&&!S.paused&&!S.ended){update(dt);hudT-=dt;if(hudT<=0){hudT=.25;if(P&&P.mcd>0)renderHud()}}
  draw(now/1000);requestAnimationFrame(frame);
}
addEventListener('resize',resize);
newRun();resize();startStage(0);showStart();requestAnimationFrame(frame);
</script>
