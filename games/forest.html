  if((o.t==='coal'||o.t==='obsidian')&&!ME.tools.pick){toast('곡괭이가 있어야 석탄을 캘 수 있어요. 제작대에서 만들어요','bad');return}
  if(room()<=0&&!(CHESTS.has(o.t)||['tree','pebble','cactus','gearpile'].includes(o.t))){toast('가방이 가득 찼어요! 등불에 연료를 넣거나 더 큰 자루를 만들어요','bad');return}
  ME.swing=1;if(axeLv()===5&&(o.t==='tree'||o.t==='cactus')&&sawPlay())0;else sfx(o.t==='tree'?'chop':o.t==='coal'?'mine':'pick');act({a:'obj',id:o.id,pow:AXES[axeLv()].pow,cls:ME.cls})}
let holding=null;
function updHold(dt){const el=$('hold');if(!holding||!(keys.KeyE||tAct)){holding=null;el.hidden=true;return}if(!target||target.k!==holding.k||(holding.chest&&target.o!==holding.chest)){holding=null;el.hidden=true;return}
  holdT+=dt;el.hidden=false;el.firstElementChild.style.width=(holdT/holdNeed*100)+'%';if(holdT>=holdNeed){const h=holding;holding=null;el.hidden=true;keys.KeyE=false;
    if(h.k==='cage')act({a:'rescue',i:h.c.i});else if(h.chest){ME.swing=1;sfx('craft');act({a:'obj',id:h.chest.id,pow:1,cls:ME.cls})}else act({a:'fish',cls:ME.cls})}}
function attack(){if(ME.dead||ME.atk>0||!ov.hidden)return;if(ME.slot==='ranged')return shoot();ME.atk=.5;ME.swing=1;if(!(axeLv()===5&&!ME.tools.staff&&sawPlay(.9)))sfx('swing');const fx=Math.sin(ME.yaw),fz=Math.cos(ME.yaw);const dmg=meleeDmg();
  const mobs=NET.guest?GM:W.mobs;for(const m of mobs){const dx=m.x-ME.x,dz=m.z-ME.z,d=Math.hypot(dx,dz);if(d<(ME.tools.spear?3.3:2.4)*MOB[m.t].s&&(dx*fx+dz*fz)/(d||1)>.3){act({a:'hit',id:m.id,dmg,x:ME.x,z:ME.z,cls:ME.cls,slow:axeLv()===3?1:0});sfx('hit');const M=MOBM[m.id];if(M)M.flash=.2;return}}}

function drawMap(){const cv=$('map'),x=cv.getContext('2d'),S=150/WS;x.clearRect(0,0,300,300);x.fillStyle='#0b1a10';x.fillRect(0,0,300,300);
  const R=lvRadNow();x.save();x.beginPath();x.arc(150,150,R*S,0,7);x.clip();x.fillStyle='#2f5a2a';x.fillRect(0,0,300,300);mapBiomes(x,S);
  x.fillStyle='#2f7fc4';for(let z=-WS;z<WS;z+=2){const rx=riverX(z);x.fillRect(150+(rx-4)*S,150+z*S,8*S,2*S+1)}x.beginPath();x.arc(150-24*S,150+30*S,6*S,0,7);x.fill();
  x.fillStyle='#1d3d1a';for(const o of OBJ)if(o.alive&&o.t==='tree')x.fillRect(150+o.x*S-1,150+o.z*S-1,2,2);x.fillStyle='#111';for(const o of OBJ)if(o.alive&&o.t==='coal')x.fillRect(150+o.x*S-2,150+o.z*S-2,4,4);
  x.fillStyle='#ef4444';for(const o of OBJ)if(o.alive&&o.t==='oil')x.fillRect(150+o.x*S-2,150+o.z*S-2,4,4);x.restore();
  const sp=curSpirits();for(const c of CAVES){x.font='18px sans-serif';x.textAlign='center';x.textBaseline='middle';x.globalAlpha=Math.hypot(c.x,c.z)<R?1:.45;x.fillText(sp[c.i]?'✅':SPIRIT[c.i].e,150+c.x*S,150+c.z*S)}x.globalAlpha=1;
  mapStructs(x,S,R);x.fillStyle='#ffb35c';x.beginPath();x.arc(150,150,6,0,7);x.fill();
  x.fillStyle='#a855f7';for(const m of curMobs())if(m.t!=='guard'){x.beginPath();x.arc(150+m.x*S,150+m.z*S,3,0,7);x.fill()}
  for(const id in NET.pl){const p=NET.pl[id];if(p.x==null)continue;x.fillStyle='#38bdf8';x.beginPath();x.arc(150+p.x*S,150+p.z*S,4,0,7);x.fill()}

let AC=null;function audio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(type,f0,f1,dur,vol,delay=0){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol,f){if(!AC)return;const n=AC.sampleRate*dur|0,bf=AC.createBuffer(1,n,AC.sampleRate),d=bf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=bf;fl.type='lowpass';fl.frequency.value=f;g.gain.value=vol;s.connect(fl).connect(g).connect(AC.destination);s.start()}
function sfx(k){try{switch(k){case'chop':noise(.12,.3,900);tone('square',160,90,.08,.05);break;case'mine':noise(.1,.25,2400);tone('square',600,300,.06,.04);break;case'pick':tone('sine',600,900,.08,.07);break;case'step':noise(.04,.04,500);break;
  case'swing':noise(.12,.12,2500);break;case'hit':noise(.08,.25,1500);tone('square',200,90,.1,.06);break;case'hurt':tone('square',300,110,.25,.08);break;case'fire':noise(.5,.2,700);break;case'eat':for(let i=0;i<3;i++)noise(.06,.12,900);break;
  case'craft':[392,523,659].forEach((f,i)=>tone('triangle',f,f,.1,.07,i*.07));break;case'good':[523,659,784,1047].forEach((f,i)=>tone('triangle',f,f,.12,.07,i*.08));break;case'bad':tone('sawtooth',240,120,.3,.05);break;case'purify':tone('sine',800,1600,.25,.07);break;
  case'night':tone('sine',220,110,1.2,.08);tone('sine',330,165,1.2,.05,.2);break}}catch(e){}}
