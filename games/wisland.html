<!doctype html>
<html lang="ko">
<head>
<script src="../mwt.js" defer></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>날씨 생존 섬</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#87b8e8;color:#0f172a;font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
body.pre #hudWrap{display:none}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap}
.tag i{font-style:normal;display:block;height:4px;border-radius:3px;background:rgba(0,0,0,.4);margin-top:2px;overflow:hidden}.tag i b{display:block;height:100%;background:#4ade80}
#fx{position:fixed;inset:0;pointer-events:none;z-index:4;transition:background .4s,box-shadow .3s}
#top{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#phase{background:rgba(15,23,42,.82);color:#fff;border-radius:14px;padding:7px 16px;font-weight:900;font-size:17px;white-space:nowrap;display:flex;gap:10px;align-items:center}
#phase .t{font-variant-numeric:tabular-nums;color:#fde68a;font-size:20px}
#phase.warn{background:rgba(185,28,28,.9);animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
#sub{background:rgba(255,255,255,.88);border-radius:10px;padding:4px 12px;font-size:13px;font-weight:800;white-space:nowrap}
#sub:empty{display:none}
#me{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));z-index:6;background:rgba(255,255,255,.9);border-radius:16px;padding:9px 12px;width:220px;font-size:12.5px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.15)}
#me .row{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;margin:3px 0}
.gb{height:10px;border-radius:6px;background:#e2e8f0;overflow:hidden}.gb b{display:block;height:100%;transition:width .2s}
#me .items{margin-top:5px;font-size:12px;color:#334155}
#board{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:6;background:rgba(255,255,255,.88);border-radius:14px;padding:8px 10px;font-size:12.5px;font-weight:800;min-width:170px;max-width:230px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
#board h4{font-size:12px;color:#64748b;margin-bottom:3px}
#board .p{display:flex;justify-content:space-between;gap:8px;padding:1px 0}#board .p.dead{opacity:.45;text-decoration:line-through}#board .p.me{color:#2563eb}
#prompt{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 4px);transform:translateX(-50%);z-index:6;background:rgba(15,23,42,.85);color:#fff;border-radius:10px;padding:7px 14px;font-weight:800;font-size:14px;white-space:nowrap}
#prompt:empty{display:none}
#vote{position:fixed;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 84px);transform:translateX(-50%);z-index:7;background:rgba(255,255,255,.95);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.2);width:min(560px,94vw);display:none}
#vote.on{display:block}
#vote h3{font-size:15px;margin-bottom:6px;text-align:center}
#vote .clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:5px;margin-bottom:8px}
#vote .clue{background:#eff6ff;border-radius:10px;padding:6px 8px;font-size:12.5px;line-height:1.35}#vote .clue b{display:block;font-size:11px;color:#2563eb}
#vote .clue.lock{background:#f1f5f9;color:#94a3b8}
#vote .opts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#vote .opts button{background:#fef9c3;border:2px solid #facc15;border-radius:12px;padding:8px 12px;font-weight:900;font-size:15px}
#vote .opts button.sel{background:#22c55e;border-color:#15803d;color:#fff}
#vote .hint{text-align:center;font-size:12px;color:#64748b;margin-top:6px}
#toast{position:fixed;left:50%;top:38%;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(15,23,42,.88);color:#fff;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:800;animation:tin .3s;max-width:80vw;text-align:center}
.toast.good{background:rgba(21,128,61,.92)}.toast.bad{background:rgba(185,28,28,.92)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
#banner{position:fixed;left:50%;top:24%;transform:translateX(-50%);z-index:7;text-align:center;font-size:44px;font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 20px rgba(0,0,0,.4);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#banner small{display:block;font-size:17px;margin-top:4px}
#chatLog{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 140px);z-index:6;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;display:flex;flex-direction:column;gap:3px}
#chatBar{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:12;background:rgba(15,23,42,.95);border-radius:14px;padding:10px;width:min(560px,94vw)}
#chatBar .qk{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}.qb{background:#1e293b;color:#fff;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:700}
#chatF{display:flex;gap:6px}#chatIn{flex:1;font:inherit;background:#0b1020;border:1px solid #334155;border-radius:9px;padding:8px;color:#fff}#chatF button{background:#3b82f6;color:#fff;border-radius:9px;padding:0 14px;font-weight:800}
#touch{position:fixed;inset:0;z-index:5;pointer-events:none}
#look{position:absolute;right:0;top:0;width:60%;height:100%;pointer-events:auto}
.joy{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 130px);width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);pointer-events:auto}
.joy i{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.6)}
.tb{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;background:rgba(15,23,42,.55);color:#fff;border:2px solid rgba(255,255,255,.5);font-weight:900;font-size:13px;line-height:1.1}
#tJ{right:max(18px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 40px);width:80px;height:80px;background:rgba(56,189,248,.5);font-size:16px}
#tR{right:calc(max(18px,env(safe-area-inset-right)) + 92px);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 20px)}
#tR.on{background:rgba(34,197,94,.6)}
#tE{right:calc(max(18px,env(safe-area-inset-right)) + 10px);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 135px);background:rgba(250,204,21,.55)}
#tC{right:calc(max(18px,env(safe-area-inset-right)) + 100px);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 100px);width:48px;height:48px}
body.touch #me{left:max(10px,env(safe-area-inset-left));bottom:auto;top:calc(max(10px,env(safe-area-inset-top)) + 8px);width:170px;padding:6px 9px;font-size:11px}
body.touch #me .row{grid-template-columns:50px 1fr;margin:1px 0}
body.touch #board{font-size:11px;min-width:130px;padding:6px 8px}
body.touch #top{top:calc(max(10px,env(safe-area-inset-top)) + 2px)}
body.touch #phase{font-size:13px;padding:5px 10px}body.touch #phase .t{font-size:15px}
body.touch #vote{top:auto;bottom:6px;width:min(500px,56vw);padding:6px}
body.touch #vote .clues{grid-template-columns:repeat(3,1fr)}body.touch #vote .clue{font-size:10.5px;padding:4px 6px}
body.touch #banner{font-size:28px}
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(15,23,42,.45)}
#ov[hidden]{display:none}
.card{background:#fff;color:#0f172a;border-radius:20px;padding:18px 20px;width:min(640px,100%);max-height:100%;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5}
.card h1{font-size:30px;letter-spacing:-1px}.card h2{font-size:21px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{width:36px;height:36px;border-radius:10px;background:#f1f5f9;font-size:18px;flex:none}
.btn{background:#facc15;color:#1c1917;border-radius:12px;padding:11px 16px;font-weight:900;font-size:15px;box-shadow:0 3px 0 #a16207}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a16207}.btn[disabled]{opacity:.45}
.btn.alt{background:#eef2f7;color:#0f172a;box-shadow:0 3px 0 #cbd5e1}.btn.blue{background:#3b82f6;color:#fff;box-shadow:0 3px 0 #1d4ed8}.btn.sm{padding:7px 11px;font-size:13px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{font-size:12.5px;color:#64748b}
.note{background:#f1f5f9;border-radius:12px;padding:10px 12px;font-size:14px}
.inp{font:inherit;border:2px solid #cbd5e1;border-radius:10px;padding:9px 12px;width:100%}
.qa{display:grid;gap:6px}.qa button{text-align:left;border:2px solid #e2e8f0;border-radius:10px;padding:9px 12px;background:#fff;font-weight:700}
.qa button.ok{border-color:#22c55e;background:#dcfce7}.qa button.no{border-color:#ef4444;background:#fee2e2}
.qq{font-size:18px;font-weight:900}
.g{color:#15803d}.r{color:#dc2626}
.dis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.dis div{background:#f8fafc;border-radius:10px;padding:7px 9px;font-size:12.5px}.dis b{display:block;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td{border-bottom:1px solid #e2e8f0;padding:5px 4px}.tbl td:last-child{text-align:right;font-weight:800}
.lesson{background:linear-gradient(135deg,#eff6ff,#f0fdf4);border-radius:14px;padding:12px 14px;font-size:14.5px}.lesson b{color:#1d4ed8}
.safe{background:#fff7ed;border-radius:12px;padding:10px 12px;font-size:14px}
@media (max-width:640px){#banner{font-size:28px}.card h1{font-size:24px}}
</style>

let AC=null,master=null,rainG=null,windG=null;
function audio(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  const mk=(f,type)=>{const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=AC.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(master);s.start();return g};
  rainG=mk(2500,'lowpass');windG=mk(500,'bandpass')}if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(type,f1,f2,d,v,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
function noise(d,v,f,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const b=AC.createBuffer(1,AC.sampleRate*d|0,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f||1200;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t)}
function sfx(k){if(!AC)return;switch(k){
  case'good':tone('triangle',660,990,.15,.14);tone('triangle',990,1320,.18,.11,.12);break;case'bad':tone('sawtooth',300,120,.4,.12);break;
  case'click':tone('square',900,900,.04,.05);break;case'hit':noise(.25,.3,900);tone('square',200,80,.2,.1);break;case'down':tone('sawtooth',300,60,1,.15);break;
  case'drink':noise(.3,.06,700);tone('sine',400,500,.2,.05);break;case'beep':tone('square',1200,1200,.08,.08);tone('square',1200,1200,.08,.08,.15);break;
  case'thunder':noise(1.6,.55,300);noise(.3,.4,3000);tone('sawtooth',60,30,1.2,.15);break;
  case'alarm':for(let i=0;i<3;i++){tone('square',880,660,.25,.09,i*.32)}break}}
function audioStep(){if(!AC||!rainG)return;const w=W();const live=w&&(w.ph==='dis'||w.ph==='warn');const dk=w?w.dk:'';const ind=isIndoor(ME.x,ME.y+.5,ME.z);
  const r=live&&['rain','typhoon','storm'].includes(dk)?.35*WX.k*(ind?.4:1):0;const wd=live&&(dk==='typhoon'||dk==='snow'||dk==='dust')?(dk==='typhoon'?.5:.18)*WX.k*(ind?.35:1):.02;
  rainG.gain.setTargetAtTime(r,AC.currentTime,.3);windG.gain.setTargetAtTime(wd,AC.currentTime,.3)}

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
let last=performance.now(),hudT=0,seaT=0;const T0=performance.now();
function frame(nw){const dt=Math.min(.05,Math.max(0,(nw-last)/1000));last=nw;const t=(nw-T0)/1000;
  try{if(GAME.on){moveMe(dt);
      if(ROLE.r!=='guest'&&S){const me=S.pl.me;if(me){Object.assign(me,{n:NET.nick,x:ME.x,y:ME.y,z:ME.z,yw:ME.yw,hp:ME.hp,mv:ME.moveAmt||0,sw:ME.swim?1:0});if(!ME.al)me.al=0;if(me.al)ME.al=1}hostStep(dt);if(!NET.on)S.evq.length=0}
      camStep(dt);syncModels(dt);drawTags();hudT-=dt;if(hudT<=0){hudT=.12;hud();audioStep()}EL.showHud(!!(W()&&ov.hidden));
      seaT-=dt;if(seaT<=0){seaT=1;const w=W();if(w&&(w.ph==='inter'||w.ph==='res')&&Math.hypot(ME.x,ME.z)>ISL-9)EL.see('seab','바닷가에선 낮엔 바다 → 육지로 해풍이 불어요')}}
    else{const r=58;camera.position.set(Math.sin(t*.05)*r,24,Math.cos(t*.05)*r);camera.lookAt(0,3,0)}
    weatherFx(dt,t);netTick(dt);renderer.render(scene,camera)}catch(err){console.error(err)}
  requestAnimationFrame(frame)}
buildIsland();FX.snowCov.geometry=FX.ground.geometry;FX.snowCov.position.y=.05;scene.add(FX.snowCov);setBoard(stationIdle());resize();
requestAnimationFrame(frame);lobby();
window.WXI={get S(){return S},get V(){return V},ME,NET,ROLE,CAM,DIS,beginHost,netStart,interact,vote,W,FX,hazard};
