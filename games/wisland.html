<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>날씨 생존 섬</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#87b8e8;color:#0f172a;font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
body.pre #hudWrap{display:none}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap}
.tag i{font-style:normal;display:block;height:4px;border-radius:3px;background:rgba(0,0,0,.4);margin-top:2px;overflow:hidden}.tag i b{display:block;height:100%;background:#4ade80}
#fx{position:fixed;inset:0;pointer-events:none;z-index:4;transition:background .4s,box-shadow .3s}
#top{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#phase{background:rgba(15,23,42,.82);color:#fff;border-radius:14px;padding:7px 16px;font-weight:900;font-size:17px;white-space:nowrap;display:flex;gap:10px;align-items:center}
#phase .t{font-variant-numeric:tabular-nums;color:#fde68a;font-size:20px}
#phase.warn{background:rgba(185,28,28,.9);animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
#sub{background:rgba(255,255,255,.88);border-radius:10px;padding:4px 12px;font-size:13px;font-weight:800;white-space:nowrap}
#sub:empty{display:none}
#me{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));z-index:6;background:rgba(255,255,255,.9);border-radius:16px;padding:9px 12px;width:220px;font-size:12.5px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.15)}
#me .row{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;margin:3px 0}
.gb{height:10px;border-radius:6px;background:#e2e8f0;overflow:hidden}.gb b{display:block;height:100%;transition:width .2s}
#me .items{margin-top:5px;font-size:12px;color:#334155}
#board{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:6;background:rgba(255,255,255,.88);border-radius:14px;padding:8px 10px;font-size:12.5px;font-weight:800;min-width:170px;max-width:230px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
#board h4{font-size:12px;color:#64748b;margin-bottom:3px}
#board .p{display:flex;justify-content:space-between;gap:8px;padding:1px 0}#board .p.dead{opacity:.45;text-decoration:line-through}#board .p.me{color:#2563eb}
#prompt{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 4px);transform:translateX(-50%);z-index:6;background:rgba(15,23,42,.85);color:#fff;border-radius:10px;padding:7px 14px;font-weight:800;font-size:14px;white-space:nowrap}
#prompt:empty{display:none}
#vote{position:fixed;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 84px);transform:translateX(-50%);z-index:7;background:rgba(255,255,255,.95);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.2);width:min(560px,94vw);display:none}
#vote.on{display:block}
#vote h3{font-size:15px;margin-bottom:6px;text-align:center}
#vote .clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:5px;margin-bottom:8px}
#vote .clue{background:#eff6ff;border-radius:10px;padding:6px 8px;font-size:12.5px;line-height:1.35}#vote .clue b{display:block;font-size:11px;color:#2563eb}
#vote .clue.lock{background:#f1f5f9;color:#94a3b8}
#vote .opts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#vote .opts button{background:#fef9c3;border:2px solid #facc15;border-radius:12px;padding:8px 12px;font-weight:900;font-size:15px}
#vote .opts button.sel{background:#22c55e;border-color:#15803d;color:#fff}
#vote .hint{text-align:center;font-size:12px;color:#64748b;margin-top:6px}
#toast{position:fixed;left:50%;top:38%;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(15,23,42,.88);color:#fff;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:800;animation:tin .3s;max-width:80vw;text-align:center}
.toast.good{background:rgba(21,128,61,.92)}.toast.bad{background:rgba(185,28,28,.92)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
#banner{position:fixed;left:50%;top:24%;transform:translateX(-50%);z-index:7;text-align:center;font-size:44px;font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 20px rgba(0,0,0,.4);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#banner small{display:block;font-size:17px;margin-top:4px}
#chatLog{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 140px);z-index:6;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;display:flex;flex-direction:column;gap:3px}
#chatBar{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:12;background:rgba(15,23,42,.95);border-radius:14px;padding:10px;width:min(560px,94vw)}
#chatBar .qk{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}.qb{background:#1e293b;color:#fff;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:700}
#chatF{display:flex;gap:6px}#chatIn{flex:1;font:inherit;background:#0b1020;border:1px solid #334155;border-radius:9px;padding:8px;color:#fff}#chatF button{background:#3b82f6;color:#fff;border-radius:9px;padding:0 14px;font-weight:800}
#touch{position:fixed;inset:0;z-index:5;pointer-events:none}
#look{position:absolute;right:0;top:0;width:60%;height:100%;pointer-events:auto}
.joy{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 130px);width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);pointer-events:auto}
.joy i{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.6)}
.tb{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;background:rgba(15,23,42,.55);color:#fff;border:2px solid rgba(255,255,255,.5);font-weight:900;font-size:13px;line-height:1.1}
#tJ{right:max(18px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 40px);width:80px;height:80px;background:rgba(56,189,248,.5);font-size:16px}
#tR{right:calc(max(18px,env(safe-area-inset-right)) + 92px);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 20px)}
#tR.on{background:rgba(34,197,94,.6)}
#tE{right:calc(max(18px,env(safe-area-inset-right)) + 10px);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 135px);background:rgba(250,204,21,.55)}
#tC{right:calc(max(18px,env(safe-area-inset-right)) + 100px);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 100px);width:48px;height:48px}
body.touch #me{left:max(10px,env(safe-area-inset-left));bottom:auto;top:calc(max(10px,env(safe-area-inset-top)) + 8px);width:170px;padding:6px 9px;font-size:11px}
body.touch #me .row{grid-template-columns:50px 1fr;margin:1px 0}
body.touch #board{font-size:11px;min-width:130px;padding:6px 8px}
body.touch #top{top:calc(max(10px,env(safe-area-inset-top)) + 2px)}
body.touch #phase{font-size:13px;padding:5px 10px}body.touch #phase .t{font-size:15px}
body.touch #vote{top:auto;bottom:6px;width:min(500px,56vw);padding:6px}
body.touch #vote .clues{grid-template-columns:repeat(3,1fr)}body.touch #vote .clue{font-size:10.5px;padding:4px 6px}
body.touch #banner{font-size:28px}
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(15,23,42,.45)}
#ov[hidden]{display:none}
.card{background:#fff;color:#0f172a;border-radius:20px;padding:18px 20px;width:min(640px,100%);max-height:100%;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5}
.card h1{font-size:30px;letter-spacing:-1px}.card h2{font-size:21px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{width:36px;height:36px;border-radius:10px;background:#f1f5f9;font-size:18px;flex:none}
.btn{background:#facc15;color:#1c1917;border-radius:12px;padding:11px 16px;font-weight:900;font-size:15px;box-shadow:0 3px 0 #a16207}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a16207}.btn[disabled]{opacity:.45}
.btn.alt{background:#eef2f7;color:#0f172a;box-shadow:0 3px 0 #cbd5e1}.btn.blue{background:#3b82f6;color:#fff;box-shadow:0 3px 0 #1d4ed8}.btn.sm{padding:7px 11px;font-size:13px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{font-size:12.5px;color:#64748b}
.note{background:#f1f5f9;border-radius:12px;padding:10px 12px;font-size:14px}
.inp{font:inherit;border:2px solid #cbd5e1;border-radius:10px;padding:9px 12px;width:100%}
.qa{display:grid;gap:6px}.qa button{text-align:left;border:2px solid #e2e8f0;border-radius:10px;padding:9px 12px;background:#fff;font-weight:700}
.qa button.ok{border-color:#22c55e;background:#dcfce7}.qa button.no{border-color:#ef4444;background:#fee2e2}
.qq{font-size:18px;font-weight:900}
.g{color:#15803d}.r{color:#dc2626}
.dis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.dis div{background:#f8fafc;border-radius:10px;padding:7px 9px;font-size:12.5px}.dis b{display:block;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td{border-bottom:1px solid #e2e8f0;padding:5px 4px}.tbl td:last-child{text-align:right;font-weight:800}
.lesson{background:linear-gradient(135deg,#eff6ff,#f0fdf4);border-radius:14px;padding:12px 14px;font-size:14.5px}.lesson b{color:#1d4ed8}
.safe{background:#fff7ed;border-radius:12px;padding:10px 12px;font-size:14px}
@media (max-width:640px){#banner{font-size:28px}.card h1{font-size:24px}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ===== 민왕게임월드 온라인 연결 도우미 v2 =====
   PeerJS(WebRTC)로 먼저 연결하고, 안 되면(서버 장애·학교/통신사 방화벽) MQTT 중계 서버로 자동 전환해요.
   게임 코드는 그대로 new Peer(...)를 쓰면 돼요. */
(function(){
if(window.__MWG_NET)return;window.__MWG_NET=2;
var RealPeer=window.Peer;
var BROKERS=window.MWG_MQTT||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
var ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'},
 {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}];
var TOPIC='mwgame/v2/';
function rid(n){var s='',c='abcdefghijkmnpqrstuvwxyz23456789';for(var i=0;i<(n||10);i++)s+=c[Math.random()*c.length|0];return s}
function Em(){this._h={}}
Em.prototype.on=function(e,f){(this._h[e]=this._h[e]||[]).push(f);return this};
Em.prototype.off=function(e,f){var a=this._h[e];if(a){var i=a.indexOf(f);if(i>=0)a.splice(i,1)}return this};
Em.prototype.emit=function(e){var a=(this._h[e]||[]).slice(),args=[].slice.call(arguments,1);for(var i=0;i<a.length;i++){try{a[i].apply(this,args)}catch(err){console.error(err)}}};
function inherit(C){C.prototype=Object.create(Em.prototype);C.prototype.constructor=C}

/* ---------- 아주 작은 MQTT 3.1.1 (웹소켓) ---------- */
var te=new TextEncoder(),td=new TextDecoder();
function str(s){var b=te.encode(s);var o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o}
function cat(arr){var n=0,i;for(i=0;i<arr.length;i++)n+=arr[i].length;var o=new Uint8Array(n),p=0;for(i=0;i<arr.length;i++){o.set(arr[i],p);p+=arr[i].length}return o}
function pkt(h,body){var len=body.length,lb=[];do{var d=len%128;len=Math.floor(len/128);if(len>0)d|=128;lb.push(d)}while(len>0);return cat([new Uint8Array([h].concat(lb)),body])}
function Mqtt(clientId){Em.call(this);this.cid=clientId;this.bi=0;this.ok=false;this.subs=[];this.buf=new Uint8Array(0);this.pid=1;this.dead=false;this._go()}
inherit(Mqtt);
Mqtt.prototype._go=function(){var self=this;if(this.dead)return;if(this.bi>=BROKERS.length){this.emit('fail');return}
  var url=BROKERS[this.bi],ws,done=false;try{ws=new WebSocket(url,'mqtt')}catch(e){this.bi++;return this._go()}
  ws.binaryType='arraybuffer';this.ws=ws;
  var to=setTimeout(function(){if(!done){done=true;try{ws.close()}catch(e){}self.bi++;self._go()}},6000);
  ws.onopen=function(){var body=cat([str('MQTT'),new Uint8Array([4,2,0,40]),str(self.cid)]);ws.send(pkt(0x10,body))};
  ws.onmessage=function(ev){self._rx(new Uint8Array(ev.data),function(){if(!done){done=true;clearTimeout(to)}})};
  ws.onerror=function(){};
  ws.onclose=function(){clearTimeout(to);var was=self.ok;self.ok=false;clearInterval(self.pt);if(self.dead)return;if(!done){done=true;self.bi++;self._go();return}
    if(was){self.emit('down');setTimeout(function(){if(!self.dead){self.bi=0;self._go()}},1500)}}};
Mqtt.prototype._rx=function(chunk,onConn){var b=cat([this.buf,chunk]);var p=0;
  while(p<b.length){var h=b[p],mul=1,len=0,q=p+1,d;do{if(q>=b.length){this.buf=b.slice(p);return}d=b[q++];len+=(d&127)*mul;mul*=128}while(d&128);
    if(q+len>b.length){this.buf=b.slice(p);return}var body=b.subarray(q,q+len);p=q+len;var t=h>>4;
    if(t===2){if(body[1]===0){onConn();var first=!this.everOk;this.ok=true;this.everOk=true;var self=this;this.pt=setInterval(function(){try{self.ws.send(new Uint8Array([0xC0,0]))}catch(e){}},20000);for(var i=0;i<this.subs.length;i++)this._sub(this.subs[i]);this.emit(first?'ready':'up')}else{try{this.ws.close()}catch(e){}}}
    else if(t===3){var tl=(body[0]<<8)|body[1];var topic=td.decode(body.subarray(2,2+tl));var off=2+tl+((h>>1)&3?2:0);this.emit('msg',topic,td.decode(body.subarray(off)))}}
  this.buf=new Uint8Array(0)};
Mqtt.prototype._sub=function(t){var id=this.pid++&65535||1;this.ws.send(pkt(0x82,cat([new Uint8Array([id>>8,id&255]),str(t),new Uint8Array([0])])))};
Mqtt.prototype.sub=function(t){this.subs.push(t);if(this.ok)this._sub(t)};
Mqtt.prototype.pub=function(t,s){if(!this.ok)return false;try{this.ws.send(pkt(0x30,cat([str(t),te.encode(s)])));return true}catch(e){return false}};
Mqtt.prototype.close=function(){this.dead=true;clearInterval(this.pt);try{this.ws.send(new Uint8Array([0xE0,0]));this.ws.close()}catch(e){}};

/* ---------- 연결 하나 (PeerJS 또는 MQTT를 감싸요) ---------- */
function Conn(peer,remote){Em.call(this);this.peer=remote;this.open=false;this.reliable=true;this._p=peer;this._k=null;this._rc=null;this.closed=false;this.via=''}
inherit(Conn);
Conn.prototype.send=function(d){if(!this.open||this.closed)return;if(this._rc){try{this._rc.send(d)}catch(e){}}else if(this._k){this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'d',c:this._k,f:this._p.id,d:d}));this._tx=Date.now()}};
Conn.prototype.close=function(){if(this.closed)return;this.closed=true;var was=this.open;this.open=false;if(this._rc){try{this._rc.close()}catch(e){}}if(this._k){this._p._mq&&this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'fin',c:this._k,f:this._p.id}));delete this._p._mc[this._k]}clearInterval(this._ka);if(was)this.emit('close')};
Conn.prototype._useReal=function(rc){var self=this;this._rc=rc;this.via='webrtc';
  rc.on('data',function(d){self.emit('data',d)});rc.on('close',function(){if(!self.closed){self.closed=true;self.open=false;self.emit('close')}});rc.on('error',function(e){self.emit('error',e)})};
Conn.prototype._setOpen=function(){var self=this;if(this.open||this.closed)return;this.open=true;setTimeout(function(){self.emit('open')},0)};
Conn.prototype._useMq=function(k){var self=this;this._k=k;this.via='relay';this._rx=Date.now();this._p._mc[k]=this;
  this._ka=setInterval(function(){if(!self.open)return;if(Date.now()-(self._tx||0)>3000)self._p._mq.pub(TOPIC+self.peer,JSON.stringify({t:'png',c:k,f:self._p.id}));if(Date.now()-self._rx>16000){self.close()}},2000)};

/* ---------- Peer 대신 쓰는 SmartPeer ---------- */
function SmartPeer(id,opts){if(!(this instanceof SmartPeer))return new SmartPeer(id,opts);Em.call(this);var self=this;
  if(id&&typeof id==='object'){opts=id;id=undefined}
  this.id=id||('g'+rid(11));this.isHost=!!id;this.opts=opts||{};this.destroyed=false;this.open=false;this._mc={};this._openSent=false;this._rpOpen=false;this._mqReady=false;
  // 1) PeerJS
  if(RealPeer){try{var o={};for(var k in this.opts)o[k]=this.opts[k];o.config=o.config||{iceServers:ICE};
    this._rp=new RealPeer(this.id,o);
    this._rp.on('open',function(){self._rpOpen=true;self._open()});
    this._rp.on('connection',function(rc){var c=new Conn(self,rc.peer);rc.on('open',function(){if(c.closed)return;c._useReal(rc);c._setOpen();self.emit('connection',c)})});
    this._rp.on('error',function(e){var t=e&&e.type;if(t==='unavailable-id'){self.emit('error',e);return}if(t==='peer-unavailable'){var m=/peer\s+(\S+)/i.exec(e.message||'');self.emit('_pu',m?m[1]:'');return}self._rpBad=true;if(!self._rpOpen)self._maybeOpen()});
    this._rp.on('disconnected',function(){if(!self.destroyed){try{self._rp.reconnect()}catch(e){}}});
  }catch(e){this._rp=null;this._rpBad=true}}else this._rpBad=true;
  // 2) MQTT 중계 (항상 함께 켜 둬요)
  this._mq=new Mqtt('mw'+rid(12));
  this._mq.on('ready',function(){self._mqReady=true;self._maybeOpen()});

function onEv(e){const w=W();switch(e.k){
  case'ph':{const D=DIS[e.dk];
    if(e.ph==='inter'){banner(`🏝️ 라운드 ${e.rd+1}/${e.nr}`,'잠깐 쉬어요 — 곧 일기 예보가 시작돼요');setBoard(stationIdle())}
    if(e.ph==='fore'){ME.obs=false;voteKey='';if(cardKind==='res')closeCard();toast('📡 일기 예보 시간! 관측소 단서를 보고 날씨를 맞혀요','good');sfx('good');const ww=W();if(ww)setBoard(stationTex(Object.assign({},ww,{dk:e.dk})))}
    if(e.ph==='warn'){sfx('alarm');}
    if(e.ph==='dis'){banner(`${D.e} ${D.n}`,'45초 동안 살아남아요!','#fde68a')}
    break}
  case'voted':break;
  case'fc':if(e.ok){ME.item=e.it;toast(`✅ 예보 성공! +5점 · 준비물 ${ITEMN[e.it]}`,'good');sfx('good');EL.prog('fc',1);EL.see('forecast','관측 단서로 날씨를 맞혔어요!')}else{ME.item='';toast(e.v?`❌ 예보가 틀렸어요 (정답: ${DIS[e.dk].e} ${DIS[e.dk].n}) — 준비물 없이 버텨요!`:`⌛ 예보를 안 했어요 — 준비물 없이 버텨요!`,'bad');sfx('bad')}break;
  case'reveal':{const D=DIS[e.dk];banner(`${D.e} ${D.n} 특보!`,D.warn,'#fecaca');toast(`📢 ${e.ok}/${e.n}명이 예보를 맞혔어요`);break}
  case'warn':warnRing(e.x,e.z,e.d);break;
  case'bolt':boltAt(e.x,e.z);break;
  case'down':if(e.id!==myId())toast(`💀 ${e.n} 탈락!`);break;
  case'res':resultCard(e);break;

  case'end':endCard(e.rank);break;
  case'toast':toast(e.m,e.c);break}}

function netSend(m){if(!NET.on)return;if(NET.host){for(const c of NET.conns.values())if(c.open)try{c.send(m)}catch(e){}}else if(NET.hc&&NET.hc.open)try{NET.hc.send(m)}catch(e){}}

function netStart(asHost,code){if(!window.Peer){toast('친구와 함께 하기를 불러오지 못했어요 (인터넷 확인)','bad');return}
  code=asHost?String(1000+Math.floor(Math.random()*9000)):String(code||'').replace(/\D/g,'').slice(0,4);if(code.length!==4){toast('방 번호 4자리를 적어 주세요','bad');return}
  const hid='wxisl-v1-'+code;toast(asHost?'방을 만드는 중…':'방에 들어가는 중…');ov.querySelectorAll('.btn').forEach(b=>b.disabled=true);
  const pc=new Peer(asHost?hid:undefined,Object.assign({debug:0},window.ERV_PEERCFG||{}));NET.pc=pc;let done=false;
  const fail=m=>{try{pc.destroy()}catch(e){}toast(m,'bad');ov.querySelectorAll('.btn').forEach(b=>b.disabled=false)};
  const to=setTimeout(()=>{if(!done)fail(asHost?'방을 만들지 못했어요. 잠시 뒤 다시 해 주세요.':'방을 찾지 못했어요. 번호를 확인해 주세요.')},20000);
  pc.on('error',e=>{if(!done){clearTimeout(to);fail(e.type==='unavailable-id'?'그 방 번호는 이미 쓰고 있어요':e.type==='peer-unavailable'?'그 번호의 방이 없어요':'연결에 실패했어요 ('+(e.type||'오류')+')')}});
  pc.on('open',()=>{if(asHost){done=true;clearTimeout(to);Object.assign(NET,{on:true,host:true,code});roomCard();toast(`방을 열었어요! 방 번호 ${code}`,'good');return}
    const hc=pc.connect(hid,{reliable:true});NET.hc=hc;hc.on('open',()=>{done=true;clearTimeout(to);Object.assign(NET,{on:true,guest:true,code});hc.send({t:'hi',n:NET.nick});waitCard()});
    hc.on('data',d=>onNet(d,'host'));hc.on('close',()=>{if(NET.guest){banner('방이 닫혔어요','방장이 나갔어요');setTimeout(()=>location.reload(),3000)}})});
  pc.on('connection',c=>{if(!asHost){c.close();return}c.on('open',()=>NET.conns.set(c.peer,c));c.on('data',d=>onNet(d,c.peer));c.on('close',()=>{NET.conns.delete(c.peer);const p=NET.pl[c.peer];if(p)toast(`${p.n}님이 나갔어요`);delete NET.pl[c.peer];if(S)delete S.pl[c.peer];if(!GAME.on)roomCard()})})}
function roomCard(){const pl=[{n:NET.nick},...Object.values(NET.pl)];
  openCard(`<div class="hd"><h2>👥 방 ${NET.code}</h2><span class="small">${pl.length}/4명</span></div><p class="small">친구에게 <b>방 번호 ${NET.code}</b>를 알려 주세요. 빈자리는 🤖 로봇 친구가 채워요!</p>
   <div class="note">${pl.map((p,i)=>`${i===0?'👑':'🙂'} <b>${esc(p.n)}</b>`).join('<br>')}</div>
   <div class="row2"><button class="btn" id="rgo" type="button">▶ 시작 (${LOB.nr}라운드)</button></div>`,()=>{$('rgo').onclick=()=>{audio();beginHost(LOB.nr)}},'room')}
function waitCard(){openCard(`<div class="hd"><h2>👥 방 ${NET.code}</h2></div><p>방장이 시작하면 바로 들어가요! 기다리는 동안 안내서를 읽어 보세요.</p><div class="row2"><button class="btn alt" id="wg" type="button">📖 안내서</button></div>`,()=>{$('wg').onclick=()=>guideCard(waitCard)},'wait')}
function snap(){const pl={};for(const id in S.pl){const p=S.pl[id];pl[id]={n:p.n,x:r1(p.x),y:Math.round(p.y*100)/100,z:r1(p.z),yw:Math.round((p.yw||0)*100)/100,hp:Math.round(p.hp),al:p.al,sc:p.sc,it:p.it,col:p.col,bot:p.bot?1:0,mv:p.mv||0,sw:p.sw||0}}
  return{t:'s',s:{ph:S.ph,t:r1(S.t),rd:S.rd,nr:S.nr,dk:S.dk,op:S.op,vt:S.vt,wl:Math.round(S.wl*100)/100,wd:{x:r1(S.wd.x),z:r1(S.wd.z),s:r1(S.wd.s)},cs:S.cs.map(r1),deb:S.deb.map(d=>[r1(d.x),r1(d.y),r1(d.z),r1(d.vx),r1(d.vz)]),pl}}}
function onNet(d,from){if(!d||typeof d!=='object')return;
  if(NET.host&&from!=='host'){
    if(d.t==='hi'){if(Object.keys(NET.pl).length>=3){netTo(from,{t:'full'});return}NET.pl[from]={n:String(d.n||'친구').slice(0,10)};toast(`${NET.pl[from].n}님이 들어왔어요! 👋`,'good');netTo(from,{t:'you',id:from});
      if(S&&GAME.on){const i=Object.keys(S.pl).length;S.pl[from]=newPl(NET.pl[from].n,i);netTo(from,{t:'init',id:from})}else roomCard();return}
    if(d.t==='in'){if(!S)return;const p=S.pl[from];if(!p)return;if(isFinite(d.x)&&isFinite(d.z)&&isFinite(d.y)){p.x=clamp(+d.x,-70,70);p.y=clamp(+d.y,-5,30);p.z=clamp(+d.z,-70,70);p.yw=+d.yw||0;p.mv=+d.mv||0;p.sw=d.sw?1:0}
      if(isFinite(d.hp))p.hp=clamp(+d.hp,0,100);if(p.al&&d.al===0){p.al=0;evAll({k:'down',n:p.n,id:from})}
      if(Array.isArray(d.a))for(const a of d.a){if(!(a.s>(p.lastS||0)))continue;p.lastS=a.s;doAct(from,a,p)}return}
    if(d.t==='chat'){const n=NET.pl[from]?NET.pl[from].n:'친구';chatAdd(n,cleanChat(d.m));netSend({t:'chat',n,m:cleanChat(d.m),from});return}
    return}
  switch(d.t){
    case'you':NET.myId=d.id;break;
    case'init':ROLE.r='guest';NET.myId=d.id;startPlay();break;
    case's':if(ROLE.r==='guest'){V=d.s;const me=V.pl[NET.myId];if(me){ME.col=me.col;if(me.it!==undefined&&V.ph!=='fore')ME.item=me.it}}break;
    case'ev':onEv(d.e);break;
    case'chat':if(d.from!==NET.myId)chatAdd(d.n,d.m);break;
    case'full':toast('방이 꽉 찼어요 (최대 4명)','bad');break}}
let netT=0;
function netTick(dt){if(!NET.on)return;netT-=dt;if(netT>0)return;netT=.09;
  if(NET.guest){if(!GAME.on)return;const now=performance.now();ACTQ=ACTQ.filter(a=>!a.t0||now-a.t0<2500);ACTQ.forEach(a=>a.t0=a.t0||now);netSend({t:'in',x:r1(ME.x),y:Math.round(ME.y*100)/100,z:r1(ME.z),yw:Math.round(ME.yw*100)/100,mv:r1(ME.moveAmt||0),sw:ME.swim?1:0,hp:Math.round(ME.hp),al:ME.al,a:ACTQ.map(a=>{const o=Object.assign({},a);delete o.t0;return o})});return}
  if(NET.host&&S){netSend(snap());if(S.evq.length){const ev=S.evq.splice(0);for(const e of ev)netSend({t:'ev',e})}}}
const cleanChat=m=>String(m||'').replace(/[<>]/g,'').trim().slice(0,60);
function chatAdd(n,m){if(!m)return;const d=document.createElement('div');d.innerHTML=`<b>${esc(n)}</b> ${esc(m)}`;$('chatLog').appendChild(d);while($('chatLog').children.length>5)$('chatLog').firstChild.remove();setTimeout(()=>d.remove(),9000)}
function chatSend(m){m=cleanChat(m);if(!m)return;chatAdd(NET.nick||'나',m);if(NET.on){if(NET.host)netSend({t:'chat',n:NET.nick,m,from:'host'});else netSend({t:'chat',m})}}
function chatOpen(){if(!NET.on){toast('채팅은 친구와 함께 할 때 쓸 수 있어요');return}$('chatBar').hidden=false;if(document.pointerLockElement)document.exitPointerLock();for(const k in keys)keys[k]=false;$('chatIn').value='';$('chatIn').focus()}
function chatClose(){$('chatBar').hidden=true;$('chatIn').blur()}
$('chatF').addEventListener('submit',e=>{e.preventDefault();chatSend($('chatIn').value);chatClose()});$('chatIn').addEventListener('keydown',e=>{if(e.code==='Escape')chatClose();e.stopPropagation()});
document.querySelectorAll('#chatBar .qb').forEach(b=>b.onclick=()=>{chatSend(b.textContent);chatClose()});

/* ============ 시작 ============ */
const GAME={on:false};let LOB={nr:store.get('nr',7)};
function nick(){const v=($('nick')&&$('nick').value||'').trim().slice(0,10);if(v){NET.nick=v;store.set('nick',v)}if(!NET.nick)NET.nick='친구'+(Math.random()*90+10|0)}
function startPlay(){GAME.on=true;document.body.classList.remove('pre');closeCard();const a=Math.random()*TAU;Object.assign(ME,{x:SPOT.spawn.x+Math.cos(a)*2,z:SPOT.spawn.z+Math.sin(a)*2,y:1.2,vx:0,vy:0,vz:0,hp:100,al:1,item:'',obs:false,qd:-1});
  if(ROLE.r!=='guest'&&S&&S.pl.me){ME.x=S.pl.me.x;ME.z=S.pl.me.z;ME.col=S.pl.me.col}
  if(MEM){scene.remove(MEM.g);if(MEM.gh)scene.remove(MEM.gh);MEM=null}
  const goals=WX_GOALS.filter(g=>g.k!=='drink'||(S?S.order.includes('heat'):true));EL.start(EL.pickGoals(goals,3));
  EL.hud({left:'max(10px,env(safe-area-inset-left))',top:touchUI?'calc(max(10px,env(safe-area-inset-top)) + 112px)':'auto',bottom:touchUI?'auto':'calc(max(10px,env(safe-area-inset-bottom)) + 118px)'});EL.showHud(false);
  CAM.yaw=Math.PI*0;banner('🏝️ 날씨 생존 섬','관측하고 · 예보하고 · 살아남아요!')}
function beginHost(nr){ROLE.r=NET.on?'host':'solo';S=newState(nr);S.pl.me=newPl(NET.nick,0);let i=1;for(const id in NET.pl)S.pl[id]=newPl(NET.pl[id].n,i++);addBots();
  for(const k in MODELS){scene.remove(MODELS[k].g);if(MODELS[k].gh)scene.remove(MODELS[k].gh);delete MODELS[k]}startPlay();
  if(NET.on)for(const id in NET.pl)netTo(id,{t:'init',id})}
function lobby(){const best=store.get('best',0);
  openCard(`<div style="text-align:center;display:grid;gap:4px"><h1>🌦️ 날씨 생존 섬</h1><p>작은 섬마을에 이상한 날씨가 몰려와요! <b>관측소</b>에서 기압·습도·구름·바람을 살펴 <b>일기 예보</b>를 하고, 폭우·태풍·한파·폭염·황사·안개·뇌우에서 <b>살아남아요</b>.</p><p class="small">초5 과학 「날씨와 우리 생활」 · 1~4명 (빈자리는 로봇 친구) ${best?'· 🏅 최고 '+best+'점':''}</p></div>
   <label class="small">내 이름 <input class="inp" id="nick" maxlength="10" placeholder="예: 예보왕" value="${esc(NET.nick)}"></label>
   <div><div class="small" style="margin-bottom:4px">라운드</div><div class="seg" id="nrS"><button type="button" data-n="4" aria-pressed="${LOB.nr===4}"><b>⏱️ 짧게 4라운드</b><small>약 6분 · 날씨 4가지</small></button><button type="button" data-n="7" aria-pressed="${LOB.nr===7}"><b>🌈 전부 7라운드</b><small>약 10분 · 모든 날씨 재난</small></button></div></div>
   <div class="row2"><button class="btn" id="solo" type="button">▶ 혼자 시작</button><button class="btn blue" id="host" type="button">👥 방 만들기</button></div>
   <div class="row2"><input class="inp" id="code" inputmode="numeric" maxlength="4" placeholder="방 번호 4자리" style="width:150px"><button class="btn alt" id="join" type="button">🚪 방 들어가기</button></div>
   <div class="row2"><button class="btn alt sm" id="gd" type="button">📖 안내서</button><button class="btn alt sm" id="hp" type="button">🎮 조작법</button><button class="btn alt sm" id="bk" type="button">📘 날씨 개념 도감</button></div>`,()=>{
   ov.querySelectorAll('#nrS button').forEach(b=>b.onclick=()=>{LOB.nr=+b.dataset.n;store.set('nr',LOB.nr);ov.querySelectorAll('#nrS button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
   $('solo').onclick=()=>{nick();audio();beginHost(LOB.nr)};$('host').onclick=()=>{nick();audio();netStart(true)};$('join').onclick=()=>{nick();audio();netStart(false,$('code').value)};
   $('code').addEventListener('keydown',e=>{if(e.code==='Enter'){nick();audio();netStart(false,$('code').value)}});
   $('gd').onclick=()=>guideCard(lobby);$('hp').onclick=()=>helpCard(lobby);$('bk').onclick=()=>EL.book()},'lobby')}

/* ============ 소리 ============ */
let AC=null,master=null,rainG=null,windG=null;
function audio(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  const mk=(f,type)=>{const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=AC.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(master);s.start();return g};
  rainG=mk(2500,'lowpass');windG=mk(500,'bandpass')}if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(type,f1,f2,d,v,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
function noise(d,v,f,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const b=AC.createBuffer(1,AC.sampleRate*d|0,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f||1200;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t)}
function sfx(k){if(!AC)return;switch(k){
  case'good':tone('triangle',660,990,.15,.14);tone('triangle',990,1320,.18,.11,.12);break;case'bad':tone('sawtooth',300,120,.4,.12);break;
  case'click':tone('square',900,900,.04,.05);break;case'hit':noise(.25,.3,900);tone('square',200,80,.2,.1);break;case'down':tone('sawtooth',300,60,1,.15);break;
  case'drink':noise(.3,.06,700);tone('sine',400,500,.2,.05);break;case'beep':tone('square',1200,1200,.08,.08);tone('square',1200,1200,.08,.08,.15);break;
  case'thunder':noise(1.6,.55,300);noise(.3,.4,3000);tone('sawtooth',60,30,1.2,.15);break;
  case'alarm':for(let i=0;i<3;i++){tone('square',880,660,.25,.09,i*.32)}break}}
function audioStep(){if(!AC||!rainG)return;const w=W();const live=w&&(w.ph==='dis'||w.ph==='warn');const dk=w?w.dk:'';const ind=isIndoor(ME.x,ME.y+.5,ME.z);
  const r=live&&['rain','typhoon','storm'].includes(dk)?.35*WX.k*(ind?.4:1):0;const wd=live&&(dk==='typhoon'||dk==='snow'||dk==='dust')?(dk==='typhoon'?.5:.18)*WX.k*(ind?.35:1):.02;
  rainG.gain.setTargetAtTime(r,AC.currentTime,.3);windG.gain.setTargetAtTime(wd,AC.currentTime,.3)}

/* ============ 루프 ============ */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
let last=performance.now(),hudT=0,seaT=0;const T0=performance.now();
function frame(nw){const dt=Math.min(.05,Math.max(0,(nw-last)/1000));last=nw;const t=(nw-T0)/1000;
  try{if(GAME.on){moveMe(dt);
      if(ROLE.r!=='guest'&&S){const me=S.pl.me;if(me){Object.assign(me,{n:NET.nick,x:ME.x,y:ME.y,z:ME.z,yw:ME.yw,hp:ME.hp,mv:ME.moveAmt||0,sw:ME.swim?1:0});if(!ME.al)me.al=0;if(me.al)ME.al=1}hostStep(dt);if(!NET.on)S.evq.length=0}
      camStep(dt);syncModels(dt);drawTags();hudT-=dt;if(hudT<=0){hudT=.12;hud();audioStep()}EL.showHud(!!(W()&&ov.hidden));
      seaT-=dt;if(seaT<=0){seaT=1;const w=W();if(w&&(w.ph==='inter'||w.ph==='res')&&Math.hypot(ME.x,ME.z)>ISL-9)EL.see('seab','바닷가에선 낮엔 바다 → 육지로 해풍이 불어요')}}
    else{const r=58;camera.position.set(Math.sin(t*.05)*r,24,Math.cos(t*.05)*r);camera.lookAt(0,3,0)}
    weatherFx(dt,t);netTick(dt);renderer.render(scene,camera)}catch(err){console.error(err)}
  requestAnimationFrame(frame)}
buildIsland();FX.snowCov.geometry=FX.ground.geometry;FX.snowCov.position.y=.05;scene.add(FX.snowCov);setBoard(stationIdle());resize();
requestAnimationFrame(frame);lobby();
window.WXI={get S(){return S},get V(){return V},ME,NET,ROLE,CAM,DIS,beginHost,netStart,interact,vote,W,FX,hazard};

</script>
