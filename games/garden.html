<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>날씨 정원</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#9fd8ff;color:#0f172a;font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.45;cursor:default}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
body.pre .hud{display:none!important}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:12.5px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;text-align:center}
.tag.me{color:#fde68a}
.bub{position:absolute;transform:translate(-50%,-100%);font-size:30px;animation:bub 2.2s forwards}
@keyframes bub{0%{opacity:0;margin-top:10px}10%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-20px}}
.pop{position:absolute;transform:translate(-50%,-100%);font-size:14px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000,0 0 5px #000;white-space:nowrap;animation:popup 1.3s forwards}
@keyframes popup{from{margin-top:0;opacity:1}to{margin-top:-46px;opacity:0}}
/* 위쪽 HUD */
#coin{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:6;background:rgba(255,255,255,.92);border-radius:16px;padding:8px 14px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
#coin b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
#coin small{display:block;font-size:12px;color:#64748b;font-weight:700}
#wx{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#wx .w{background:rgba(15,23,42,.84);color:#fff;border-radius:14px;padding:7px 16px;font-weight:900;font-size:16px;white-space:nowrap}
#wx .w.on{background:linear-gradient(90deg,#1d4ed8,#7c3aed);animation:pulse 1.6s infinite}
#wx .s{background:rgba(255,255,255,.9);border-radius:10px;padding:3px 11px;font-size:12.5px;font-weight:800;white-space:nowrap}
#wx .s:empty{display:none}
@keyframes pulse{50%{transform:scale(1.04)}}
#board{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:6;background:rgba(255,255,255,.9);border-radius:14px;padding:7px 10px;font-size:12.5px;min-width:140px;max-width:200px}
#board h4{font-size:11.5px;color:#64748b;margin-bottom:2px;display:flex;justify-content:space-between;gap:6px}
#board .p{display:flex;justify-content:space-between;gap:8px;padding:1px 0;font-weight:700}
#board .p.me{color:#2563eb}
#board .p i{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
/* 오른쪽 버튼 */
#side{position:fixed;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:8px}
#side button{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(0,0,0,.15);font-size:22px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#side button small{font-size:10.5px;font-weight:800}
#side button.dot{position:relative}#side button.dot::after{content:'';position:absolute;right:5px;top:5px;width:11px;height:11px;border-radius:50%;background:#ef4444}
/* 아래 핫바 */
#bar{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;display:flex;gap:5px;max-width:calc(100vw - 20px);overflow-x:auto;padding:4px;background:rgba(15,23,42,.55);border-radius:16px;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.slot{flex:0 0 auto;width:58px;height:58px;border-radius:12px;background:rgba(255,255,255,.88);position:relative;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;border:3px solid transparent}
.slot small{font-size:9.5px;font-weight:800;margin-top:3px;max-width:54px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slot b{position:absolute;right:3px;top:2px;font-size:11px;font-weight:900;color:#0f172a}
.slot kbd{position:absolute;left:4px;top:2px;font-size:9px;color:#64748b;font-family:inherit;font-weight:800}
.slot.sel{border-color:#facc15;background:#fffbeb;transform:translateY(-3px)}
#prompt{position:fixed;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 84px);transform:translateX(-50%);z-index:6;background:#16a34a;color:#fff;border-radius:14px;padding:10px 18px;font-weight:900;font-size:16px;box-shadow:0 4px 0 #14532d;white-space:nowrap}
#prompt[hidden]{display:none}
#hint{position:fixed;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 84px);transform:translateX(-50%);z-index:5;background:rgba(15,23,42,.78);color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none}
#hint:empty,#prompt:not([hidden])~#hint{display:none}
#room{position:fixed;left:max(10px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 64px);z-index:6;background:rgba(37,99,235,.9);color:#fff;border-radius:10px;padding:4px 10px;font-size:12.5px;font-weight:800}
#room:empty{display:none}
#emo{position:fixed;left:max(10px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 96px);z-index:6;display:flex;flex-direction:column;gap:4px}
#emo button{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.85);font-size:20px}
#emo[hidden]{display:none}
/* 토스트·배너 */
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(15,23,42,.9);color:#fff;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:800;animation:tin .25s;max-width:86vw;text-align:center}
.toast.good{background:rgba(21,128,61,.94)}.toast.bad{background:rgba(185,28,28,.94)}.toast.gold{background:linear-gradient(90deg,#b45309,#a21caf)}
body.panel #toast{top:auto;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 8px)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
#banner{position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:29;text-align:center;font-size:40px;font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.45);opacity:0;transition:opacity .4s;pointer-events:none;width:94vw}
#banner.on{opacity:1}
#banner small{display:block;font-size:16px;margin-top:6px;font-weight:800}
#flash{position:fixed;inset:0;z-index:2;pointer-events:none;background:#fff;opacity:0}
/* 터치 */
#touch{position:fixed;inset:0;z-index:5;pointer-events:none;display:none}
body.touch #touch{display:block}
.joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 92px);width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);pointer-events:auto;touch-action:none}
.joy i{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.7)}
.tb{position:absolute;pointer-events:auto;width:66px;height:66px;border-radius:50%;background:rgba(15,23,42,.55);color:#fff;border:2px solid rgba(255,255,255,.55);font-weight:900;font-size:12px;line-height:1.15;touch-action:none}
.tb span{display:block;font-size:22px}
#tH{right:max(78px,calc(env(safe-area-inset-right) + 78px));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 100px);width:76px;height:76px;background:rgba(22,163,74,.7)}
#tJ{right:max(16px,env(safe-area-inset-right));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 170px)}
/* 카드(가게·가방·로비) */
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.35);padding:12px}
#ov[hidden]{display:none}
#ov.lob{background:linear-gradient(180deg,rgba(14,165,233,.25),rgba(15,23,42,.45))}
.card{background:#fff;border-radius:22px;padding:18px 18px 14px;width:min(560px,100%);max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3);position:relative}
.card h2{font-size:22px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card h2 small{font-size:13px;color:#64748b;font-weight:700;margin-left:auto}
.card .x{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:#f1f5f9;font-size:18px;font-weight:900}
.card p.d{font-size:14px;color:#334155;line-height:1.5;margin-bottom:8px}
.lobT{font-size:34px;font-weight:900;text-align:center;letter-spacing:-1px}
.lobS{text-align:center;color:#334155;font-size:14.5px;line-height:1.55;margin:6px 0 4px}
.lobM{text-align:center;color:#64748b;font-size:12.5px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn{background:#22c55e;color:#fff;border-radius:14px;padding:11px 16px;font-weight:900;font-size:16px;box-shadow:0 4px 0 #15803d}
.btn.b2{background:#3b82f6;box-shadow:0 4px 0 #1d4ed8}
.btn.b3{background:#f1f5f9;color:#0f172a;box-shadow:0 4px 0 #cbd5e1}
.btn.b4{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:11px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
input.in{font:inherit;font-size:16px;border:2px solid #cbd5e1;border-radius:12px;padding:9px 12px;outline:none;min-width:0}
input.in:focus{border-color:#22c55e}
label.l{display:block;font-size:12.5px;color:#64748b;font-weight:700;margin-top:6px}
.tabs{display:flex;gap:6px;margin:6px 0 8px}
.tabs button{flex:1;padding:8px;border-radius:11px;background:#f1f5f9;font-weight:800;font-size:14px}
.tabs button.on{background:#16a34a;color:#fff}
.list{display:flex;flex-direction:column;gap:6px}
.it{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;background:#f8fafc;border-radius:14px;padding:7px 9px;border:2px solid #e2e8f0}
.it .e{font-size:30px;text-align:center;line-height:1}
.it .n{font-weight:900;font-size:15px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.it .n .r{font-size:10.5px;font-weight:900;color:#fff;border-radius:6px;padding:1px 6px}
.it .m{font-size:12px;color:#475569;margin-top:2px;line-height:1.35}
.it .m b{color:#0f172a}
.it .a{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.it .a .pr{font-weight:900;font-size:14px;white-space:nowrap}
.it.out{opacity:.5}
.it.lock{border-color:#facc15;background:#fffbeb}
.mut{display:inline-block;font-size:10.5px;font-weight:900;border-radius:6px;padding:1px 5px;background:#e0e7ff;color:#3730a3}
.rb{background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e,#3b82f6,#a855f7)!important}
.sum{background:#f0fdf4;border-radius:14px;padding:10px 12px;margin:6px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800}
.sum b{font-size:20px}
.qz{font-size:18px;font-weight:900;line-height:1.45;margin:8px 0 10px}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qo button{background:#eff6ff;border:2px solid #bfdbfe;border-radius:14px;padding:12px 8px;font-weight:800;font-size:15px;line-height:1.35}
.qo button.ok{background:#22c55e;border-color:#15803d;color:#fff}.qo button.no{background:#fee2e2;border-color:#ef4444}
.help li{margin:4px 0 4px 18px;font-size:14px;line-height:1.5}
.empty{color:#64748b;text-align:center;padding:16px;font-size:14px}
@media (max-width:640px){
 #coin b{font-size:18px}#coin{padding:6px 10px}
 #board{display:none}body.mp #board{display:block;top:auto;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 76px);right:auto;left:max(10px,env(safe-area-inset-left));min-width:0;font-size:11px;padding:5px 8px}
 #wx .w{font-size:14px;padding:6px 12px}
 .slot{width:52px;height:52px;font-size:21px}
 #side button{width:50px;height:50px;font-size:19px}
 #side{top:auto;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 260px);transform:none}
 .lobT{font-size:28px}
}
</style>

  for(const [f] of ripe){if(k==='rain'||k==='storm'){if(Math.random()<.012*p){if(f.m&MB.chill){f.m=f.m&~MB.chill|MB.frozen}else if(!(f.m&MB.frozen))f.m|=MB.wet;GAME.dirty=true}}

    if(cand.length){const c=cand[Math.random()*cand.length|0],pl=S.cells[c],s=SEEDS[pl.s];const [x,z]=cellPos(GAME.idx,c);
      if(k==='storm'){bolt(x,z);flash();SND.thunder();let n=0;pl.f.forEach(f=>{if(isRipe(s,pl,f)){f.m|=MB.shock;n++}});if(n)toast(`⚡ 번개가 ${s.e} ${s.n}에 떨어졌어요! 찌릿 열매 ${n}개`,'gold')}

 ['바람이 불어오는 방향을 알려 주는 도구는?',['풍향계','우량계','온도계','저울'],'풍향계의 화살표는 바람이 불어오는 쪽을 가리켜요. 북쪽에서 불어오면 북풍이에요.'],
 ['바람은 어디에서 어디로 불까요?',['고기압 → 저기압','저기압 → 고기압','바다 → 하늘','남쪽 → 북쪽만'],'두 곳의 기압 차이 때문에 공기가 고기압에서 저기압으로 움직이는 것이 바람이에요.'],
 ['맑은 날 낮에 바닷가에서는 바람이 어느 쪽으로 불까요?',['바다 → 육지','육지 → 바다','위 → 아래','바람이 안 불어요'],'낮에는 육지가 바다보다 빨리 데워져 육지가 저기압이 돼요. 그래서 바다에서 육지로 해풍이 불어요.'],
 ['맑은 날 밤에 바닷가에서는 바람이 어느 쪽으로 불까요?',['육지 → 바다','바다 → 육지','아래 → 위','바람이 안 불어요'],'밤에는 육지가 바다보다 빨리 식어 바다 쪽이 저기압이 돼요. 그래서 육지에서 바다로 육풍이 불어요.'],
 ['우리나라 겨울에 차고 건조한 공기 덩어리는 어디에서 올까요?',['북서쪽 대륙','남동쪽 바다','남서쪽 바다','북동쪽 바다'],'북서쪽 대륙에서 오는 공기 덩어리는 차갑고 건조해서 겨울이 춥고 건조해요.'],
 ['우리나라 여름에 덥고 습한 공기 덩어리는 어디에서 올까요?',['남동쪽 바다','북서쪽 대륙','북쪽 극지방','서쪽 사막'],'남동쪽 바다에서 오는 공기 덩어리는 따뜻하고 습해서 여름이 덥고 습해요.'],
 ['공기 덩어리가 바다 위에 오래 머물면 어떤 성질을 띨까요?',['습해져요','건조해져요','무거워져요','색이 변해요'],'공기 덩어리는 머문 곳의 성질을 닮아요. 바다 위는 습하고, 대륙 위는 건조해요.'],
 ['같은 부피일 때 더 무거운 공기는?',['차가운 공기','따뜻한 공기','둘 다 같아요','공기는 무게가 없어요'],'차가운 공기는 알갱이가 촘촘해 같은 부피에서 더 무거워요. 그래서 기압이 높아요.'],
 ['공기의 무게 때문에 생기는 누르는 힘을 무엇이라고 할까요?',['기압','습도','기온','풍속'],'공기도 무게가 있어 물체를 눌러요. 이 힘이 기압이에요.'],
 ['주변보다 기압이 높은 곳을 무엇이라고 할까요?',['고기압','저기압','진공','태풍'],'주변보다 기압이 높으면 고기압, 낮으면 저기압이에요. 고기압일 때는 대체로 날씨가 맑아요.'],

 ['구름 속 작은 물방울이 합쳐져 무거워지면 어떻게 될까요?',['비가 되어 떨어져요','더 높이 올라가요','사라져요','얼음으로만 변해요'],'작은 물방울이 서로 합쳐져 커지고 무거워지면 떨어지는데, 이것이 비예요.'],
 ['구름 속 얼음 알갱이가 녹지 않고 땅까지 내려오면?',['눈','비','이슬','안개'],'얼음 알갱이가 커져 떨어질 때 녹지 않으면 눈, 녹으면 비가 돼요.'],
 ['응결이란 무엇일까요?',['수증기가 물방울로 변하는 것','물이 수증기로 변하는 것','물이 얼음이 되는 것','얼음이 녹는 것'],'공기 중 수증기가 차가워져 물방울로 변하는 것을 응결이라고 해요. 이슬·안개·구름이 모두 응결로 생겨요.'],

 ['습도가 높은 날 일어나는 일로 알맞은 것은?',['빨래가 잘 안 말라요','빨래가 아주 빨리 말라요','정전기가 많이 생겨요','눈이 와요'],'습도가 높으면 공기 중 수증기가 많아 물이 잘 증발하지 않아요. 곰팡이도 잘 생겨요.'],
 ['습도가 너무 낮을 때 할 수 있는 일은?',['가습기를 틀거나 젖은 수건을 널어요','제습기를 틀어요','창문을 꼭 닫고 난로만 켜요','물을 마시지 않아요'],'건조할 때는 가습기나 젖은 수건으로 습도를 높여요. 너무 습할 때는 제습기를 써요.'],
 ['일기 예보에서 "강수 확률"은 무엇을 뜻할까요?',['비나 눈이 올 가능성','바람의 세기','기온','미세먼지 양'],'강수 확률 70%는 비나 눈이 올 가능성이 높다는 뜻이에요. 우산을 챙기면 좋아요.'],

 ['높은 건물 꼭대기에 번개를 안전하게 땅으로 흘려보내는 장치는?',['피뢰침','풍향계','안테나','우량계'],'피뢰침은 번개의 전기를 땅으로 안전하게 흘려보내 건물을 지켜요.'],
 ['천둥·번개가 칠 때 안전한 행동은?',['건물 안으로 들어가요','큰 나무 밑에 서 있어요','넓은 운동장 가운데 있어요','우산을 높이 들어요'],'번개는 높은 곳에 잘 떨어져요. 나무 밑이나 넓은 곳은 위험하니 건물 안으로 피해요.'],
 ['황사는 주로 어디에서 날아올까요?',['중국·몽골의 사막','태평양 바다','북극','남극'],'봄철 중국·몽골 사막의 모래 먼지가 바람을 타고 우리나라까지 날아와요. 마스크를 써요.'],
 ['태풍은 주로 어디에서 만들어질까요?',['따뜻한 열대 바다','차가운 극지방','높은 산꼭대기','사막'],'태풍은 따뜻한 열대 바다에서 수증기를 많이 얻어 만들어지는 강한 저기압이에요.'],
 ['폭염 경보가 내렸을 때 알맞은 행동은?',['물을 자주 마시고 한낮 바깥 활동을 줄여요','한낮에 운동장을 달려요','물을 마시지 않아요','두꺼운 옷을 입어요'],'폭염 때는 물을 자주 마시고 시원한 곳에서 쉬며, 한낮(12~17시) 바깥 활동을 줄여요.'],
 ['식물이 빛을 받아 스스로 양분을 만드는 일은?',['광합성','증산 작용','호흡','수분'],'잎은 빛 에너지와 물, 이산화 탄소로 양분(녹말)을 만들어요. 이것이 광합성이에요.'],
 ['광합성에 꼭 필요한 것이 아닌 것은?',['소금','빛','물','이산화 탄소'],'광합성에는 빛, 물, 이산화 탄소가 필요해요. 그 결과 양분과 산소가 만들어져요.'],
 ['뿌리가 하는 일로 알맞은 것은?',['물을 흡수해요','꽃가루를 만들어요','빛을 모아요','씨를 퍼뜨려요'],'뿌리는 땅속의 물을 흡수하고 식물을 지지해요. 양분을 저장하는 뿌리도 있어요(당근·고구마).'],
 ['줄기가 하는 일은?',['물과 양분이 이동하는 통로예요','빛을 받아 양분을 만들어요','꽃가루를 옮겨요','씨를 만들어요'],'줄기는 뿌리에서 흡수한 물을 잎으로, 잎에서 만든 양분을 온몸으로 보내는 통로예요.'],
 ['잎에 도달한 물이 기공을 통해 수증기로 빠져나가는 것은?',['증산 작용','광합성','응결','수정'],'증산 작용은 뿌리에서 물을 끌어올리고 식물의 온도를 조절해요.'],
 ['벌·나비가 꽃가루를 옮겨 주는 것을 무엇이라고 할까요?',['수분(꽃가루받이)','증산','발아','광합성'],'꽃가루가 암술에 옮겨 붙는 것을 꽃가루받이라고 해요. 그래야 씨와 열매가 생겨요.'],
 ['꽃이 하는 가장 중요한 일은?',['씨를 만들어요','물을 흡수해요','양분을 만들어요','식물을 지지해요'],'꽃가루받이가 일어나면 꽃에서 씨가 만들어지고, 씨를 싸고 있는 부분이 열매로 자라요.'],
 ['씨가 싹 트는 데 꼭 필요한 조건은?',['알맞은 온도와 물','많은 비료','소금물','어둠만'],'씨가 싹 트려면 알맞은 양의 물과 온도가 필요해요. 싹 튼 뒤 잘 자라려면 빛도 필요해요.'],
 ['씨를 심은 뒤 가장 먼저 나오는 것은?',['뿌리와 떡잎','꽃','열매','단풍잎'],'씨에서 뿌리가 먼저 나와 땅을 붙잡고, 이어서 떡잎이 땅 위로 올라와요.'],
 ['식물의 한살이 순서로 알맞은 것은?',['씨 → 싹 → 잎·줄기 → 꽃 → 열매','꽃 → 씨 → 열매 → 싹','열매 → 꽃 → 싹 → 씨','싹 → 열매 → 씨 → 꽃'],'씨가 싹 트고 자라 꽃이 피고, 열매를 맺어 다시 씨를 남겨요. 이 과정을 한살이라고 해요.'],
 ['한해살이 식물과 여러해살이 식물의 차이는?',['한 해 안에 한살이를 마치는지 여부','꽃 색깔','잎의 개수','키의 크기'],'벼·옥수수처럼 한 해 안에 씨를 남기고 죽으면 한해살이, 사과나무처럼 여러 해 사는 것은 여러해살이 식물이에요.'],
 ['열매 속에 씨가 있는 까닭은?',['씨를 퍼뜨려 자손을 남기려고','물을 저장하려고','빛을 모으려고','무거워지려고'],'동물이 열매를 먹고 씨를 퍼뜨리거나, 바람·물에 씨가 날아가 새로운 곳에서 싹 트도록 해요.'],
 ['같은 식물이라도 비가 알맞게 오면 잘 자라는 까닭은?',['식물이 자라는 데 물이 필요해서','비가 열매를 크게 칠해서','비가 해를 가려서','비가 씨를 없애서'],'물은 광합성의 재료이고, 양분을 옮기는 데도 쓰여요. 그래서 알맞은 비는 식물에게 도움이 돼요.'],
 ['태양광 발전은 어떤 에너지를 전기 에너지로 바꿀까요?',['빛 에너지','소리 에너지','화학 에너지','위치 에너지'],'태양 전지는 햇빛의 빛 에너지를 전기 에너지로 바꿔요.'],
 ['풍력 발전은 무엇의 힘으로 전기를 만들까요?',['바람','파도','석탄','지열'],'바람이 날개를 돌리면 발전기가 운동 에너지를 전기 에너지로 바꿔요.'],
 ['재생 에너지가 아닌 것은?',['석탄','태양광','풍력','수력'],'석탄·석유는 쓰면 다시 만들기 어려운 화석 연료예요. 햇빛·바람·물은 계속 다시 얻을 수 있어요.'],
 ['이슬과 구름의 공통점은?',['수증기가 응결해서 생겨요','얼음으로만 되어 있어요','땅에서만 생겨요','낮에만 생겨요'],'이슬은 물체 표면에서, 구름은 높은 하늘에서 수증기가 응결해 생겨요.'],
 ['기온은 보통 하루 중 언제 가장 높을까요?',['오후 2시 무렵','해 뜰 무렵','자정','아침 7시'],'태양이 가장 높은 정오보다 조금 늦은 오후 2시 무렵 땅이 가장 많이 데워져 기온이 가장 높아요.'],

let liveT=null;

  S.qdeck=(S.qdeck&&S.qdeck.length)?S.qdeck:QZ.map((_,i)=>i).sort(()=>Math.random()-.5);const qi=S.qdeck.pop(),q=QZ[qi];const opts=q[1].map((t,i)=>[t,i]).sort(()=>Math.random()-.5);const reward=Math.max(40,Math.min(50000,Math.round(S.coins*.08)));
  openCard(`<button class="x" type="button">✕</button><h2>🧑‍🔬 날씨 박사의 퀴즈 <small>연속 정답 ${S.qstreak||0}</small></h2><p class="d">맞히면 <b>🪙 ${fmt(reward)}</b>! 3문제 연속으로 맞히면 씨앗 선물!</p><div class="qz">${q[0]}</div><div class="qo">${opts.map(([t,i])=>`<button type="button" data-i="${i}">${t}</button>`).join('')}</div><div id="qExp"></div>`);liveT=null;
  $('ov').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(S.quizT>now()-1)return;S.quizT=now();const ok=b.dataset.i==='0';S.qN=(S.qN||0)+1;$('ov').querySelectorAll('[data-i]').forEach(x=>{x.disabled=true;if(x.dataset.i==='0')x.classList.add('ok')});

  if(!id||id===NET.myId)return;
  if(d.t==='st'){const p=upsert(id,{x:+d.x||0,z:+d.z||0,y:+d.y||0,ry:+d.ry||0,mv:!!d.mv,petK:(d.pk||[]).filter(k=>PETS[k]).slice(0,3),coins:+d.c||0});if(d.n&&!p.n)p.n=String(d.n).slice(0,8);if(p.idx==null&&d.idx!=null)upsert(id,{idx:d.idx})}
  else if(d.t==='gd'){const p=upsert(id,{});const g=gdUnpack(d);p.cells=g.cells;p.spr=g.spr}
  else if(d.t==='emo'){if(PL[id]&&typeof d.e==='string'&&d.e.length<=4)emote(d.e,id)}}
function lobbyBtns(on){document.querySelectorAll('#lobby .btn').forEach(b=>b.disabled=!on)}
function onlineHud(){$('room').textContent=`👥 방 번호 ${NET.code}`;$('emo').hidden=false;document.body.classList.add('mp')}
function netStart(asHost,code){if(!window.Peer){toast('친구와 함께 하기를 불러오지 못했어요 (인터넷 확인)','bad');return}
  code=asHost?String(1000+Math.floor(Math.random()*9000)):String(code||'').replace(/\D/g,'').slice(0,4);if(code.length!==4){toast('방 번호 4자리를 적어 주세요','bad');return}
  const hid='wgarden-v1-'+code;toast(asHost?'방을 만드는 중…':'방에 들어가는 중…');lobbyBtns(false);NET.code=code;
  const pc=new Peer(asHost?hid:undefined,Object.assign({debug:0},window.ERV_PEERCFG||{}));NET.pc=pc;let done=false;
  const fail=m=>{try{pc.destroy()}catch(e){}toast(m,'bad');lobbyBtns(true)};
  const to=setTimeout(()=>{if(!done)fail(asHost?'방을 만들지 못했어요. 잠시 뒤 다시 해 주세요.':'방을 찾지 못했어요. 번호를 확인해 주세요.')},20000);
  pc.on('error',e=>{if(!done){clearTimeout(to);fail(e.type==='unavailable-id'?'그 방 번호는 이미 쓰고 있어요':e.type==='peer-unavailable'?'그 번호의 방이 없어요':'연결에 실패했어요 ('+(e.type||'오류')+')')}});
  pc.on('open',()=>{if(asHost){done=true;clearTimeout(to);Object.assign(NET,{on:true,host:true,code});startGame(0);onlineHud();toast(`👥 방을 열었어요! 방 번호 <b>${code}</b> — 친구에게 알려 주세요`,'good',5000);return}
    const hc=pc.connect(hid,{reliable:true});NET.hc=hc;hc.on('open',()=>{done=true;clearTimeout(to);hc.send({t:'hi',n:NET.nick})});
    hc.on('data',d=>onNet(d,'h'));hc.on('close',()=>{if(NET.guest){save();banner('방이 닫혔어요','방장이 나갔어요. 내 정원은 저장돼 있어요!');setTimeout(()=>location.reload(),3500)}})});
  pc.on('connection',c=>{if(!asHost){c.close();return}c.on('open',()=>NET.conns.set(c.peer,c));c.on('data',d=>onNet(d,c.peer));c.on('close',()=>{NET.conns.delete(c.peer);if(NET.pl[c.peer]){delete NET.pl[c.peer];dropPl(c.peer);relay({t:'left',id:c.peer})}})})}

/* ---------- 로비 ---------- */
$('solo').onclick=()=>{audio();nick();startGame(0)};
$('host').onclick=()=>{audio();nick();netStart(true)};
$('join').onclick=()=>{audio();nick();netStart(false,$('code').value)};
$('code').addEventListener('keydown',e=>{if(e.code==='Enter'){audio();nick();netStart(false,$('code').value)}});
function showLobby(){$('ov').className='lob';$('ov').hidden=false;$('ov').innerHTML='';$('ov').appendChild(LOBBY);const b=$('mwgBar');if(b)b._mwg=0;GAME.panel=null}
const LOBBY=$('lobby');
$('lHelp').onclick=()=>{helpCard(()=>showLobby())};
$('lReset').onclick=()=>{if(!confirmReset){confirmReset=1;$('lReset').textContent='⚠️ 한 번 더 누르면 지워져요';setTimeout(()=>{confirmReset=0;$('lReset').textContent='🗑️ 정원 처음부터'},3000);return}S=freshSave();save();location.reload()};
let confirmReset=0;
if(S.earned>0||S.cells.some(Boolean))$('solo').textContent='▶ 내 정원 이어서';

</script>
<script>/*MWGT*/(function(){if(!window.MWG)return;MWG.connect('garden');MWG.host(function(){return NET.on&&NET.host&&NET.code?{code:NET.code,name:(NET.nick||'친구')+'의 방',n:1+Object.keys(NET.pl||{}).length,max:6,open:true,info:'날씨 정원'}:{}});
setInterval(function(){var el=document.getElementById('mwgBar');if(!el||el._mwg)return;el._mwg=1;MWG.bar(el,{join:function(c){var i=document.getElementById('code');if(i)i.value=c;var b=document.getElementById('join');if(b)b.click()},create:function(){var b=document.getElementById('host');if(b)b.click()}})},400);})()</script>
