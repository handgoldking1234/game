(function(){

/* ---------- 단계(친구들) ---------- */

];

function emblem(c,l,s,col){ /* 이마 장식: 정책 아이콘 */
 var u=s/10;c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=Math.max(1.4,u*1.5);c.lineCap='round';c.lineJoin='round';c.beginPath();

  case 3:for(var k=0;k<10;k++){var a=-Math.PI/2+k*Math.PI/5,r=k%2?2.2*u:5*u;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath();c.fill();break;
  case 4:c.moveTo(-4.8*u,-3*u);c.lineTo(-3.3*u,-3*u);c.lineTo(-2*u,1.6*u);c.lineTo(3.3*u,1.6*u);c.lineTo(4.4*u,-1.6*u);c.lineTo(-2.8*u,-1.6*u);c.stroke();c.beginPath();c.arc(-1.4*u,3.8*u,1*u,0,7);c.arc(2.7*u,3.8*u,1*u,0,7);c.fill();break;
  case 5:c.moveTo(-4.6*u,-1.2*u);c.lineTo(0,-4.6*u);c.lineTo(4.6*u,-1.2*u);c.closePath();c.fill();[-3.2,-.7,1.8].forEach(function(x){c.fillRect(x*u,-.2*u,1.4*u,3.4*u)});c.fillRect(-4.6*u,3.6*u,9.2*u,1.2*u);break;
  case 6:c.moveTo(-2.4*u,-5*u);c.lineTo(-.6*u,-1.6*u);c.moveTo(2.4*u,-5*u);c.lineTo(.6*u,-1.6*u);c.stroke();c.beginPath();c.arc(0,1.6*u,3.4*u,0,7);c.fill();break;
  case 7:c.arc(0,0,4.5*u,0,7);c.stroke();c.beginPath();c.ellipse(0,0,2*u,4.5*u,0,0,7);c.stroke();c.beginPath();c.moveTo(-4.5*u,0);c.lineTo(4.5*u,0);c.stroke();break;
  case 8:c.moveTo(-5*u,3.4*u);c.lineTo(-5.4*u,-2.8*u);c.lineTo(-2.3*u,.4*u);c.lineTo(0,-4.4*u);c.lineTo(2.3*u,.4*u);c.lineTo(5.4*u,-2.8*u);c.lineTo(5*u,3.4*u);c.closePath();c.fill();break;
 }
 c.restore();
}
/* mood: 0 보통, 1 신남, 2 걱정 */
function face(c,l,r,mood,blink){
 var ex=r*.3,ey=r*.16,er=Math.max(1.6,r*.125),ink=l===0?'#fff':'#2a2140';
 if(l===0){c.fillStyle='#17132f';c.beginPath();c.ellipse(0,ey,r*.78,r*.27,0,0,7);c.fill()}
 c.fillStyle=ink;c.strokeStyle=ink;c.lineCap='round';c.lineWidth=Math.max(1.4,r*.07);
 if(blink||mood===1){[-1,1].forEach(function(s){c.beginPath();if(mood===1)c.arc(s*ex,ey+er*.4,er,Math.PI+.35,-.35);else{c.moveTo(s*ex-er,ey);c.lineTo(s*ex+er,ey)}c.stroke()})}
 else{[-1,1].forEach(function(s){c.beginPath();c.ellipse(s*ex,ey,er,er*1.15,0,0,7);c.fill();if(r>12){c.fillStyle=l===0?'#17132f':'#fff';c.beginPath();c.arc(s*ex-er*.3,ey-er*.4,er*.38,0,7);c.fill();c.fillStyle=ink}})}
 if(l===0){c.strokeStyle='#17132f';c.lineWidth=Math.max(1.4,r*.08);c.beginPath();c.moveTo(-ex-er*1.3,ey-er*2);c.lineTo(-ex+er,ey-er*1.2);c.moveTo(ex+er*1.3,ey-er*2);c.lineTo(ex-er,ey-er*1.2);c.stroke();
  c.strokeStyle='#fff';c.lineWidth=Math.max(1.4,r*.07);c.beginPath();c.moveTo(-r*.2,r*.56);c.quadraticCurveTo(0,r*.68,r*.26,r*.5);c.stroke();return}
 c.fillStyle='rgba(255,90,120,.38)';c.beginPath();c.ellipse(-r*.54,r*.36,r*.14,r*.09,0,0,7);c.ellipse(r*.54,r*.36,r*.14,r*.09,0,0,7);c.fill();
 c.strokeStyle=ink;c.fillStyle=ink;c.lineWidth=Math.max(1.3,r*.06);c.beginPath();
 if(mood===1){c.moveTo(-r*.17,r*.36);c.quadraticCurveTo(0,r*.74,r*.17,r*.36);c.closePath();c.fill();c.fillStyle='#ff7a9a';c.beginPath();c.ellipse(0,r*.5,r*.08,r*.05,0,0,7);c.fill()}
 else if(mood===2){c.ellipse(0,r*.46,r*.07,r*.09,0,0,7);c.stroke();c.fillStyle='#8fdcff';c.beginPath();c.moveTo(r*.7,-r*.2);c.quadraticCurveTo(r*.82,r*.02,r*.7,r*.06);c.quadraticCurveTo(r*.58,r*.02,r*.7,-r*.2);c.fill()}
 else{c.moveTo(-r*.13,r*.38);c.quadraticCurveTo(0,r*.52,r*.13,r*.38);c.stroke()}
}
function ballArt(c,l,r,mood,blink,label){
 var L=LV[l],lw=Math.max(2,r*.085);

 c.beginPath();c.arc(0,0,r-lw/2,0,7);c.fillStyle=g;c.fill();c.lineWidth=lw;c.strokeStyle=L.d;c.stroke();
 c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(-r*.4,-r*.52,r*.2,r*.1,-.65,0,7);c.fill();c.beginPath();c.arc(-r*.6,-r*.3,r*.05,0,7);c.fill();
 c.save();c.translate(0,-r*.42);emblem(c,l,r*.27,l===0?'#ff7a9a':'rgba(255,255,255,.95)');c.restore();
 face(c,l,r,mood||0,blink);
 if(label&&r>=46){c.font='900 '+Math.max(11,Math.round(r*.19))+'px '+FONT;c.textAlign='center';c.textBaseline='middle';c.lineWidth=Math.max(3,r*.07);c.strokeStyle=L.d;c.lineJoin='round';c.strokeText(L.nm,0,r*.74);c.fillStyle='#fff';c.fillText(L.nm,0,r*.74)}

var ICON={};
function iconURL(l,mood){var k=l+'_'+(mood||0);if(ICON[k])return ICON[k];var o=document.createElement('canvas');o.width=o.height=160;var c=o.getContext('2d');c.translate(80,80);ballArt(c,l,74,mood||0,false,false);return ICON[k]=o.toDataURL()}

 G.cur=G.next;G.next=gen();G.cool=.5;sfx.drop();renderUI();
 if(l===0&&!G.seen.bad){G.seen.bad=1;toast('담합이 등장! 합쳐지지 않아요. 공정 조사로 잡아요',0,'bad')}
}

}
function probe(){
 if(!G||G.over)return;var bad=G.balls.filter(function(b){return b.l===0});
 if(!bad.length){toast('지금은 담합이가 없어요');return}

}

/* ---------- 물리 ---------- */
function step(dt){
 var B=G.balls,i,j,a,b;
 for(i=0;i<B.length;i++){a=B[i];a.vy+=300*dt;a.vx*=.996;a.x+=a.vx*dt;a.y+=a.vy*dt}
 for(var it=0;it<4;it++){
  for(i=0;i<B.length;i++){a=B[i];if(a.dead)continue;
   for(j=i+1;j<B.length;j++){b=B[j];if(b.dead)continue;var dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;if(d2>=rr*rr)continue;
    if(a.l===b.l&&a.l>0){merge(a,b);break}
    var d=Math.sqrt(d2)||.01,nx=dx/d,ny=dy/d,ov=rr-d,ma=a.r*a.r,mb=b.r*b.r,ta=mb/(ma+mb),tb=ma/(ma+mb);
    a.x-=nx*ov*ta;a.y-=ny*ov*ta;b.x+=nx*ov*tb;b.y+=ny*ov*tb;
    var rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;
    if(vn<0){if(vn<-40){if(!a.hit)a.sq=.25;if(!b.hit)b.sq=.25}
     var jn=-(1.12)*vn/(1/ma+1/mb);a.vx-=jn*nx/ma;a.vy-=jn*ny/ma;b.vx+=jn*nx/mb;b.vy+=jn*ny/mb;
     var tx=-ny,ty=nx,vt=rvx*tx+rvy*ty,jt=-vt*.12/(1/ma+1/mb);a.vx-=jt*tx/ma;a.vy-=jt*ty/ma;b.vx+=jt*tx/mb;b.vy+=jt*ty/mb}
    a.hit=b.hit=true}
   if(a.dead)continue;
   if(a.x<a.r){a.x=a.r;if(a.vx<0)a.vx*=-.2}if(a.x>BW-a.r){a.x=BW-a.r;if(a.vx>0)a.vx*=-.2}
   if(a.y>BH-a.r){a.y=BH-a.r;if(a.vy>40&&!a.hit)a.sq=.25;if(a.vy>0)a.vy*=-.12;a.vx*=.96;a.hit=true}}
 }
 if(B.some(function(x){return x.dead}))G.balls=B.filter(function(x){return !x.dead});
}

function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}

var clouds=[];for(var ci=0;ci<7;ci++)clouds.push({x:R(),y:.04+R()*.9,s:.7+R()*1.1,v:.003+R()*.006});
var twk=[];for(ci=0;ci<26;ci++)twk.push({x:R(),y:R(),p:R()*6,s:2+R()*3});
function drawBg(now,dt){

 cx.fillStyle='rgba(255,255,255,.75)';clouds.forEach(function(c){c.x+=c.v*dt;if(c.x>1.15)c.x=-.2;var x=c.x*W,y=c.y*H,s=c.s*34;cx.beginPath();cx.arc(x,y,s*.6,0,7);cx.arc(x+s*.6,y-s*.25,s*.55,0,7);cx.arc(x+s*1.2,y,s*.6,0,7);cx.arc(x+s*.6,y+s*.15,s*.6,0,7);cx.fill()});
 twk.forEach(function(t){cx.globalAlpha=.25+.45*Math.abs(Math.sin(now/600+t.p));cx.fillStyle='#fff';star(t.x*W,t.y*H,t.s,t.p)});cx.globalAlpha=1;
}
function draw(now,dt){
 cx.clearRect(0,0,W,H);drawBg(now,dt);
 var bw=BW*SC,bh=BH*SC,sx=0;if(G&&G.shake>0)sx=(R()-.5)*8*G.shake;
 cx.save();cx.translate(BX+sx,BY);
 cx.shadowColor='rgba(36,48,103,.28)';cx.shadowBlur=24;cx.shadowOffsetY=10;rr(-6,-6,bw+12,bh+12,32);cx.fillStyle='#fff';cx.fill();cx.shadowColor='transparent';
 rr(0,0,bw,bh,26);cx.save();cx.clip();
 var bg=cx.createLinearGradient(0,0,0,bh);bg.addColorStop(0,'#3b4a9c');bg.addColorStop(1,'#232c6b');cx.fillStyle=bg;cx.fillRect(0,0,bw,bh);
 cx.fillStyle='rgba(255,255,255,.05)';for(var yy=18;yy<bh;yy+=26)for(var xx=((yy/26|0)%2?13:26);xx<bw;xx+=26){cx.beginPath();cx.arc(xx,yy,2.2,0,7);cx.fill()}

 if(dz>0){cx.fillStyle='rgba(255,92,141,'+(.18+.22*dz*(.6+.4*Math.sin(now/90)))+')';cx.fillRect(0,0,bw,LINE*SC)}
 cx.setLineDash([8,8]);cx.lineWidth=3;cx.lineCap='round';cx.strokeStyle=dz>0?'#ff7aa5':'rgba(255,255,255,.35)';cx.beginPath();cx.moveTo(12,LINE*SC);cx.lineTo(bw-12,LINE*SC);cx.stroke();cx.setLineDash([]);

  if(!G.over){clampAim();var cr=LV[G.cur].r*SC,ax=G.aim*SC;
   cx.setLineDash([2,10]);cx.lineWidth=3;cx.strokeStyle='rgba(255,255,255,.28)';cx.beginPath();cx.moveTo(ax,DROPY*SC+cr+4);cx.lineTo(ax,bh);cx.stroke();cx.setLineDash([]);

  G.balls.forEach(function(b){

   var mood=b.joy>0?1:(b.hit&&b.y-b.r<LINE+5?2:0),blink=((now/1000+b.seed)%4.2)<.13;

  G.parts.forEach(function(p){cx.globalAlpha=Math.max(0,Math.min(1,p.life*2));cx.fillStyle=p.c;if(p.star)star(p.x*SC,p.y*SC,p.s*SC*1.5,p.rot);else{cx.beginPath();cx.arc(p.x*SC,p.y*SC,p.s*SC*.7,0,7);cx.fill()}});cx.globalAlpha=1;
  G.floats.forEach(function(f){var a=Math.max(0,1-f.t/.9),y=f.y*SC-f.t*46,sz=Math.round(Math.max(16,5.6*SC)*(1+.3*Math.max(0,.2-f.t)*5));cx.globalAlpha=a;cx.font='900 '+sz+'px '+FONT;cx.textAlign='center';cx.textBaseline='middle';cx.lineJoin='round';cx.lineWidth=6;cx.strokeStyle='#161d4d';var x=Math.max(46,Math.min(bw-46,f.x*SC));cx.strokeText(f.s,x,y);cx.fillStyle=f.c;cx.fillText(f.s,x,y)});cx.globalAlpha=1;

/* ---------- 흐름 ---------- */
var last=performance.now(),acc=0;
function loop(now){
 var dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
 if(G&&!G.over){
  G.t+=dt;if(G.cool>0)G.cool-=dt;if(G.comboT>0)G.comboT-=dt;
  if(keys.l)G.aim-=70*dt;if(keys.r)G.aim+=70*dt;
  acc+=dt;var n=0;while(acc>=1/120&&n<8){step(1/120);acc-=1/120;n++}
  G.balls.forEach(function(b){if(b.pop<1)b.pop=Math.min(1,b.pop+dt*4.5);if(b.joy>0)b.joy-=dt;if(b.sq>0)b.sq=Math.max(0,b.sq-dt*1.6)});
  var up=G.balls.some(function(b){return b.hit&&b.y-b.r<LINE&&Math.abs(b.vy)<25});
  if(up){G.danger+=dt;if(G.danger>.6&&!G.warned){G.warned=1;toast('선을 넘으면 끝나요! 큰 친구끼리 합쳐 자리를 만들어요',0,'bad')}}else{G.danger=Math.max(0,G.danger-dt*2);G.warned=0}
  if(G.danger>=2)end();
 }
 if(G){if(G.shake>0)G.shake-=dt;if(G.flash>0)G.flash-=dt;
  G.parts.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=130*dt;p.rot+=dt*5;p.life-=dt});G.parts=G.parts.filter(function(p){return p.life>0});
  G.rings.forEach(function(r){r.t+=dt});G.rings=G.rings.filter(function(r){return r.t<.45});
  G.floats.forEach(function(f){f.t+=dt});G.floats=G.floats.filter(function(f){return f.t<.9})}
 draw(now,dt);requestAnimationFrame(loop);
}
function end(){
 if(G.over)return;G.over=true;G.shake=.4;sfx.over();if(G.score>best){best=G.score;try{localStorage.setItem('jodal_merge_best',best)}catch(e){}}
 var m=G.maxL,st=m>=8?3:m>=7?2:m>=6?1:0;
 $('eHero').src=iconURL(m,1);$('eTitle').textContent=LV[m].nm+'까지 키웠어요!';
 var s='';for(var i=0;i<3;i++)s+=i<st?'★':'<span class="off">★</span>';$('eStars').innerHTML=s;
 $('eScore').textContent=G.score.toLocaleString('ko-KR');$('eMerge').textContent=G.merges;$('eCatch').textContent=G.catches;

 if(m>=6)L.push('<p>기술과 품질이 뛰어난 제품은 <b>우수조달물품</b>으로 지정되고, 조달청은 우리 기업의 <b>해외 조달시장</b> 진출도 도와요.</p>');
 L.push('<p><b>비축</b>: 원자재를 쌓아 두었다가 공급망 위기 때 풀어요. <b>담합</b>처럼 불공정한 행위는 조사해서 공정한 경쟁을 지켜요.</p>');
