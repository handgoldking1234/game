<style>

function ctex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rx)t.repeat.set(rx,ry||rx);t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t}

function kartStep(K,inp,dt){const N=TR.N,W=TR.W;for(const t of TIMERS)if(K[t]>0)K[t]=Math.max(0,K[t]-dt);

  let vmax=PH.vmax*K.vf;if(K.boostT>0)vmax*=K.boostK==='draft'?1.22:1.36;if(K.magT>0)vmax*=1.3;if(K.shrinkT>0)vmax*=.62;if(K.bot&&K.fogT>0)vmax*=.9;if(K.bot&&K.cloudT>0)vmax*=.94;if(K.surf==='pud')vmax*=.9;

    let grip=K.surf==='ice'?1.4:K.surf==='pud'?5:9;

      grip=inp.drift?1.5:(same<-.3?7:2.6);K.sp-=K.sp*.2*Math.abs(Math.sin(d))*dt;K.g=Math.min(1,K.g+Math.max(0,K.sp)*Math.abs(Math.sin(d))*dt*.024);

  if(K.surf==='ice'&&!stun&&Math.abs(K.sp)>8)K.vh+=Math.sin(performance.now()/300+K.x)*.15*dt;
  // 이동

    let w='';for(const e of ENTV)if(e.tg===G.myId&&(e.k==='missile'||e.k==='ufo'))w=e.k==='missile'?'🚨 번개 미사일이 다가와요!':'🚨 태풍 회오리가 다가와요!';const we=$('warn');we.style.display=w?'block':'none';we.textContent=w;if(w&&!hudStep.siren){hudStep.siren=1;sfx('siren')}if(!w)hudStep.siren=0;

function drawMini(){const c=$('mm'),x=c.getContext('2d'),w=c.width;x.clearRect(0,0,w,w);if(MINI)x.drawImage(MINI,0,0,w,w);

let ENTV=[];const START={up:null};
function raceStep(dt){const K=ME();
  if(G.ph==='count'){G.cd-=dt;const n=Math.ceil(G.cd-1);if(n!==raceStep.n){raceStep.n=n;if(n>=1&&n<=3){center(String(n),900);sfx('beep')}else if(n===0){center('GO!',900);sfx('go')}}
    const inp=myInput();if(inp.up&&START.up==null)START.up=G.cd;if(!inp.up)START.up=null;
    if(G.cd<=1){G.ph='race';G.t=0;if(K&&START.up!=null&&START.up<1.6){boost(K,1.3,'start');hudMsg('🚀 스타트 부스터!')}}
    for(const A of ALLK){A.rx=A.x;A.rz=A.z}return}
  if(G.ph!=='race'&&G.ph!=='end')return;
  G.t+=dt;
  // 내 카트
  if(K){const inp=myInput();if(K.bubT>0&&inp.lr)K.bubT=Math.max(0,K.bubT-.13);if(inp.useE)useItem(K);if(inp.swapE&&K.items.length===2){K.items.reverse();slotsDirty=true}
    const d0=K.dN;kartStep(K,inp,dt);if(K.dN>d0)EL.prog('drift',1);
    if(G.mode==='speed'&&K.g>=1){K.g=0;if(K.items.length<2){K.items.push('boost');slotsDirty=true;hudMsg('🌪️ 게이지 가득! 돌풍 부스터 획득');sfx('get')}}
    if(K.wrongT>1.2&&!K.fin&&K.wrongT-dt<=1.2)sfx('no')}
  if(isHost()){for(const A of ALLK)if(A.bot)botStep(A,dt);entStep(dt);ENTV=ENT}
  kartCollide(locals());boxStep(dt);quizStep(dt);
  // 남의 카트 부드럽게
  for(const A of ALLK){if(A.loc)continue;const f=1-Math.exp(-12*dt);A.x=lerp(A.x,A.rx,f);A.z=lerp(A.z,A.rz,f);A.y=lerp(A.y,A.ry,f);A.yaw+=angDiff(A.ryaw,A.yaw)*f;if(A.spinT>0||A.liftT>0)A.spinA+=dt*12}
  G.rankT-=dt;if(G.rankT<=0){G.rankT=.15;calcRanks()}
  if(isHost()){G.snapT-=dt;if(G.snapT<=0&&NET.on){G.snapT=1/15;netSend(snap())}
    if(G.ph==='race'){const allDone=ALLK.every(A=>A.fin);if(allDone||(G.retire!=null&&G.t>=G.retire)){G.ph='end';G.endT=G.t+(allDone?2:1);}}
    if(G.ph==='end'&&G.t>=G.endT&&!G.res){calcRanks();const res=G.order.map(id=>{const A=G.K[id];return{id,n:A.n,ch:A.ch,bot:A.bot,fin:A.fin,t:A.fin?A.finT:null}});G.res=res;netSend({t:'end',res});showResult(res)}}
  else{G.mySnapT=(G.mySnapT||0)-dt;if(G.mySnapT<=0&&K){G.mySnapT=1/15;netSend({t:'m',a:kstate(K)})}}}
function kflags(K){return(K.boostT>0?1:0)|(K.shieldT>0?2:0)|(K.angelT>0?4:0)|(K.bubT>0?8:0)|(K.liftT>0?16:0)|(K.shrinkT>0?32:0)|(K.spinT>0?64:0)|(K.flipT>0?128:0)|(K.drift?256:0)}
const r2=v=>Math.round(v*100)/100;
function kstate(K){return[r2(K.x),r2(K.y),r2(K.z),r2(K.yaw),r2(K.vh),r2(K.sp),Math.round(K.tp),K.idx,kflags(K),K.lapS,K.fin?1:0,r2(K.finT),r2(K.st),r2(K.flipT)]}
function applyState(A,a){A.rx=a[0];A.ry=a[1];A.rz=a[2];A.ryaw=a[3];A.vh=a[4];A.sp=a[5];A.tp=a[6];A.idx=a[7];const f=a[8];A.boostT=f&1?.2:0;A.shieldT=f&2?.2:0;A.angelT=f&4?.2:0;A.bubT=f&8?.2:0;A.liftT=f&16?.2:0;A.shrinkT=f&32?.2:0;A.spinT=f&64?.2:0;A.drift=f&256?1:0;
  A.lapS=a[9];if(a[10]&&!A.fin){A.fin=true;A.finT=a[11];if(NET.host&&G.retire==null)G.retire=G.t+12}A.st=a[12];A.flipT=a[13]||0}
function snap(){const k={};for(const A of ALLK)k[A.id]=kstate(A);let b='';for(const B of BOXES)b+=B.on?'1':'0';
  return{t:'s',k,e:ENT.map(e=>[e.id,e.k,r2(e.x),r2(e.y),r2(e.z),r2(e.vx||0),r2(e.vz||0),e.tg||'']),b,tm:r2(G.t),ph:G.ph,rt:G.retire}}
function unsnap(s){for(const id in s.k){if(id===G.myId)continue;const A=G.K[id];if(A)applyState(A,s.k[id])}
  ENTV=s.e.map(a=>({id:a[0],k:a[1],x:a[2],y:a[3],z:a[4],vx:a[5],vz:a[6],tg:a[7]}));
  const now=performance.now();for(let i=0;i<BOXES.length&&i<s.b.length;i++){const B=BOXES[i];if(B.pred&&now-B.pred<800)continue;B.on=s.b[i]==='1'}
  if(Math.abs(G.t-s.tm)>.5)G.t=s.tm;G.retire=s.rt;if(s.ph==='race'&&G.ph==='count'){G.ph='race'}}

  <div class="pane" style="margin-top:8px"><h3>운전 도움</h3><div class="seg" id="auto"><button type="button" data-v="1" class="${SET.auto?'on':''}">자동 가속 켜기</button><button type="button" data-v="0" class="${!SET.auto?'on':''}">끄기</button></div>
   <div class="seg" id="assist" style="margin-top:6px"><button type="button" data-v="1" class="${SET.assist?'on':''}">퀴즈 중 자동 운전 켜기</button><button type="button" data-v="0" class="${!SET.assist?'on':''}">끄기</button></div></div>
  <div class="pane" style="margin-top:8px"><h3>소리</h3><div class="seg" id="vol">${[[0,'끄기'],[.4,'작게'],[.7,'보통'],[1,'크게']].map(([v,n])=>`<button type="button" data-v="${v}" class="${SET.vol==v?'on':''}">${n}</button>`).join('')}</div><div class="seg" id="bgm" style="margin-top:6px"><button type="button" data-v="1" class="${SET.bgm?'on':''}">배경 음악 켜기</button><button type="button" data-v="0" class="${!SET.bgm?'on':''}">끄기</button></div></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="bk4" type="button">확인</button></div></div>`,()=>{
    const seg=(id,f)=>ov.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{f(b.dataset.v);store.set('set',SET);setCard(back)});
    seg('gfx',v=>{if(SET.gfx!==v){SET.gfx=v;store.set('set',SET);location.reload()}});seg('auto',v=>SET.auto=v==='1');seg('assist',v=>SET.assist=v==='1');seg('vol',v=>{SET.vol=+v;if(MG)MG.gain.value=SET.vol*.6});seg('bgm',v=>SET.bgm=v==='1');$('bk4').onclick=back})}
function pauseCard(){if(!ov.hidden)return;openCard(`<div class="card sm"><h2>⏸ 잠깐!</h2><p class="small">${NET.on?'온라인 경기는 멈추지 않아요.':'레이스가 계속 진행 중이에요.'}</p><div class="row" style="margin-top:10px"><button class="btn" id="rs" type="button">▶ 계속</button><button class="btn b3" id="hp2" type="button">🎮 조작법</button><button class="btn b3" id="st2" type="button">⚙️</button><button class="btn b3" id="qt" type="button">🏠 로비</button></div></div>`,()=>{$('rs').onclick=()=>{closeCard();EL.showHud(true)};$('hp2').onclick=()=>helpCard(pauseCard2);$('st2').onclick=()=>setCard(pauseCard2);$('qt').onclick=()=>{if(NET.on)location.reload();else{closeCard();lobby()}}},'pause')}
function pauseCard2(){closeCard();pauseCard()}
function showResult(res){G.ph='done';QZ.on=false;$('quiz').style.display='none';const me=res.findIndex(r=>r.id===G.myId)+1;sfx(me===1?'win':'finish');
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
  openCard(`<div class="card"><h1>${me===1?'🏆 우승!':me<=3?'🎉 '+me+'등!':'🏁 '+me+'등'}</h1><p class="small">${TRACKS[G.trk].e} ${TRACKS[G.trk].n} · ${G.mode==='item'?'아이템전':'스피드전'} · ${G.laps}바퀴</p>
   <table class="res">${res.map((r,i)=>`<tr class="${r.id===G.myId?'me':''}"><td>${medal(i)}</td><td>${CHARS[r.ch].e} ${esc(r.n)}</td><td style="text-align:right">${r.fin?fmtT(r.t):r.bot?'—':'리타이어'}</td></tr>`).join('')}</table>
   ${EL.reportHTML()||''}
   <div class="row" style="margin-top:10px">${NET.guest?'<span class="small">방장이 다시 시작하면 바로 출발해요</span>':'<button class="btn" id="again" type="button">🔁 다시 달리기</button>'}<button class="btn b2" id="lb" type="button">🏠 로비로</button></div></div>`,()=>{if($('again'))$('again').onclick=()=>beginHost();$('lb').onclick=()=>{if(NET.guest){closeCard();lobby()}else lobby()}},'result')}

/* ================= 학습 목표 ================= */
const KR_GOALS=[{k:'quiz',t:'아이템 퀴즈 3문제 맞히기',n:3,c:'forecast'},{k:'use',t:'날씨 아이템 5번 쓰기',n:5,c:'life'},{k:'drift',t:'드리프트 12번 하기',n:12,c:'wind'},{k:'fin',t:'끝까지 완주하기',n:1,c:'life'},{k:'top3',t:'3등 안에 들어오기',n:1,c:'forecast'},{k:'draft',t:'슬립스트림(DRAFT) 부스터 1번 쓰기',n:1,c:'wind'}];

/* ================= 함께 하기 ================= */
const NET={on:false,host:false,guest:false,code:'',pc:null,conns:new Map(),hc:null,pl:{}};
function netSend(m){if(!NET.on)return;if(NET.host){for(const c of NET.conns.values())if(c.open)try{c.send(m)}catch(e){}}else if(NET.hc&&NET.hc.open)try{NET.hc.send(m)}catch(e){}}
function netTo(pid,m){const c=NET.conns.get(pid);if(c&&c.open)try{c.send(m)}catch(e){}}
function netStart(asHost,code){if(!window.Peer){toast('친구와 함께 하기를 불러오지 못했어요 (인터넷 확인)','bad');return}
  code=asHost?String(1000+Math.floor(Math.random()*9000)):String(code||'').replace(/\D/g,'').slice(0,4);if(code.length!==4){toast('방 번호 4자리를 적어 주세요','bad');return}
  const hid='wxkart-v1-'+code;toast(asHost?'방을 만드는 중…':'방에 들어가는 중…');ov.querySelectorAll('.btn').forEach(b=>b.disabled=true);
  const pc=new Peer(asHost?hid:undefined,Object.assign({debug:0},window.ERV_PEERCFG||{}));NET.pc=pc;let done=false;
  const fail=m=>{try{pc.destroy()}catch(e){}toast(m,'bad');ov.querySelectorAll('.btn').forEach(b=>b.disabled=false)};
  const to=setTimeout(()=>{if(!done)fail(asHost?'방을 만들지 못했어요. 잠시 뒤 다시 해 주세요.':'방을 찾지 못했어요. 번호를 확인해 주세요.')},20000);
  pc.on('error',e=>{if(!done){clearTimeout(to);fail(e.type==='unavailable-id'?'그 방 번호는 이미 쓰고 있어요':e.type==='peer-unavailable'?'그 번호의 방이 없어요':'연결에 실패했어요 ('+(e.type||'오류')+')')}});
  pc.on('open',id=>{if(asHost){done=true;clearTimeout(to);Object.assign(NET,{on:true,host:true,code});G.myId='h';if(window.MWG)MWG.host(()=>({code:NET.code,name:LOB.nick+'의 방',n:1+Object.keys(NET.pl).length,max:8,open:G.ph==='lobby'||G.ph==='done',info:TRACKS[LOB.trk].e+' '+TRACKS[LOB.trk].n}));lobby();toast(`방을 열었어요! 방 번호 <b>${code}</b>`,'good',5000);return}
    const hc=pc.connect(hid,{reliable:true});NET.hc=hc;hc.on('open',()=>{done=true;clearTimeout(to);Object.assign(NET,{on:true,guest:true,code});G.myId=pc.id;hc.send({t:'hi',n:LOB.nick,ch:LOB.ch,col:LOB.col});lobby();toast('방에 들어왔어요!','good')});
    hc.on('data',d=>onNet(d,'host'));hc.on('close',()=>{if(NET.guest){toast('방이 닫혔어요 (방장이 나갔어요)','bad',5000);setTimeout(()=>location.reload(),3000)}})});
  pc.on('connection',c=>{if(!asHost){c.close();return}c.on('open',()=>{if(NET.conns.size>=7||G.ph==='race'||G.ph==='count'){try{c.send({t:'full'})}catch(e){}setTimeout(()=>c.close(),300);return}NET.conns.set(c.peer,c)});c.on('data',d=>onNet(d,c.peer));
    c.on('close',()=>{NET.conns.delete(c.peer);const p=NET.pl[c.peer];if(p)toast(`${esc(p.n)}님이 나갔어요`);delete NET.pl[c.peer];const K=G.K[c.peer];if(K){K.bot=true;K.loc=true;K.n='🤖'+K.n;K.vf=DIFF[G.diff].vf}if(G.ph==='lobby')lobby();else roomSync()})})}
function roomSync(){netSend({t:'room',pl:[{n:LOB.nick,ch:LOB.ch,col:LOB.col}].concat(Object.values(NET.pl))});if(G.ph==='lobby'&&ov.dataset.k==='lobby')lobby()}
function onNet(m,from){if(!m||!m.t)return;
  if(NET.host){const p=NET.pl[from];
    if(m.t==='hi'||m.t==='lob'){NET.pl[from]={n:String(m.n||'친구').slice(0,8),ch:clamp(m.ch|0,0,7),col:clamp(m.col|0,0,KCOL.length-1)};if(m.t==='hi')toast(`${esc(NET.pl[from].n)}님이 들어왔어요!`,'good');roomSync();return}
    if(m.t==='m'){const K=G.K[from];if(K&&!K.bot)applyState(K,m.a);return}
    if(m.t==='box'){const B=BOXES[m.i];if(B&&B.on){B.on=false;B.t=3.5}return}
    if(m.t==='use'){if(m.r&&G.K[from]&&ITEMS[m.r.k]){m.r.id=from;hostUse(m.r)}return}
    if(m.t==='fin'){const K=G.K[from];if(K&&!K.fin){K.fin=true;K.finT=m.tm;if(G.retire==null)G.retire=G.t+12}return}
    return}
  // 손님
  if(m.t==='full'){toast('방이 가득 찼거나 이미 경기 중이에요','bad',5000);return}
  if(m.t==='room'){const pl={};m.pl.forEach((p,i)=>{if(i===0)pl.host=p;else pl['p'+i]=p});NET.pl={};const arr=m.pl.slice();const meI=arr.findIndex(p=>p.n===LOB.nick);NET.pl=Object.fromEntries(arr.filter((p,i)=>i!==meI).map((p,i)=>['p'+i,p]));if(G.ph==='lobby'||G.ph==='done'){if(ov.dataset.k==='lobby')lobby()}return}
  if(m.t==='go'){startRace(m.cfg,m.roster);return}
  if(m.t==='s'){if(G.ph!=='lobby')unsnap(m);return}
  if(m.t==='fx'){const K=ME();if(K)applyFx(K,m.k,m.f);return}
  if(m.t==='ev'){onEv(m);return}
  if(m.t==='end'){G.res=m.res;setTimeout(()=>showResult(m.res),G.K[G.myId]&&G.K[G.myId].fin?400:1500);return}}

/* ================= 소리 ================= */
let AC=null,MG=null,ENG=null,BGM={t:0,i:0};
function audio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=SET.vol*.6;MG.connect(AC.destination);
  const o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o1.type='sawtooth';o2.type='square';o2.detune.value=-1200;f.type='lowpass';f.frequency.value=900;g.gain.value=0;o1.connect(f);o2.connect(f);f.connect(g);g.connect(MG);o1.start();o2.start();ENG={o1,o2,f,g}}catch(e){AC=null}}
function tone(f,d,type,v,slide,when){if(!AC||SET.vol<=0)return;const t=(when||AC.currentTime);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02)}
function nz(d,v,fq){if(!AC||SET.vol<=0)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq||1200;const g=AC.createGain();g.gain.value=v||.2;s.connect(f);f.connect(g);g.connect(MG);s.start()}
function sfx(k){if(!AC)return;switch(k){case'beep':tone(660,.25,'square',.18);break;case'go':tone(1320,.5,'square',.2);break;case'ready':tone(440,.15,'triangle',.15);break;
  case'boost':nz(.6,.25,2500);tone(300,.5,'sawtooth',.08,900);break;case'drift':nz(.25,.08,3000);break;case'wall':nz(.2,.3,600);tone(120,.15,'square',.12);break;case'bump':nz(.12,.15,800);break;
  case'box':tone(880,.08,'square',.12);tone(1320,.12,'square',.12,null,AC.currentTime+.07);break;case'quiz':tone(700,.1,'triangle',.15);tone(1050,.18,'triangle',.15,null,AC.currentTime+.1);break;
  case'ok':[523,659,784,1046].forEach((f,i)=>tone(f,.14,'square',.12,null,AC.currentTime+i*.07));break;case'no':tone(300,.3,'sawtooth',.12,150);break;case'get':tone(1046,.1,'square',.12);tone(1568,.18,'square',.12,null,AC.currentTime+.08);break;
  case'use':tone(500,.2,'square',.12,1200);break;case'hit':nz(.5,.35,900);tone(200,.4,'sawtooth',.12,60);break;case'splash':nz(.5,.25,1800);break;case'block':tone(1200,.2,'triangle',.15,600);break;
  case'siren':tone(900,.3,'square',.08,600);tone(900,.3,'square',.08,600,AC.currentTime+.32);break;case'lap':tone(784,.12,'square',.14);tone(1046,.2,'square',.14,null,AC.currentTime+.12);break;
  case'finish':[784,988,1175,1568].forEach((f,i)=>tone(f,.2,'square',.13,null,AC.currentTime+i*.12));break;case'win':[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.22,'square',.13,null,AC.currentTime+i*.13));break;
  case'thunder':nz(1.4,.35,400);break}}
const MEL=[72,76,79,76,74,77,81,77,72,76,79,84,83,79,76,74];const BAS=[48,48,53,53,45,45,55,55];
function audioStep(dt){if(!AC)return;const K=ME();const run=(G.ph==='race'||G.ph==='count')&&K;if(ENG){const sp=run?Math.max(0,K.sp):0;ENG.o1.frequency.value=55+sp*3.2+(K&&K.boostT>0?40:0);ENG.o2.frequency.value=ENG.o1.frequency.value;ENG.f.frequency.value=500+sp*25;ENG.g.gain.value=run?.05+sp*.0012:0}
  if(SET.bgm&&SET.vol>0&&G.ph!=='lobby'){const step=60/150/2;while(BGM.t<AC.currentTime+.2){if(BGM.t<AC.currentTime)BGM.t=AC.currentTime;const i=BGM.i++;const n=MEL[i%16];if(i%2===0||Math.random()<.5)tone(440*Math.pow(2,(n-69)/12),step*.9,'triangle',.035,null,BGM.t);if(i%2===0)tone(440*Math.pow(2,(BAS[(i>>1)%8]-69)/12),step*1.8,'square',.025,null,BGM.t);BGM.t+=step}}}

/* ================= 반복 ================= */
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=clamp((now-last)/1000,0,.05);last=now;
  if(G.ph==='race'||G.ph==='count'||G.ph==='end'||G.ph==='done'){if(G.ph!=='done')raceStep(dt);else{G.t+=dt;for(const A of ALLK)if(A.loc){const inp=autoInput(A,dt,0);inp.th=A.sp>16?0:1;kartStep(A,inp,dt)}}
    for(const A of ALLK)drawKart(A,dt);drawEnts(ENTV,dt);camStep(dt);if(G.ph!=='done')hudStep(dt);const K=ME();if(K){sun.position.set(K.x+40,K.y+80,K.z+25);sun.target.position.set(K.x,K.y,K.z)}}
  else{orbitCam(dt);const p=camera.position;sun.position.set(p.x+40,p.y+80,p.z+25);sun.target.position.set(p.x,p.y-9,p.z)}
  partStep(dt);if(SEA&&SEA.material.map)SEA.material.map.offset.x+=dt*.004;CLOUDS.rotation.y+=dt*.002;sky.position.copy(camera.position);
  weatherStep(dt,camera.position.x,camera.position.y,camera.position.z);audioStep(dt);
  renderer.render(scene,camera)}

/* ================= 시작 ================= */
EL.init('wkart',{forecast:'❓ 상자 퀴즈를 맞혀요',life:'🎁 날씨 아이템을 써요',wind:'💨 드리프트 · 부스터',thunder:'⚡ 번개 미사일 · 우박 폭풍',rain:'💧 소나기 물폭탄',cloud:'☁️ 먹구름',fogc:'🌫️ 안개 숲 · 짙은 안개',cold:'🧊 설산 빙판 · 서리 빙판',seab:'🏖️ 해변 서킷의 바닷바람',typhoon:'🌀 태풍 회오리',lowp:'🧲 저기압 자석',highp:'😇 맑음 천사'});
EL.hud({left:'max(10px,env(safe-area-inset-left))',top:touchUI?'calc(max(10px,env(safe-area-inset-top)) + 150px)':'auto',bottom:touchUI?'auto':'max(12px,env(safe-area-inset-bottom))'});EL.showHud(false);
EL.popAt({left:'max(12px,env(safe-area-inset-left))',top:'auto',bottom:touchUI?'calc(max(12px,env(safe-area-inset-bottom)) + 120px)':'calc(max(12px,env(safe-area-inset-bottom)) + 48px)',right:'auto',maxWidth:'330px'});
if(SET.assist==null)SET.assist=true;
buildTrack(LOB.trk,LOB.mode);if(window.MWG)MWG.connect('kart');lobby();$('load').style.display='none';requestAnimationFrame(loop);
addEventListener('pointerdown',()=>audio(),{once:true});

</script>
