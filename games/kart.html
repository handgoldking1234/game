<style>

/* ---------- 연결 하나 (PeerJS 또는 MQTT를 감싸요) ---------- */
function Conn(peer,remote){Em.call(this);this.peer=remote;this.open=false;this.reliable=true;this._p=peer;this._k=null;this._rc=null;this.closed=false;this.via=''}

function SmartPeer(id,opts){if(!(this instanceof SmartPeer))return new SmartPeer(id,opts);Em.call(this);var self=this;
  if(id&&typeof id==='object'){opts=id;id=undefined}

  // 1) PeerJS
  if(RealPeer){try{var o={};for(var k in this.opts)o[k]=this.opts[k];o.config=o.config||{iceServers:ICE};
    this._rp=new RealPeer(this.id,o);

    this._rp.on('connection',function(rc){var c=new Conn(self,rc.peer);rc.on('open',function(){if(c.closed)return;c._useReal(rc);c._setOpen();self.emit('connection',c)})});

  // 2) MQTT 중계 (항상 함께 켜 둬요)
  this._mq=new Mqtt('mw'+rid(12));
  this._mq.on('ready',function(){self._mqReady=true;self._maybeOpen()});
  this._mq.on('fail',function(){self._mqBad=true;if(!self._openSent&&(self._rpBad||!RealPeer))self.emit('error',{type:'network',message:'연결 서버에 닿지 못했어요'})});
  this._mq.on('msg',function(t,s){self._onMsg(s)});

SmartPeer.prototype._maybeOpen=function(){if(this._openSent||this.destroyed)return;if(this._rpOpen)return this._open();if(this._mqReady&&(this._waited||this._rpBad))this._open()};
SmartPeer.prototype._open=function(){if(this._openSent||this.destroyed)return;this._openSent=true;this.open=true;var self=this;setTimeout(function(){self.emit('open',self.id)},0)};
SmartPeer.prototype._onMsg=function(s){var m;try{m=JSON.parse(s)}catch(e){return}if(!m||!m.c)return;var c=this._mc[m.c];
  if(m.t==='syn'){if(!this.isHost&&!this._acceptAll)return;if(!c){c=new Conn(this,String(m.f));c._useMq(m.c);c._setOpen();this.emit('connection',c)}c._rx=Date.now();this._mq.pub(TOPIC+m.f,JSON.stringify({t:'ack',c:m.c,f:this.id}));return}

  else if(m.t==='fin'){if(!c.closed){c.closed=true;var was=c.open;c.open=false;clearInterval(c._ka);delete this._mc[m.c];if(was)c.emit('close')}}};

    var go=function(){var k=rid(12);c._useMq(k);c._wait=true;var n=0;var syn=function(){if(!c._wait||c.closed){clearInterval(c._synT);return}if(++n>8){clearInterval(c._synT);c._wait=false;c.closed=true;self.emit('error',{type:'peer-unavailable',message:'Could not connect to peer '+remote});c.emit('error',{type:'peer-unavailable'});return}self._mq.pub(TOPIC+remote,JSON.stringify({t:'syn',c:k,f:self.id}))};syn();c._synT=setInterval(syn,1300)};

      rc.on('open',function(){if(c.open||c.closed){try{rc.close()}catch(e){}return}if(fellBack){if(c._wait){c._wait=false;clearInterval(c._synT);if(c._k)delete self._mc[c._k];clearInterval(c._ka);c._k=null}else{try{rc.close()}catch(e){}return}}c._useReal(rc);c._setOpen()});

  v.ws+=K.sp*dt/.4;for(const w of m.wheels)w.children.forEach(c=>c.rotation.x=v.ws);m.wheels[0].rotation.y=m.wheels[1].rotation.y=-K.st*.45;m.sw.rotation.z=K.st*.9;

function gridPos(i){const N=TR.N;const back=6+Math.floor(i/2)*7+(i%2)*2.5;const idx=(N-Math.round(back/2))%N;const lat=i%2?3.6:-3.6;const p=TR.P[idx],s=TR.S[idx];return{x:p.x+s.x*lat,z:p.z+s.z*lat,y:p.y,yaw:TR.ANG[idx],idx}}

function entStep(dt){const all=Object.values(G.K);for(let i=ENT.length-1;i>=0;i--){const e=ENT[i];let kill=false;

function autoInput(K,dt,skill){const N=TR.N;const look=Math.floor(5+Math.max(K.sp,0)*.42);const ti=(K.idx+look)%N;
  K.lane+=(K.laneT-K.lane)*Math.min(1,dt*.6);if(Math.random()<dt*.2)K.laneT=rnd(-TR.W*.5,TR.W*.5);
  // 앞의 빙판·물웅덩이 피하기

  const p=TR.P[ti],s=TR.S[ti];const tx=p.x+s.x*K.lane,tz=p.z+s.z*K.lane;const want=Math.atan2(tx-K.x,tz-K.z);const d=angDiff(want,K.yaw);
  const st=clamp(-d*2.6,-1,1);const ca=TR.CA[K.idx];const vt=clamp(PH.vmax*K.vf*(1.32-ca*16),17,99);
  const th=K.sp>vt+3?-.5:1;const drift=ca>.026&&K.sp>24&&Math.abs(d)>.1;return{th,st,drift,upE:K.ibT>0&&Math.random()<(skill||.4)*.3,useE:false}}

    if(K.wrongT>1.2&&!K.fin&&K.wrongT-dt<=1.2)sfx('no')}

    hc.on('data',d=>onNet(d,'host'));hc.on('close',()=>{if(NET.guest){toast('방이 닫혔어요 (방장이 나갔어요)','bad',5000);setTimeout(()=>location.reload(),3000)}})});
  pc.on('connection',c=>{if(!asHost){c.close();return}c.on('open',()=>{if(NET.conns.size>=7||G.ph==='race'||G.ph==='count'){try{c.send({t:'full'})}catch(e){}setTimeout(()=>c.close(),300);return}NET.conns.set(c.peer,c)});c.on('data',d=>onNet(d,c.peer));
    c.on('close',()=>{NET.conns.delete(c.peer);const p=NET.pl[c.peer];if(p)toast(`${esc(p.n)}님이 나갔어요`);delete NET.pl[c.peer];const K=G.K[c.peer];if(K){K.bot=true;K.loc=true;K.n='🤖'+K.n;K.vf=DIFF[G.diff].vf}if(G.ph==='lobby')lobby();else roomSync()})})}
function roomSync(){netSend({t:'room',pl:[{n:LOB.nick,ch:LOB.ch,col:LOB.col}].concat(Object.values(NET.pl))});if(G.ph==='lobby'&&ov.dataset.k==='lobby')lobby()}
function onNet(m,from){if(!m||!m.t)return;
  if(NET.host){const p=NET.pl[from];
    if(m.t==='hi'||m.t==='lob'){NET.pl[from]={n:String(m.n||'친구').slice(0,8),ch:clamp(m.ch|0,0,7),col:clamp(m.col|0,0,KCOL.length-1)};if(m.t==='hi')toast(`${esc(NET.pl[from].n)}님이 들어왔어요!`,'good');roomSync();return}
    if(m.t==='m'){const K=G.K[from];if(K&&!K.bot)applyState(K,m.a);return}
    if(m.t==='box'){const B=BOXES[m.i];if(B&&B.on){B.on=false;B.t=3.5}return}
    if(m.t==='use'){if(m.r&&G.K[from]&&ITEMS[m.r.k]){m.r.id=from;hostUse(m.r)}return}
    if(m.t==='fin'){const K=G.K[from];if(K&&!K.fin){K.fin=true;K.finT=m.tm;if(G.retire==null)G.retire=G.t+12}return}
    return}
  // 손님
  if(m.t==='full'){toast('방이 가득 찼거나 이미 경기 중이에요','bad',5000);return}
  if(m.t==='room'){const pl={};m.pl.forEach((p,i)=>{if(i===0)pl.host=p;else pl['p'+i]=p});NET.pl={};const arr=m.pl.slice();const meI=arr.findIndex(p=>p.n===LOB.nick);NET.pl=Object.fromEntries(arr.filter((p,i)=>i!==meI).map((p,i)=>['p'+i,p]));if(G.ph==='lobby'||G.ph==='done'){if(ov.dataset.k==='lobby')lobby()}return}
  if(m.t==='go'){startRace(m.cfg,m.roster);return}
  if(m.t==='s'){if(G.ph!=='lobby')unsnap(m);return}
  if(m.t==='fx'){const K=ME();if(K)applyFx(K,m.k,m.f);return}
  if(m.t==='ev'){onEv(m);return}
  if(m.t==='end'){G.res=m.res;setTimeout(()=>showResult(m.res),G.K[G.myId]&&G.K[G.myId].fin?400:1500);return}}

/* ================= 소리 ================= */
let AC=null,MG=null,ENG=null,BGM={t:0,i:0};
function audio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=SET.vol*.6;MG.connect(AC.destination);
  const o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o1.type='sawtooth';o2.type='square';o2.detune.value=-1200;f.type='lowpass';f.frequency.value=900;g.gain.value=0;o1.connect(f);o2.connect(f);f.connect(g);g.connect(MG);o1.start();o2.start();ENG={o1,o2,f,g}}catch(e){AC=null}}
function tone(f,d,type,v,slide,when){if(!AC||SET.vol<=0)return;const t=(when||AC.currentTime);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02)}
function nz(d,v,fq){if(!AC||SET.vol<=0)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq||1200;const g=AC.createGain();g.gain.value=v||.2;s.connect(f);f.connect(g);g.connect(MG);s.start()}
function sfx(k){if(!AC)return;switch(k){case'beep':tone(660,.25,'square',.18);break;case'go':tone(1320,.5,'square',.2);break;case'ready':tone(440,.15,'triangle',.15);break;
  case'boost':nz(.6,.25,2500);tone(300,.5,'sawtooth',.08,900);break;case'drift':nz(.25,.08,3000);break;case'wall':nz(.2,.3,600);tone(120,.15,'square',.12);break;case'bump':nz(.12,.15,800);break;
  case'box':tone(880,.08,'square',.12);tone(1320,.12,'square',.12,null,AC.currentTime+.07);break;case'quiz':tone(700,.1,'triangle',.15);tone(1050,.18,'triangle',.15,null,AC.currentTime+.1);break;
  case'ok':[523,659,784,1046].forEach((f,i)=>tone(f,.14,'square',.12,null,AC.currentTime+i*.07));break;case'no':tone(300,.3,'sawtooth',.12,150);break;case'get':tone(1046,.1,'square',.12);tone(1568,.18,'square',.12,null,AC.currentTime+.08);break;
  case'use':tone(500,.2,'square',.12,1200);break;case'hit':nz(.5,.35,900);tone(200,.4,'sawtooth',.12,60);break;case'splash':nz(.5,.25,1800);break;case'block':tone(1200,.2,'triangle',.15,600);break;
  case'siren':tone(900,.3,'square',.08,600);tone(900,.3,'square',.08,600,AC.currentTime+.32);break;case'lap':tone(784,.12,'square',.14);tone(1046,.2,'square',.14,null,AC.currentTime+.12);break;
  case'finish':[784,988,1175,1568].forEach((f,i)=>tone(f,.2,'square',.13,null,AC.currentTime+i*.12));break;case'win':[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.22,'square',.13,null,AC.currentTime+i*.13));break;
  case'thunder':nz(1.4,.35,400);break}}
const MEL=[72,76,79,76,74,77,81,77,72,76,79,84,83,79,76,74];const BAS=[48,48,53,53,45,45,55,55];
function audioStep(dt){if(!AC)return;const K=ME();const run=(G.ph==='race'||G.ph==='count')&&K;if(ENG){const sp=run?Math.max(0,K.sp):0;ENG.o1.frequency.value=55+sp*3.2+(K&&K.boostT>0?40:0);ENG.o2.frequency.value=ENG.o1.frequency.value;ENG.f.frequency.value=500+sp*25;ENG.g.gain.value=run?.05+sp*.0012:0}
  if(SET.bgm&&SET.vol>0&&G.ph!=='lobby'){const step=60/150/2;while(BGM.t<AC.currentTime+.2){if(BGM.t<AC.currentTime)BGM.t=AC.currentTime;const i=BGM.i++;const n=MEL[i%16];if(i%2===0||Math.random()<.5)tone(440*Math.pow(2,(n-69)/12),step*.9,'triangle',.035,null,BGM.t);if(i%2===0)tone(440*Math.pow(2,(BAS[(i>>1)%8]-69)/12),step*1.8,'square',.025,null,BGM.t);BGM.t+=step}}}

/* ================= 반복 ================= */
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=clamp((now-last)/1000,0,.05);last=now;
  if(G.ph==='race'||G.ph==='count'||G.ph==='end'||G.ph==='done'){if(G.ph!=='done')raceStep(dt);else{G.t+=dt;for(const A of ALLK)if(A.loc){const inp=autoInput(A,dt,0);inp.th=A.sp>16?0:1;kartStep(A,inp,dt)}}
    for(const A of ALLK)drawKart(A,dt);drawEnts(ENTV,dt);camStep(dt);if(G.ph!=='done')hudStep(dt);const K=ME();if(K){sun.position.set(K.x+40,K.y+80,K.z+25);sun.target.position.set(K.x,K.y,K.z)}}
  else{orbitCam(dt);const p=camera.position;sun.position.set(p.x+40,p.y+80,p.z+25);sun.target.position.set(p.x,p.y-9,p.z)}
  partStep(dt);if(SEA&&SEA.material.map)SEA.material.map.offset.x+=dt*.004;CLOUDS.rotation.y+=dt*.002;sky.position.copy(camera.position);
  weatherStep(dt,camera.position.x,camera.position.y,camera.position.z);audioStep(dt);
  renderer.render(scene,camera)}

/* ================= 시작 ================= */
EL.init('wkart',{forecast:'❓ 상자 퀴즈를 맞혀요',life:'🎁 날씨 아이템을 써요',wind:'💨 드리프트 · 부스터',thunder:'⚡ 번개 미사일 · 우박 폭풍',rain:'💧 소나기 물폭탄',cloud:'☁️ 먹구름',fogc:'🌫️ 안개 숲 · 짙은 안개',cold:'🧊 설산 빙판 · 서리 빙판',seab:'🏖️ 해변 서킷의 바닷바람',typhoon:'🌀 태풍 회오리',lowp:'🧲 저기압 자석',highp:'😇 맑음 천사'});
EL.hud({left:'max(10px,env(safe-area-inset-left))',top:touchUI?'calc(max(10px,env(safe-area-inset-top)) + 150px)':'auto',bottom:touchUI?'auto':'max(12px,env(safe-area-inset-bottom))'});EL.showHud(false);
EL.popAt({left:'max(12px,env(safe-area-inset-left))',top:'auto',bottom:touchUI?'calc(max(12px,env(safe-area-inset-bottom)) + 120px)':'calc(max(12px,env(safe-area-inset-bottom)) + 48px)',right:'auto',maxWidth:'330px'});
if(SET.assist==null)SET.assist=true;
buildTrack(LOB.trk,LOB.mode);lobby();$('load').style.display='none';requestAnimationFrame(loop);
addEventListener('pointerdown',()=>audio(),{once:true});

</script>
