<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#14213d;--quiet:#5b6478;--line:#dfe4ee;--blue:#1f5eff;--red:#e5383b;--green:#139a5b;--gold:#f4a300;--violet:#7b3fe4}
html,body{height:100%;overflow:hidden;background:#cfe3ff;color:var(--ink);font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR','Noto Sans KR',sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:10px 12px;display:none;flex-direction:column;gap:8px;pointer-events:none;z-index:5}

.bar{display:flex;align-items:center;gap:8px;padding-right:88px}
.pillx{background:rgba(255,255,255,.92);border-radius:12px;padding:6px 11px;font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(20,33,61,.08)}
.hearts{color:var(--red);letter-spacing:2px;font-size:17px}
.hearts .off{color:#d4d9e3}
.pig{color:var(--green)}
.clock{background:var(--ink);color:#fff}
.clock.low{background:var(--red);animation:blink .6s infinite}
@keyframes blink{50%{opacity:.6}}
.orders{display:flex;gap:8px}
.ord{background:rgba(255,255,255,.95);border-radius:14px;padding:6px 9px 6px 6px;display:flex;align-items:center;gap:7px;box-shadow:0 2px 8px rgba(20,33,61,.08);min-width:0;flex:1;max-width:220px;border:2px solid transparent;transition:transform .2s}
.ord img{width:38px;height:38px;flex:none}
.ord .tx{display:flex;flex-direction:column;min-width:0}
.ord .ag{font-size:11.5px;font-weight:800;color:var(--quiet);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .nm{font-size:13.5px;font-weight:900;white-space:nowrap}
.ord .ct{margin-left:auto;font-weight:900;font-size:16px;color:var(--blue)}
.ord.done{border-color:var(--green);transform:scale(1.06)}
.status{display:flex;gap:6px;flex-wrap:wrap}
.status .pillx{font-size:12.5px;padding:4px 9px}
.status .inno{color:var(--violet)}.status .ai{color:var(--blue)}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;z-index:10;background:rgba(207,227,255,.55);backdrop-filter:blur(2px)}
.screen.on{display:flex}
.panel{background:#fff;border-radius:24px;padding:22px 20px;max-width:480px;width:100%;box-shadow:0 14px 40px rgba(20,33,61,.15);display:flex;flex-direction:column;gap:14px;text-align:center;max-height:100%;overflow:auto}
.panel h1{font-size:clamp(32px,9vw,46px);font-weight:900;letter-spacing:-.02em;line-height:1.1}
.panel h1 small{display:block;font-size:14px;color:var(--blue);font-weight:800;letter-spacing:.02em;margin-bottom:6px}
.panel h2{font-size:26px;font-weight:900}
.lead{color:var(--quiet);font-size:14.5px;line-height:1.55}
.how{display:flex;flex-direction:column;gap:8px;text-align:left}
.how .rw{display:flex;align-items:center;gap:10px;background:#f3f6fb;border-radius:14px;padding:8px 10px}
.how .rw b{font-size:14px;min-width:44px}
.how .rw .ics{display:flex;gap:4px;flex-wrap:wrap}
.how .rw img{width:34px;height:34px}
.how .rw.good b{color:var(--green)}.how .rw.bad b{color:var(--red)}.how .rw.bonus b{color:var(--violet)}
.how .rw span{font-size:12.5px;color:var(--quiet);margin-left:auto;text-align:right;line-height:1.3}
.big{background:var(--blue);color:#fff;font-weight:900;font-size:19px;padding:16px 26px;border-radius:16px;box-shadow:0 6px 0 #1546c2;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #1546c2}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.credit{font-size:11.5px;color:var(--quiet);line-height:1.55}
.ctrl{font-size:13px;color:var(--quiet);display:flex;gap:6px;align-items:center;justify-content:center}
.bigstars{font-size:46px;color:var(--gold);letter-spacing:6px;line-height:1}
.bigstars .off{color:#e1e5ec}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#f3f6fb;border-radius:12px;padding:10px 4px}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:11.5px;color:var(--quiet);font-weight:700}
.learn{background:#e8efff;border-radius:14px;padding:12px 14px;text-align:left;font-size:14px;line-height:1.6}
.learn .h{color:var(--blue);display:block;margin-bottom:4px;font-weight:900}
.learn p+p{margin-top:6px}
#count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:#fff;text-shadow:0 6px 0 #1546c2,0 12px 30px rgba(20,33,61,.3);z-index:9;pointer-events:none}
#count.on{display:flex}
#banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--red);color:#fff;font-weight:900;font-size:22px;padding:14px 22px;border-radius:16px;z-index:8;display:none;text-align:center;line-height:1.35;box-shadow:0 10px 30px rgba(229,56,59,.35);pointer-events:none;width:max-content;max-width:90vw}
#banner small{display:block;font-size:14px;font-weight:700;opacity:.92}
#banner.ok{background:var(--green);box-shadow:0 10px 30px rgba(19,154,91,.35)}
#banner.on{display:block;animation:pop .3s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.7);opacity:0}}
#toasts{position:fixed;left:50%;top:132px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:7;width:min(92vw,460px)}
.toast{background:var(--ink);color:#fff;font-size:14.5px;font-weight:800;border-radius:12px;padding:9px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:tin .25s ease-out both;line-height:1.4;text-align:center}
.toast.good{background:var(--green)}.toast.bad{background:var(--red)}.toast.inno{background:var(--violet)}.toast.blue{background:var(--blue)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.top{position:fixed;top:10px;right:12px;z-index:20;display:flex;gap:6px}
.top button{width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:17px;color:var(--quiet)}
@media (max-width:560px){
 .ord{padding:5px 6px 5px 4px;gap:5px}
 .ord img{width:30px;height:30px}
 .ord .ag{font-size:10.5px}.ord .nm{font-size:12px}.ord .ct{font-size:14px}
 .pillx{font-size:13.5px;padding:5px 9px}
 .hearts{font-size:15px}
 #hud{padding:8px}
 .top{top:8px;right:8px}.top button{width:32px;height:32px}
 #banner{font-size:19px}
}
</style>
</head>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),cx=cv.getContext('2d');
var W=0,H=0,DPR=1,S=0;
var R=Math.random,pick=function(a){return a[Math.floor(R()*a.length)]};
var FONT="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR','Noto Sans KR',sans-serif";

/* ---------- 소리 ---------- */
var AC=null,muted=false;
function tone(f,d,type,v,delay){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
var sfx={
 catch:function(){tone(784,.08,'triangle',.1)},
 order:function(){tone(523,.1,'triangle',.1);tone(659,.1,'triangle',.1,.08);tone(988,.22,'triangle',.1,.16)},
 bad:function(){tone(200,.25,'sawtooth',.08);tone(140,.3,'sawtooth',.07,.1)},

 tick:function(){tone(660,.05,'sine',.08)},
 alarm:function(){tone(740,.14,'square',.06);tone(554,.14,'square',.06,.18)},
 end:function(){tone(523,.12,'triangle',.1);tone(659,.12,'triangle',.1,.12);tone(784,.12,'triangle',.1,.24);tone(1046,.3,'triangle',.1,.36)}
};
$('snd').onclick=function(){muted=!muted;this.innerHTML='<svg class="i"><use href="#i-'+(muted?'mute':'sound')+'"/></svg>'};

/* ---------- 물건 ---------- */
var GOODS={
 desk:{nm:'책걸상',c:'#1f5eff'},ext:{nm:'소화기',c:'#e5383b'},aid:{nm:'구급상자',c:'#139a5b'},
 laptop:{nm:'노트북',c:'#3d5a80'},blanket:{nm:'구호 담요',c:'#f08c00'},water:{nm:'생수',c:'#1c9ad6'}
};
var BADS={
 collude:{nm:'담합',c:'#2b2d42',why:'담합: 업체끼리 미리 짜고 가격을 맞춘 물건이에요. 받으면 안 돼요!'},
 defect:{nm:'불량품',c:'#5c4033',why:'불량품: 금 가고 망가진 물건이에요. 납품 검사에서 걸러요!'},
 fake:{nm:'가짜 서류',c:'#6c757d',why:'가짜 서류: 직접 만들지 않았는데 서류를 꾸민 업체예요!'}
};
var SPECIAL={
 inno:{nm:'혁신제품',c:'#7b3fe4'},green:{nm:'녹색제품',c:'#2f9e44'},ai:{nm:'AI 돋보기',c:'#1f5eff'},copper:{nm:'구리',c:'#c8691c'}
};
var AGENCY=[
 {ag:'초등학교',items:['desk','laptop']},{ag:'소방서',items:['ext','aid']},{ag:'보건소',items:['aid']},
 {ag:'재난 대피소',items:['blanket','water']},{ag:'도서관',items:['laptop','desk']},{ag:'군부대',items:['water','blanket']}
];

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawTile(c,k,s,glow){
 var g=GOODS[k]||BADS[k]||SPECIAL[k],h=s/2,lw=Math.max(2,s*.075);
 c.save();
 if(glow){c.shadowColor=glow;c.shadowBlur=s*.45}
 if(k==='green'){c.fillStyle=g.c;c.beginPath();c.arc(0,0,h,0,7);c.fill()}
 else if(k==='copper'){c.fillStyle=g.c;c.beginPath();c.moveTo(-h,h*.5);c.lineTo(-h*.6,-h*.45);c.lineTo(h*.6,-h*.45);c.lineTo(h,h*.5);c.closePath();c.fill()}
 else{rr(c,-h,-h,s,s,s*.22);c.fillStyle=g.c;c.fill()}
 c.shadowBlur=0;
 if(BADS[k]){c.lineWidth=lw;c.strokeStyle='#ff5a5f';rr(c,-h+lw/2,-h+lw/2,s-lw,s-lw,s*.2);c.stroke()}
 c.strokeStyle='#fff';c.fillStyle='#fff';c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';
 var u=s/10;
 c.beginPath();
 switch(k){
  case 'desk':c.rect(-3.2*u,-1.6*u,6.4*u,1.1*u);c.fill();c.beginPath();c.moveTo(-2.6*u,-.5*u);c.lineTo(-2.6*u,2.6*u);c.moveTo(2.6*u,-.5*u);c.lineTo(2.6*u,2.6*u);c.moveTo(-2.6*u,1.1*u);c.lineTo(2.6*u,1.1*u);c.stroke();break;
  case 'ext':rr(c,-1.5*u,-1.8*u,3*u,5*u,1.3*u);c.fill();c.beginPath();c.moveTo(0,-1.8*u);c.lineTo(0,-3*u);c.lineTo(2.4*u,-3*u);c.lineTo(2.9*u,-1.6*u);c.stroke();c.fillStyle=g.c;c.fillRect(-1.5*u,0,3*u,.8*u);break;
  case 'aid':c.fillRect(-.9*u,-3*u,1.8*u,6*u);c.fillRect(-3*u,-.9*u,6*u,1.8*u);break;
  case 'laptop':rr(c,-2.8*u,-2.6*u,5.6*u,3.6*u,.5*u);c.stroke();c.beginPath();c.moveTo(-3.6*u,2.2*u);c.lineTo(3.6*u,2.2*u);c.stroke();break;
  case 'blanket':rr(c,-3*u,-2.4*u,6*u,4.8*u,.8*u);c.stroke();c.beginPath();c.moveTo(-3*u,-.6*u);c.lineTo(3*u,-.6*u);c.moveTo(-3*u,.9*u);c.lineTo(3*u,.9*u);c.stroke();break;
  case 'water':rr(c,-1.5*u,-1.6*u,3*u,4.6*u,.8*u);c.fill();c.fillRect(-.7*u,-3*u,1.4*u,1.3*u);c.fillStyle=g.c;c.fillRect(-1.5*u,0,3*u,1*u);break;
  case 'collude':c.arc(-1.1*u,-.4*u,1.8*u,0,7);c.stroke();c.beginPath();c.arc(1.1*u,-.4*u,1.8*u,0,7);c.stroke();break;
  case 'defect':c.strokeStyle='#d8b48a';rr(c,-3*u,-2.4*u,6*u,4.6*u,.6*u);c.stroke();c.strokeStyle='#ff5a5f';c.beginPath();c.moveTo(-.6*u,-2.4*u);c.lineTo(.6*u,-.6*u);c.lineTo(-.4*u,.4*u);c.lineTo(.8*u,2.2*u);c.stroke();break;
  case 'fake':c.fillStyle='#f1f3f5';rr(c,-2.4*u,-3*u,4.8*u,5.6*u,.5*u);c.fill();c.strokeStyle='#e5383b';c.beginPath();c.moveTo(-1.4*u,-1.6*u);c.lineTo(1.4*u,1.2*u);c.moveTo(1.4*u,-1.6*u);c.lineTo(-1.4*u,1.2*u);c.stroke();break;
  case 'inno':var p=[];for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i%2?1.4*u:3.2*u;p.push([Math.cos(a)*r,Math.sin(a)*r])}c.moveTo(p[0][0],p[0][1]);p.forEach(function(q){c.lineTo(q[0],q[1])});c.closePath();c.fill();break;
  case 'green':c.moveTo(-2.4*u,2.4*u);c.quadraticCurveTo(-2.6*u,-2.8*u,2.8*u,-2.8*u);c.quadraticCurveTo(2.8*u,2.6*u,-2.4*u,2.4*u);c.fill();c.strokeStyle=g.c;c.beginPath();c.moveTo(-2*u,2*u);c.lineTo(1.4*u,-1.4*u);c.stroke();break;
  case 'ai':c.arc(-.6*u,-.6*u,2.2*u,0,7);c.stroke();c.beginPath();c.moveTo(1*u,1*u);c.lineTo(3*u,3*u);c.stroke();break;
  case 'copper':c.strokeStyle='rgba(255,255,255,.7)';c.moveTo(-h*.45,-h*.15);c.lineTo(h*.2,-h*.15);c.stroke();break;
 }
 c.restore();
}
var ICON={};
function iconURL(k){if(ICON[k])return ICON[k];var o=document.createElement('canvas'),s=64;o.width=o.height=s*2;var c=o.getContext('2d');c.scale(2,2);c.translate(s/2,s/2);drawTile(c,k,s*.86);ICON[k]=o.toDataURL();return ICON[k]}

/* 바로(로봇)와 바구니 */
function drawBot(x,y,s,wide,hurt){
 var bw=s*(wide?3.3:2.1),bh=s*.62,c=cx;
 c.save();c.translate(x,y);
 var hw=s*1.05,hh=s*.82,hy=-bh-hh*.85;
 c.fillStyle='#14213d';c.beginPath();c.arc(-hw/2-s*.06,hy+hh/2,s*.11,0,7);c.arc(hw/2+s*.06,hy+hh/2,s*.11,0,7);c.fill();
 c.strokeStyle='#1f5eff';c.lineWidth=s*.06;c.beginPath();c.moveTo(0,hy);c.lineTo(0,hy-s*.22);c.stroke();
 c.fillStyle='#f4a300';c.beginPath();c.arc(0,hy-s*.25,s*.09,0,7);c.fill();
 rr(c,-hw/2,hy,hw,hh,hh*.38);c.fillStyle=hurt?'#e5383b':'#1f5eff';c.fill();
 rr(c,-hw/2+s*.12,hy+s*.12,hw-s*.24,hh-s*.26,hh*.28);c.fillStyle='#e8efff';c.fill();
 c.fillStyle='#14213d';c.strokeStyle='#14213d';
 if(hurt){c.lineWidth=s*.06;[-1,1].forEach(function(d){c.beginPath();c.moveTo(d*s*.2-s*.07,hy+hh*.38);c.lineTo(d*s*.2+s*.07,hy+hh*.52);c.moveTo(d*s*.2+s*.07,hy+hh*.38);c.lineTo(d*s*.2-s*.07,hy+hh*.52);c.stroke()})}
 else{c.beginPath();c.arc(-s*.2,hy+hh*.45,s*.075,0,7);c.fill();c.beginPath();c.arc(s*.2,hy+hh*.45,s*.075,0,7);c.fill()}
 c.lineWidth=s*.055;c.beginPath();
 if(!hurt)c.arc(0,hy+hh*.55,s*.12,.2,Math.PI-.2);else c.arc(0,hy+hh*.78,s*.1,Math.PI+.3,-.3);
 c.stroke();
 c.fillStyle=wide?'#7b3fe4':'#f4a300';
 c.beginPath();c.moveTo(-bw/2,-bh);c.lineTo(bw/2,-bh);c.lineTo(bw/2-s*.18,0);c.lineTo(-bw/2+s*.18,0);c.closePath();c.fill();
 c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=s*.045;
 for(var i=1;i<5;i++){var xx=-bw/2+bw*i/5;c.beginPath();c.moveTo(xx,-bh+s*.08);c.lineTo(xx*(1-.08),-s*.06);c.stroke()}
 c.fillStyle='#14213d';rr(c,-bw/2-s*.06,-bh-s*.1,bw+s*.12,s*.16,s*.08);c.fill();
 c.font='900 '+Math.round(s*.24)+'px '+FONT;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.fillText('나라장터',0,-bh*.45);
 c.restore();
 return bw;
}

/* ---------- 상태 ---------- */
var G=null,last=0,raf=0,hudT=0;
var input={x:null,left:false,right:false};

function resize(){
 DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
 S=Math.max(44,Math.min(66,Math.min(W,H)/8.5));
}
addEventListener('resize',resize);

function newOrder(){
 var a=pick(AGENCY),k=pick(a.items);
 var used=G?G.orders.map(function(o){return o&&o.k}):[],tries=0;
 while(used.indexOf(k)>=0&&tries++<20){a=pick(AGENCY);k=pick(a.items)}
 return {ag:a.ag,k:k,need:2+Math.floor(R()*2),got:0};
}
function start(){
 resize();
 G={t:60,score:0,hearts:3,orders:[],items:[],spawn:.6,x:W/2,wideT:0,aiT:0,hurtT:0,
  done:0,dodge:0,inno:0,green:0,copper:0,crisis:false,crisisDone:false,seen:{},over:false,shake:0,parts:[],floats:[],started:false};
 G.orders=[newOrder()];G.orders.push(newOrder());G.orders.push(newOrder());
 input.x=null;
 $('sTitle').classList.remove('on');$('sEnd').classList.remove('on');$('hud').classList.add('on');$('home').style.display='';
 renderHud();$('hTime').textContent='60';$('hClock').classList.remove('low');
 var n=3;$('count').classList.add('on');$('count').textContent=n;sfx.tick();
 clearInterval(start.iv);
 start.iv=setInterval(function(){n--;if(n>0){$('count').textContent=n;sfx.tick()}else{clearInterval(start.iv);$('count').textContent='시작!';sfx.order();setTimeout(function(){$('count').classList.remove('on')},500);G.started=true}},700);
}

/* ---------- 떨어지는 물건 ---------- */
function spawnItem(){
 var el=60-G.t,k,kind,r=R();
 var badP=.18+Math.min(.12,el*.003),spP=.1;
 if(G.crisis&&R()<.45){k='copper';kind='sp'}
 else if(r<badP){k=pick(['collude','defect','fake']);kind='bad'}
 else if(r<badP+spP){k=el<12?'green':pick(['inno','inno','green','ai']);kind='sp'}
 else{
  var need=G.orders.filter(function(o){return o.got<o.need}).map(function(o){return o.k});
  k=(need.length&&R()<.7)?pick(need):pick(Object.keys(GOODS));kind='good';
 }
 var sp=(H*.19+el*H*.0035)*(.9+R()*.2);
 G.items.push({k:k,kind:kind,x:S/2+8+R()*(W-S-16),y:-S,vy:sp,rot:(R()-.5)*.4,vr:(R()-.5)*1.2,wob:R()*6});
}

function catchItem(it){
 if(it.kind==='good'){
  var o=G.orders.filter(function(o){return o.k===it.k&&o.got<o.need})[0];
  if(o){o.got++;G.score+=20;floatTxt(it.x,it.y,'+20','#139a5b');sfx.catch();burst(it.x,it.y,GOODS[it.k].c);
   if(o.got>=o.need){G.done++;G.score+=60;sfx.order();toast(o.ag+'에 '+GOODS[o.k].nm+' 납품 완료! +60','good');
    var idx=G.orders.indexOf(o);setTimeout(function(){if(G&&!G.over){G.orders[idx]=newOrder();renderHud()}},700)}
  }else{G.score+=5;floatTxt(it.x,it.y,'+5','#139a5b');sfx.catch();
   if(!G.seen.extra){G.seen.extra=1;toast('위에 뜬 주문 물건을 받으면 점수가 훨씬 커요!','blue')}}
 }else if(it.kind==='bad'){
  G.hearts--;G.hurtT=.8;G.shake=.35;sfx.bad();burst(it.x,it.y,'#e5383b');
  floatTxt(it.x,it.y,'앗!','#e5383b');
  toast(G.seen[it.k]?BADS[it.k].nm+'은(는) 피해야 해요!':BADS[it.k].why,'bad');G.seen[it.k]=1;
  if(G.hearts<=0)setTimeout(end,400);
 }else{
  sfx.bonus();burst(it.x,it.y,SPECIAL[it.k].c);
  if(it.k==='inno'){G.inno++;G.wideT=8;G.score+=30;floatTxt(it.x,it.y,'+30 바구니 커짐!','#7b3fe4');if(!G.seen.inno){G.seen.inno=1;toast('혁신제품을 먼저 사 주면 새 기술 기업이 자라요! 8초 동안 바구니가 커져요.','inno')}}
  if(it.k==='green'){G.green++;G.score+=25;floatTxt(it.x,it.y,'+25 탄소 줄임','#2f9e44');if(!G.seen.green){G.seen.green=1;toast('녹색제품은 탄소를 덜 내요. 지구도 웃어요!','good')}}
  if(it.k==='ai'){G.aiT=7;floatTxt(it.x,it.y,'AI 돋보기!','#1f5eff');toast('AI 돋보기: 7초 동안 불공정 물건이 빨갛게 보이고 느려져요.','blue')}
  if(it.k==='copper'){G.copper++;G.score+=15;floatTxt(it.x,it.y,'+15 비축','#c8691c')}
 }
 renderHud();
}

/* ---------- 효과 ---------- */
function burst(x,y,col){for(var i=0;i<12;i++){var a=R()*7,v=80+R()*180;G.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:.6,col:col})}}
function floatTxt(x,y,t,col){G.floats.push({x:x,y:y,t:t,col:col,life:1})}
function toast(t,k){var d=document.createElement('div');d.className='toast '+(k||'');d.textContent=t;$('toasts').appendChild(d);while($('toasts').children.length>2)$('toasts').firstChild.remove();setTimeout(function(){d.remove()},2800)}
function banner(t,sub,ms,ok){var b=$('banner');b.innerHTML=t+(sub?'<small>'+sub+'</small>':'');b.classList.toggle('ok',!!ok);b.classList.add('on');clearTimeout(banner.tm);banner.tm=setTimeout(function(){b.classList.remove('on')},ms||2200)}

function renderHud(){
 var h='';for(var i=0;i<3;i++)h+=i<G.hearts?'♥':'<span class="off">♥</span>';$('hHearts').innerHTML=h;
 $('hScore').textContent=G.score.toLocaleString('ko-KR')+'만 원';
 $('hOrders').innerHTML=G.orders.map(function(o){return '<div class="ord'+(o.got>=o.need?' done':'')+'"><img src="'+iconURL(o.k)+'" alt=""><div class="tx"><span class="ag">'+o.ag+'</span><span class="nm">'+GOODS[o.k].nm+'</span></div><span class="ct">'+Math.min(o.got,o.need)+'/'+o.need+'</span></div>'}).join('');
 var st='';
 if(G.wideT>0)st+='<div class="pillx inno">혁신 바구니 '+Math.ceil(G.wideT)+'초</div>';
 if(G.aiT>0)st+='<div class="pillx ai">AI 돋보기 '+Math.ceil(G.aiT)+'초</div>';
 if(G.crisis)st+='<div class="pillx" style="color:#c8691c">구리 비축 '+G.copper+'개</div>';
 $('hStatus').innerHTML=st;
}

/* ---------- 그리기 ---------- */
var clouds=[];for(var i=0;i<6;i++)clouds.push({x:Math.random(),y:.15+Math.random()*.45,s:.6+Math.random()*.8,v:.004+Math.random()*.008});
function drawBg(dt){
 var g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,G&&G.crisis?'#ffd8cc':'#bcd8ff');g.addColorStop(1,'#eef5ff');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 cx.fillStyle='rgba(255,255,255,.85)';
 clouds.forEach(function(c){c.x+=c.v*dt;if(c.x>1.2)c.x=-.2;var x=c.x*W,y=c.y*H,s=c.s*S;cx.beginPath();cx.arc(x,y,s*.6,0,7);cx.arc(x+s*.55,y-s*.2,s*.5,0,7);cx.arc(x+s*1.1,y,s*.55,0,7);cx.fill()});
 var gy=H-S*.55;
 cx.fillStyle='#d6e2f5';
 for(var i=0;i<9;i++){var bw=W/9,bh=S*(1.2+((i*37)%5)*.35);cx.fillRect(i*bw+4,gy-bh,bw-8,bh)}
 cx.fillStyle='#c4d4ee';var mx=W/2,mw=Math.min(W*.5,S*6);cx.fillRect(mx-mw/2,gy-S*2.6,mw,S*2.6);
 cx.beginPath();cx.moveTo(mx-mw/2-10,gy-S*2.6);cx.lineTo(mx,gy-S*3.3);cx.lineTo(mx+mw/2+10,gy-S*2.6);cx.fill();
 cx.fillStyle='#b4c6e6';for(var j=0;j<5;j++)cx.fillRect(mx-mw/2+mw*(j+.35)/5,gy-S*2.2,mw*.3/5,S*2.2);
 cx.fillStyle='#9fd18b';cx.fillRect(0,gy,W,H-gy);cx.fillStyle='#86c06f';cx.fillRect(0,gy,W,4);
}
function drawScene(dt){
 drawBg(dt);
 if(!G)return;
 var sx=0,sy=0;if(G.shake>0){sx=(R()-.5)*12*G.shake/.35;sy=(R()-.5)*8*G.shake/.35}
 cx.save();cx.translate(sx,sy);
 G.items.forEach(function(it){
  var a=it.rot+Math.sin(it.wob)*.08;
  cx.save();cx.translate(it.x,it.y);cx.rotate(a);
  var glow=null;if(it.kind==='sp')glow=SPECIAL[it.k].c;if(it.kind==='bad'&&G.aiT>0)glow='#ff2d2d';
  drawTile(cx,it.k,S,glow);
  if(it.kind==='bad'&&G.aiT>0){cx.strokeStyle='#ff2d2d';cx.lineWidth=4;cx.beginPath();cx.arc(0,0,S*.75,0,7);cx.stroke()}
  cx.rotate(-a);
  var nm=(GOODS[it.k]||BADS[it.k]||SPECIAL[it.k]).nm;
  cx.font='900 '+Math.round(S*.24)+'px '+FONT;cx.textAlign='center';cx.textBaseline='top';
  cx.lineWidth=4;cx.strokeStyle='rgba(255,255,255,.95)';cx.strokeText(nm,0,S*.56);cx.fillStyle=it.kind==='bad'?'#e5383b':'#14213d';cx.fillText(nm,0,S*.56);
  cx.restore();
 });
 var by=H-S*.62;
 G.bw=drawBot(G.x,by,S,G.wideT>0,G.hurtT>0);
 G.by=by;
 G.parts.forEach(function(p){cx.globalAlpha=Math.max(0,p.life/.6);cx.fillStyle=p.col;cx.fillRect(p.x-3,p.y-3,6,6)});cx.globalAlpha=1;
 G.floats.forEach(function(f){cx.globalAlpha=Math.max(0,f.life);cx.font='900 '+Math.round(S*.36)+'px '+FONT;cx.textAlign='center';cx.lineWidth=5;cx.strokeStyle='#fff';cx.strokeText(f.t,f.x,f.y);cx.fillStyle=f.col;cx.fillText(f.t,f.x,f.y)});cx.globalAlpha=1;
 cx.restore();
}

/* ---------- 흐름 ---------- */
function loop(now){
 var dt=Math.min(.05,(now-last)/1000);last=now;
 if(G&&!G.over&&G.started){
  G.t-=dt;
  if(G.t<=0){G.t=0;end()}
  var sp=W*1.4;
  if(input.left)G.x-=sp*dt;if(input.right)G.x+=sp*dt;
  if(input.x!=null)G.x+=(input.x-G.x)*Math.min(1,dt*14);
  var half=(G.bw||S*2)/2;G.x=Math.max(half,Math.min(W-half,G.x));
  if(!G.crisis&&!G.crisisDone&&G.t<=32){G.crisis=true;sfx.alarm();banner('공급망 위기 경보!','구리가 귀해졌어요. 떨어지는 구리를 받아 비축해요',2600)}
  if(G.crisis&&G.t<=20){G.crisis=false;G.crisisDone=true;var b=G.copper*20;G.score+=b;sfx.order();banner('위기 끝! 비축 구리 '+G.copper+'개로 공장을 지켰어요','+'+b+'만 원 보너스',2400,true);renderHud()}
  G.spawn-=dt;var el=60-G.t;
  if(G.spawn<=0){spawnItem();G.spawn=Math.max(.38,.85-el*.008)*(G.crisis?.8:1)}
  var slow=G.aiT>0?.6:1;
  G.items.forEach(function(it){it.y+=it.vy*dt*(it.kind==='bad'?slow:1);it.rot+=it.vr*dt;it.wob+=dt*3});
  var top=G.by-S*.62,bw=G.bw;
  G.items=G.items.filter(function(it){
   var reach=it.kind==='bad'?bw/2-S*.1:bw/2+S*.3;
   if(it.y+S*.35>=top&&it.y-S*.3<=top+S*.3&&Math.abs(it.x-G.x)<reach){catchItem(it);return false}
   if(it.y>H+S){if(it.kind==='bad'){G.dodge++;G.score+=3}return false}
   return true;
  });
  ['wideT','aiT','hurtT','shake'].forEach(function(k){if(G[k]>0)G[k]=Math.max(0,G[k]-dt)});
  G.parts.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt});G.parts=G.parts.filter(function(p){return p.life>0});
  G.floats.forEach(function(f){f.y-=60*dt;f.life-=dt});G.floats=G.floats.filter(function(f){return f.life>0});
  hudT-=dt;if(hudT<=0){hudT=.25;$('hTime').textContent=Math.ceil(G.t);$('hClock').classList.toggle('low',G.t<=10);renderHud()}
 }
 drawScene(dt);
 raf=requestAnimationFrame(loop);
}
function end(){
 if(G.over)return;G.over=true;sfx.end();
 var sc=G.score,st=sc>=1600?3:sc>=900?2:sc>=350?1:0;
 if(G.hearts<=0)st=Math.min(st,1);
 $('eTitle').textContent=G.hearts<=0?'불공정에 세 번 당했어요!':st>=3?'최고의 조달 도우미!':st>=2?'믿음직한 조달 도우미!':'수고했어요!';
 var s='';for(var i=0;i<3;i++)s+=i<st?'★':'<span class="off">★</span>';$('eStars').innerHTML=s;
 $('eScore').textContent=sc.toLocaleString('ko-KR')+'만';$('eOrders').textContent=G.done;$('eDodge').textContent=G.dodge;
 var L=['<span class="h">오늘 배운 조달 상식</span><p>나라장터는 공공기관 7만 1천여 곳과 업체 60만여 곳이 함께 쓰는 나라의 전자 조달 창구예요. 조달청은 학교 책걸상부터 소방 장비까지 공공기관이 쓰는 물건을 사서 공급해요.</p>',
  '<p>업체끼리 미리 짜고 가격을 맞추는 <b>담합</b>은 불공정 조달행위예요. 조달청은 이런 행위를 조사하고 감독해요.</p>'];
 if(G.inno)L.push('<p>공공기관이 혁신제품을 먼저 사서 써 보는 <b>혁신조달</b>은 새 기술 기업이 자라는 사다리가 돼요.</p>');
 if(G.copper)L.push('<p>조달청은 구리·알루미늄 같은 원자재를 <b>비축</b>해 두었다가 공급망 위기 때 풀어 중소기업을 도와요.</p>');
 $('eLearn').innerHTML=L.join('');
 setTimeout(function(){$('hud').classList.remove('on');$('sEnd').classList.add('on')},700);
}

/* ---------- 조작 ---------- */
cv.addEventListener('pointerdown',function(e){input.x=e.clientX;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',function(e){if(e.pointerType==='mouse'||e.buttons)input.x=e.clientX});
cv.addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')input.x=null});
addEventListener('keydown',function(e){
 if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){input.left=true;input.x=null}
 if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){input.right=true;input.x=null}
 if((e.key==='Enter'||e.key===' ')&&(!G||G.over)){e.preventDefault();start()}
});
addEventListener('keyup',function(e){if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')input.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')input.right=false});

/* ---------- 시작 화면 ---------- */
function howRow(cls,label,keys,note){return '<div class="rw '+cls+'"><b>'+label+'</b><div class="ics">'+keys.map(function(k){return '<img src="'+iconURL(k)+'" alt="">'}).join('')+'</div><span>'+note+'</span></div>'}
$('how').innerHTML=howRow('good','받기',['desk','ext','aid','blanket'],'위에 뜬 <b>주문</b>을<br>채워요')+howRow('bad','피하기',['collude','defect','fake'],'담합·불량품·<br>가짜 서류')+howRow('bonus','보너스',['inno','green','ai'],'혁신·녹색제품,<br>AI 돋보기');
$('bStart').onclick=start;$('bAgain').onclick=start;
$('home').onclick=function(){if(G)G.over=true;clearInterval(start.iv);$('count').classList.remove('on');$('hud').classList.remove('on');$('sEnd').classList.remove('on');$('sTitle').classList.add('on');this.style.display='none'};
resize();last=performance.now();raf=requestAnimationFrame(loop);
window.__sok={get G(){return G},start:start,input:input,get S(){return S}};
})();
</script>
</body>
</html>
