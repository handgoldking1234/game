<script>
/* ============ claude.ai 함께 하기 (room 기능을 PeerJS처럼 쓰는 연결 도구) ============ */
let NETR_=null;
(async()=>{try{if(window.claude&&claude.use){const r=await claude.use('room');if(r)NETR_=r}}catch(e){NETR_=null}})();
const RP_CLEAN=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F­​-‏‪-‮⁠-⁯﻿-]/g,'');
const RP_LATEST=new Set(['p','s','m','gs','ps','pos','st','mobs','in']);
class RPConn{constructor(pc,peer){this.pc=pc;this.peer=peer;this.open=false;this.h={}}
  on(ev,fn){(this.h[ev]=this.h[ev]||[]).push(fn);return this}
  fire(ev,a){for(const f of this.h[ev]||[])try{f(a)}catch(e){console.error(e)}}
  send(m){if(this.open)this.pc._q(this.peer,m)}
  close(){this.open=false}}
class RoomPeer{
  constructor(id){this.id=id||null;this.h={};this.conns=new Map();this.seq=0;this.win=[];this.pend=[];this.seen={};this.chunks={};this.room=null;this.dead=false;this.unsub=[];
    this._start().catch(e=>this.fire('error',{type:e&&e.type||'network'}))}
  on(ev,fn){(this.h[ev]=this.h[ev]||[]).push(fn);return this}
  fire(ev,a){for(const f of this.h[ev]||[])try{f(a)}catch(e){console.error(e)}}
  async _start(){await new Promise(r=>setTimeout(r,0));const R=NETR_;if(!R)throw{type:'network'};const host=!!this.id;this.host=host;
    const name=String(host?this.id:'x').toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);
    if(host){this.room=await R.join(name);await new Promise(r=>setTimeout(r,1200));
      if(this.room.peers().some(p=>!p.sameTab&&p.presence&&p.presence.h)){await this.room.leave().catch(()=>{});throw{type:'unavailable-id'}}
      await this.room.presence({h:1,o:[]});this.me=(this.room.peers().find(p=>p.sameTab)||{}).peer;this._listen();this.fire('open',this.id)}
    else this.fire('open','guest')}
  connect(hid){const c=new RPConn(this,null);(async()=>{try{const name=String(hid).toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);this.room=await NETR_.join(name);
      let hp=null;for(let i=0;i<40&&!hp;i++){hp=this.room.peers().find(p=>!p.sameTab&&p.presence&&p.presence.h);if(!hp)await new Promise(r=>setTimeout(r,250))}
      if(!hp){await this.room.leave().catch(()=>{});this.fire('error',{type:'peer-unavailable'});return}
      this.me=(this.room.peers().find(p=>p.sameTab)||{}).peer;c.peer=hp.peer;this.conns.set(hp.peer,c);await this.room.presence({g:1,o:[]});this._listen();c.open=true;c.fire('open')}catch(e){this.fire('error',{type:'network'})}})();return c}
  _listen(){const r=this.room;this.unsub.push(r.onPeers(ch=>this._peers(ch),()=>{for(const c of this.conns.values()){c.open=false;c.fire('close')}}));this._peers({peers:r.peers(),joined:r.peers(),left:[],updated:[]});

  _peers(ch){for(const p of ch.left||[]){const c=this.conns.get(p.peer);if(c){c.open=false;this.conns.delete(p.peer);c.fire('close')}}
    for(const p of ch.peers){if(p.sameTab)continue;const pr=p.presence||{};
      if(this.host&&pr.g&&!this.conns.has(p.peer)){const c=new RPConn(this,p.peer);this.conns.set(p.peer,c);this.fire('connection',c);setTimeout(()=>{c.open=true;c.fire('open')},50)}
      const c=this.conns.get(p.peer);if(!c)continue;const o=Array.isArray(pr.o)?pr.o.slice().sort((x,y)=>x.s-y.s):[];const sn=this.seen[p.peer]||(this.seen[p.peer]={set:new Set(),floor:0});
      for(const e of o){if(!e||!(e.s>sn.floor)||sn.set.has(e.s))continue;sn.set.add(e.s);if(e.to!=='*'&&!(Array.isArray(e.to)&&e.to.includes(this.me)))continue;let txt=e.x;
        if(e.c){const k=p.peer+':'+e.c[0];const bk=this.chunks[k]||(this.chunks[k]=[]);bk[e.c[1]]=e.x;if(bk.filter(v=>v!=null).length<e.c[2])continue;txt=bk.join('');delete this.chunks[k]}
        try{c.fire('data',JSON.parse(txt))}catch(err){}}
      if(sn.set.size>600){const arr=[...sn.set].sort((x,y)=>x-y);sn.floor=arr[arr.length-400];sn.set=new Set(arr.slice(-400))}}}
  _q(to,m){const t=m&&m.t,key=RP_LATEST.has(t)?t+'|'+(m.id??''):null;
    for(const e of this.pend)if(e.ref===m){if(!e.to.includes(to))e.to.push(to);return}
    let txt;try{txt=RP_CLEAN(JSON.stringify(m))}catch(e){return}
    if(key){const e=this.pend.find(q=>q.key===key);if(e){e.ref=m;e.txt=txt;if(!e.to.includes(to))e.to.push(to);return}}
    this.pend.push({ref:m,key,to:[to],txt})}
  _flush(){if(!this.room||this.dead)return;const now=Date.now();
    for(const e of this.pend){const to=e.to.length>=this.conns.size&&this.host?'*':e.to.slice();
      if(e.key){this.win=this.win.filter(w=>!(w.key===e.key));}
      if(e.txt.length>1500){const id=(++this.seq);const n=Math.ceil(e.txt.length/1500);for(let i=0;i<n;i++)this.win.push({s:++this.seq,to,c:[id,i,n],x:e.txt.slice(i*1500,(i+1)*1500),t:now,big:1})}
      else this.win.push({s:++this.seq,to,x:e.txt,t:now,key:e.key})}
    this.pend=[];
    this.win=this.win.filter(w=>w.big?(w.n||0)<3:now-w.t<900);
    let out=[],size=40;const big=this.win.filter(w=>w.big).sort((x,y)=>(x.n||0)-(y.n||0)||x.s-y.s),small=this.win.filter(w=>!w.big);
    const L=w=>w.L||(w.L=JSON.stringify(w.x).length+60);const hasBig=big.length>0;

    for(const w of big){const l=L(w);if(size+l>3850)continue;size+=l;out.push(w);w.n=(w.n||0)+1}
    out.sort((a,b)=>a.s-b.s);const pl=out.map(w=>({s:w.s,to:w.to,x:w.x,...(w.c?{c:w.c}:{})}));const sig=pl.map(q=>q.s).join(',');
    if(sig===this.sig)return;this.sig=sig;this.room.presence({o:pl}).catch(()=>{})}
  destroy(){this.dead=true;clearInterval(this.timer);for(const u of this.unsub)try{u()}catch(e){}if(this.room)this.room.leave().catch(()=>{})}}

/* ============ 공원 (방장이 계산) ============ */
let S=null;
const IK=Object.keys(ITEMS);
const CARRY_MAX=4;
function newRun(night){S={night:night||1,phase:'play',items:[],mons:[],prog:{},done:{},fuel:100,rampage:0,gate:0,pipe:{i:0,ph:'rest',t:6},bj:{ph:'roam',t:16},pl:{},plist:[],nid:1,faints:0,evq:[],fuelT:0,t:0};return S}
function ev(e){if(S)S.evq.push(e);onEv(e)}
function evTo(pid,e){if(pid==='me')onEv(e);else netTo(pid,{t:'ev',e})}
function spawnItem(k,pos){const p=pos||freeSpot(9);S.items.push({id:S.nid++,k,x:r1(p.x),z:r1(p.z)})}
function startNight(n){S.night=n;S.phase='play';S.items=[];S.mons=[];S.prog={};S.done={};S.fuel=100;S.rampage=0;S.gate=0;S.pipe={i:0,ph:'rest',t:8};S.bj={ph:'roam',t:18};S.t=0;
  const cfg=NIGHTS[n];
  if(n===1){for(let i=0;i<26;i++)spawnItem('panel');S.prog={d:0,need:20}}
  if(n===2){for(const k of['coal','coal','oil','oil','gas','gas','blade','cell','wood','wheel','bio','cell'])spawnItem(k);S.prog={s:0,need:12}}
  if(n===3){for(let i=0;i<3;i++)spawnItem('battery');S.prog={}}
  if(n===4){for(let i=0;i<5;i++){spawnItem('gblade');spawnItem('fuse')}S.prog={gb:0,fu:0,need:4}}
  if(n>=3)for(let i=0;i<4;i++)spawnItem(pick(['wood','bio']));
  const start={zz:{x:0,z:-4},hw:{x:-20,z:-14},hk:{x:P.furn.x,z:P.furn.z-.6},jj:{x:PIPES[0].x,z:PIPES[0].z},bj:{x:20,z:8}};
  for(const k of cfg.mons)S.mons.push({id:S.nid++,k,x:start[k].x,z:start[k].z,yaw:0,st:k==='hk'?'sleep':'roam',goal:null,tgt:null,lost:0,stuck:0,hunt:0,silent:0,silT:rnd(15,30)});
  for(const id in S.pl){const p=S.pl[id];p.carry=[];p.faint=0;p.inv=4;p.out=0}
  ev({k:'night',n})}
function nightDone(){const n=S.night,pr=S.prog;if(n===1)return pr.d>=pr.need;if(n===2)return pr.s>=pr.need;if(n===3)return S.done.bulb&&S.done.fan&&S.done.dyn;if(n===4)return S.gate&&Object.values(S.pl).every(p=>p.out||p.gone);return false}
const safeZone=p=>dist(p.x,p.z,SP.x,SP.z)<6;
const live=p=>!p.faint&&!p.out&&!p.gone;
function faint(id,p,by){if(p.inv>0||!live(p)||safeZone(p))return;p.faint=3.6;p.inv=7;S.faints++;
  const c=p.carry.splice(0);c.forEach((k,i)=>{const a=i/Math.max(1,c.length)*TAU;const x=p.x+Math.cos(a)*1.2,z=p.z+Math.sin(a)*1.2;spawnItem(k,blocked(x,z,.6)?freeSpot(9):{x,z})});
  ev({k:'faint',id,by,n:p.n,drop:c.length})}
function near(p,q,r){return dist(p.x,p.z,q.x,q.z)<r}

/* ---- 행동 ---- */
function doAct(pid,a,p){if(!S||!p||S.phase!=='play'||p.faint)return;
  switch(a.k){
    case'pick':{const i=S.items.findIndex(t=>t.id===a.id);if(i<0)return;const it=S.items[i];if(dist(p.x,p.z,it.x,it.z)>2.6)return;if(p.carry.length>=CARRY_MAX){evTo(pid,{k:'toast',m:'🎒 손이 꽉 찼어요! 먼저 가져다 놓아요 (최대 4개)',c:'warn'});return}
      S.items.splice(i,1);p.carry.push(it.k);evTo(pid,{k:'pick',it:it.k});break}
    case'deliver':{if(a.st==='solar'&&near(p,P.solar,3.2)){const n=p.carry.filter(k=>k==='panel').length;if(!n)return;p.carry=p.carry.filter(k=>k!=='panel');S.prog.d=Math.min(S.prog.need,S.prog.d+n);
        ev({k:'deliv',n:p.n,m:`☀️ 패널 조각 ${n}개를 붙였어요! (${S.prog.d}/${S.prog.need})`,st:'solar'})}
      if(a.st==='grid'&&near(p,P.grid,3.2)){let g=0,f=0;p.carry=p.carry.filter(k=>{if(k==='gblade'&&S.prog.gb+g<S.prog.need){g++;return false}if(k==='fuse'&&S.prog.fu+f<S.prog.need){f++;return false}return true});if(!g&&!f)return;S.prog.gb+=g;S.prog.fu+=f;
        ev({k:'deliv',n:p.n,m:`⚡ 변전소 수리 중! 🌬️ ${S.prog.gb}/4 · 🔌 ${S.prog.fu}/4`,st:'grid'});if(S.prog.gb>=4&&S.prog.fu>=4)ev({k:'gridOn'})}break}
    case'sort':{const bin=a.bin==='r'?P.sortR:P.sortF;if(!near(p,bin,2.8))return;const i=p.carry.findIndex(k=>ITEMS[k].t);if(i<0){evTo(pid,{k:'toast',m:'넣을 자원을 먼저 주워 와요',c:'warn'});return}const k=p.carry[i];
      if(ITEMS[k].t===a.bin){p.carry.splice(i,1);S.prog.s++;ev({k:'sorted',n:p.n,it:k,cnt:S.prog.s})}else evTo(pid,{k:'wrongBin',it:k});break}
    case'feed':{if(!near(p,P.trough,3))return;const f=p.carry.filter(k=>ITEMS[k].fuel);if(!f.length){evTo(pid,{k:'toast',m:'🪵 장작이나 🌽 바이오 연료를 가져와요',c:'warn'});return}
      p.carry=p.carry.filter(k=>!ITEMS[k].fuel);S.fuel=Math.min(100,S.fuel+40*f.length);const was=S.rampage;S.rampage=0;ev({k:'fed',n:p.n,c:f.length,calm:was});break}
    case'mach':{const m=a.m;if(!(m==='bulb'||m==='fan')||S.done[m]||!near(p,P[m],2.8))return;const i=p.carry.indexOf('battery');if(i<0){evTo(pid,{k:'toast',m:'🔋 배터리가 필요해요',c:'warn'});return}p.carry.splice(i,1);S.done[m]=1;ev({k:'mach',m,n:p.n});break}
    case'dyn':{if(S.done.dyn||!near(p,P.dyn,2.8))return;S.done.dyn=1;ev({k:'mach',m:'dyn',n:p.n});break}
    case'gate':{if(S.night!==4||!(S.prog.gb>=4&&S.prog.fu>=4)||S.gate||!near(p,P.gate,4.5))return;S.gate=1;ev({k:'gate',n:p.n});break}}}

/* ---- 괴물 움직임 ---- */
function moveMon(m,tx,tz,spd,dt){const dx=tx-m.x,dz=tz-m.z,d=Math.hypot(dx,dz);if(d<.05)return d;const st=Math.min(d,spd*dt);const ox=m.x,oz=m.z;m.x+=dx/d*st;m.z+=dz/d*st;collide(m,.55);m.yaw=Math.atan2(dx,dz);
  const moved=Math.hypot(m.x-ox,m.z-oz);if(moved<st*.3)m.stuck+=dt;else m.stuck=Math.max(0,m.stuck-dt);if(m.stuck>1.1){m.stuck=0;m.goal=freeSpot(0);m.detour=2.5}return d}
function roam(m,spd,dt){if(!m.goal||dist(m.x,m.z,m.goal.x,m.goal.z)<1.5)m.goal=freeSpot(0);moveMon(m,m.goal.x,m.goal.z,spd,dt)}
function players(){return Object.entries(S.pl).filter(([,p])=>live(p))}
function stepMons(dt){const n=S.night,dark=NIGHTS[n].dark;
  for(const m of S.mons){if(m.detour>0)m.detour-=dt;
    if(m.k==='zz'){m.silT-=dt;if(m.silT<=0){m.silent=!m.silent;m.silT=m.silent?rnd(5,8):rnd(18,32)}
      let best=null,bd=1e9;const R=(dark?10:13);for(const[id,p]of players()){if(safeZone(p))continue;const d=dist(m.x,m.z,p.x,p.z);const vis=p.box?(p.mv&&d<2.6):d<R*(p.cr?.6:1);if(vis&&d<bd&&losClear(m.x,m.z,p.x,p.z)){bd=d;best=[id,p]}}
      if(best){m.tgt=best[0];m.lx=best[1].x;m.lz=best[1].z;m.lost=0;m.st='chase'}else if(m.st==='chase'){m.lost+=dt;if(m.lost>3.5)m.st='roam'}
      if(m.st==='chase'&&!(m.detour>0))moveMon(m,m.lx,m.lz,4.25+n*.15,dt);else roam(m,2.3,dt)}
    else if(m.k==='hw'){let heard=null,hd=1e9;for(const[id,p]of players()){if(safeZone(p))continue;const nz=!p.mv?0:p.run?17:p.cr?2.2:p.box?4.5:7;const d=dist(m.x,m.z,p.x,p.z);if(d<nz&&d<hd){hd=d;heard=p}}
      if(heard){m.hx=heard.x;m.hz=heard.z;m.hunt=4;m.st='hunt'}if(m.hunt>0){m.hunt-=dt;if(!(m.detour>0)&&moveMon(m,m.hx,m.hz,3.1,dt)<.8)m.hunt=Math.min(m.hunt,1)}else{m.st='roam';roam(m,1.5,dt)}}
    else if(m.k==='bj'){const B0=S.bj;B0.t-=dt;if(B0.ph==='roam'){roam(m,1.4,dt);m.st='roam';if(B0.t<=0){B0.ph='warn';B0.t=1.6;ev({k:'bjWarn'})}}
      else if(B0.ph==='warn'){m.st='warn';if(B0.t<=0){B0.ph='watch';B0.t=3}}
      else{m.st='watch';for(const[id,p]of players()){if(safeZone(p))continue;if(p.mv&&dist(m.x,m.z,p.x,p.z)<28&&losClear(m.x,m.z,p.x,p.z))faint(id,p,'bj')}if(B0.t<=0){B0.ph='roam';B0.t=rnd(14,20)}}}
    else if(m.k==='hk'){if(n<3)continue;if(!S.rampage){S.fuel=Math.max(0,S.fuel-dt*(n===4?1.5:1.25));if(S.fuel<=0){S.rampage=1;m.li=0;ev({k:'rampage'})}}
      if(S.rampage){m.st='run';const tgt=LOOP[m.li||0];if(moveMon(m,tgt.x,tgt.z,7,dt)<.8)m.li=((m.li||0)+1)%LOOP.length}else{m.st=S.fuel<30?'grumpy':'sleep';moveMon(m,P.furn.x,P.furn.z-.6,4,dt)}}
    else if(m.k==='jj'){const J=S.pipe;J.t-=dt;if(J.ph==='rest'&&J.t<=0){J.i=Math.random()*PIPES.length|0;J.ph='gurgle';J.t=2.6}else if(J.ph==='gurgle'&&J.t<=0){J.ph='out';J.t=rnd(6,9)}else if(J.ph==='out'&&J.t<=0){J.ph='rest';J.t=rnd(3,6)}
      m.x=PIPES[J.i].x;m.z=PIPES[J.i].z;m.st=J.ph;if(J.ph==='out')for(const[id,p]of players())if(dist(p.x,p.z,m.x,m.z)<1.9)faint(id,p,'jj')}
    // 붙잡기
    if(m.k==='zz'||m.k==='hw'||(m.k==='hk'&&S.rampage)){const R=m.k==='hk'?1.6:1.25;for(const[id,p]of players())if(dist(m.x,m.z,p.x,p.z)<R)faint(id,p,m.k)}}}
function hostStep(dt){if(!S)return;S.t+=dt;
  for(const id in S.pl){const p=S.pl[id];if(p.inv>0)p.inv-=dt;if(p.faint>0){p.faint-=dt;if(p.faint<=0)p.faint=0}if(S.night===4&&S.gate&&!p.out&&p.z<-41){p.out=1;ev({k:'out',n:p.n})}}
  if(S.phase==='play'){stepMons(dt);

  const to=setTimeout(()=>{if(!done)fail(asHost?'방을 만들지 못했어요. 잠시 뒤 다시 해 주세요.':'방을 찾지 못했어요. 번호를 확인해 주세요.')},20000);
  pc.on('error',e=>{if(!done){clearTimeout(to);fail(e.type==='unavailable-id'?'그 방 번호는 이미 쓰고 있어요':e.type==='peer-unavailable'?'그 번호의 방이 없어요':(window.claude&&!NETR_)?'claude.ai 링크에서는 로그인한 친구끼리만 함께 할 수 있어요. 크롬판 파일로 열어 주세요.':'연결에 실패했어요 ('+(e.type||'오류')+')')}});
  pc.on('open',()=>{if(asHost){done=true;clearTimeout(to);Object.assign(NET,{on:true,host:true,code});roomCard();toast(`방을 열었어요! 방 번호 ${code}`,'good');return}
    const hc=pc.connect(hid,{reliable:true});NET.hc=hc;hc.on('open',()=>{done=true;clearTimeout(to);Object.assign(NET,{on:true,guest:true,code});hc.send({t:'hi',n:NET.nick});waitCard()});
    hc.on('data',d=>onNet(d,'host'));hc.on('close',()=>{if(NET.guest){banner('방이 닫혔어요','방장이 나갔어요');setTimeout(()=>location.reload(),3000)}})});
  pc.on('connection',c=>{if(!asHost){c.close();return}c.on('open',()=>NET.conns.set(c.peer,c));c.on('data',d=>onNet(d,c.peer));c.on('close',()=>{NET.conns.delete(c.peer);const p=NET.pl[c.peer];if(p)toast(`${p.n}님이 나갔어요`);delete NET.pl[c.peer];if(S&&S.pl[c.peer])S.pl[c.peer].gone=1;if(!GAME.on)roomCard()})})}
function roomCard(){const pl=[{n:NET.nick},...Object.values(NET.pl)];const nn=store.get('night',1);
  openCard(`<div class="hd"><h2>👥 방 ${NET.code}</h2><span class="small">${pl.length}/4명</span></div><p class="small">친구에게 <b>방 번호 ${NET.code}</b>를 알려 주세요. 다 같이 공원을 탈출해요!</p>
   <div class="note">${pl.map((p,i)=>`${i===0?'👑':'🙂'} <b>${esc(p.n)}</b>`).join('<br>')}</div>
   <div class="row"><button class="btn" id="rgo" type="button">▶ 1번째 밤부터</button>${nn>1?`<button class="btn alt" id="rco" type="button">⏩ ${nn}번째 밤부터</button>`:''}</div>`);
  $('rgo').onclick=()=>{audio();beginHost(1)};const c=$('rco');if(c)c.onclick=()=>{audio();beginHost(nn)}}
function waitCard(){openCard(`<div class="hd"><h2>👥 방 ${NET.code}</h2></div><p>방장이 시작하면 바로 들어가요! 기다리는 동안 괴물 도감을 읽어 보세요.</p><div class="row"><button class="btn alt" id="wg" type="button">📖 괴물 도감</button></div>`);$('wg').onclick=()=>{dexCard();ov.querySelector('[data-x]').onclick=waitCard}}
const newPl=n=>({n,x:SP.x+rnd(-2,2),z:SP.z,yaw:0,box:0,cr:0,run:0,mv:0,carry:[],faint:0,inv:3,out:0});
function snap(){return{t:'s',n:S.night,ph:S.phase,pr:S.prog,dn:S.done,fu:Math.round(S.fuel),rp:S.rampage,gt:S.gate,pi:[S.pipe.i,S.pipe.ph],bj:S.bj.ph,fa:S.faints,
  I:S.items.map(t=>[t.id,IK.indexOf(t.k),t.x,t.z]),Mo:S.mons.map(m=>[m.id,MK.indexOf(m.k),r1(m.x),r1(m.z),Math.round(m.yaw*100)/100,m.k==='zz'&&m.silent&&m.st!=='chase'?'silent':m.st]),
  P:Object.entries(S.pl).filter(([,p])=>!p.gone).map(([id,p])=>[id,r1(p.x),r1(p.z),Math.round(p.yaw*100)/100,p.box?1:0,p.cr?1:0,p.faint>0?1:0,p.n,p.carry.join('.')])}}
function applySnap(d){V={night:d.n,phase:d.ph,prog:d.pr||{},done:d.dn||{},fuel:d.fu,rampage:d.rp,gate:d.gt,pipe:{i:d.pi[0],ph:d.pi[1]},bj:{ph:d.bj},faints:d.fa,
  items:d.I.map(r=>({id:r[0],k:IK[r[1]],x:r[2],z:r[3]})),mons:d.Mo.map(r=>({id:r[0],k:MK[r[1]],x:r[2],z:r[3],yaw:r[4],st:r[5]})),
  plist:d.P.map(r=>({id:r[0],x:r[1],z:r[2],yaw:r[3],box:r[4],cr:r[5],f:r[6],n:r[7],cy:r[8]?r[8].split('.'):[]}))}}
function onNet(d,from){if(!d||typeof d!=='object')return;
  if(NET.host&&from!=='host'){
    if(d.t==='hi'){if(Object.keys(NET.pl).length>=3){netTo(from,{t:'full'});return}NET.pl[from]={n:String(d.n||'친구').slice(0,10)};toast(`${NET.pl[from].n}님이 들어왔어요! 👋`,'good');
      netTo(from,{t:'you',id:from});if(S){S.pl[from]=newPl(NET.pl[from].n);netTo(from,{t:'init',id:from,n:S.night})}else roomCard();return}
    if(d.t==='in'){if(!S)return;const p=S.pl[from];if(!p)return;if(isFinite(d.x)&&isFinite(d.z)&&!(p.faint>0)){p.x=clamp(+d.x,-B,B);p.z=clamp(+d.z,-B-6,B);p.yaw=+d.y||0;p.box=!!d.b;p.cr=!!d.c;p.run=!!d.r;p.mv=!!d.m}
      if(Array.isArray(d.a))for(const a of d.a){if(!(a.s>(p.lastS||0)))continue;p.lastS=a.s;doAct(from,a,p)}return}
    if(d.t==='chat'){const n=NET.pl[from]?NET.pl[from].n:'친구';chatAdd(n,cleanChat(d.m));netSend({t:'chat',n,m:cleanChat(d.m),from});return}
    return}
  switch(d.t){
    case'you':NET.myId=d.id;break;
    case'init':ROLE.r='guest';NET.myId=d.id;startPlay();applyNight(d.n);nightCard(d.n);break;
    case's':if(ROLE.r==='guest')applySnap(d);break;
    case'ev':onEv(d.e);break;
    case'chat':if(d.from!==NET.myId)chatAdd(d.n,d.m);break;
    case'full':toast('방이 꽉 찼어요 (최대 4명)','bad');break}}
let netT=0;
function netTick(dt){if(!NET.on)return;netT-=dt;if(netT>0)return;netT=NETR_?.12:.08;
  if(NET.guest){if(!GAME.on)return;const now=performance.now();ACTQ=ACTQ.filter(a=>!a.t0||now-a.t0<2500);ACTQ.forEach(a=>a.t0=a.t0||now);
    netSend({t:'in',x:r1(ME.x),z:r1(ME.z),y:Math.round(ME.yaw*100)/100,b:ME.box?1:0,c:ME.cr?1:0,r:ME.run?1:0,m:ME.mv?1:0,a:ACTQ.map(a=>{const o=Object.assign({},a);delete o.t0;return o})});return}
  if(NET.host&&S){netSend(snap());if(S.evq.length){const ev=S.evq.splice(0);for(const e of ev)netSend({t:'ev',e})}}}

/* ============ 채팅 ============ */
const cleanChat=m=>String(m||'').replace(/[<>]/g,'').trim().slice(0,60);
function chatAdd(n,m,me){if(!m)return;const d=document.createElement('div');d.innerHTML=`<b>${esc(n)}</b> ${esc(m)}`;$('chatLog').appendChild(d);while($('chatLog').children.length>5)$('chatLog').firstChild.remove();setTimeout(()=>d.remove(),9000)}
function chatSend(m){m=cleanChat(m);if(!m)return;chatAdd(NET.nick||'나',m,1);if(NET.on){if(NET.host)netSend({t:'chat',n:NET.nick,m,from:'host'});else netSend({t:'chat',m})}}
function chatOpen(){if(!NET.on){toast('채팅은 친구와 함께 할 때 쓸 수 있어요');return}$('chatBar').hidden=false;if(document.pointerLockElement)document.exitPointerLock();for(const k in keys)keys[k]=false;$('chatIn').value='';$('chatIn').focus()}
function chatClose(){$('chatBar').hidden=true;$('chatIn').blur()}
$('chatF').addEventListener('submit',e=>{e.preventDefault();chatSend($('chatIn').value);chatClose()});$('chatIn').addEventListener('keydown',e=>{if(e.code==='Escape')chatClose()});
document.querySelectorAll('#chatBar .qb').forEach(b=>b.onclick=()=>{chatSend(b.textContent);chatClose()});

/* ============ 시작 ============ */
const GAME={on:false};
function nick(){const v=($('nick')&&$('nick').value||'').trim().slice(0,10);if(v){NET.nick=v;store.set('nick',v)}if(!NET.nick)NET.nick='탐험대'+(Math.random()*90+10|0)}
function startPlay(){GAME.on=true;document.body.classList.remove('pre');closeCard();ME.x=SP.x;ME.z=SP.z;ME.yaw=0;ME.stam=100;renderBar()}
function beginHost(n){ROLE.r=NET.on?'host':'solo';newRun(n);S.pl.me=newPl(NET.nick);for(const id in NET.pl)S.pl[id]=newPl(NET.pl[id].n);startPlay();LOG.facts=[];LOG.quiz=[];
  if(NET.on)for(const id in NET.pl)netTo(id,{t:'init',id,n});startNight(n)}
function startNextNight(){if(ROLE.r==='guest'||!S)return;LOG.facts=[];LOG.quiz=[];startNight(Math.min(4,S.night+1))}
function lobby(){const nn=store.get('night',1),won=store.get('won',0);
  openCard(`<div style="text-align:center;display:grid;gap:4px"><h1>🎡 한밤의 에너지 공원</h1><p>5학년 체험학습으로 간 <b>에너지 테마파크</b>. 그런데 버스가 고장 나고 밤이 되자, 공원의 <b>에너지 괴물</b>들이 깨어났어요! 에너지를 되살리고 탈출해요.</p><p class="small">🌙 4번의 밤 · 혼자 또는 친구 4명까지 · 만 10세 이상 · 조금 무서워요${won?` · 🏆 탈출 ${won}번`:''}</p></div>
   <label class="small">내 이름 <input class="inp" id="nick" maxlength="10" placeholder="예: 에너지탐험대" value="${esc(NET.nick)}"></label>
   <div class="row"><button class="btn" id="solo" type="button">▶ 혼자 1번째 밤부터</button>${nn>1?`<button class="btn alt" id="cont" type="button">⏩ ${nn}번째 밤부터</button>`:''}<button class="btn blue" id="host" type="button">👥 방 만들기</button></div>
   <div class="row"><input class="inp" id="code" inputmode="numeric" maxlength="4" placeholder="방 번호 4자리" style="width:150px"><button class="btn alt" id="join" type="button">🚪 방 들어가기</button></div>
   <div class="row"><button class="btn alt sm" id="dx" type="button">📖 괴물 도감</button><button class="btn alt sm" id="hp" type="button">🎮 조작법</button><button class="btn alt sm" id="jsT" type="button">😱 점프스케어 ${jsOn()?'켜짐':'꺼짐'}</button><button class="btn alt sm" id="gqT" type="button">🎨 그래픽 ${GQ==='high'?'높음':'보통'}</button></div>`,()=>{
   $('solo').onclick=()=>{nick();audio();beginHost(1)};const c=$('cont');if(c)c.onclick=()=>{nick();audio();beginHost(nn)};$('host').onclick=()=>{nick();audio();netStart(true)};$('join').onclick=()=>{nick();audio();netStart(false,$('code').value)};
   $('dx').onclick=()=>{dexCard();ov.querySelector('[data-x]').onclick=lobby};$('hp').onclick=()=>helpCard(lobby);$('jsT').onclick=()=>{store.set('jsc',jsOn()?0:1);if(jsOn())jumpscare('zz',1);lobby()};$('gqT').onclick=()=>{store.set('gq',GQ==='high'?'mid':'high');location.reload()}})}

/* ============ 루프 ============ */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let last=performance.now(),hudT=0;const T0=performance.now();
function frame(nw){const dt=Math.min(.05,Math.max(0,(nw-last)/1000));last=nw;const t=(nw-T0)/1000;
  try{if(GAME.on){if(ME.fainted>0){ME.fainted-=dt;if(ME.fainted<=0){ME.fainted=0;ME.x=SP.x+rnd(-2,2);ME.z=SP.z;ME.yaw=0;ME.pitch=0;$('fade').style.opacity=0}}
      moveMe(dt);
      if(ROLE.r!=='guest'&&S){const me=S.pl.me;if(me&&!(me.faint>0))Object.assign(me,{n:NET.nick,x:ME.x,z:ME.z,yaw:ME.yaw,box:ME.box,cr:ME.cr,run:ME.run,mv:ME.mv});if(!(ROLE.r==='solo'&&!ov.hidden))hostStep(dt);if(!NET.on)S.evq.length=0}
      syncWorld(dt,t);cues(dt);jsCues(dt);hudT-=dt;if(hudT<=0){hudT=.15;hud()}}
    else{camera.position.set(Math.sin(t*.05)*14,6,26+Math.cos(t*.05)*4);camera.rotation.set(-.12,Math.sin(t*.05)*.3,0);for(const s of SPIN)s.o.rotation[s.ax]+=dt*s.v}
    fxTick(dt);iaTick(dt);tpTick(dt);netTick(dt);if(JS.on)renderJS(dt);else renderer.render(scene,camera)}catch(err){console.error(err)}
  requestAnimationFrame(frame)}
buildPark();buildSky();decorate();buildProps();const ECO=monModel('eco');ECO.g.position.set(P.eco.x,0,P.eco.z);ECO.g.rotation.y=Math.PI*.15;
renderBar();requestAnimationFrame(frame);lobby();

</script>
</body></html>
