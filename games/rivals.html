function crossGeo(w,h,n=3){const g=[];for(let i=0;i<n;i++)for(const f of [0,Math.PI]){const p=new THREE.PlaneGeometry(w,h);p.translate(0,h/2,0);p.rotateY(i/n*Math.PI+f);g.push(p)}
