<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#243067;--quiet:#6f7bb0;--blue:#4f7dff;--pink:#ff5c8d;--yellow:#ffc928}
html,body{height:100%;overflow:hidden;background:#8fdcff;color:var(--ink);font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR','Noto Sans KR',sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.abs{position:fixed;z-index:5}
.chunk{background:#fff;border-radius:18px;box-shadow:0 4px 0 #b9cdf2,0 8px 16px rgba(36,48,103,.14)}
#top{display:flex;align-items:flex-start;gap:8px;height:76px}
#top>.chunk{margin-top:8px}
#top .sc{display:flex;flex-direction:column;line-height:1.05;margin-right:auto;min-width:0}
#top .sc small{font-size:12px;font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 1px 0 #2d6fb8}
#top .sc b{font-size:40px;font-weight:900;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:#fff;-webkit-text-stroke:6px #243067;paint-order:stroke fill;text-shadow:0 4px 0 #243067}
#top .sc span{font-size:12px;font-weight:800;color:#1f4f8f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:9px}
.nx{flex:none;display:flex;align-items:center;gap:6px;padding:5px 10px 5px 11px}
.nx small{font-size:11.5px;font-weight:900;color:var(--quiet);white-space:nowrap}
.nx img{width:38px;height:38px;display:block}
.ib{width:40px;height:40px;display:grid;place-items:center;font-size:18px;color:var(--ink);border-radius:14px}
.ib:active,.act:active,.big:active{transform:translateY(3px)}
#ladder{display:flex;align-items:center;justify-content:space-between;height:42px;padding:0 10px;background:rgba(36,48,103,.82);border-radius:21px;box-shadow:0 4px 0 rgba(24,32,78,.9)}
#ladder img{width:28px;height:28px;opacity:.3;filter:grayscale(1) brightness(1.4);transition:all .3s}
#ladder img.on{opacity:1;filter:none}
#ladder img.now{transform:scale(1.3);animation:bob 1s ease-in-out infinite}
#ladder i{flex:1;height:3px;background:rgba(255,255,255,.22);margin:0 2px;border-radius:2px}
@keyframes bob{50%{transform:scale(1.3) translateY(-3px)}}
#btns{display:flex;gap:10px;height:62px}
.act{flex:1;display:flex;align-items:center;gap:9px;padding:0 12px;text-align:left;border-radius:20px;min-width:0}
#bHold{box-shadow:0 4px 0 #f0b400,0 8px 16px rgba(36,48,103,.14)}
#bProbe{box-shadow:0 4px 0 #f2578a,0 8px 16px rgba(36,48,103,.14)}
.act img{width:42px;height:42px;flex:none}
.act .ph{display:block;width:40px;height:40px;border-radius:50%;border:3px dashed #c8d3ee;flex:none}
.act b{display:block;font-size:15.5px;font-weight:900;white-space:nowrap}
.act small{display:block;font-size:11.5px;font-weight:800;color:var(--quiet);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act>span:nth-child(2){min-width:0}
.act .n{margin-left:auto;min-width:28px;height:28px;border-radius:14px;background:var(--pink);color:#fff;font-size:16px;font-weight:900;display:grid;place-items:center}
.act.off .n{background:#c8d3ee}
.act.glow{animation:wig .5s ease-in-out infinite}
@keyframes wig{50%{transform:scale(1.04)}}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;z-index:10;background:rgba(104,196,255,.55);backdrop-filter:blur(5px)}
.screen.on{display:flex}
.panel{background:#fff;border-radius:32px;padding:24px 20px 22px;max-width:430px;width:100%;box-shadow:0 8px 0 #b9cdf2,0 24px 50px rgba(36,48,103,.25);display:flex;flex-direction:column;gap:14px;text-align:center;max-height:100%;overflow:auto;border:4px solid #fff}
.logo small{display:inline-block;font-size:13px;color:#fff;font-weight:900;background:var(--blue);border-radius:12px;padding:4px 12px;margin-bottom:10px}
.logo h1{font-size:clamp(44px,13vw,60px);font-weight:900;letter-spacing:-.02em;line-height:1;color:var(--yellow);-webkit-text-stroke:9px #243067;paint-order:stroke fill;text-shadow:0 6px 0 #243067}
.logo h1 em{font-style:normal;color:#ff7aa5}
.panel h2{font-size:25px;font-weight:900;letter-spacing:-.02em}
.lead{color:var(--quiet);font-size:14.5px;line-height:1.6;font-weight:700}
.lead b{color:var(--ink)}
.steps{display:flex;align-items:flex-end;justify-content:center;gap:0;height:56px}
.steps img{animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}}
.how{display:flex;flex-direction:column;gap:8px;text-align:left}
.how div{display:flex;align-items:center;gap:10px;background:#eef4ff;border-radius:18px;padding:8px 12px;font-size:13.5px;line-height:1.4;color:var(--quiet);font-weight:700}
.how img{width:36px;height:36px;flex:none}
.how b{color:var(--ink)}
.big{background:var(--pink);color:#fff;font-weight:900;font-size:21px;padding:15px 26px;border-radius:22px;box-shadow:0 6px 0 #d63a6c;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.big:active{box-shadow:0 3px 0 #d63a6c}
.credit{font-size:11.5px;color:var(--quiet);line-height:1.55;font-weight:700}
.hero{width:132px;height:132px;margin:0 auto;animation:hop 1.4s ease-in-out infinite}
.bigstars{font-size:46px;color:var(--yellow);letter-spacing:6px;line-height:1;-webkit-text-stroke:5px #243067;paint-order:stroke fill}
.bigstars .off{color:#e3e9f7;-webkit-text-stroke:5px #c8d3ee}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#eef4ff;border-radius:16px;padding:10px 4px}
.stat b{display:block;font-size:21px;font-weight:900}
.stat span{font-size:11.5px;color:var(--quiet);font-weight:800}
.learn{background:#fff6d6;border-radius:18px;padding:12px 14px;text-align:left;font-size:14px;line-height:1.6;font-weight:600}
.learn .h{color:#c98600;display:block;margin-bottom:4px;font-weight:900}
.learn p+p{margin-top:6px}
.quiz{background:#eef4ff;border-radius:18px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:8px}
.quiz .q{font-size:14.5px;font-weight:900;line-height:1.45}
.quiz .q small{display:block;color:var(--blue);font-size:12px;margin-bottom:2px}
.quiz button{background:#fff;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:800;text-align:left;box-shadow:0 3px 0 #b9cdf2;line-height:1.35}
.quiz button.ok{background:#d8f7e6;box-shadow:0 3px 0 #86d6a8}
.quiz button.no{background:#ffe3ec;box-shadow:0 3px 0 #f2a3bd}
.quiz .ex{font-size:13.5px;font-weight:700;color:var(--quiet);line-height:1.5}
.quiz .nx2{background:var(--blue);color:#fff;text-align:center;box-shadow:0 3px 0 #2a4fcc}
#toasts{position:fixed;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:7;width:min(92vw,410px)}
.toast{background:#fff;color:var(--ink);font-size:14px;font-weight:900;border-radius:20px;padding:7px 14px 7px 8px;box-shadow:0 4px 0 #b9cdf2,0 10px 22px rgba(36,48,103,.25);animation:tin .3s cubic-bezier(.3,1.6,.5,1) both;line-height:1.35;text-align:left;display:flex;align-items:center;gap:8px}
.toast img{width:34px;height:34px;flex:none}
.toast.noimg{padding-left:14px}
.toast.bad{background:#ffe3ec;box-shadow:0 4px 0 #f2a3bd,0 10px 22px rgba(36,48,103,.25)}
@keyframes tin{from{opacity:0;transform:scale(.7)}}
</style>
</head>

<svg width="0" height="0" style="position:absolute"><defs>
 <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></symbol>

<canvas id="cv"></canvas>

<div id="top" class="abs">
 <div class="sc"><small>SCORE</small><b id="score">0</b><span id="bestL">가장 크게 키운 단계: 수증기</span></div>

<section class="screen on" id="sTitle">
 <div class="panel">
  <div class="logo"><small>5학년 과학 · 날씨와 우리 생활</small><h1>물방울 <em>키우기</em></h1></div>
  <div class="steps" id="steps"></div>
  <p class="lead">같은 친구 둘이 만나면 한 단계 자라요.<br>보이지 않는 <b>수증기</b>를 <b>무지개</b>까지 키워 보세요!</p>
  <div class="how" id="how"></div>
  <button class="big" id="bStart"><svg class="i"><use href="#i-play"/></svg>시작하기</button>
  <p class="credit">초등 5학년 2학기 과학 「날씨와 우리 생활」과 함께 해요.<br>무지개는 재미로 넣은 마지막 단계예요.</p>
 </div>
</section>

<section class="screen" id="sEnd">
 <div class="panel">
  <img class="hero" id="eHero" alt="">
  <h2 id="eTitle"></h2>
  <div class="bigstars" id="eStars"></div>
  <div class="stats">
   <div class="stat"><b id="eScore">0</b><span>점수</span></div>
   <div class="stat"><b id="eMerge">0</b><span>합친 횟수</span></div>
   <div class="stat"><b id="eCatch">0</b><span>날린 미세먼지</span></div>
  </div>

  <div class="quiz" id="quiz"></div>
  <button class="big" id="bAgain"><svg class="i"><use href="#i-play"/></svg>다시 키우기</button>
 </div>
</section>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),cx=cv.getContext('2d'),R=Math.random;
var FONT="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR','Noto Sans KR',sans-serif";

/* ---------- 단계(친구들) ---------- */
var LV=[
 {nm:'미세먼지',r:8.5,a:'#cdbb9c',c:'#8c7a5f',d:'#5a4c38',e:'#ffe9c2'},
 {nm:'수증기',r:5,a:'#f2fffb',c:'#aeeede',d:'#55bfa9',e:'#2f9c86',say:''},
 {nm:'물방울',r:6.7,a:'#c2eaff',c:'#4fb8ff',d:'#1f86d6',e:'#fff',say:'응결! 수증기가 차가워지면 작은 물방울이 돼요.'},
 {nm:'구름 조각',r:8.6,a:'#ffffff',c:'#edf3fb',d:'#a3b6d2',e:'#7890b4',say:'작은 물방울이 하늘에 모여 떠 있으면 구름이에요.'},
 {nm:'구름',r:10.8,a:'#e6efff',c:'#9dbcf2',d:'#5a82cc',e:'#fff',say:'물방울이 더 모여 구름이 커졌어요.'},
 {nm:'먹구름',r:13.2,a:'#b3bcd2',c:'#737e9c',d:'#434c68',e:'#fff',say:'먹구름! 물방울이 아주 많이 모여 두껍고 어두워요.'},
 {nm:'빗방울',r:15.9,a:'#a8d4ff',c:'#2f7dff',d:'#1b4fc4',e:'#fff',say:'구름 속 물방울이 합쳐져 무거워지면 비가 되어 떨어져요.'},
 {nm:'소나기',r:19,a:'#c3b5ff',c:'#735ff2',d:'#4737ba',e:'#fff',say:'소나기! 짧은 시간에 세차게 쏟아지는 비예요.'},
 {nm:'무지개',r:22.5,a:'#fff6a8',c:'#ffc400',d:'#d48f00',e:'#fff',say:'비가 그친 뒤 햇빛이 물방울을 만나면 무지개가 보여요!'}
];
var PTS=[0,0,2,5,10,20,40,80,160];

function emblem(c,l,s,col){ /* 이마 장식: 날씨 그림 */
 var u=s/10;c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=Math.max(1.4,u*1.5);c.lineCap='round';c.lineJoin='round';
 var cloud=function(k){c.beginPath();c.arc(-2.4*u*k,.8*u*k,2.2*u*k,0,7);c.arc(.2*u*k,-1*u*k,2.9*u*k,0,7);c.arc(2.8*u*k,.9*u*k,2.1*u*k,0,7);c.fill();c.fillRect(-2.4*u*k,.6*u*k,5.2*u*k,2.4*u*k)};
 var drop=function(x,y,k){c.beginPath();c.moveTo(x,y-3.6*u*k);c.quadraticCurveTo(x+3.4*u*k,y+.6*u*k,x,y+2.6*u*k);c.quadraticCurveTo(x-3.4*u*k,y+.6*u*k,x,y-3.6*u*k);c.fill()};
 switch(l){
  case 0:[[-3,-1],[0,-2.4],[3,-.6],[-1.4,1.8],[2,2.2]].forEach(function(p){c.beginPath();c.arc(p[0]*u,p[1]*u,1.1*u,0,7);c.fill()});break;
  case 1:[-2.6,0,2.6].forEach(function(x){c.beginPath();c.moveTo(x*u,3.6*u);c.quadraticCurveTo((x-1.6)*u,1.2*u,x*u,0);c.quadraticCurveTo((x+1.6)*u,-1.4*u,x*u,-3.6*u);c.stroke()});break;
  case 2:drop(0,.4*u,1.25);break;
  case 3:cloud(.8);break;
  case 4:cloud(1.15);break;
  case 5:cloud(1.1);break;
  case 6:drop(0,1*u,1.1);c.beginPath();c.moveTo(-3.6*u,-4*u);c.lineTo(-3.6*u,-1.6*u);c.moveTo(3.6*u,-4*u);c.lineTo(3.6*u,-1.6*u);c.stroke();break;
  case 7:c.translate(0,-1.4*u);cloud(.95);[-2.6,0,2.6].forEach(function(x){c.beginPath();c.moveTo(x*u,3.6*u);c.lineTo((x-.9)*u,6*u);c.stroke()});break;
  case 8:['#ff6b6b','#fff','#4fb8ff'].forEach(function(k,i){c.strokeStyle=k;c.lineWidth=u*1.5;c.beginPath();c.arc(0,3*u,(5.6-i*1.7)*u,Math.PI,0);c.stroke()});break;
 }
 c.restore();
}
/* mood: 0 보통, 1 신남, 2 걱정 */
function face(c,l,r,mood,blink){
 var ex=r*.3,ey=r*.16,er=Math.max(1.6,r*.125),ink=l===0?'#fff':'#2a2140';
 if(l===0){c.fillStyle='#17132f';c.beginPath();c.ellipse(0,ey,r*.78,r*.27,0,0,7);c.fill()}
 c.fillStyle=ink;c.strokeStyle=ink;c.lineCap='round';c.lineWidth=Math.max(1.4,r*.07);
 if(blink||mood===1){[-1,1].forEach(function(s){c.beginPath();if(mood===1)c.arc(s*ex,ey+er*.4,er,Math.PI+.35,-.35);else{c.moveTo(s*ex-er,ey);c.lineTo(s*ex+er,ey)}c.stroke()})}
 else{[-1,1].forEach(function(s){c.beginPath();c.ellipse(s*ex,ey,er,er*1.15,0,0,7);c.fill();if(r>12){c.fillStyle=l===0?'#17132f':'#fff';c.beginPath();c.arc(s*ex-er*.3,ey-er*.4,er*.38,0,7);c.fill();c.fillStyle=ink}})}
 if(l===0){c.strokeStyle='#17132f';c.lineWidth=Math.max(1.4,r*.08);c.beginPath();c.moveTo(-ex-er*1.3,ey-er*2);c.lineTo(-ex+er,ey-er*1.2);c.moveTo(ex+er*1.3,ey-er*2);c.lineTo(ex-er,ey-er*1.2);c.stroke();
  c.strokeStyle='#fff';c.lineWidth=Math.max(1.4,r*.07);c.beginPath();c.moveTo(-r*.2,r*.56);c.quadraticCurveTo(0,r*.68,r*.26,r*.5);c.stroke();return}
 c.fillStyle='rgba(255,90,120,.38)';c.beginPath();c.ellipse(-r*.54,r*.36,r*.14,r*.09,0,0,7);c.ellipse(r*.54,r*.36,r*.14,r*.09,0,0,7);c.fill();
 c.strokeStyle=ink;c.fillStyle=ink;c.lineWidth=Math.max(1.3,r*.06);c.beginPath();
 if(mood===1){c.moveTo(-r*.17,r*.36);c.quadraticCurveTo(0,r*.74,r*.17,r*.36);c.closePath();c.fill();c.fillStyle='#ff7a9a';c.beginPath();c.ellipse(0,r*.5,r*.08,r*.05,0,0,7);c.fill()}
 else if(mood===2){c.ellipse(0,r*.46,r*.07,r*.09,0,0,7);c.stroke();c.fillStyle='#8fdcff';c.beginPath();c.moveTo(r*.7,-r*.2);c.quadraticCurveTo(r*.82,r*.02,r*.7,r*.06);c.quadraticCurveTo(r*.58,r*.02,r*.7,-r*.2);c.fill()}
 else{c.moveTo(-r*.13,r*.38);c.quadraticCurveTo(0,r*.52,r*.13,r*.38);c.stroke()}
}
function ballArt(c,l,r,mood,blink,label){
 var L=LV[l],lw=Math.max(2,r*.085);
 var g=c.createRadialGradient(-r*.3,-r*.45,r*.05,0,0,r*1.05);g.addColorStop(0,L.a);g.addColorStop(.62,L.c);g.addColorStop(1,L.d);
 c.beginPath();c.arc(0,0,r-lw/2,0,7);c.fillStyle=g;c.fill();c.lineWidth=lw;c.strokeStyle=L.d;c.stroke();
 c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(-r*.4,-r*.52,r*.2,r*.1,-.65,0,7);c.fill();c.beginPath();c.arc(-r*.6,-r*.3,r*.05,0,7);c.fill();
 c.save();c.translate(0,-r*.42);emblem(c,l,r*.27,L.e);c.restore();
 face(c,l,r,mood||0,blink);
 if(label&&r>=46){c.font='900 '+Math.max(11,Math.round(r*.19))+'px '+FONT;c.textAlign='center';c.textBaseline='middle';c.lineWidth=Math.max(3,r*.07);c.strokeStyle=L.d;c.lineJoin='round';c.strokeText(L.nm,0,r*.74);c.fillStyle='#fff';c.fillText(L.nm,0,r*.74)}

var QS=null;

function quizShow(){
 var box=$('quiz');if(QS.i>=QS.list.length){box.innerHTML='<div class="q"><small>과학 문제 끝!</small>3문제 중 '+QS.ok+'문제를 맞혔어요'+(QS.ok===3?'. 참 잘했어요!':'')+'</div>';return}
 var it=QS.list[QS.i],opts=it.c.map(function(t,k){return {t:t,ok:k===0}}).sort(function(){return R()-.5});
 box.innerHTML='<div class="q"><small>과학 문제 '+(QS.i+1)+' / 3</small></div>';box.firstChild.appendChild(document.createTextNode(it.q));
 var done=false;
 opts.forEach(function(o){var b=document.createElement('button');b.textContent=o.t;b.onclick=function(){if(done)return;done=true;
   if(o.ok){b.className='ok';QS.ok++;sfx.merge(6)}else{b.className='no';sfx.bad();[].forEach.call(box.querySelectorAll('button'),function(x){if(x.textContent===it.c[0])x.className='ok'})}
   var ex=document.createElement('div');ex.className='ex';ex.textContent=(o.ok?'정답! ':'아쉬워요. ')+it.e;box.appendChild(ex);
   var n=document.createElement('button');n.className='nx2';n.textContent=QS.i<2?'다음 문제':'결과 보기';n.onclick=function(){QS.i++;quizShow()};box.appendChild(n);n.scrollIntoView({block:'nearest'})};
  box.appendChild(b)});
}

var keys={l:false,r:false},down=false;
function aimAt(e){if(G&&!G.over)G.aim=(e.clientX-BX)/SC}
cv.addEventListener('pointerdown',function(e){down=true;aimAt(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',function(e){if(down||e.pointerType==='mouse')aimAt(e)});
cv.addEventListener('pointerup',function(e){if(!down)return;down=false;aimAt(e);drop()});
cv.addEventListener('pointercancel',function(){down=false});
addEventListener('keydown',function(e){var k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=true;if(k==='ArrowRight'||k==='d'||k==='D')keys.r=true;
 if(k===' '||k==='ArrowDown'){e.preventDefault();if(G&&!G.over)drop();else if(!e.repeat)start()}
 if(k==='Enter'&&(!G||G.over))start();if(k==='z'||k==='Z')hold();if(k==='x'||k==='X')probe()});
addEventListener('keyup',function(e){var k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=false;if(k==='ArrowRight'||k==='d'||k==='D')keys.r=false});
