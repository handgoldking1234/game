<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05060c;color:#f1f5f9;font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
body.pre #hudWrap{display:none}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:800;color:#e0f2fe;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;transition:box-shadow .3s}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:8px;align-items:center;background:rgba(10,12,24,.78);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:6px 14px;font-weight:800;font-size:15px;white-space:nowrap}
#hud .clk{font-size:20px;font-variant-numeric:tabular-nums;color:#fde68a}
#hud .ch{font-size:12px;color:#c4b5fd}
#pw{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:6;background:rgba(10,12,24,.78);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 10px;width:190px;font-size:12px;font-weight:800}
#pw .row{display:flex;justify-content:space-between;align-items:center;margin:2px 0}
.gb{height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin:2px 0 5px}.gb b{display:block;height:100%;transition:width .3s}
#tasks{position:fixed;left:max(10px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 54px);z-index:6;background:rgba(10,12,24,.78);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 12px;font-size:13px;max-width:300px;line-height:1.5}
#tasks h4{font-size:13px;color:#fde68a;margin-bottom:2px}
#tasks li{list-style:none}#tasks li.ok{color:#86efac;text-decoration:line-through;opacity:.75}
#tasks.min ul{display:none}
#gauges{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));z-index:6;background:rgba(10,12,24,.78);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 12px;width:210px;font-size:12px;font-weight:800}
#gauges .g{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:6px;margin:2px 0}
#gauges .g.low span{color:#fca5a5;animation:blink .6s infinite}
@keyframes blink{50%{opacity:.35}}
#hearts{font-size:16px;margin-bottom:3px}
#carry{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;background:rgba(10,12,24,.82);border:2px solid #fbbf24;border-radius:12px;padding:6px 14px;font-weight:800;font-size:14px;display:none}
#prompt{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 48px);transform:translateX(-50%);z-index:6;background:rgba(10,12,24,.82);border-radius:10px;padding:6px 14px;font-weight:800;font-size:15px;white-space:nowrap}
#prompt:empty{display:none}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.8);z-index:5;pointer-events:none}
#toast{position:fixed;right:max(10px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 150px);z-index:7;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;max-width:min(380px,70vw)}
.toast{background:rgba(15,23,42,.92);border-left:5px solid #60a5fa;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;animation:tin .3s}
.toast.good{border-color:#22c55e}.toast.bad{border-color:#ef4444}.toast.warn{border-color:#f59e0b}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
#banner{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:7;text-align:center;font-size:34px;font-weight:900;text-shadow:0 3px 8px #000;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#banner small{display:block;font-size:15px;font-weight:700;margin-top:4px;color:#e2e8f0}
#shout{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:8;font-size:64px;font-weight:900;color:#ef4444;text-shadow:0 0 18px rgba(239,68,68,.8),0 4px 0 #450a0a;pointer-events:none;opacity:0;white-space:nowrap;letter-spacing:-2px}
#shout.on{opacity:1;animation:shk .08s infinite}
@keyframes shk{0%{transform:translate(-50%,-50%) rotate(-2deg)}50%{transform:translate(-49%,-51%) rotate(2deg)}100%{transform:translate(-51%,-49%) rotate(-1deg)}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9;transition:opacity .35s}
#hideV{position:fixed;inset:0;z-index:4;pointer-events:none;display:none;background:repeating-linear-gradient(0deg,rgba(20,12,4,.95) 0 26px,rgba(0,0,0,.35) 26px 34px)}
#bedV{position:fixed;inset:0;z-index:4;pointer-events:none;display:none;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(30,58,138,.75) 75%,rgba(30,58,138,.95))}
#chatLog{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 160px);z-index:6;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000;display:flex;flex-direction:column;gap:3px}
#chatBar{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:12;background:rgba(15,23,42,.95);border-radius:14px;padding:10px;width:min(560px,94vw)}
#chatBar .qk{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}.qb{background:#1e293b;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:700}
#chatF{display:flex;gap:6px}#chatIn{flex:1;font:inherit;background:#0b1020;border:1px solid #334155;border-radius:9px;padding:8px;color:#fff}#chatF button{background:#3b82f6;border-radius:9px;padding:0 14px;font-weight:800}
#touch{position:fixed;inset:0;z-index:5;pointer-events:none}
#look{position:absolute;right:0;top:0;width:60%;height:100%;pointer-events:auto}
.joy{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);pointer-events:auto}
.joy i{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.35)}
.tb{position:absolute;pointer-events:auto;width:62px;height:62px;border-radius:50%;background:rgba(15,23,42,.6);border:2px solid rgba(255,255,255,.3);font-weight:900;font-size:14px;line-height:1.1}
#tE{right:max(18px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 90px);width:78px;height:78px;background:rgba(250,204,21,.35);font-size:18px}
#tU{right:calc(max(18px,env(safe-area-inset-right)) + 92px);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 70px)}
#tR{right:calc(max(18px,env(safe-area-inset-right)) + 6px);bottom:max(14px,env(safe-area-inset-bottom));width:70px;height:62px}
#tF{right:calc(max(18px,env(safe-area-inset-right)) + 100px);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 145px);width:50px;height:50px}
#tC{right:calc(max(18px,env(safe-area-inset-right)) + 96px);bottom:max(14px,env(safe-area-inset-bottom));width:50px;height:50px}
#tR.on{background:rgba(34,197,94,.45)}
#tJ{right:calc(max(18px,env(safe-area-inset-right)) + 176px);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 30px);background:rgba(56,189,248,.35)}
#tasks{cursor:pointer}#tasks.min h4:after{content:' ▾'}
body.touch #gauges{top:calc(max(10px,env(safe-area-inset-top)) + 54px);left:max(10px,env(safe-area-inset-left));bottom:auto;width:150px;padding:5px 8px;font-size:10.5px}
body.touch #gauges .g{grid-template-columns:58px 1fr;margin:0}body.touch #gauges .gb{margin:2px 0}body.touch #hearts{font-size:12px;margin:0}
body.touch #pw{width:150px;padding:6px 8px;font-size:10.5px}body.touch #pw .gb{margin:1px 0 3px}
body.touch #tasks{top:calc(max(10px,env(safe-area-inset-top)) + 196px);max-width:210px;font-size:11px;padding:5px 9px}
body.touch #toast{top:auto;bottom:10px;right:50%;transform:translateX(50%);align-items:center}
body.touch #prompt{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 40px);font-size:13px}
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(3,4,10,.62)}
#ov[hidden]{display:none}
.card{background:#fff;color:#0f172a;border-radius:20px;padding:18px 20px;width:min(640px,100%);max-height:100%;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5}
.card h1{font-size:30px;letter-spacing:-1px}.card h2{font-size:21px}.card h3{font-size:17px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{width:36px;height:36px;border-radius:10px;background:#f1f5f9;font-size:18px;flex:none}
.btn{background:#facc15;color:#1c1917;border-radius:12px;padding:11px 16px;font-weight:900;font-size:15px;box-shadow:0 3px 0 #a16207}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a16207}.btn[disabled]{opacity:.45}
.btn.alt{background:#eef2f7;color:#0f172a;box-shadow:0 3px 0 #cbd5e1}.btn.blue{background:#3b82f6;color:#fff;box-shadow:0 3px 0 #1d4ed8}.btn.green{background:#22c55e;color:#fff;box-shadow:0 3px 0 #15803d}.btn.red{background:#ef4444;color:#fff;box-shadow:0 3px 0 #b91c1c}.btn.purple{background:#8b5cf6;color:#fff;box-shadow:0 3px 0 #6d28d9}
.btn.sm{padding:7px 11px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{font-size:12.5px;color:#64748b}
.note{background:#f1f5f9;border-radius:12px;padding:10px 12px;font-size:14px}
.inp{font:inherit;border:2px solid #cbd5e1;border-radius:10px;padding:9px 12px;width:100%}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.seg button{border:2px solid #e2e8f0;border-radius:12px;padding:8px;text-align:center;background:#fff}
.seg button[aria-pressed=true]{border-color:#facc15;background:#fef9c3}
.seg small{display:block;font-size:11.5px;color:#64748b;line-height:1.35;margin-top:2px}
.qa{display:grid;gap:6px}.qa button{text-align:left;border:2px solid #e2e8f0;border-radius:10px;padding:9px 12px;background:#fff;font-weight:700}
.qa button.ok{border-color:#22c55e;background:#dcfce7}.qa button.no{border-color:#ef4444;background:#fee2e2}
.qq{font-size:18px;font-weight:900}
.g{color:#15803d}.r{color:#dc2626}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td{border-bottom:1px solid #e2e8f0;padding:6px 4px}.tbl td:last-child{text-align:right;font-weight:800}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pal button{border:2px solid #e2e8f0;border-radius:12px;padding:10px 6px;background:#fff;font-size:30px;line-height:1.1}
.pal button small{display:block;font-size:12px;font-weight:800;color:#334155;margin-top:4px}
.pal button.pick{border-color:#22c55e;background:#dcfce7}
.book td,.book th{padding:6px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13.5px;vertical-align:top}.book tr.hit{background:#f5f3ff}
.ent{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;background:#1e1b4b;color:#ede9fe;border-radius:14px;padding:12px}
.ent .pic{font-size:62px;text-align:center}
.news{background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px;font-size:14px}.news b{color:#fde68a}
@media (max-width:640px){#shout{font-size:40px}#banner{font-size:24px}#pw{width:150px}.card h1{font-size:24px}}
</style>

<script>/* ===== 민왕게임월드 온라인 연결 도우미 v2 =====
   PeerJS(WebRTC)로 먼저 연결하고, 안 되면(서버 장애·학교/통신사 방화벽) MQTT 중계 서버로 자동 전환해요.

(function(){
if(window.__MWG_NET)return;window.__MWG_NET=2;
var RealPeer=window.Peer;
var BROKERS=window.MWG_MQTT||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
var ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'},
 {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}];
var TOPIC='mwgame/v2/';
function rid(n){var s='',c='abcdefghijkmnpqrstuvwxyz23456789';for(var i=0;i<(n||10);i++)s+=c[Math.random()*c.length|0];return s}
function Em(){this._h={}}
Em.prototype.on=function(e,f){(this._h[e]=this._h[e]||[]).push(f);return this};
Em.prototype.off=function(e,f){var a=this._h[e];if(a){var i=a.indexOf(f);if(i>=0)a.splice(i,1)}return this};
Em.prototype.emit=function(e){var a=(this._h[e]||[]).slice(),args=[].slice.call(arguments,1);for(var i=0;i<a.length;i++){try{a[i].apply(this,args)}catch(err){console.error(err)}}};
function inherit(C){C.prototype=Object.create(Em.prototype);C.prototype.constructor=C}

/* ---------- 아주 작은 MQTT 3.1.1 (웹소켓) ---------- */
var te=new TextEncoder(),td=new TextDecoder();
function str(s){var b=te.encode(s);var o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o}
function cat(arr){var n=0,i;for(i=0;i<arr.length;i++)n+=arr[i].length;var o=new Uint8Array(n),p=0;for(i=0;i<arr.length;i++){o.set(arr[i],p);p+=arr[i].length}return o}
function pkt(h,body){var len=body.length,lb=[];do{var d=len%128;len=Math.floor(len/128);if(len>0)d|=128;lb.push(d)}while(len>0);return cat([new Uint8Array([h].concat(lb)),body])}
function Mqtt(clientId){Em.call(this);this.cid=clientId;this.bi=0;this.ok=false;this.subs=[];this.buf=new Uint8Array(0);this.pid=1;this.dead=false;this._go()}
inherit(Mqtt);
Mqtt.prototype._go=function(){var self=this;if(this.dead)return;if(this.bi>=BROKERS.length){this.emit('fail');return}
  var url=BROKERS[this.bi],ws,done=false;try{ws=new WebSocket(url,'mqtt')}catch(e){this.bi++;return this._go()}
  ws.binaryType='arraybuffer';this.ws=ws;
  var to=setTimeout(function(){if(!done){done=true;try{ws.close()}catch(e){}self.bi++;self._go()}},6000);
  ws.onopen=function(){var body=cat([str('MQTT'),new Uint8Array([4,2,0,40]),str(self.cid)]);ws.send(pkt(0x10,body))};
  ws.onmessage=function(ev){self._rx(new Uint8Array(ev.data),function(){if(!done){done=true;clearTimeout(to)}})};
  ws.onerror=function(){};
  ws.onclose=function(){clearTimeout(to);var was=self.ok;self.ok=false;clearInterval(self.pt);if(self.dead)return;if(!done){done=true;self.bi++;self._go();return}
    if(was){self.emit('down');setTimeout(function(){if(!self.dead){self.bi=0;self._go()}},1500)}}};
Mqtt.prototype._rx=function(chunk,onConn){var b=cat([this.buf,chunk]);var p=0;
  while(p<b.length){var h=b[p],mul=1,len=0,q=p+1,d;do{if(q>=b.length){this.buf=b.slice(p);return}d=b[q++];len+=(d&127)*mul;mul*=128}while(d&128);
    if(q+len>b.length){this.buf=b.slice(p);return}var body=b.subarray(q,q+len);p=q+len;var t=h>>4;
    if(t===2){if(body[1]===0){onConn();var first=!this.everOk;this.ok=true;this.everOk=true;var self=this;this.pt=setInterval(function(){try{self.ws.send(new Uint8Array([0xC0,0]))}catch(e){}},20000);for(var i=0;i<this.subs.length;i++)this._sub(this.subs[i]);this.emit(first?'ready':'up')}else{try{this.ws.close()}catch(e){}}}
    else if(t===3){var tl=(body[0]<<8)|body[1];var topic=td.decode(body.subarray(2,2+tl));var off=2+tl+((h>>1)&3?2:0);this.emit('msg',topic,td.decode(body.subarray(off)))}}
  this.buf=new Uint8Array(0)};
Mqtt.prototype._sub=function(t){var id=this.pid++&65535||1;this.ws.send(pkt(0x82,cat([new Uint8Array([id>>8,id&255]),str(t),new Uint8Array([0])])))};
Mqtt.prototype.sub=function(t){this.subs.push(t);if(this.ok)this._sub(t)};
Mqtt.prototype.pub=function(t,s){if(!this.ok)return false;try{this.ws.send(pkt(0x30,cat([str(t),te.encode(s)])));return true}catch(e){return false}};
Mqtt.prototype.close=function(){this.dead=true;clearInterval(this.pt);try{this.ws.send(new Uint8Array([0xE0,0]));this.ws.close()}catch(e){}};

/* ---------- 연결 하나 (PeerJS 또는 MQTT를 감싸요) ---------- */
function Conn(peer,remote){Em.call(this);this.peer=remote;this.open=false;this.reliable=true;this._p=peer;this._k=null;this._rc=null;this.closed=false;this.via=''}
inherit(Conn);
Conn.prototype.send=function(d){if(!this.open||this.closed)return;if(this._rc){try{this._rc.send(d)}catch(e){}}else if(this._k){this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'d',c:this._k,f:this._p.id,d:d}));this._tx=Date.now()}};
Conn.prototype.close=function(){if(this.closed)return;this.closed=true;var was=this.open;this.open=false;if(this._rc){try{this._rc.close()}catch(e){}}if(this._k){this._p._mq&&this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'fin',c:this._k,f:this._p.id}));delete this._p._mc[this._k]}clearInterval(this._ka);if(was)this.emit('close')};
Conn.prototype._useReal=function(rc){var self=this;this._rc=rc;this.via='webrtc';
  rc.on('data',function(d){self.emit('data',d)});rc.on('close',function(){if(!self.closed){self.closed=true;self.open=false;self.emit('close')}});rc.on('error',function(e){self.emit('error',e)})};
Conn.prototype._setOpen=function(){var self=this;if(this.open||this.closed)return;this.open=true;setTimeout(function(){self.emit('open')},0)};
Conn.prototype._useMq=function(k){var self=this;this._k=k;this.via='relay';this._rx=Date.now();this._p._mc[k]=this;
  this._ka=setInterval(function(){if(!self.open)return;if(Date.now()-(self._tx||0)>3000)self._p._mq.pub(TOPIC+self.peer,JSON.stringify({t:'png',c:k,f:self._p.id}));if(Date.now()-self._rx>16000){self.close()}},2000)};

/* ---------- Peer 대신 쓰는 SmartPeer ---------- */
function SmartPeer(id,opts){if(!(this instanceof SmartPeer))return new SmartPeer(id,opts);Em.call(this);var self=this;
  if(id&&typeof id==='object'){opts=id;id=undefined}
  this.id=id||('g'+rid(11));this.isHost=!!id;this.opts=opts||{};this.destroyed=false;this.open=false;this._mc={};this._openSent=false;this._rpOpen=false;this._mqReady=false;
  // 1) PeerJS
  if(RealPeer){try{var o={};for(var k in this.opts)o[k]=this.opts[k];o.config=o.config||{iceServers:ICE};
    this._rp=new RealPeer(this.id,o);
    this._rp.on('open',function(){self._rpOpen=true;self._open()});
    this._rp.on('connection',function(rc){var c=new Conn(self,rc.peer);rc.on('open',function(){if(c.closed)return;c._useReal(rc);c._setOpen();self.emit('connection',c)})});
    this._rp.on('error',function(e){var t=e&&e.type;if(t==='unavailable-id'){self.emit('error',e);return}if(t==='peer-unavailable'){var m=/peer\s+(\S+)/i.exec(e.message||'');self.emit('_pu',m?m[1]:'');return}self._rpBad=true;if(!self._rpOpen)self._maybeOpen()});
    this._rp.on('disconnected',function(){if(!self.destroyed){try{self._rp.reconnect()}catch(e){}}});
  }catch(e){this._rp=null;this._rpBad=true}}else this._rpBad=true;
  // 2) MQTT 중계 (항상 함께 켜 둬요)
  this._mq=new Mqtt('mw'+rid(12));
  this._mq.on('ready',function(){self._mqReady=true;self._maybeOpen()});
  this._mq.on('fail',function(){self._mqBad=true;if(!self._openSent&&(self._rpBad||!RealPeer))self.emit('error',{type:'network',message:'연결 서버에 닿지 못했어요'})});
  this._mq.on('msg',function(t,s){self._onMsg(s)});
  this._mq.sub(TOPIC+this.id);
  setTimeout(function(){self._waited=true;self._maybeOpen()},3500)}
inherit(SmartPeer);
SmartPeer.prototype._maybeOpen=function(){if(this._openSent||this.destroyed)return;if(this._rpOpen)return this._open();if(this._mqReady&&(this._waited||this._rpBad))this._open()};
SmartPeer.prototype._open=function(){if(this._openSent||this.destroyed)return;this._openSent=true;this.open=true;var self=this;setTimeout(function(){self.emit('open',self.id)},0)};
SmartPeer.prototype._onMsg=function(s){var m;try{m=JSON.parse(s)}catch(e){return}if(!m||!m.c)return;var c=this._mc[m.c];
  if(m.t==='syn'){if(!this.isHost&&!this._acceptAll)return;if(!c){c=new Conn(this,String(m.f));c._useMq(m.c);c._setOpen();this.emit('connection',c)}c._rx=Date.now();this._mq.pub(TOPIC+m.f,JSON.stringify({t:'ack',c:m.c,f:this.id}));return}
  if(!c)return;c._rx=Date.now();
  if(m.t==='ack'){if(c._wait){c._wait=false;clearInterval(c._synT);c._setOpen()}}
  else if(m.t==='d'){if(c.open)c.emit('data',m.d)}
  else if(m.t==='fin'){if(!c.closed){c.closed=true;var was=c.open;c.open=false;clearInterval(c._ka);delete this._mc[m.c];if(was)c.emit('close')}}};
SmartPeer.prototype.connect=function(remote,opts){var self=this,c=new Conn(this,remote);var fellBack=false;
  function relay(){if(fellBack||c.closed||c.open)return;fellBack=true;
    var go=function(){var k=rid(12);c._useMq(k);c._wait=true;var n=0;var syn=function(){if(!c._wait||c.closed){clearInterval(c._synT);return}if(++n>8){clearInterval(c._synT);c._wait=false;c.closed=true;self.emit('error',{type:'peer-unavailable',message:'Could not connect to peer '+remote});c.emit('error',{type:'peer-unavailable'});return}self._mq.pub(TOPIC+remote,JSON.stringify({t:'syn',c:k,f:self.id}))};syn();c._synT=setInterval(syn,1300)};
    if(self._mqReady)go();else{var w=setInterval(function(){if(self._mqReady){clearInterval(w);go()}else if(self._mqBad){clearInterval(w);self.emit('error',{type:'network'})}},300)}}
  if(this._rp&&this._rpOpen&&!this._rpBad){try{var rc=this._rp.connect(remote,opts||{reliable:true});
      rc.on('open',function(){if(c.open||c.closed){try{rc.close()}catch(e){}return}if(fellBack){if(c._wait){c._wait=false;clearInterval(c._synT);if(c._k)delete self._mc[c._k];clearInterval(c._ka);c._k=null}else{try{rc.close()}catch(e){}return}}c._useReal(rc);c._setOpen()});
      var pu=function(who){if(!who||who===remote)relay()};this.on('_pu',pu);
      setTimeout(relay,7000)}catch(e){relay()}}
  else relay();
  return c};
SmartPeer.prototype.destroy=function(){if(this.destroyed)return;this.destroyed=true;for(var k in this._mc){try{this._mc[k].close()}catch(e){}}if(this._rp){try{this._rp.destroy()}catch(e){}}if(this._mq)this._mq.close();this.emit('close')};
SmartPeer.prototype.disconnect=function(){this.destroy()};
SmartPeer.prototype.reconnect=function(){};
window.Peer=SmartPeer;window.MWG_RealPeer=RealPeer;
})();
