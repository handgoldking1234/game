Mqtt.prototype.close=function(){this.dead=true;clearInterval(this.pt);try{this.ws.send(new Uint8Array([0xE0,0]));this.ws.close()}catch(e){}};

/* ---------- 연결 하나 (PeerJS 또는 MQTT를 감싸요) ---------- */
function Conn(peer,remote){Em.call(this);this.peer=remote;this.open=false;this.reliable=true;this._p=peer;this._k=null;this._rc=null;this.closed=false;this.via=''}
inherit(Conn);
Conn.prototype.send=function(d){if(!this.open||this.closed)return;if(this._rc){try{this._rc.send(d)}catch(e){}}else if(this._k){this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'d',c:this._k,f:this._p.id,d:d}));this._tx=Date.now()}};
Conn.prototype.close=function(){if(this.closed)return;this.closed=true;var was=this.open;this.open=false;if(this._rc){try{this._rc.close()}catch(e){}}if(this._k){this._p._mq&&this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'fin',c:this._k,f:this._p.id}));delete this._p._mc[this._k]}clearInterval(this._ka);if(was)this.emit('close')};
Conn.prototype._useReal=function(rc){var self=this;this._rc=rc;this.via='webrtc';
  rc.on('data',function(d){self.emit('data',d)});rc.on('close',function(){if(!self.closed){self.closed=true;self.open=false;self.emit('close')}});rc.on('error',function(e){self.emit('error',e)})};
Conn.prototype._setOpen=function(){var self=this;if(this.open||this.closed)return;this.open=true;setTimeout(function(){self.emit('open')},0)};
Conn.prototype._useMq=function(k){var self=this;this._k=k;this.via='relay';this._rx=Date.now();this._p._mc[k]=this;
  this._ka=setInterval(function(){if(!self.open)return;if(Date.now()-(self._tx||0)>3000)self._p._mq.pub(TOPIC+self.peer,JSON.stringify({t:'png',c:k,f:self._p.id}));if(Date.now()-self._rx>16000){self.close()}},2000)};

/* ---------- Peer 대신 쓰는 SmartPeer ---------- */
function SmartPeer(id,opts){if(!(this instanceof SmartPeer))return new SmartPeer(id,opts);Em.call(this);var self=this;
  if(id&&typeof id==='object'){opts=id;id=undefined}
  this.id=id||('g'+rid(11));this.isHost=!!id;this.opts=opts||{};this.destroyed=false;this.open=false;this._mc={};this._openSent=false;this._rpOpen=false;this._mqReady=false;
  // 1) PeerJS
  if(RealPeer){try{var o={};for(var k in this.opts)o[k]=this.opts[k];o.config=o.config||{iceServers:ICE};
    this._rp=new RealPeer(this.id,o);
    this._rp.on('open',function(){self._rpOpen=true;self._open()});
    this._rp.on('connection',function(rc){var c=new Conn(self,rc.peer);rc.on('open',function(){if(c.closed)return;c._useReal(rc);c._setOpen();self.emit('connection',c)})});
    this._rp.on('error',function(e){var t=e&&e.type;if(t==='unavailable-id'){self.emit('error',e);return}if(t==='peer-unavailable'){var m=/peer\s+(\S+)/i.exec(e.message||'');self.emit('_pu',m?m[1]:'');return}self._rpBad=true;if(!self._rpOpen)self._maybeOpen()});
    this._rp.on('disconnected',function(){if(!self.destroyed){try{self._rp.reconnect()}catch(e){}}});
  }catch(e){this._rp=null;this._rpBad=true}}else this._rpBad=true;
  // 2) MQTT 중계 (항상 함께 켜 둬요)
  this._mq=new Mqtt('mw'+rid(12));
  this._mq.on('ready',function(){self._mqReady=true;self._maybeOpen()});
  this._mq.on('fail',function(){self._mqBad=true;if(!self._openSent&&(self._rpBad||!RealPeer))self.emit('error',{type:'network',message:'연결 서버에 닿지 못했어요'})});
  this._mq.on('msg',function(t,s){self._onMsg(s)});
  this._mq.sub(TOPIC+this.id);
  setTimeout(function(){self._waited=true;self._maybeOpen()},3500)}
inherit(SmartPeer);
SmartPeer.prototype._maybeOpen=function(){if(this._openSent||this.destroyed)return;if(this._rpOpen)return this._open();if(this._mqReady&&(this._waited||this._rpBad))this._open()};
SmartPeer.prototype._open=function(){if(this._openSent||this.destroyed)return;this._openSent=true;this.open=true;var self=this;setTimeout(function(){self.emit('open',self.id)},0)};
SmartPeer.prototype._onMsg=function(s){var m;try{m=JSON.parse(s)}catch(e){return}if(!m||!m.c)return;var c=this._mc[m.c];
  if(m.t==='syn'){if(!this.isHost&&!this._acceptAll)return;if(!c){c=new Conn(this,String(m.f));c._useMq(m.c);c._setOpen();this.emit('connection',c)}c._rx=Date.now();this._mq.pub(TOPIC+m.f,JSON.stringify({t:'ack',c:m.c,f:this.id}));return}
  if(!c)return;c._rx=Date.now();
  if(m.t==='ack'){if(c._wait){c._wait=false;clearInterval(c._synT);c._setOpen()}}
  else if(m.t==='d'){if(c.open)c.emit('data',m.d)}
  else if(m.t==='fin'){if(!c.closed){c.closed=true;var was=c.open;c.open=false;clearInterval(c._ka);delete this._mc[m.c];if(was)c.emit('close')}}};
SmartPeer.prototype.connect=function(remote,opts){var self=this,c=new Conn(this,remote);var fellBack=false;
  function relay(){if(fellBack||c.closed||c.open)return;fellBack=true;
    var go=function(){var k=rid(12);c._useMq(k);c._wait=true;var n=0;var syn=function(){if(!c._wait||c.closed){clearInterval(c._synT);return}if(++n>8){clearInterval(c._synT);c._wait=false;c.closed=true;self.emit('error',{type:'peer-unavailable',message:'Could not connect to peer '+remote});c.emit('error',{type:'peer-unavailable'});return}self._mq.pub(TOPIC+remote,JSON.stringify({t:'syn',c:k,f:self.id}))};syn();c._synT=setInterval(syn,1300)};
    if(self._mqReady)go();else{var w=setInterval(function(){if(self._mqReady){clearInterval(w);go()}else if(self._mqBad){clearInterval(w);self.emit('error',{type:'network'})}},300)}}
  if(this._rp&&this._rpOpen&&!this._rpBad){try{var rc=this._rp.connect(remote,opts||{reliable:true});
      rc.on('open',function(){if(c.open||c.closed){try{rc.close()}catch(e){}return}if(fellBack){if(c._wait){c._wait=false;clearInterval(c._synT);if(c._k)delete self._mc[c._k];clearInterval(c._ka);c._k=null}else{try{rc.close()}catch(e){}return}}c._useReal(rc);c._setOpen()});
      var pu=function(who){if(!who||who===remote)relay()};this.on('_pu',pu);
      setTimeout(relay,7000)}catch(e){relay()}}
  else relay();
  return c};
SmartPeer.prototype.destroy=function(){if(this.destroyed)return;this.destroyed=true;for(var k in this._mc){try{this._mc[k].close()}catch(e){}}if(this._rp){try{this._rp.destroy()}catch(e){}}if(this._mq)this._mq.close();this.emit('close')};
SmartPeer.prototype.disconnect=function(){this.destroy()};
SmartPeer.prototype.reconnect=function(){};
window.Peer=SmartPeer;window.MWG_RealPeer=RealPeer;
})();

function dadStep(dt){const d=S.dad;d.stT-=dt;
  if(d.st==='slip'||d.st==='cured'||d.st==='stare'){if(d.stT<=0){if(d.st==='cured')return;d.st='walk';d.purpose='home';routeTo(d,S.ch===1&&S.phase==='prologue'?SPOT.sofa:SPOT.sofa)}return}

  for(const b of S.bananas)if(b.st==='trap'&&b.f===d.f&&Math.hypot(b.x-d.x,b.z-d.z)<.7&&d.st!=='sit'&&d.st!=='sleep'&&d.st!=='tv'){S.bananas.splice(S.bananas.indexOf(b),1);d.st='slip';d.stT=4.5;d.path=[];S.stats.slip++;evAll({k:'slip'});return}
  if(d.st==='sit'||d.st==='tv'){d.yaw=d.st==='tv'?-Math.PI/2:0;if(d.st==='tv'){d.x=SPOT.sofa.x+1.1;d.z=SPOT.sofa.z}if(S.anger>=100&&S.phase==='prologue'){const w=wastedRooms()[0];if(w){d.st='walk';d.purpose='waste';d.wroom=w.id;routeTo(d,{f:w.f,x:w.sw[0],z:w.sw[1]-(w.sw[1]>0?.8:-.8)});evAll({k:'shout',m:'에너지 낭비 금지!!'})}}return}
  if(d.st==='sleep'){d.x=SPOT.sofa.x+.4;d.z=SPOT.sofa.z;d.f=0;d.wakeT-=dt*(1+S.anger/120);if(d.wakeT<=0)wake();return}

  if(rule()&&d.st!=='chase'){for(const id in S.pl){const p=S.pl[id];if(canSee(d,p)){d.st='chase';d.tgt=id;d.lostT=0;evAll({k:'chase',pid:id,n:p.n});break}}}
  if(d.st==='chase'){const p=S.pl[d.tgt];if(!p||safeOf(p)){d.st='walk';d.purpose='home';routeTo(d,SPOT.sofa);evAll({k:'lost'});return}
    const vis=canSee(d,p);if(vis){d.lostT=0;d.last={f:p.f,x:p.x,z:p.z};const dx=p.x-d.x,dz=p.z-d.z,L=Math.hypot(dx,dz);const st=dadSpeed()*dt;if(L>.01){const o={x:d.x+dx/L*Math.min(st,L),z:d.z+dz/L*Math.min(st,L)};collide(o,d.f,.35);d.x=o.x;d.z=o.z;d.yaw=Math.atan2(-dx,-dz)}d.path=[];if(L<.95){caught(d.tgt);return}}

  else{d.purpose='check';routeTo(d,S.ch===1?{f:1,x:-6,z:-3}:{f:-1,x:0,z:2.5});evAll({k:'dadWake',why:'check'})}}

  if(d.purpose==='check'){evAll({k:'shout',m:S.ch===1?'빨리 자!!!':'누가… 내 지하실에 있니…'});for(const id in S.pl){const p=S.pl[id];if(!p.out&&p.f===d.f&&!safeOf(p)&&Math.hypot(p.x-d.x,p.z-d.z)<13&&clearLine(d.f,d.x,d.z,p.x,p.z)){d.st='chase';d.tgt=id;d.lostT=0;evAll({k:'chase',pid:id,n:p.n});return}}d.st='stare';d.stT=3;evAll({k:'calm',ch:S.ch});return}

function hostStep(dt){if(!S||S.phase==='end'||S.phase==='over')return;
  const alive=alivePl();const allBed=S.ch===1&&alive.length&&alive.every(([,p])=>p.bed>=0);

  if(S.ch===1&&S.phase==='prologue'){S.clock+=dt*.67;if(allBed){taskDone('sleep');S.clock=60}if(S.clock>=60){S.clock=60;S.phase='night';const d=S.dad;d.st='walk';d.purpose='home';d.path=[];routeTo(d,SPOT.sofa);S.tv=0;evAll({k:'night'});d.wakeTnext=1;
      if(!alive.every(([,p])=>p.bed>=0)){setTimeout(()=>{if(S&&S.phase==='night'&&S.dad.st!=='chase'){S.dad.st='walk';S.dad.purpose='check';routeTo(S.dad,{f:1,x:-6,z:-3});evAll({k:'dadWake',why:'ten'})}},1500)}}}

  const P=S.power;let load=2;for(const r of LIT_ROOMS)if(S.lights[r.id])load+=2.5;if(S.tv)load+=3;if(S.heater)load+=6;P.load=load;
  if(!P.out){P.fuel-=load*.026*dt;if(P.fuel<=0){P.fuel=0;P.out=1;S.tv=0;evAll({k:'power',on:0})}}

  dadStep(dt)}

let AC=null,master=null;

function tone(type,f1,f2,d,v,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}

  case'good':tone('triangle',660,990,.15,.14);tone('triangle',990,1320,.18,.11,.12);break;case'bad':tone('sawtooth',300,120,.4,.12);break;
  case'click':tone('square',900,900,.04,.05);break;case'step':noise(.08,.12,400);break;case'stairs':for(let i=0;i<4;i++)noise(.07,.12,350,i*.18);break;
  case'shout':tone('sawtooth',160,90,.6,.18);noise(.5,.12,800);break;case'caught':tone('sawtooth',90,40,1,.22);noise(.9,.25,600);break;case'caughtAll':break;
  case'power':tone('sawtooth',400,60,.8,.12);break;case'on':tone('triangle',200,600,.4,.1);break;case'pick':tone('triangle',520,780,.08,.08);break;
  case'drink':noise(.3,.06,700);tone('sine',400,500,.2,.05);break;case'blub':tone('sine',200,500,.25,.1);tone('sine',300,700,.2,.08,.15);break;
  case'heart':tone('sine',70,50,.12,.25);tone('sine',70,50,.12,.2,.18);break;case'slip':tone('triangle',800,200,.5,.12);noise(.3,.2,500,.4);break;
  case'weird':tone('sawtooth',500,90,.7,.07);tone('triangle',700,1300,.5,.05,.3);break;case'glass':noise(.4,.2,5000);tone('triangle',1500,2500,.3,.06);break}}

  const pc=new Peer(asHost?hid:undefined,Object.assign({debug:0},window.ERV_PEERCFG||{}));NET.pc=pc;let done=false;
  const fail=m=>{try{pc.destroy()}catch(e){}toast(m,'bad');ov.querySelectorAll('.btn').forEach(b=>b.disabled=false)};
  const to=setTimeout(()=>{if(!done)fail(asHost?'방을 만들지 못했어요. 잠시 뒤 다시 해 주세요.':'방을 찾지 못했어요. 번호를 확인해 주세요.')},20000);
  pc.on('error',e=>{if(!done){clearTimeout(to);fail(e.type==='unavailable-id'?'그 방 번호는 이미 쓰고 있어요':e.type==='peer-unavailable'?'그 번호의 방이 없어요':'연결에 실패했어요 ('+(e.type||'오류')+')')}});
  pc.on('open',()=>{if(asHost){done=true;clearTimeout(to);Object.assign(NET,{on:true,host:true,code});roomCard();toast(`방을 열었어요! 방 번호 ${code}`,'good');return}
    const hc=pc.connect(hid,{reliable:true});NET.hc=hc;hc.on('open',()=>{done=true;clearTimeout(to);Object.assign(NET,{on:true,guest:true,code});hc.send({t:'hi',n:NET.nick});waitCard()});
    hc.on('data',d=>onNet(d,'host'));hc.on('close',()=>{if(NET.guest){banner('방이 닫혔어요','방장이 나갔어요');setTimeout(()=>location.reload(),3000)}})});
  pc.on('connection',c=>{if(!asHost){c.close();return}c.on('open',()=>NET.conns.set(c.peer,c));c.on('data',d=>onNet(d,c.peer));c.on('close',()=>{NET.conns.delete(c.peer);const p=NET.pl[c.peer];if(p)toast(`${p.n}님이 나갔어요`);delete NET.pl[c.peer];if(S)delete S.pl[c.peer];if(!GAME.on)roomCard()})})}
let LOB={ch:1,mode:'normal'};
function roomCard(){const pl=[{n:NET.nick},...Object.values(NET.pl)];
  openCard(`<div class="hd"><h2>👥 방 ${NET.code}</h2><span class="small">${pl.length}/4명</span></div><p class="small">친구에게 <b>방 번호 ${NET.code}</b>를 알려 주세요. 다 같이 한 집에서 아빠를 피해요!</p>
   <div class="note">${pl.map((p,i)=>`${i===0?'👑':'🙂'} <b>${esc(p.n)}</b>`).join('<br>')}</div>
   <div class="row"><button class="btn" id="rgo1" type="button">▶ 1장 시작</button><button class="btn purple" id="rgo2" type="button">▶ 2장 시작</button></div>`);
  $('rgo1').onclick=()=>{audio();beginHost(1,LOB.mode)};$('rgo2').onclick=()=>{audio();beginHost(2,LOB.mode)}}
function waitCard(){openCard(`<div class="hd"><h2>👥 방 ${NET.code}</h2></div><p>방장이 시작하면 바로 들어가요! 기다리는 동안 안내서를 읽어 보세요.</p><div class="row"><button class="btn alt" id="wg" type="button">📖 안내서</button></div>`);$('wg').onclick=()=>guideCard()}
function snap(){const pl={};for(const id in S.pl){const p=S.pl[id];pl[id]={n:p.n,f:p.f,x:r1(p.x),z:r1(p.z),yaw:Math.round(p.yaw*100)/100,bed:p.bed,hide:p.hide,hearts:p.hearts,out:p.out,carry:p.carry,col:p.col,fl:p.fl}}
  return{t:'s',s:{ch:S.ch,mode:S.mode,phase:S.phase,clock:S.clock,power:S.power,gas:S.gas,lights:S.lights,tv:S.tv,heater:S.heater,doorLock:S.doorLock,tasks:S.tasks,trash:S.trash.map(t=>({id:t.id,f:t.f,x:t.x,z:t.z,st:t.st})),ramen:S.ramen,
   dad:{f:S.dad.f,x:r1(S.dad.x),z:r1(S.dad.z),yaw:Math.round(S.dad.yaw*100)/100,st:S.dad.st},anger:S.anger,waste:S.waste,anoms:S.anoms,found:S.found,cauldron:S.cauldron,potion:S.potion,bananas:S.bananas,pl}}}
function onNet(d,from){if(!d||typeof d!=='object')return;
  if(NET.host&&from!=='host'){
    if(d.t==='hi'){if(Object.keys(NET.pl).length>=3){netTo(from,{t:'full'});return}NET.pl[from]={n:String(d.n||'친구').slice(0,10)};toast(`${NET.pl[from].n}님이 들어왔어요! 👋`,'good');netTo(from,{t:'you',id:from});
      if(S&&GAME.on){S.pl[from]=newPl(NET.pl[from].n,Object.keys(S.pl).length);netTo(from,{t:'init',id:from,ch:S.ch,mode:S.mode})}else roomCard();return}
    if(d.t==='in'){if(!S)return;const p=S.pl[from];if(!p)return;if(isFinite(d.x)&&isFinite(d.z)){p.x=clamp(+d.x,-12,12);p.z=clamp(+d.z,-9,9);p.yaw=+d.y||0;p.f=[0,1,-1].includes(d.f)?d.f:p.f;p.fl=!!d.fl}
      if(Array.isArray(d.a))for(const a of d.a){if(!(a.s>(p.lastS||0)))continue;p.lastS=a.s;doAct(from,a,p)}return}
    if(d.t==='chat'){const n=NET.pl[from]?NET.pl[from].n:'친구';chatAdd(n,cleanChat(d.m));netSend({t:'chat',n,m:cleanChat(d.m),from});return}
    return}
  switch(d.t){
    case'you':NET.myId=d.id;break;
    case'init':ROLE.r='guest';NET.myId=d.id;startPlay(d.ch,d.mode);break;
    case's':if(ROLE.r==='guest'){V=d.s;const me=V.pl[NET.myId];if(me){if(me.hearts!=null)ME.hearts=me.hearts;ME.out=me.out}}break;
    case'ev':onEv(d.e);break;
    case'chat':if(d.from!==NET.myId)chatAdd(d.n,d.m);break;
    case'full':toast('방이 꽉 찼어요 (최대 4명)','bad');break}}
let netT=0;
function netTick(dt){if(!NET.on)return;netT-=dt;if(netT>0)return;netT=.08;
  if(NET.guest){if(!GAME.on)return;const now=performance.now();ACTQ=ACTQ.filter(a=>!a.t0||now-a.t0<2500);ACTQ.forEach(a=>a.t0=a.t0||now);netSend({t:'in',f:ME.f,x:r1(ME.x),z:r1(ME.z),y:Math.round(ME.yaw*100)/100,fl:ME.fl?1:0,a:ACTQ.map(a=>{const o=Object.assign({},a);delete o.t0;return o})});return}
  if(NET.host&&S){netSend(snap());if(S.evq.length){const ev=S.evq.splice(0);for(const e of ev)netSend({t:'ev',e})}}}
const cleanChat=m=>String(m||'').replace(/[<>]/g,'').trim().slice(0,60);
function chatAdd(n,m){if(!m)return;const d=document.createElement('div');d.innerHTML=`<b>${esc(n)}</b> ${esc(m)}`;$('chatLog').appendChild(d);while($('chatLog').children.length>5)$('chatLog').firstChild.remove();setTimeout(()=>d.remove(),9000)}
function chatSend(m){m=cleanChat(m);if(!m)return;chatAdd(NET.nick||'나',m);if(NET.on){if(NET.host)netSend({t:'chat',n:NET.nick,m,from:'host'});else netSend({t:'chat',m})}}
function chatOpen(){if(!NET.on){toast('채팅은 친구와 함께 할 때 쓸 수 있어요');return}$('chatBar').hidden=false;if(document.pointerLockElement)document.exitPointerLock();for(const k in keys)keys[k]=false;$('chatIn').value='';$('chatIn').focus()}
function chatClose(){$('chatBar').hidden=true;$('chatIn').blur()}
$('chatF').addEventListener('submit',e=>{e.preventDefault();chatSend($('chatIn').value);chatClose()});$('chatIn').addEventListener('keydown',e=>{if(e.code==='Escape')chatClose()});
document.querySelectorAll('#chatBar .qb').forEach(b=>b.onclick=()=>{chatSend(b.textContent);chatClose()});

/* ============ 시작 ============ */
const GAME={on:false,pause:false,ended:0};
function nick(){const v=($('nick')&&$('nick').value||'').trim().slice(0,10);if(v){NET.nick=v;store.set('nick',v)}if(!NET.nick)NET.nick='아이'+(Math.random()*90+10|0)}
function newPl(n,i){return{n,f:0,x:-3+i*.8,z:-1,yaw:Math.PI,bed:-1,hide:null,hearts:3,out:0,carry:null,col:COLS[i%4],fl:false}}
function startPlay(ch,mode){GAME.on=true;GAME.ended=0;document.body.classList.remove('pre');closeCard();Object.assign(ME,{f:0,x:-3,z:-1,yaw:Math.PI,pitch:0,bed:-1,hide:null,fl:mode==='dark',stam:100,hun:ch===1?70:60,thi:ch===1?70:60,slp:100,tmp:100,hearts:3,out:0});
  if(ch===1&&ROLE.r!=='guest'){}EL.start(EL.pickGoals(SD_GOALS[ch],3));EL.hud({left:'max(10px,env(safe-area-inset-left))',top:touchUI?'calc(max(10px,env(safe-area-inset-top)) + 228px)':'auto',bottom:touchUI?'auto':'calc(max(10px,env(safe-area-inset-bottom)) + 178px)'});EL.showHud(false);
  entCard(ch);banner(ch===1?'🌙 오후 9시':'🌑 오후 9시 · 2장',ch===1?'10시 전에 집안일을 끝내요':'새벽 3시까지 아빠를 되돌려요')}
function beginHost(ch,mode){ROLE.r=NET.on?'host':'solo';newState(ch,mode);S.pl.me=newPl(NET.nick,0);let i=1;for(const id in NET.pl)S.pl[id]=newPl(NET.pl[id].n,i++);for(const k in TM){scene.remove(TM[k]);delete TM[k]}for(const k in BNM){scene.remove(BNM[k]);delete BNM[k]}startPlay(ch,mode);
  if(NET.on)for(const id in NET.pl)netTo(id,{t:'init',id,ch,mode})}
function lobby(){const cl=store.get('clear',{});
  openCard(`<div style="text-align:center;display:grid;gap:4px"><h1>👨 엄격한 에너지 아빠</h1><p>놀이공원에서 돌아온 밤, 아빠가 <b>이상하게 엄격</b>해졌어요. 에너지를 조금만 낭비해도 화를 내요! 집안일로 <b>에너지</b>를 배우고, 아빠를 피해 <b>아침까지 살아남아요</b>.</p><p class="small">초5 과학 「자원과 에너지」 · 1~4명 · 조금 무서워요 ${cl.c1?'· 🏅 1장 클리어':''}${cl.c2?' · 🏆 2장 클리어':''}</p></div>
   <label class="small">내 이름 <input class="inp" id="nick" maxlength="10" placeholder="예: 절약왕" value="${esc(NET.nick)}"></label>
   <div><div class="small" style="margin-bottom:4px">이야기 고르기</div><div class="seg" id="chS"><button type="button" data-c="1" aria-pressed="${LOB.ch===1}"><b>🌙 1장</b><small>에너지 아끼는 밤 — 집안일 + 아침 6시까지 살아남기</small></button><button type="button" data-c="2" aria-pressed="${LOB.ch===2}"><b>👁️ 2장</b><small>블랙아웃의 지하실 — 에너지 현상 찾아 물약 만들기</small></button></div></div>
   <div><div class="small" style="margin-bottom:4px">모드</div><div class="seg" id="mdS">${Object.entries(MODES).map(([k,m])=>`<button type="button" data-m="${k}" aria-pressed="${LOB.mode===k}"><b>${m.e} ${m.n}</b><small>${m.d}</small></button>`).join('')}</div></div>
   <div class="row"><button class="btn" id="solo" type="button">▶ 혼자 시작</button><button class="btn blue" id="host" type="button">👥 방 만들기</button></div>
   <div class="row"><input class="inp" id="code" inputmode="numeric" maxlength="4" placeholder="방 번호 4자리" style="width:150px"><button class="btn alt" id="join" type="button">🚪 방 들어가기</button></div>
   <div class="row"><button class="btn alt sm" id="gd" type="button">📖 안내서</button><button class="btn alt sm" id="hp" type="button">🎮 조작법</button><button class="btn alt sm" id="bk" type="button">📘 에너지 개념 도감</button></div>`,()=>{
   ov.querySelectorAll('#chS button').forEach(b=>b.onclick=()=>{LOB.ch=+b.dataset.c;ov.querySelectorAll('#chS button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
   ov.querySelectorAll('#mdS button').forEach(b=>b.onclick=()=>{LOB.mode=b.dataset.m;ov.querySelectorAll('#mdS button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
   $('solo').onclick=()=>{nick();audio();beginHost(LOB.ch,LOB.mode)};$('host').onclick=()=>{nick();audio();netStart(true)};$('join').onclick=()=>{nick();audio();netStart(false,$('code').value)};
   $('gd').onclick=()=>{guideCard();ov.querySelector('[data-x]').onclick=lobby};$('hp').onclick=()=>{helpCard();ov.querySelector('[data-x]').onclick=lobby};$('bk').onclick=()=>EL.book()})}

/* ============ 루프 ============ */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let last=performance.now(),hudT=0;const T0=performance.now();
function frame(nw){const dt=Math.min(.05,Math.max(0,(nw-last)/1000));last=nw;const t=(nw-T0)/1000;
  try{if(GAME.on){if(ME.stairCD>0)ME.stairCD-=dt;moveMe(dt);
      if(ROLE.r!=='guest'&&S){const me=S.pl.me;if(me){Object.assign(me,{n:NET.nick,f:ME.f,x:ME.x,z:ME.z,yaw:ME.yaw,fl:ME.fl});if(me.bed>=0&&ME.bed<0)me.bed=-1;if(!me.hide&&ME.hide&&false){}ME.out=me.out;ME.hearts=me.hearts}if(!GAME.pause)hostStep(dt);if(!NET.on)S.evq.length=0}
      gaugeStep(dt);syncWorld(dt,t);hudT-=dt;if(hudT<=0){hudT=.12;hud()}EL.showHud(!!(W()&&ov.hidden))}
    else{camera.position.set(-2+Math.sin(t*.06)*1.5,1.7,-3);camera.rotation.set(-.08,Math.PI*.55+Math.sin(t*.07)*.4,0);if(W())syncWorld(dt,t)}
    netTick(dt);renderer.render(scene,camera)}catch(err){console.error(err)}
  requestAnimationFrame(frame)}
buildHouse();
$('tasks').onclick=()=>$('tasks').classList.toggle('min');if(touchUI)$('tasks').classList.add('min');
S=newState(1,'normal');S.dad.st='tv';S.dad.x=SPOT.sofa.x+1.1;S.dad.z=SPOT.sofa.z;S.tv=1;
requestAnimationFrame(frame);lobby();

</script>
</body></html>
