:root{color-scheme:light;--ink:#1f2937;--muted:#5b6673;--paper:#c6c6c6;--paper2:#d9d9d9;--line:#8b8b8b;--leaf:#22a065;--leaf-soft:#dcf3e6;--heat:#e5533a;--heat-soft:#fde4dd;--sun:#ffc531;--sun-soft:#fff3cc;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#78a7ff;overflow:hidden}
body{font-family:var(--f-body);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;pointer-events:none}
body.pre .hud{display:none!important}
#cross{left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px}

#cross::before{left:9px;top:0;width:2px;height:20px}#cross::after{top:9px;left:0;height:2px;width:20px}
#panel{left:max(10px,env(safe-area-inset-left,0px));top:max(8px,env(safe-area-inset-top,0px));background:rgba(0,0,0,.45);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;display:grid;gap:3px;min-width:210px;pointer-events:auto;cursor:pointer;text-shadow:0 1px 0 #000}
#panel b{font-family:var(--f-display);font-weight:400;font-size:15px}
.row2{display:flex;justify-content:space-between;gap:10px;align-items:center}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
#batB{background:linear-gradient(90deg,#facc15,#22c55e)}#co2B{background:linear-gradient(90deg,#9ca3af,#57534e)}
#status.bad{color:#fca5a5}#status.good{color:#86efac}
#quest{right:max(10px,env(safe-area-inset-right,0px));top:max(8px,env(safe-area-inset-top,0px));width:min(290px,42vw);background:rgba(0,0,0,.45);color:#fff;border-radius:8px;padding:7px 10px;font-size:13px;display:grid;gap:2px;pointer-events:auto;cursor:pointer;text-shadow:0 1px 0 #000}
#quest b{font-family:var(--f-display);font-weight:400;font-size:15px;color:#fde047}
#quest small{opacity:.9;line-height:1.4}
#hotbarW{left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom,0px));display:grid;gap:3px;justify-items:center;pointer-events:auto}
#vitals{display:flex;justify-content:space-between;width:100%;padding:0 2px;font-size:15px;line-height:1;text-shadow:0 1px 1px #000}
#vitals span{display:flex;gap:0}#vitals i{font-style:normal;width:16px;text-align:center}#vitals i.off{filter:grayscale(1) brightness(.35)}#vitals i.half{opacity:.6}
#armorV{font-size:12px;color:#fff;text-shadow:0 1px 1px #000;height:13px}
#xpBar{width:100%;height:5px;background:rgba(0,0,0,.55);border:1px solid #000}#xpBar i{display:block;height:100%;background:#7fff3f;width:0}
#hotbar{display:flex;background:rgba(0,0,0,.55);border:2px solid #222;padding:2px}
.sl{width:46px;height:46px;border:2px solid #8b8b8b;background:rgba(139,139,139,.55);position:relative;display:grid;place-items:center;padding:0;margin:0}
.sl.on{outline:3px solid #fff;outline-offset:-1px;z-index:2}
.sl img{width:34px;height:34px;image-rendering:pixelated;pointer-events:none}
.sl span{position:absolute;right:2px;bottom:0;color:#fff;font-size:13px;font-weight:700;text-shadow:1px 1px 0 #3f3f3f;pointer-events:none;font-family:var(--f-display)}
.sl u{position:absolute;left:4px;right:4px;bottom:3px;height:3px;background:#000;pointer-events:none}.sl u i{display:block;height:100%}
#itemName{left:50%;transform:translateX(-50%);bottom:calc(max(8px,env(safe-area-inset-bottom,0px)) + 92px);color:#fff;text-shadow:1px 1px 0 #3f3f3f;font-family:var(--f-display);font-size:17px;transition:opacity .4s}
#tip{left:50%;top:calc(50% + 24px);transform:translateX(-50%);color:#fff;text-shadow:0 1px 3px #000;font-size:13.5px;text-align:center;max-width:80vw}
#toast{left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top,0px)) + 6px);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(520px,56vw)}
.toast{background:rgba(15,23,42,.88);color:#fff;border-radius:8px;padding:6px 12px;font-size:14px;text-align:center;animation:tin .25s}
.toast.bad{background:rgba(160,30,20,.92)}.toast.good{background:rgba(21,110,55,.92)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#chatLog{left:max(10px,env(safe-area-inset-left,0px));bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 110px);display:flex;flex-direction:column;gap:2px;max-width:min(380px,60vw);opacity:.35;transition:opacity .4s}
#chatLog.show{opacity:1}#chatLog .cm{background:rgba(0,0,0,.5);color:#fff;padding:3px 8px;font-size:14px}#chatLog .cm b{color:#7dd3fc;margin-right:4px}#chatLog .cm.me b{color:#fde047}
#chatBar{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 100px);width:min(560px,92vw);display:grid;gap:6px}
#chatBar .qk{display:flex;flex-wrap:wrap;gap:5px}#chatBar .qb{border:0;border-radius:999px;padding:5px 11px;background:rgba(255,255,255,.9);font-size:13.5px}
#chatF{display:flex;gap:6px}#chatIn{flex:1;font:inherit;font-size:16px;padding:9px 12px;border-radius:6px;border:3px solid #facc15;background:#fff}#chatF button{border:0;border-radius:6px;padding:0 16px;background:#facc15;font-family:var(--f-display);font-size:16px}
#lockHint{left:50%;top:62%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:9px 16px;font-size:15px;text-align:center}
#hurt{inset:0;background:radial-gradient(transparent 45%,rgba(220,38,38,.5));opacity:0;transition:opacity .2s}
#dark{inset:0;background:#000;opacity:0;transition:opacity 1.2s}
#water{inset:0;background:rgba(40,80,200,.35);display:none}
#portalFx{inset:0;background:radial-gradient(circle,rgba(192,132,252,.25),rgba(88,28,135,.9));opacity:0;transition:opacity .15s}
#boss{top:max(8px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(420px,70vw);text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 2px #000;display:none}
#boss .bar{height:10px;background:rgba(0,0,0,.5);border:2px solid #fff;margin-top:3px}#boss .bar i{display:block;height:100%;background:linear-gradient(90deg,#a21caf,#e879f9);width:100%}

  padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.card{background:#c6c6c6;border-radius:6px;width:min(760px,100%);max-height:100%;overflow:auto;padding:14px;display:grid;gap:10px;border:3px solid #fff;border-right-color:#555;border-bottom-color:#555;box-shadow:0 0 0 2px #000}
.card.narrow{width:min(520px,100%)}
.card h1,.card h2,.card h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;color:#3f3f3f}
.card h1{font-size:clamp(30px,6vw,46px)}.card h2{font-size:22px}.card h3{font-size:16px}
.card p{margin:0;line-height:1.6}
.hd{display:flex;align-items:center;gap:10px}.hd .x{margin-left:auto;border:0;background:#8b8b8b;color:#fff;border-radius:4px;width:34px;height:34px;font-size:17px}

.btn:hover:not(:disabled){background:#7f8fd0}
.btn.go{background:#3c8527}.btn.go:hover{background:#4ca233}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{border-radius:4px;padding:8px 10px;font-size:14px;line-height:1.55;background:#e6e6e6;border:2px solid #8b8b8b}.note.info{background:var(--sun-soft)}.note.good{background:var(--leaf-soft)}.note.bad{background:var(--heat-soft)}
.choice{text-align:left;background:#e6e6e6;border:2px solid #8b8b8b;border-radius:4px;padding:10px 12px;font-size:16px}
.choice:hover:not(:disabled){border-color:#000}.choice.right{border-color:var(--leaf);background:var(--leaf-soft)}.choice.wrong{border-color:var(--heat);background:var(--heat-soft)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.box{background:#e6e6e6;border-radius:4px;padding:9px 11px;display:grid;gap:4px;align-content:start;min-width:0;border:2px solid #8b8b8b}

.inp{font:inherit;font-size:17px;padding:8px 10px;border-radius:3px;border:2px solid #000;background:#000;color:#fff}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{border:2px solid #000;border-radius:3px;padding:6px 10px;background:#8b8b8b;color:#fff;font-size:14px}.seg button[aria-pressed=true]{background:#3c8527}

.cg{display:flex;align-items:center;gap:10px}.arrow{font-size:28px;color:#555}

#tb{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:max(110px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,58px);gap:7px;pointer-events:auto}
.tb{height:52px;border-radius:8px;border:2px solid rgba(0,0,0,.5);background:rgba(255,255,255,.75);font-family:var(--f-display);font-size:13.5px}
.tb.on{background:#facc15}
@media (max-width:700px){#panel{min-width:0;font-size:11.5px}#quest{width:44vw;font-size:11.5px}.sl{width:36px;height:36px}.sl img{width:26px;height:26px}.inv{grid-template-columns:1fr}.grid9{grid-template-columns:repeat(9,36px)}.isl{width:36px;height:36px}.isl img{width:26px;height:26px}.grid3{grid-template-columns:repeat(3,36px)}.grid2{grid-template-columns:repeat(2,36px)}.cols{grid-template-columns:1fr}}

</style>

<script>/* ===== 민왕게임월드 온라인 연결 도우미 v2 =====

(function(){

 {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}];

function inherit(C){C.prototype=Object.create(Em.prototype);C.prototype.constructor=C}

/* ---------- 아주 작은 MQTT 3.1.1 (웹소켓) ---------- */
var te=new TextEncoder(),td=new TextDecoder();
function str(s){var b=te.encode(s);var o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o}

inherit(Mqtt);
Mqtt.prototype._go=function(){var self=this;if(this.dead)return;if(this.bi>=BROKERS.length){this.emit('fail');return}

  ws.onopen=function(){var body=cat([str('MQTT'),new Uint8Array([4,2,0,40]),str(self.cid)]);ws.send(pkt(0x10,body))};
  ws.onmessage=function(ev){self._rx(new Uint8Array(ev.data),function(){if(!done){done=true;clearTimeout(to)}})};
  ws.onerror=function(){};
  ws.onclose=function(){clearTimeout(to);var was=self.ok;self.ok=false;clearInterval(self.pt);if(self.dead)return;if(!done){done=true;self.bi++;self._go();return}
    if(was){self.emit('down');setTimeout(function(){if(!self.dead){self.bi=0;self._go()}},1500)}}};
Mqtt.prototype._rx=function(chunk,onConn){var b=cat([this.buf,chunk]);var p=0;
  while(p<b.length){var h=b[p],mul=1,len=0,q=p+1,d;do{if(q>=b.length){this.buf=b.slice(p);return}d=b[q++];len+=(d&127)*mul;mul*=128}while(d&128);
    if(q+len>b.length){this.buf=b.slice(p);return}var body=b.subarray(q,q+len);p=q+len;var t=h>>4;
    if(t===2){if(body[1]===0){onConn();var first=!this.everOk;this.ok=true;this.everOk=true;var self=this;this.pt=setInterval(function(){try{self.ws.send(new Uint8Array([0xC0,0]))}catch(e){}},20000);for(var i=0;i<this.subs.length;i++)this._sub(this.subs[i]);this.emit(first?'ready':'up')}else{try{this.ws.close()}catch(e){}}}
    else if(t===3){var tl=(body[0]<<8)|body[1];var topic=td.decode(body.subarray(2,2+tl));var off=2+tl+((h>>1)&3?2:0);this.emit('msg',topic,td.decode(body.subarray(off)))}}
  this.buf=new Uint8Array(0)};
Mqtt.prototype._sub=function(t){var id=this.pid++&65535||1;this.ws.send(pkt(0x82,cat([new Uint8Array([id>>8,id&255]),str(t),new Uint8Array([0])])))};
Mqtt.prototype.sub=function(t){this.subs.push(t);if(this.ok)this._sub(t)};
Mqtt.prototype.pub=function(t,s){if(!this.ok)return false;try{this.ws.send(pkt(0x30,cat([str(t),te.encode(s)])));return true}catch(e){return false}};
Mqtt.prototype.close=function(){this.dead=true;clearInterval(this.pt);try{this.ws.send(new Uint8Array([0xE0,0]));this.ws.close()}catch(e){}};

/* ---------- 연결 하나 (PeerJS 또는 MQTT를 감싸요) ---------- */
function Conn(peer,remote){Em.call(this);this.peer=remote;this.open=false;this.reliable=true;this._p=peer;this._k=null;this._rc=null;this.closed=false;this.via=''}
inherit(Conn);
Conn.prototype.send=function(d){if(!this.open||this.closed)return;if(this._rc){try{this._rc.send(d)}catch(e){}}else if(this._k){this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'d',c:this._k,f:this._p.id,d:d}));this._tx=Date.now()}};
Conn.prototype.close=function(){if(this.closed)return;this.closed=true;var was=this.open;this.open=false;if(this._rc){try{this._rc.close()}catch(e){}}if(this._k){this._p._mq&&this._p._mq.pub(TOPIC+this.peer,JSON.stringify({t:'fin',c:this._k,f:this._p.id}));delete this._p._mc[this._k]}clearInterval(this._ka);if(was)this.emit('close')};
Conn.prototype._useReal=function(rc){var self=this;this._rc=rc;this.via='webrtc';
  rc.on('data',function(d){self.emit('data',d)});rc.on('close',function(){if(!self.closed){self.closed=true;self.open=false;self.emit('close')}});rc.on('error',function(e){self.emit('error',e)})};
Conn.prototype._setOpen=function(){var self=this;if(this.open||this.closed)return;this.open=true;setTimeout(function(){self.emit('open')},0)};
Conn.prototype._useMq=function(k){var self=this;this._k=k;this.via='relay';this._rx=Date.now();this._p._mc[k]=this;
  this._ka=setInterval(function(){if(!self.open)return;if(Date.now()-(self._tx||0)>3000)self._p._mq.pub(TOPIC+self.peer,JSON.stringify({t:'png',c:k,f:self._p.id}));if(Date.now()-self._rx>16000){self.close()}},2000)};

/* ---------- Peer 대신 쓰는 SmartPeer ---------- */
function SmartPeer(id,opts){if(!(this instanceof SmartPeer))return new SmartPeer(id,opts);Em.call(this);var self=this;
  if(id&&typeof id==='object'){opts=id;id=undefined}
  this.id=id||('g'+rid(11));this.isHost=!!id;this.opts=opts||{};this.destroyed=false;this.open=false;this._mc={};this._openSent=false;this._rpOpen=false;this._mqReady=false;
  // 1) PeerJS
  if(RealPeer){try{var o={};for(var k in this.opts)o[k]=this.opts[k];o.config=o.config||{iceServers:ICE};
    this._rp=new RealPeer(this.id,o);
    this._rp.on('open',function(){self._rpOpen=true;self._open()});
    this._rp.on('connection',function(rc){var c=new Conn(self,rc.peer);rc.on('open',function(){if(c.closed)return;c._useReal(rc);c._setOpen();self.emit('connection',c)})});
    this._rp.on('error',function(e){var t=e&&e.type;if(t==='unavailable-id'){self.emit('error',e);return}if(t==='peer-unavailable'){var m=/peer\s+(\S+)/i.exec(e.message||'');self.emit('_pu',m?m[1]:'');return}self._rpBad=true;if(!self._rpOpen)self._maybeOpen()});
    this._rp.on('disconnected',function(){if(!self.destroyed){try{self._rp.reconnect()}catch(e){}}});
  }catch(e){this._rp=null;this._rpBad=true}}else this._rpBad=true;
  // 2) MQTT 중계 (항상 함께 켜 둬요)
  this._mq=new Mqtt('mw'+rid(12));
  this._mq.on('ready',function(){self._mqReady=true;self._maybeOpen()});
  this._mq.on('fail',function(){self._mqBad=true;if(!self._openSent&&(self._rpBad||!RealPeer))self.emit('error',{type:'network',message:'연결 서버에 닿지 못했어요'})});
  this._mq.on('msg',function(t,s){self._onMsg(s)});
  this._mq.sub(TOPIC+this.id);
  setTimeout(function(){self._waited=true;self._maybeOpen()},3500)}
inherit(SmartPeer);
SmartPeer.prototype._maybeOpen=function(){if(this._openSent||this.destroyed)return;if(this._rpOpen)return this._open();if(this._mqReady&&(this._waited||this._rpBad))this._open()};
SmartPeer.prototype._open=function(){if(this._openSent||this.destroyed)return;this._openSent=true;this.open=true;var self=this;setTimeout(function(){self.emit('open',self.id)},0)};
SmartPeer.prototype._onMsg=function(s){var m;try{m=JSON.parse(s)}catch(e){return}if(!m||!m.c)return;var c=this._mc[m.c];
  if(m.t==='syn'){if(!this.isHost&&!this._acceptAll)return;if(!c){c=new Conn(this,String(m.f));c._useMq(m.c);c._setOpen();this.emit('connection',c)}c._rx=Date.now();this._mq.pub(TOPIC+m.f,JSON.stringify({t:'ack',c:m.c,f:this.id}));return}
  if(!c)return;c._rx=Date.now();
  if(m.t==='ack'){if(c._wait){c._wait=false;clearInterval(c._synT);c._setOpen()}}
  else if(m.t==='d'){if(c.open)c.emit('data',m.d)}
  else if(m.t==='fin'){if(!c.closed){c.closed=true;var was=c.open;c.open=false;clearInterval(c._ka);delete this._mc[m.c];if(was)c.emit('close')}}};
SmartPeer.prototype.connect=function(remote,opts){var self=this,c=new Conn(this,remote);var fellBack=false;
  function relay(){if(fellBack||c.closed||c.open)return;fellBack=true;
    var go=function(){var k=rid(12);c._useMq(k);c._wait=true;var n=0;var syn=function(){if(!c._wait||c.closed){clearInterval(c._synT);return}if(++n>8){clearInterval(c._synT);c._wait=false;c.closed=true;self.emit('error',{type:'peer-unavailable',message:'Could not connect to peer '+remote});c.emit('error',{type:'peer-unavailable'});return}self._mq.pub(TOPIC+remote,JSON.stringify({t:'syn',c:k,f:self.id}))};syn();c._synT=setInterval(syn,1300)};
    if(self._mqReady)go();else{var w=setInterval(function(){if(self._mqReady){clearInterval(w);go()}else if(self._mqBad){clearInterval(w);self.emit('error',{type:'network'})}},300)}}
  if(this._rp&&this._rpOpen&&!this._rpBad){try{var rc=this._rp.connect(remote,opts||{reliable:true});
      rc.on('open',function(){if(c.open||c.closed){try{rc.close()}catch(e){}return}if(fellBack){if(c._wait){c._wait=false;clearInterval(c._synT);if(c._k)delete self._mc[c._k];clearInterval(c._ka);c._k=null}else{try{rc.close()}catch(e){}return}}c._useReal(rc);c._setOpen()});
      var pu=function(who){if(!who||who===remote)relay()};this.on('_pu',pu);
      setTimeout(relay,7000)}catch(e){relay()}}
  else relay();
  return c};
SmartPeer.prototype.destroy=function(){if(this.destroyed)return;this.destroyed=true;for(var k in this._mc){try{this._mc[k].close()}catch(e){}}if(this._rp){try{this._rp.destroy()}catch(e){}}if(this._mq)this._mq.close();this.emit('close')};
SmartPeer.prototype.disconnect=function(){this.destroy()};
SmartPeer.prototype.reconnect=function(){};
window.Peer=SmartPeer;window.MWG_RealPeer=RealPeer;
})();

<script>
/* ============ claude.ai 함께 하기 (room 기능을 PeerJS처럼 쓰는 연결 도구) ============ */
let NETR_=null;
(async()=>{try{if(window.claude&&claude.use){const r=await claude.use('room');if(r)NETR_=r}}catch(e){NETR_=null}})();
const RP_CLEAN=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F­​-‏‪-‮⁠-⁯﻿-]/g,'');
const RP_LATEST=new Set(['p','s','m','gs','ps','pos','st','mobs']);
class RPConn{constructor(pc,peer){this.pc=pc;this.peer=peer;this.open=false;this.h={}}
  on(ev,fn){(this.h[ev]=this.h[ev]||[]).push(fn);return this}
  fire(ev,a){for(const f of this.h[ev]||[])try{f(a)}catch(e){console.error(e)}}
  send(m){if(this.open)this.pc._q(this.peer,m)}
  close(){this.open=false}}
class RoomPeer{
  constructor(id){this.id=id||null;this.h={};this.conns=new Map();this.seq=0;this.win=[];this.pend=[];this.seen={};this.chunks={};this.room=null;this.dead=false;this.unsub=[];
    this._start().catch(e=>this.fire('error',{type:e&&e.type||'network'}))}
  on(ev,fn){(this.h[ev]=this.h[ev]||[]).push(fn);return this}
  fire(ev,a){for(const f of this.h[ev]||[])try{f(a)}catch(e){console.error(e)}}
  async _start(){await new Promise(r=>setTimeout(r,0));const R=NETR_;if(!R)throw{type:'network'};const host=!!this.id;this.host=host;
    const name=String(host?this.id:'x').toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);
    if(host){this.room=await R.join(name);await new Promise(r=>setTimeout(r,1200));
      if(this.room.peers().some(p=>!p.sameTab&&p.presence&&p.presence.h)){await this.room.leave().catch(()=>{});throw{type:'unavailable-id'}}
      await this.room.presence({h:1,o:[]});this.me=(this.room.peers().find(p=>p.sameTab)||{}).peer;this._listen();this.fire('open',this.id)}
    else this.fire('open','guest')}
  connect(hid){const c=new RPConn(this,null);(async()=>{try{const name=String(hid).toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);this.room=await NETR_.join(name);
      let hp=null;for(let i=0;i<40&&!hp;i++){hp=this.room.peers().find(p=>!p.sameTab&&p.presence&&p.presence.h);if(!hp)await new Promise(r=>setTimeout(r,250))}
      if(!hp){await this.room.leave().catch(()=>{});this.fire('error',{type:'peer-unavailable'});return}
      this.me=(this.room.peers().find(p=>p.sameTab)||{}).peer;c.peer=hp.peer;this.conns.set(hp.peer,c);await this.room.presence({g:1,o:[]});this._listen();c.open=true;c.fire('open')}catch(e){this.fire('error',{type:'network'})}})();return c}
  _listen(){const r=this.room;this.unsub.push(r.onPeers(ch=>this._peers(ch),()=>{for(const c of this.conns.values()){c.open=false;c.fire('close')}}));this._peers({peers:r.peers(),joined:r.peers(),left:[],updated:[]});
    this.timer=setInterval(()=>this._flush(),100)}
  _peers(ch){for(const p of ch.left||[]){const c=this.conns.get(p.peer);if(c){c.open=false;this.conns.delete(p.peer);c.fire('close')}}
    for(const p of ch.peers){if(p.sameTab)continue;const pr=p.presence||{};
      if(this.host&&pr.g&&!this.conns.has(p.peer)){const c=new RPConn(this,p.peer);this.conns.set(p.peer,c);this.fire('connection',c);setTimeout(()=>{c.open=true;c.fire('open')},50)}
      const c=this.conns.get(p.peer);if(!c)continue;const o=Array.isArray(pr.o)?pr.o.slice().sort((x,y)=>x.s-y.s):[];const sn=this.seen[p.peer]||(this.seen[p.peer]={set:new Set(),floor:0});
      for(const e of o){if(!e||!(e.s>sn.floor)||sn.set.has(e.s))continue;sn.set.add(e.s);if(e.to!=='*'&&!(Array.isArray(e.to)&&e.to.includes(this.me)))continue;let txt=e.x;
        if(e.c){const k=p.peer+':'+e.c[0];const bk=this.chunks[k]||(this.chunks[k]=[]);bk[e.c[1]]=e.x;if(bk.filter(v=>v!=null).length<e.c[2])continue;txt=bk.join('');delete this.chunks[k]}
        try{c.fire('data',JSON.parse(txt))}catch(err){}}
      if(sn.set.size>600){const arr=[...sn.set].sort((x,y)=>x-y);sn.floor=arr[arr.length-400];sn.set=new Set(arr.slice(-400))}}}
  _q(to,m){const t=m&&m.t,key=RP_LATEST.has(t)?t+'|'+(m.id??''):null;
    for(const e of this.pend)if(e.ref===m){if(!e.to.includes(to))e.to.push(to);return}
    let txt;try{txt=RP_CLEAN(JSON.stringify(m))}catch(e){return}
    if(key){const e=this.pend.find(q=>q.key===key);if(e){e.ref=m;e.txt=txt;if(!e.to.includes(to))e.to.push(to);return}}
    this.pend.push({ref:m,key,to:[to],txt})}
  _flush(){if(!this.room||this.dead)return;const now=Date.now();
    for(const e of this.pend){const to=e.to.length>=this.conns.size&&this.host?'*':e.to.slice();
      if(e.key){this.win=this.win.filter(w=>!(w.key===e.key));}
      if(e.txt.length>1500){const id=(++this.seq);const n=Math.ceil(e.txt.length/1500);for(let i=0;i<n;i++)this.win.push({s:++this.seq,to,c:[id,i,n],x:e.txt.slice(i*1500,(i+1)*1500),t:now,big:1})}
      else this.win.push({s:++this.seq,to,x:e.txt,t:now,key:e.key})}
    this.pend=[];
    this.win=this.win.filter(w=>w.big?(w.n||0)<3:now-w.t<900);
    let out=[],size=40;const big=this.win.filter(w=>w.big).sort((x,y)=>(x.n||0)-(y.n||0)||x.s-y.s),small=this.win.filter(w=>!w.big);
    const L=w=>w.L||(w.L=JSON.stringify(w.x).length+60);const hasBig=big.length>0;

const ARMC={leather:[[160,96,52],[120,70,36]],gold:[[250,214,70],[200,150,30]],iron:[[225,225,230],[180,180,186]],diamond:[[90,236,224],[40,170,160]],netherite:[[86,76,80],[50,44,48]]};
function armorPaint(sl,m){const [c,d]=ARMC[m];const C=rgb(...c),Dk=rgb(...d);return p=>{
  if(sl===0){for(let y=3;y<10;y++)for(let x=3;x<13;x++){if(y>5&&x>4&&x<11)continue;p(x,y,(x+y)%5?C:Dk)}}
  if(sl===1){for(let y=2;y<15;y++)for(let x=2;x<14;x++){const arm=y<7&&(x<4||x>11);const gap=y<5&&x>5&&x<10;if(gap)continue;if(arm||(x>=4&&x<=11))p(x,y,(x+y)%5?C:Dk)}}
  if(sl===2){for(let y=2;y<15;y++)for(let x=3;x<13;x++){if(y>5&&x>6&&x<9)continue;p(x,y,(x+y)%5?C:Dk)}}
  if(sl===3){for(let y=6;y<13;y++)for(const x0 of [2,9])for(let x=x0;x<x0+5;x++){if(y<9&&x>x0+2)continue;p(x,y,(x+y)%4?C:Dk)}}}}
for(const m in ARMC)for(let i=0;i<4;i++){const k=`${m}_${['helmet','chest','legs','boots'][i]}`;if(!(m==='iron'&&i===1))tile(k,armorPaint(i,m))}

  if(id===51){P.portT=(P.portT||0)+dt;$('portalFx').style.opacity=Math.min(.9,P.portT/2);if(P.portT>=2)travel(regOf(P.x)==='nether'?'over':'nether')}
