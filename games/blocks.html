<!doctype html>

<style>
/* 마인크래프트식 생존 화면: 가운데 조준점, 아래 핫바·하트·배고픔, 왼쪽 위 마을 전기판, 오른쪽 위 미션 */
:root{color-scheme:light;--ink:#1f2937;--muted:#5b6673;--paper:#c6c6c6;--paper2:#d9d9d9;--line:#8b8b8b;--leaf:#22a065;--leaf-soft:#dcf3e6;--heat:#e5533a;--heat-soft:#fde4dd;--sun:#ffc531;--sun-soft:#fff3cc;

[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#78a7ff;overflow:hidden}
body{font-family:var(--f-body);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}

.isl.big{width:56px;height:56px}
.lbl{font-family:var(--f-display);color:#3f3f3f;font-size:15px;margin:2px 0}
#cursor{position:fixed;z-index:40;pointer-events:none;width:40px;height:40px;margin:-20px 0 0 -20px}
#cursor img{width:40px;height:40px;image-rendering:pixelated}#cursor span{position:absolute;right:0;bottom:-2px;color:#fff;font-size:14px;text-shadow:1px 1px 0 #333;font-family:var(--f-display)}

.book{max-height:330px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,46px);gap:3px;align-content:start;background:#8b8b8b;padding:4px;border:2px solid #373737}
.book .isl.no{opacity:.4}
.prog{width:44px;height:10px;background:#555;border:1px solid #000}.prog i{display:block;height:100%;background:#fff}
.flame{width:18px;height:18px;font-size:16px;line-height:18px;text-align:center}

/* 터치 */
#touch{position:fixed;inset:0;z-index:4;pointer-events:none}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:max(110px,env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);pointer-events:auto}
#knob{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.7)}
#tb{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:max(110px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,58px);gap:7px;pointer-events:auto}
.tb{height:52px;border-radius:8px;border:2px solid rgba(0,0,0,.5);background:rgba(255,255,255,.75);font-family:var(--f-display);font-size:13.5px}
.tb.on{background:#facc15}
@media (max-width:700px){#panel{min-width:0;font-size:11.5px}#quest{width:44vw;font-size:11.5px}.sl{width:36px;height:36px}.sl img{width:26px;height:26px}.inv{grid-template-columns:1fr}.grid9{grid-template-columns:repeat(9,36px)}.isl{width:36px;height:36px}.isl img{width:26px;height:26px}.grid3{grid-template-columns:repeat(3,36px)}.grid2{grid-template-columns:repeat(2,36px)}.cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head><body class="pre">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ============ claude.ai 함께 하기 (room 기능을 PeerJS처럼 쓰는 연결 도구) ============ */
let NETR_=null;
(async()=>{try{if(window.claude&&claude.use){const r=await claude.use('room');if(r)NETR_=r}}catch(e){NETR_=null}})();
const RP_CLEAN=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F­​-‏‪-‮⁠-⁯﻿-]/g,'');
const RP_LATEST=new Set(['p','s','m','gs','ps','pos','st','mobs']);
class RPConn{constructor(pc,peer){this.pc=pc;this.peer=peer;this.open=false;this.h={}}
  on(ev,fn){(this.h[ev]=this.h[ev]||[]).push(fn);return this}
  fire(ev,a){for(const f of this.h[ev]||[])try{f(a)}catch(e){console.error(e)}}
  send(m){if(this.open)this.pc._q(this.peer,m)}
  close(){this.open=false}}
class RoomPeer{
  constructor(id){this.id=id||null;this.h={};this.conns=new Map();this.seq=0;this.win=[];this.pend=[];this.seen={};this.chunks={};this.room=null;this.dead=false;this.unsub=[];
    this._start().catch(e=>this.fire('error',{type:e&&e.type||'network'}))}
  on(ev,fn){(this.h[ev]=this.h[ev]||[]).push(fn);return this}
  fire(ev,a){for(const f of this.h[ev]||[])try{f(a)}catch(e){console.error(e)}}
  async _start(){await new Promise(r=>setTimeout(r,0));const R=NETR_;if(!R)throw{type:'network'};const host=!!this.id;this.host=host;
    const name=String(host?this.id:'x').toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);
    if(host){this.room=await R.join(name);await new Promise(r=>setTimeout(r,1200));
      if(this.room.peers().some(p=>!p.sameTab&&p.presence&&p.presence.h)){await this.room.leave().catch(()=>{});throw{type:'unavailable-id'}}
      await this.room.presence({h:1,o:[]});this.me=(this.room.peers().find(p=>p.sameTab)||{}).peer;this._listen();this.fire('open',this.id)}
    else this.fire('open','guest')}
  connect(hid){const c=new RPConn(this,null);(async()=>{try{const name=String(hid).toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);this.room=await NETR_.join(name);
      let hp=null;for(let i=0;i<40&&!hp;i++){hp=this.room.peers().find(p=>!p.sameTab&&p.presence&&p.presence.h);if(!hp)await new Promise(r=>setTimeout(r,250))}
      if(!hp){await this.room.leave().catch(()=>{});this.fire('error',{type:'peer-unavailable'});return}
      this.me=(this.room.peers().find(p=>p.sameTab)||{}).peer;c.peer=hp.peer;this.conns.set(hp.peer,c);await this.room.presence({g:1,o:[]});this._listen();c.open=true;c.fire('open')}catch(e){this.fire('error',{type:'network'})}})();return c}
  _listen(){const r=this.room;this.unsub.push(r.onPeers(ch=>this._peers(ch),()=>{for(const c of this.conns.values()){c.open=false;c.fire('close')}}));this._peers({peers:r.peers(),joined:r.peers(),left:[],updated:[]});
    this.timer=setInterval(()=>this._flush(),100)}
  _peers(ch){for(const p of ch.left||[]){const c=this.conns.get(p.peer);if(c){c.open=false;this.conns.delete(p.peer);c.fire('close')}}
    for(const p of ch.peers){if(p.sameTab)continue;const pr=p.presence||{};
      if(this.host&&pr.g&&!this.conns.has(p.peer)){const c=new RPConn(this,p.peer);this.conns.set(p.peer,c);this.fire('connection',c);setTimeout(()=>{c.open=true;c.fire('open')},50)}
      const c=this.conns.get(p.peer);if(!c)continue;const o=Array.isArray(pr.o)?pr.o.slice().sort((x,y)=>x.s-y.s):[];const sn=this.seen[p.peer]||(this.seen[p.peer]={set:new Set(),floor:0});

  for(let j=0;j<INV.grid.length;j++)if(INV.grid[j]){giveBack(INV.grid[j]);INV.grid[j]=null}
  const need=reqOf(r);if(!Object.entries(need).every(([k,c])=>k.split('|').reduce((a,q)=>a+countItem(q),0)>=c)){toast(`재료가 모자라요: ${Object.entries(need).map(([k,c])=>itemName(k.split('|')[0])+' '+c).join(', ')}`,'bad');drawInv();return}
  const take=k=>{for(const q of k.split('|'))if(countItem(q)>0){takeItem(q,1);return q}return null};
  if(r.list){r.list.forEach((k,j)=>{const q=take(k);INV.grid[j]={k:q,n:1}})}
  else r.pat.forEach((row,y)=>[...row].forEach((c,x)=>{if(c===' ')return;const q=take([].concat(r.key[c]).join('|'));INV.grid[y*n+x]={k:q,n:1}}));
  sfx('pop');drawInv()}

  const once=()=>{for(let i=0;i<INV.grid.length;i++){const s=INV.grid[i];if(s){s.n--;if(s.n<=0)INV.grid[i]=null}}S.seen['r_'+r.out]=1;stat('craft_'+r.out,r.n);if(r.out==='wire')stat('craft_wire');sfx('craft')};
  if(shift){let c=0;while(matchGrid(INV.grid,INV.n)===r&&c<64){if(!canFit(r.out,r.n))break;once();addItem(r.out,r.n,undefined,true);c++}}
  else{if(CUR&&(CUR.k!==r.out||CUR.n+r.n>mx))return;once();if(CUR)CUR.n+=r.n;else CUR=mkStack(r.out,r.n)}
