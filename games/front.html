<title>에너지 전선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 전장 캔버스를 가득 채우고, 위에는 자원 띠, 아래에는 미니맵·정보·명령 버튼 콘솔 */
:root{
  color-scheme:dark;
  --void:#0b0d10; --panel:#13171b; --panel2:#1a2026; --line:#2a333b; --ink:#dbe3e6; --dim:#85939b; --ally:#3fd6c6; --hostile:#ff6b6b; --volt:#ffd75e; --leaf:#62e38a; --carbon:#b9a7c9; --warn:#ffb547;
  --f-display:'Black Han Sans','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--void)}
body{margin:0;color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--ally);outline-offset:2px}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}

/* 상단 자원 띠 */
#top{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;background:linear-gradient(#1b2228,#0f1317);border-bottom:2px solid #39454e;
  padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;background:var(--volt);transform:rotate(45deg);box-shadow:0 0 10px var(--volt)}
.res{display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.res b{font-family:var(--f-mono);font-weight:600;font-size:16px;color:var(--leaf)}
.res small{font-size:11px;color:var(--dim)}
.res.volt b{color:var(--volt)} .res.bad b{color:var(--hostile)} .res.warn b{color:var(--warn)}
.cbar{width:70px;height:7px;border-radius:4px;background:#0a0c0e;overflow:hidden;align-self:center}
.cbar i{display:block;height:100%;background:linear-gradient(90deg,#62e38a,#ffd75e 55%,#ff6b6b)}
.spacer{flex:1}
.tb{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:4px 9px;font-size:12px;cursor:pointer}
.tb:hover{border-color:var(--dim)}
.tb b{font-family:var(--f-mono);color:var(--ally)}

/* 전장 */
#stage{position:relative;overflow:hidden;touch-action:none;min-height:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#toasts{position:absolute;left:14px;bottom:12px;display:flex;flex-direction:column;gap:3px;pointer-events:none;width:min(80%,520px)}
.toast{font-size:14px;color:#ffe9a8;text-shadow:0 1px 0 #000,0 0 6px #000;animation:tin .25s}
.toast.bad{color:#ff9a9a}.toast.good{color:#9ff7b8}.toast.info{color:#bfe7ff}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
#objBox{position:absolute;right:14px;top:12px;background:rgba(6,9,11,.82);border:1px solid #2f5a44;border-left:3px solid var(--leaf);padding:8px 12px;border-radius:3px;
  font-size:12.5px;pointer-events:none;width:min(46%,300px);display:grid;gap:3px}
#objBox b{color:var(--leaf);font-size:13px}
#objBox .ok{color:#9ff7b8}#objBox .no{color:#a5b0b5}
#objBox .prog{font-family:var(--f-mono);color:var(--volt)}
#boxBtn{position:absolute;right:14px;bottom:12px;font-size:12px}
#placeHint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid var(--warn);color:#ffe2a8;
  padding:4px 12px;border-radius:3px;font-size:13px;pointer-events:none;max-width:90%;text-align:center}

/* 하단 콘솔 */
#hud{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"mini info cmd";gap:12px;height:150px;
  background:linear-gradient(180deg,#2b343b 0,#1a2025 8px,#141a1e 60%,#0e1215);border-top:3px solid #4b5963;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#miniWrap,#info,#cmd{border:2px solid #0a0d10;outline:1px solid #46535d;border-radius:2px;background:#05070a}
#miniWrap{grid-area:mini;line-height:0;align-self:start}
#mini{width:186px;height:124px;display:block;touch-action:none;cursor:pointer}
#info{grid-area:info;min-width:0;overflow:hidden;padding:8px 12px;display:flex;flex-direction:column;gap:5px;font-size:13px}
#cmd{grid-area:cmd;display:grid;grid-template-columns:repeat(4,60px);grid-template-rows:repeat(3,38px);gap:4px;padding:4px;align-self:start}
.cb{position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1a2420,#070a09);border:1px solid #33463d;border-radius:3px;cursor:pointer;padding:0;overflow:hidden}
.cb canvas{width:32px;height:32px;pointer-events:none}
.cb .k{position:absolute;right:3px;bottom:1px;font-family:var(--f-mono);font-size:9.5px;color:var(--volt)}
.cb:hover:not(:disabled){border-color:var(--leaf);box-shadow:0 0 6px rgba(98,227,138,.35)}
.cb:disabled{opacity:.35;cursor:not-allowed}
.cb.empty{visibility:hidden}
#ctip{position:absolute;right:16px;bottom:calc(100% + 6px);z-index:5;background:rgba(0,0,0,.94);border:1px solid #2fb35a;border-radius:3px;padding:7px 11px;
  font-size:12.5px;max-width:320px;pointer-events:none;line-height:1.55}
#ctip b{color:#fff} #ctip .c{font-family:var(--f-mono);color:var(--volt)} #ctip .h{color:#a9bdb2;font-size:12px}
.iname{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.iname b{font-size:17px;color:#fff}
.iname span{font-size:12px;color:var(--dim)}
.tag{font-size:11px;border-radius:3px;padding:0 5px}
.tag.r{background:#163a26;color:#9ff7b8}.tag.f{background:#2c2533;color:#d6c4e6}.tag.e{background:#3a1717;color:#ff9a9a}
.hpb{height:6px;background:#0a0c0e;border-radius:3px;overflow:hidden;max-width:260px}
.hpb i{display:block;height:100%}
.istat{display:flex;flex-wrap:wrap;gap:3px 16px;color:#9bb0a4;font-size:12px;font-variant-numeric:tabular-nums}
.istat b{color:var(--leaf);font-family:var(--f-mono);font-weight:400}
.itip{color:#a9b6bc;font-size:12.5px;line-height:1.55;max-width:62ch}
.itip b{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:2px 6px;font-size:12px}
.qbar{height:4px;background:#0a0c0e;border-radius:2px;overflow:hidden;max-width:200px}
.qbar i{display:block;height:100%;background:var(--ally)}

/* 오버레이 */
#overlay{position:fixed;inset:0;z-index:30;background:rgba(4,6,8,.86);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.brief{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px;width:min(100%,760px);max-height:100%;overflow:auto;padding:24px 26px;display:grid;gap:14px}
.brief::before{content:"";position:absolute;left:0;top:0;width:64px;height:3px;background:var(--volt)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--volt);text-transform:uppercase}
.brief h1{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,7vw,56px);line-height:1;margin:0;letter-spacing:.02em;text-wrap:balance}
.brief h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;text-wrap:balance}
.brief h3{font-size:15px;margin:0;color:#fff}
.brief p{margin:0;line-height:1.7;color:#b7c2c7;max-width:64ch;font-size:14px}
.brief p b{color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:grid;gap:7px;align-content:start;min-width:0}
.box ul,.box ol{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;line-height:1.55;color:#c3cdd1}
.box b{color:#fff;font-weight:600}
.ztbl{width:100%;border-collapse:collapse;font-size:13px}
.ztbl td{padding:4px 2px;border-bottom:1px solid var(--line);vertical-align:top}
.ztbl td:first-child{color:var(--dim);white-space:nowrap;padding-right:10px}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 20px;font-size:12.5px;color:#b7c2c7}
.keys div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.keys kbd{font-family:var(--f-mono);color:var(--volt);font-size:11.5px;white-space:nowrap}
.go-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.go{background:var(--ally);color:#06201d;border:0;border-radius:4px;padding:12px 24px;font-weight:700;font-size:15px;cursor:pointer;letter-spacing:.03em}
.go:hover{filter:brightness(1.1)}
.go.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--panel2);border-radius:4px;padding:10px;display:grid;gap:2px}
.stats b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stats small{font-size:11px;color:var(--dim)}
.win h1{color:var(--leaf)} .lose h1{color:var(--hostile)}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:11px 13px;font-size:15px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--ally)}
.choice.right{border-color:var(--leaf);background:#12301f}
.choice.wrong{border-color:var(--hostile);background:#331616}
.note{border-radius:4px;padding:10px 12px;font-size:14px;line-height:1.6}
.note.good{background:#12301f;color:#c9f7d8}.note.bad{background:#331616;color:#ffd0d0}

@media (max-width:760px){
  .cols{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.keys{grid-template-columns:1fr}
  .brief{padding:20px 18px}
}
@media (max-width:700px){
  #top{gap:4px 10px;padding-block:5px}
  .brand{font-size:16px}.res small{display:none}.cbar{width:44px}
  #hud{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"mini cmd" "info info";height:auto;gap:8px;padding-block:8px}
  #mini{width:120px;height:80px}
  #cmd{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,26px);gap:3px;justify-self:stretch}
  .cb canvas{width:22px;height:22px}.cb .k{display:none}
  #info{height:64px;padding:6px 10px}
  .iname b{font-size:15px}.itip{font-size:11.5px}
  #objBox{width:min(60%,260px);font-size:11.5px}
  .toast{font-size:12px}#toasts{width:62%}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div id="app">
  <header id="top">
    <div class="brand"><i></i><span>에너지 전선</span></div>
    <div class="res volt" title="전기: 건설과 생산에 쓰는 자원"><b id="rEn">0</b><small>전기 ⚡</small></div>
    <div class="res" id="resRate"><b id="rRate">+0</b><small>/초 · 재생 <span id="rShare">0</span>%</small></div>
    <div class="res" id="resFuel" title="일꾼이 캐 온 화석 연료. 화력 발전소가 태워요"><b id="rFuel">0</b><small>화석 연료</small></div>
    <div class="res" id="resCo2" title="대기 탄소: 100이 되면 패배"><b id="rCo2">0</b><span class="cbar"><i id="co2Bar"></i></span><small>대기 탄소</small></div>
    <div class="res"><b id="rSky">낮</b><small>하늘</small></div>
    <div class="res"><b id="rWind">보통</b><small>바람</small></div>
    <div class="res warn"><b id="rWave">–</b><small>다음 스모그</small></div>
    <span class="spacer"></span>
    <button id="speedBtn" class="tb" type="button">속도 <b>1×</b></button>
    <button id="pauseBtn" class="tb" type="button">일시정지</button>
    <button id="helpBtn" class="tb" type="button">게임 방법</button>
  </header>
  <main id="stage">
    <canvas id="view" aria-label="전장"></canvas>
    <div id="objBox"></div>
    <div id="placeHint" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <button id="boxBtn" class="tb" type="button">끌기: 화면 이동</button>
  </main>
  <footer id="hud">
    <div id="miniWrap"><canvas id="mini" aria-label="미니맵"></canvas></div>
    <div id="info"></div>
    <div id="cmd"></div>
    <div id="ctip" hidden></div>
  </footer>
</div>
<div id="overlay"></div>

<script>
/* ================= 기본 ================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const W=2400,H=1600,DAY=96;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ================= 정의 ================= */
const DEF={
  hq:{n:'에너지 본부',kind:'bld',w:100,h:84,hp:1600,rng:170,dmg:6,cd:.9,
     tip:'마을의 심장이에요. 일꾼이 캐 온 화석 연료를 저장하고 일꾼 로봇을 만들어요. 본부가 무너지면 패배해요.'},
  fossil:{n:'화력 발전소',kind:'bld',w:72,h:62,hp:520,cost:100,time:18,e:'f',key:'F',
     tip:'석탄·석유·천연가스를 태워 물을 끓이고 그 증기로 발전기를 돌려요. 전기를 많이 만들지만 <b>이산화 탄소</b>가 나오고, 연료가 떨어지면 멈춰요.'},
  solar:{n:'태양광 발전소',kind:'bld',w:64,h:48,hp:260,cost:75,time:14,e:'r',key:'S',
     tip:'햇빛을 받은 태양 전지가 전기를 만들어요. <b>밤에는 멈춰요.</b> 햇살 들판에 지으면 더 많이 만들어요.'},
  wind:{n:'풍력 발전기',kind:'bld',w:40,h:40,hp:300,cost:125,time:18,e:'r',zone:'hill',key:'W',
     tip:'바람이 날개를 돌려 전기를 만들어요. <b>바람 언덕</b>에만 지을 수 있고, 바람이 약하면 전기가 줄어요.'},
  hydro:{n:'수력 발전소',kind:'bld',w:66,h:56,hp:620,cost:175,time:24,e:'r',zone:'river',key:'H',
     tip:'높은 곳에서 떨어지는 물의 힘으로 발전기를 돌려요. <b>강 위</b>에만 지을 수 있고, 가뭄이 들면 약해져요.'},
  geo:{n:'지열 발전소',kind:'bld',w:64,h:56,hp:460,cost:200,time:24,e:'r',zone:'hot',key:'G',
     tip:'땅속 깊은 곳의 뜨거운 열로 증기를 만들어 발전해요. <b>온천 지대</b>에만 지을 수 있지만 밤낮, 날씨와 상관없이 일정해요.'},
  bio:{n:'바이오 발전소',kind:'bld',w:56,h:56,hp:360,cost:100,time:16,e:'r',zone:'farm',key:'B',
     tip:'볏짚, 나무 찌꺼기, 가축 분뇨 같은 생물 자원으로 연료를 만들어요. <b>농장</b>에만 지을 수 있고, 이산화 탄소가 아주 조금 나와요.'},
  tree:{n:'나무 심기',kind:'bld',w:26,h:26,hp:120,cost:25,time:8,key:'T',
     tip:'나무는 자라면서 공기 속 <b>이산화 탄소를 흡수</b>해요. 많이 심을수록 대기 탄소가 빨리 줄어요.'},
  tower:{n:'공기 정화탑',kind:'bld',w:40,h:40,hp:420,cost:125,time:16,rng:200,dmg:12,cd:.8,key:'D',
     tip:'다가오는 스모그 괴물에게 맑은 공기 광선을 쏘아 정화해요.'},
  factory:{n:'로봇 공장',kind:'bld',w:84,h:64,hp:720,cost:150,time:22,key:'R',
     tip:'스모그 괴물과 싸우는 정화 드론과 지킴이 로봇을 만들어요.'},
  lab:{n:'에너지 연구소',kind:'bld',w:72,h:60,hp:520,cost:150,time:20,key:'L',
     tip:'새 기술을 연구해요. 연구가 끝날 때 <b>에너지 퀴즈</b>를 맞혀야 기술이 완성돼요.'},
  worker:{n:'일꾼 로봇',kind:'unit',r:10,hp:60,spd:88,cost:50,time:9,
     tip:'화석 연료를 캐 오고 발전소를 지어요. 오른쪽 클릭(터치는 누르기)으로 광맥을 가리키면 캐기 시작해요.'},
  drone:{n:'정화 드론',kind:'unit',r:11,hp:75,spd:98,cost:60,time:11,rng:150,dmg:8,cd:.85,
     tip:'멀리서 맑은 공기 광선을 쏘는 날쌘 드론이에요.'},
  guard:{n:'지킴이 로봇',kind:'unit',r:14,hp:200,spd:70,cost:100,time:15,rng:26,dmg:15,cd:1,
     tip:'튼튼한 몸으로 앞에서 막아 주는 로봇이에요.'},
  smog:{n:'꼬마 스모그',kind:'foe',r:13,hp:45,spd:58,rng:22,dmg:6,cd:1,
     tip:'공기 속 오염 물질이 뭉쳐 생긴 괴물이에요. 대기 탄소가 많을수록 더 많이 몰려와요.'},
  big:{n:'왕 스모그',kind:'foe',r:22,hp:210,spd:40,rng:28,dmg:18,cd:1.3,
     tip:'오염이 아주 심해지면 나타나는 커다란 스모그예요.'},
  coal:{n:'석탄 광맥',kind:'res',w:34,h:26,amt:220,
     tip:'아주 오래전 식물이 땅속에 묻혀 만들어진 화석 연료예요. 캐면 줄어들고 <b>다시 생기지 않아요.</b>'},
  oil:{n:'유전 (석유)',kind:'res',w:46,h:46,amt:500,
     tip:'아주 오래전 바다 생물이 묻혀 만들어진 화석 연료예요. 매장량이 정해져 있어요.'},
  gas:{n:'천연가스전',kind:'res',w:46,h:46,amt:450,
     tip:'땅속에 갇힌 기체 화석 연료예요. 이것도 언젠가 바닥나요.'}
};

/* ================= 지형 ================= */
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function riverDist(x,y){let m=1e9;for(let i=0;i<RIVER.length-1;i++){const a=RIVER[i],b=RIVER[i+1];m=Math.min(m,segDist(x,y,a[0],a[1],b[0],b[1]))}return m}
function inZone(z,x,y){
  if(z==='river') return riverDist(x,y)<26;
  return ZONES.some(Z=>Z.z===z&&(Z.rect?x>=Z.rect[0]&&x<=Z.rect[0]+Z.rect[2]&&y>=Z.rect[1]&&y<=Z.rect[1]+Z.rect[3]:Math.hypot(x-Z.circ[0],y-Z.circ[1])<=Z.circ[2]));
}
const bg=document.createElement('canvas'); bg.width=W; bg.height=H;
(function paintBg(){
  const c=bg.getContext('2d');
  c.fillStyle='#3c6436';c.fillRect(0,0,W,H);
  for(let i=0;i<2600;i++){c.fillStyle=Math.random()<.5?'rgba(80,130,60,.35)':'rgba(30,60,30,.3)';c.beginPath();c.arc(rnd(0,W),rnd(0,H),rnd(4,26),0,7);c.fill()}
  for(const Z of ZONES){
    c.save();c.beginPath();
    if(Z.rect)c.roundRect(Z.rect[0],Z.rect[1],Z.rect[2],Z.rect[3],28);else c.arc(Z.circ[0],Z.circ[1],Z.circ[2],0,7);
    c.clip();
    const [x0,y0,w,h]=Z.rect?Z.rect:[Z.circ[0]-Z.circ[2],Z.circ[1]-Z.circ[2],Z.circ[2]*2,Z.circ[2]*2];
    if(Z.z==='sun'){c.fillStyle='#8f9a3c';c.fillRect(x0,y0,w,h);for(let i=0;i<260;i++){c.fillStyle=Math.random()<.6?'#e8d25a':'#f6efb0';c.beginPath();c.arc(rnd(x0,x0+w),rnd(y0,y0+h),rnd(1.5,3.2),0,7);c.fill()}}
    if(Z.z==='hill'){c.fillStyle='#2f5a2c';c.fillRect(x0,y0,w,h);c.strokeStyle='rgba(150,200,130,.35)';c.lineWidth=2;for(let r=20;r<Z.circ[2];r+=22){c.beginPath();c.ellipse(Z.circ[0],Z.circ[1],r,r*.8,0,0,7);c.stroke()}}
    if(Z.z==='hot'){c.fillStyle='#7d4f3a';c.fillRect(x0,y0,w,h);for(let i=0;i<70;i++){c.fillStyle='rgba(40,20,15,.45)';c.beginPath();c.arc(rnd(x0,x0+w),rnd(y0,y0+h),rnd(3,9),0,7);c.fill()}for(let i=0;i<9;i++){const x=rnd(x0+20,x0+w-20),y=rnd(y0+20,y0+h-20);c.fillStyle='#f09060';c.beginPath();c.arc(x,y,5,0,7);c.fill();c.fillStyle='#ffd0a0';c.beginPath();c.arc(x,y,2,0,7);c.fill()}}
    if(Z.z==='farm'){for(let x=x0;x<x0+w;x+=18){c.fillStyle=((x-x0)/18|0)%2?'#9bbb52':'#86a644';c.fillRect(x,y0,18,h)}for(let i=0;i<40;i++){c.fillStyle='#d9c27a';c.fillRect(rnd(x0,x0+w),rnd(y0,y0+h),6,3)}}
    c.restore();
  }
  // 강
  c.lineCap='round';c.lineJoin='round';
  const path=()=>{c.beginPath();c.moveTo(RIVER[0][0],RIVER[0][1]);for(let i=1;i<RIVER.length;i++)c.lineTo(RIVER[i][0],RIVER[i][1])};
  path();c.strokeStyle='#7b6a45';c.lineWidth=86;c.stroke();
  path();c.strokeStyle='#2f78bf';c.lineWidth=70;c.stroke();
  path();c.strokeStyle='#4f9ad8';c.lineWidth=40;c.stroke();
  for(let i=0;i<160;i++){const k=Math.random()*(RIVER.length-1)|0,t=Math.random(),a=RIVER[k],b=RIVER[k+1];c.strokeStyle='rgba(220,240,255,.5)';c.lineWidth=2;const x=a[0]+(b[0]-a[0])*t+rnd(-22,22),y=a[1]+(b[1]-a[1])*t;c.beginPath();c.moveTo(x-6,y);c.quadraticCurveTo(x,y-4,x+6,y);c.stroke()}
  // 스모그가 나오는 오염 지대
  const g=c.createLinearGradient(W-260,0,W,0);g.addColorStop(0,'rgba(60,50,70,0)');g.addColorStop(1,'rgba(60,50,70,.75)');c.fillStyle=g;c.fillRect(W-260,0,260,H);
})();

/* ================= 상태 ================= */
let G, cam={x:0,y:0,w:800,h:600}, boxMode=false;
function spawn(type,x,y,team){
  const d=DEF[type];
  const e={id:++G.nid,type,x,y,team,alive:true,hp:d.hp||1,maxhp:d.hp||1,cd:0,ord:{t:'idle'},spin:Math.random()*6,ph:Math.random()*6};
  if(d.kind==='unit'||d.kind==='foe'){e.r=d.r}
  if(d.kind==='bld'){e.w=d.w;e.h=d.h;e.built=true;e.prog=1;e.queue=[];e.qp=0;e.out=0}
  if(d.kind==='res'){e.w=d.w;e.h=d.h;e.amt=d.amt;e.max=d.amt}
  G.ents.push(e);return e;
}
function newGame(){
  G={t:0,nid:0,ents:[],energy:300,fuel:60,co2:32,sel:[],speed:1,paused:true,started:false,ended:false,
     wind:1,windT:18,drought:0,droughtT:100,wave:0,waveT:80,winT:0,place:null,research:{},
     stats:{cleaned:0,fuelUsed:0,renE:0,fosE:0,lost:0,maxCo2:32},flags:{},quiz:shuffle(QUIZ.slice()),qi:0,
     parts:[],beams:[],floats:[],pings:[],rate:{ren:0,fos:0,total:0},lastNight:false};
  G.hq=spawn('hq',480,820,'me');
  spawn('fossil',650,955,'me');
  spawn('tower',650,690,'me');
  const coalA=[[0,0],[42,-30],[84,-8],[30,36],[-34,40],[74,40]];
  coalA.forEach(([dx,dy])=>spawn('coal',250+dx,600+dy,'n'));
  coalA.forEach(([dx,dy])=>spawn('coal',1420+dx,260+dy,'n'));
  spawn('oil',700,1300,'n'); spawn('gas',1340,1020,'n');
  for(let i=0;i<4;i++){const w=spawn('worker',420+i*24,920,'me');autoGather(w)}
  centerOn(G.hq.x+120,G.hq.y);
}

/* ================= 수치 ================= */
const cost=t=>Math.round((DEF[t]?.cost||RESEARCH[t]?.cost||0)*(G.research.save?.8:1));
function daylight(){const p=(G.t%DAY)/DAY; if(p<.58)return 1; if(p<.66)return 1-(p-.58)/.08; if(p<.9)return 0; return (p-.9)/.1}
const WIND=[{v:.3,n:'잔잔'},{v:.7,n:'약함'},{v:1,n:'보통'},{v:1.35,n:'강함'}];
function windName(){return (WIND.find(w=>w.v===G.wind)||WIND[2]).n}
function plantOut(e){
  const r=G.research;
  switch(e.type){
    case 'solar':return 2.6*daylight()*(inZone('sun',e.x,e.y)?1.4:1)*(r.solar?1.4:1);
    case 'wind':return 3.6*G.wind*(r.wind?1.4:1);
    case 'hydro':return 4.2*(G.drought>0?.45:1);
    case 'geo':return 3.8;
    case 'bio':return 2.4;
    case 'fossil':return 5;
  }
  return 0;
}
const atkMult=()=>G.research.clean?1.4:1;

/* ================= 명령 ================= */
function edgeDist(a,b){
  if(b.w){const dx=Math.max(Math.abs(a.x-b.x)-b.w/2,0),dy=Math.max(Math.abs(a.y-b.y)-b.h/2,0);return Math.hypot(dx,dy)-(a.r||0)}
  return Math.hypot(a.x-b.x,a.y-b.y)-(a.r||0)-(b.r||0);
}
function nearest(from,pred,maxD=1e9){let best=null,bd=maxD;for(const e of G.ents){if(!e.alive||!pred(e))continue;const d=edgeDist(from,e);if(d<bd){bd=d;best=e}}return best}
function autoGather(w){const r=nearest(w,e=>DEF[e.type].kind==='res');w.ord=r?{t:'gather',res:r,ph:'to'}:{t:'idle'};w.carry=w.carry||0}
function smartCommand(wx,wy){
  const units=G.sel.filter(e=>e.alive&&e.team==='me'&&DEF[e.type].kind==='unit'); if(!units.length) return;
  const tg=pickAt(wx,wy);
  G.pings.push({x:wx,y:wy,t:.5,c:tg&&tg.team==='foe'?'#ff6b6b':'#62e38a'});
  const cols=Math.ceil(Math.sqrt(units.length));
  units.forEach((u,i)=>{
    const d=DEF[u.type];
    if(tg&&tg.team==='foe'&&d.dmg){u.ord={t:'attack',tg,forced:1};return}
    if(u.type==='worker'&&tg&&DEF[tg.type].kind==='res'){u.ord={t:'gather',res:tg,ph:u.carry?'ret':'to'};return}
    if(u.type==='worker'&&tg&&tg.team==='me'&&DEF[tg.type].kind==='bld'&&!tg.built){u.ord={t:'build',b:tg};return}
    const ox=(i%cols-(cols-1)/2)*26,oy=((i/cols|0)-(cols-1)/2)*26;
    u.ord={t:'move',x:clamp(wx+ox,10,W-10),y:clamp(wy+oy,10,H-10)};
  });
}
function train(b,type){
  if(b.queue.length>=5){toast('대기열이 가득 찼어요.','bad');return}
  const c=cost(type); if(G.energy<c){toast('전기가 부족해요. 발전소를 더 지어 보세요.','bad');return}
  G.energy-=c; b.queue.push(type);
}
function startResearch(b,k){
  if(b.rs){toast('이미 연구 중이에요.','bad');return}
  const c=cost(k); if(G.energy<c){toast('전기가 부족해요.','bad');return}
  G.energy-=c; b.rs={k,p:0}; G.research[k]=G.research[k]||0; G.flags['r_'+k]=1;
}
function beginPlace(type){
  if(G.energy<cost(type)){toast('전기가 부족해요. 발전소를 더 지어 보세요.','bad');return}
  G.place={type,x:cam.x+cam.w/2,y:cam.y+cam.h/2}; updPlaceHint();
}
function placeReason(type,x,y){
  const d=DEF[type];
  if(x-d.w/2<8||y-d.h/2<8||x+d.w/2>W-8||y+d.h/2>H-8) return '지도 밖이에요.';
  if(d.zone&&!inZone(d.zone,x,y)) return {hill:'풍력 발전기는 바람 언덕에만 지을 수 있어요.',river:'수력 발전소는 강 위에만 지을 수 있어요.',hot:'지열 발전소는 온천 지대에만 지을 수 있어요.',farm:'바이오 발전소는 농장에만 지을 수 있어요.'}[d.zone];
  if(type!=='hydro'&&riverDist(x,y)<35+Math.min(d.w,d.h)/2) return '강 위에는 수력 발전소만 지을 수 있어요.';
  if(x>W-280) return '오염 지대에는 지을 수 없어요.';
  for(const e of G.ents){ if(!e.alive||!e.w) continue;
    if(Math.abs(e.x-x)<(e.w+d.w)/2+6&&Math.abs(e.y-y)<(e.h+d.h)/2+6) return '다른 건물이나 광맥과 겹쳐요.'; }
  return '';
}
function tryPlace(x,y){
  const p=G.place, why=placeReason(p.type,x,y);
  if(why){toast(why,'bad');return}
  const c=cost(p.type); if(G.energy<c){toast('전기가 부족해요.','bad');G.place=null;updPlaceHint();return}
  G.energy-=c;
  const b=spawn(p.type,x,y,'me'); b.built=false;b.prog=0;b.hp=Math.max(1,b.maxhp*.1);
  let ws=G.sel.filter(e=>e.alive&&e.type==='worker'); const free=ws.filter(e=>e.ord.t!=='build'); if(free.length) ws=free;
  const w=ws.length?ws.reduce((a,e)=>Math.hypot(e.x-x,e.y-y)<Math.hypot(a.x-x,a.y-y)?e:a):nearest(b,e=>e.team==='me'&&e.type==='worker');
  if(w){ if(w.ord.t==='build'){(w.bq=w.bq||[]).push(b);toast(`${DEF[p.type].n}: 지금 짓던 건물을 마친 뒤 지을게요.`,'info')}
         else {w.prev=w.ord.t==='gather'?w.ord.res:null;w.ord={t:'build',b}} }
  if(!(window.event&&window.event.shiftKey)){G.place=null;updPlaceHint()}
}
function demolish(b){
  if(b.type==='hq') return;
  const refund=Math.round(cost(b.type)*(b.built?.25:.75)); G.energy+=refund;
  b.alive=false; boom(b.x,b.y,'#9aa',10);
  toast(`${DEF[b.type].n}을(를) 철거했어요. 전기 ${refund}을(를) 돌려받았어요.`,'info');

function step(dt){
  G.t+=dt;
  // 날씨
  G.windT-=dt; if(G.windT<=0){G.windT=rnd(16,26);const prev=G.wind;G.wind=WIND[Math.random()*WIND.length|0].v;
    if(G.wind!==prev&&has('wind')) toast(G.wind<.5?'바람이 잔잔해져서 풍력 발전이 크게 줄었어요.':G.wind>1?'바람이 세게 불어 풍력 발전이 늘었어요!':`바람: ${windName()}`, G.wind<.5?'bad':'info')}
  if(G.drought>0){G.drought-=dt; if(G.drought<=0&&has('hydro')) toast('비가 내려 강물이 다시 넉넉해졌어요.','good')}
  G.droughtT-=dt; if(G.droughtT<=0){G.droughtT=rnd(80,120); if(Math.random()<.4){G.drought=25; toast('가뭄이에요! 강물이 줄어 수력 발전이 약해졌어요.','bad')}}
  const night=daylight()<.3;
  if(night&&!G.lastNight){toast('밤이 되었어요. 햇빛이 없으면 태양광 발전이 멈춰요!','info')}
  if(!night&&G.lastNight){toast('해가 떴어요. 태양광 발전이 다시 시작돼요.','good')}
  G.lastNight=night;

  // 발전
  let ren=0,fos=0,co2=0,burn=0,trees=0;
  const fossils=[];
  for(const e of G.ents){ if(!e.alive||e.team!=='me'||DEF[e.type].kind!=='bld'||!e.built) continue;
    if(e.type==='tree'){trees++;continue}
    if(e.type==='fossil'){fossils.push(e);burn+=.32;continue}
    const o=plantOut(e); e.out=o; ren+=o; if(e.type==='bio') co2+=.012;
  }
  let ratio=1; if(burn>0){const need=burn*dt; ratio=G.fuel>=need?1:G.fuel/need; G.fuel=Math.max(0,G.fuel-need*ratio); G.stats.fuelUsed+=need*ratio}
  for(const f of fossils){f.out=plantOut(f)*ratio; fos+=f.out; co2+=.13*ratio; f.burning=ratio>0}
  if(burn>0&&ratio<1){ if(!G.flags.nofuel){G.flags.nofuel=1;toast('화석 연료가 떨어져 화력 발전소가 멈췄어요! 일꾼에게 연료를 캐게 하거나 재생에너지로 바꿔요.','bad')} } else G.flags.nofuel=0;
  const absorb=.02+trees*.016*(G.research.forest?2:1);
  G.co2=clamp(G.co2+(co2-absorb)*dt,0,100); G.stats.maxCo2=Math.max(G.stats.maxCo2,G.co2);
  G.energy+= (ren+fos)*dt; G.stats.renE+=ren*dt; G.stats.fosE+=fos*dt;
  G.rate={ren,fos,total:ren+fos,co2,absorb};
  for(const t of [50,75]) if(G.co2>=t&&!G.flags['c'+t]){G.flags['c'+t]=1;toast(t===50?'대기 탄소가 50을 넘었어요. 스모그 괴물이 더 많이 몰려와요!':'대기 탄소가 75를 넘었어요! 왕 스모그가 나타나기 시작해요.','bad')}
  for(const t of [50,75]) if(G.co2<t-8) G.flags['c'+t]=0;

  // 습격
  G.waveT-=dt; if(G.waveT<=0){spawnWave(); G.waveT=Math.max(40,62-G.wave*1.5)}

  // 개체
  for(const e of G.ents){ if(!e.alive) continue; const k=DEF[e.type].kind;
    if(k==='bld') updBld(e,dt); else if(k==='unit') updUnit(e,dt); else if(k==='foe') updFoe(e,dt); }
  collide();
  // 효과
  for(const f of fossils) if(f.burning&&Math.random()<dt*5) G.parts.push({x:f.x-16+(Math.random()<.5?0:22),y:f.y-f.h/2-22,vx:rnd(-6,6),vy:rnd(-26,-16),life:2.2,max:2.2,r:rnd(5,8),c:G.co2>60?'#5c5466':'#8c8796',grow:1});
  for(const e of G.ents) if(e.alive&&e.type==='geo'&&e.built&&Math.random()<dt*3) G.parts.push({x:e.x+rnd(-14,14),y:e.y-e.h/2-6,vx:rnd(-4,4),vy:rnd(-22,-12),life:1.6,max:1.6,r:rnd(4,7),c:'#f2f6f8',grow:1});
  G.parts=G.parts.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.grow)p.r+=dt*4;return p.life>0});
  G.beams=G.beams.filter(b=>(b.t-=dt)>0);
  G.floats=G.floats.filter(f=>{f.t-=dt;f.y-=20*dt;return f.t>0});
  G.pings=G.pings.filter(p=>(p.t-=dt)>0);
  // 정리
  const before=G.sel.length; G.ents=G.ents.filter(e=>e.alive); G.sel=G.sel.filter(e=>e.alive); if(G.sel.length!==before) dirty=true;
  checkEnd(dt);
}
function has(t){return G.ents.some(e=>e.alive&&e.team==='me'&&e.type===t&&e.built)}

function spawnWave(){
  G.wave++; const n=G.wave;
  const small=1+Math.floor(n*.6)+Math.floor(G.co2/25);
  const big=(n>=4?Math.floor((n-2)/2):0)+(G.co2>=75?2:0);
  const sp=SPAWNS[Math.random()*SPAWNS.length|0]; const mult=1+G.co2/150+n*.02;
  for(let i=0;i<small;i++){const e=spawn('smog',sp.x+rnd(-50,50),sp.y+rnd(-70,70),'foe');e.hp=e.maxhp=Math.round(40*mult)}
  for(let i=0;i<big;i++){const e=spawn('big',sp.x+rnd(-40,40),sp.y+rnd(-50,50),'foe');e.hp=e.maxhp=Math.round(210*mult)}
  toast(`${n}번째 습격! 스모그 괴물 ${small+big}마리가 몰려와요.${G.co2>=50?' (대기 탄소가 많아 더 많아졌어요)':''}`,'bad');
  G.pings.push({x:sp.x,y:sp.y,t:2,c:'#ff6b6b',big:1});
}

function updBld(b,dt){
  const d=DEF[b.type];
  if(b.type==='wind'&&b.built) b.spin+=dt*G.wind*3.2;
  if(!b.built) return;
  if(b.queue&&b.queue.length){
    const t=b.queue[0]; b.qp+=dt/DEF[t].time;
    if(b.qp>=1){b.qp=0;b.queue.shift();
      const u=spawn(t,b.x+rnd(-20,20),b.y+b.h/2+18,'me');
      if(t==='worker') autoGather(u); else u.ord={t:'move',x:b.x+rnd(-40,40),y:b.y+b.h/2+50};
      toast(`${DEF[t].n} 준비 완료!`,'good');}
  }
  if(b.rs&&!G.quizOpen){ b.rs.p+=dt/18; if(b.rs.p>=1){ b.rs.p=1; openQuiz(b) } }
  if(d.dmg){ b.cd-=dt; if(b.cd<=0){ const f=nearest(b,e=>e.team==='foe',d.rng); if(f){fire(b,f,d.dmg*atkMult());b.cd=d.cd} } }
}
function fire(src,tg,dmg){
  G.beams.push({x1:src.x,y1:src.y-(src.w?src.h/2+10:4),x2:tg.x,y2:tg.y,t:.14,c:'#9ff7e8'});
  hit(tg,dmg);
}
function hit(tg,dmg){
  tg.hp-=dmg; tg.flash=.12;
  if(tg.hp<=0&&tg.alive){tg.alive=false;
    if(tg.team==='foe'){G.stats.cleaned++; for(let i=0;i<10;i++)G.parts.push({x:tg.x,y:tg.y,vx:rnd(-50,50),vy:rnd(-60,20),life:.8,max:.8,r:rnd(2,4),c:'#9ff7b8'}); G.floats.push({x:tg.x,y:tg.y-10,t:1,s:'정화!'})}
    else { G.stats.lost++; boom(tg.x,tg.y,'#ffb547',14); if(DEF[tg.type].kind==='bld') toast(`${DEF[tg.type].n}이(가) 스모그에 무너졌어요!`,'bad'); }
  }
}
function boom(x,y,c,n){for(let i=0;i<n;i++)G.parts.push({x,y,vx:rnd(-80,80),vy:rnd(-80,80),life:.6,max:.6,r:rnd(3,6),c})}

function moveToward(u,tx,ty,spd,dt,ignore){
  let dx=tx-u.x,dy=ty-u.y; const L=Math.hypot(dx,dy); if(L<1) return true;
  dx/=L;dy/=L; const step=Math.min(L,spd*dt);
  const blocked=(x,y)=>G.ents.some(e=>e.alive&&e.w&&e!==ignore&&Math.abs(e.x-x)<e.w/2+u.r&&Math.abs(e.y-y)<e.h/2+u.r);
  const ahead=14+u.r;
  if(blocked(u.x+dx*ahead,u.y+dy*ahead)){
    const side=u.side||1;
    for(const a of [.8,1.4,-.8,-1.4].map(v=>v*side)){const c=Math.cos(a),s=Math.sin(a),nx=dx*c-dy*s,ny=dx*s+dy*c; if(!blocked(u.x+nx*ahead,u.y+ny*ahead)){dx=nx;dy=ny;break}}
    u.sideT=(u.sideT||0)+dt; if(u.sideT>1.4){u.side=-(u.side||1);u.sideT=0}
  }
  u.x+=dx*step;u.y+=dy*step;u.ang=Math.atan2(dy,dx);
  return L<=spd*dt;
}
function updUnit(u,dt){
  const d=DEF[u.type]; u.cd=Math.max(0,u.cd-dt); if(u.flash)u.flash-=dt;
  const o=u.ord;
  if(d.dmg){
    if(o.t==='attack'&&!o.tg.alive) u.ord={t:'idle'};
    if(u.ord.t==='idle'){const f=nearest(u,e=>e.team==='foe',d.rng+110)||nearest(u,e=>e.team==='foe'&&e.tg&&e.tg.team==='me'&&edgeDist(e,e.tg)<60,520);if(f)u.ord={t:'attack',tg:f}}
    if(u.ord.t==='attack'){const tg=u.ord.tg; if(edgeDist(u,tg)>d.rng) moveToward(u,tg.x,tg.y,d.spd,dt,tg); else if(u.cd<=0){fire(u,tg,d.dmg*atkMult());u.cd=d.cd} return}
  }
  if(o.t==='move'){ if(moveToward(u,o.x,o.y,d.spd,dt)) u.ord={t:'idle'}; return }
  if(u.type!=='worker') return;
  if(o.t==='build'){
    const b=o.b; if(!b.alive||b.built){
      while(u.bq&&u.bq.length){const n=u.bq.shift();if(n.alive&&!n.built){u.ord={t:'build',b:n};return}}
      u.ord=u.prev&&u.prev.alive?{t:'gather',res:u.prev,ph:u.carry?'ret':'to'}:{t:'idle'};return}
    if(edgeDist(u,b)>6){moveToward(u,b.x,b.y,d.spd,dt,b);return}
    b.prog+=dt/DEF[b.type].time; b.hp=Math.min(b.maxhp,b.hp+b.maxhp*.9*dt/DEF[b.type].time); u.work=(u.work||0)+dt;
    if(b.prog>=1){b.prog=1;b.built=true;b.hp=Math.max(b.hp,b.maxhp*.95);toast(`${DEF[b.type].n} 완성!`,'good');buildTips(b);dirty=true}
    return;
  }
  if(o.t==='gather'){
    if(o.ph==='ret'){ const hq=G.hq; if(!hq.alive){u.ord={t:'idle'};return}
      if(edgeDist(u,hq)>5){moveToward(u,hq.x,hq.y,d.spd,dt,hq);return}
      G.fuel+=u.carry; u.carry=0; o.ph='to';
      if(!o.res.alive){const r=nearest(u,e=>e.type===o.res.type,500)||nearest(u,e=>DEF[e.type].kind==='res',700); if(r)o.res=r; else {u.ord={t:'idle'};toast('주변의 화석 연료가 모두 바닥났어요.','bad')}}
      return }
    const r=o.res;
    if(!r.alive){const n=nearest(u,e=>e.type===r.type,500)||nearest(u,e=>DEF[e.type].kind==='res',700); if(n){o.res=n;return} u.ord={t:'idle'};return}
    if(o.ph==='to'){ if(edgeDist(u,r)>5){moveToward(u,r.x,r.y,d.spd,dt,r);return} o.ph='mine'; u.mt=1.7; return }
    if(o.ph==='mine'){ u.mt-=dt; if(u.mt<=0){ const take=Math.min(8,r.amt); r.amt-=take; u.carry=take; o.ph='ret';
        if(r.amt<=0){r.alive=false; toast(`${DEF[r.type].n} 하나가 바닥났어요. 화석 연료는 다시 생기지 않아요!`,'bad')} } }
  }
}
function updFoe(u,dt){
  const d=DEF[u.type]; u.cd=Math.max(0,u.cd-dt); u.rt=(u.rt||0)-dt; if(u.flash)u.flash-=dt;
  if(!u.tg||!u.tg.alive||u.rt<=0){u.rt=1.2;
    const near=nearest(u,e=>e.team==='me'&&DEF[e.type].kind==='unit',70);
    u.tg=near||nearest(u,e=>e.team==='me'&&DEF[e.type].kind==='bld')}
  if(!u.tg) return;
  if(edgeDist(u,u.tg)>d.rng){moveToward(u,u.tg.x,u.tg.y,d.spd,dt,u.tg)}
  else if(u.cd<=0){u.cd=d.cd;hit(u.tg,d.dmg);for(let i=0;i<4;i++)G.parts.push({x:u.tg.x+rnd(-10,10),y:u.tg.y+rnd(-10,10),vx:rnd(-20,20),vy:rnd(-30,0),life:.7,max:.7,r:rnd(4,7),c:'#6a5f78',grow:1})}
}
function collide(){
  const us=G.ents.filter(e=>e.alive&&e.r);
  for(let i=0;i<us.length;i++)for(let j=i+1;j<us.length;j++){const a=us[i],b=us[j];const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r-2,d=Math.hypot(dx,dy);
    if(d<m&&d>0.01){const p=(m-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p}else if(d<=0.01){a.x+=rnd(-1,1)}}
  for(const u of us){
    for(const e of G.ents){ if(!e.alive||!e.w) continue;
      const hx=e.w/2+u.r-1,hy=e.h/2+u.r-1,dx=u.x-e.x,dy=u.y-e.y;
      if(Math.abs(dx)<hx&&Math.abs(dy)<hy){const px=hx-Math.abs(dx),py=hy-Math.abs(dy); if(px<py)u.x+=Math.sign(dx||1)*px; else u.y+=Math.sign(dy||1)*py}}
    u.x=clamp(u.x,6,W-6);u.y=clamp(u.y,6,H-6);
  }
}
function buildTips(b){

    wind:'풍력은 바람 세기에 따라 전기 양이 달라져요. 위쪽 ‘바람’을 확인해 보세요.',
    geo:'지열은 밤낮과 날씨에 상관없이 늘 일정하게 전기를 만들어요.',

function checkEnd(dt){
  if(G.ended) return;
  if(!G.hq.alive) return endGame('hq');
  if(G.co2>=100) return endGame('heat');
  const r=G.rate, share=r.total>0?r.ren/r.total:0;
  G.ok={power:r.total>=15,share:share>=.9,co2:G.co2<=25};
  if(G.ok.power&&G.ok.share&&G.ok.co2) G.winT+=dt; else G.winT=0;
  if(G.winT>=30) endGame('win');
}

function rr(c,x,y,w,h,r,f,s,lw){c.beginPath();c.roundRect(x,y,w,h,r);if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=lw||2;c.stroke()}}
function circ(c,x,y,r,f,s,lw){c.beginPath();c.arc(x,y,r,0,Math.PI*2);if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=lw||2;c.stroke()}}

  case 'solar':
    c.fillStyle='#55626d';c.fillRect(-w/2+6,h/2-6,4,6);c.fillRect(w/2-10,h/2-6,4,6);
    for(let j=0;j<2;j++)for(let i=0;i<3;i++){const x=-w/2+2+i*21,y=-h/2+2+j*21;
      c.beginPath();c.moveTo(x+4,y);c.lineTo(x+20,y);c.lineTo(x+16,y+19);c.lineTo(x,y+19);c.closePath();c.fillStyle='#24508f';c.fill();c.strokeStyle='#9cc8f2';c.lineWidth=1;c.stroke();
      c.beginPath();c.moveTo(x+12,y);c.lineTo(x+8,y+19);c.moveTo(x+2,y+9.5);c.lineTo(x+18,y+9.5);c.stroke()}

  // 밤, 매연

  const dark=(1-daylight())*.5; if(dark>0){c.fillStyle=`rgba(10,18,60,${dark})`;c.fillRect(0,0,vw,vh)}

}

let dirty=true, slotCache=[];
function slots(){
  const s=G.sel.filter(e=>e.alive&&e.team==='me'); if(!s.length) return [];
  const out=[];
  if(s.some(e=>e.type==='worker')){
    for(const t of BUILD_LIST){const d=DEF[t];out.push({k:d.key,ic:t,n:d.n+' 짓기',c:cost(t),tip:d.tip,dis:G.energy<cost(t),fn:()=>beginPlace(t)})}
    out.push({k:'C',txt:'캐기',n:'화석 연료 캐기',tip:'가까운 광맥으로 가서 화석 연료를 캐요.',fn:()=>s.filter(e=>e.type==='worker').forEach(autoGather)});
    out.push({k:'X',txt:'■',n:'정지',tip:'하던 일을 멈춰요.',fn:()=>s.forEach(e=>e.ord={t:'idle'})});
    return out;
  }
  if(s.every(e=>DEF[e.type].kind==='unit')) return [{k:'X',txt:'■',n:'정지',tip:'하던 일을 멈춰요. 가까이 온 스모그와는 알아서 싸워요.',fn:()=>s.forEach(e=>e.ord={t:'idle'})}];
  const b=s[0]; if(!b.built) return [{k:'X',txt:'✕',n:'건설 취소',tip:'짓던 건물을 취소하고 전기의 75%를 돌려받아요.',fn:()=>demolish(b)}];
  if(b.type==='hq') out.push({k:'Q',ic:'worker',n:'일꾼 로봇 만들기',c:cost('worker'),tip:DEF.worker.tip,dis:G.energy<cost('worker'),fn:()=>train(b,'worker')});
  if(b.type==='factory'){out.push({k:'Q',ic:'drone',n:'정화 드론 만들기',c:cost('drone'),tip:DEF.drone.tip,dis:G.energy<cost('drone'),fn:()=>train(b,'drone')});
    out.push({k:'W',ic:'guard',n:'지킴이 로봇 만들기',c:cost('guard'),tip:DEF.guard.tip,dis:G.energy<cost('guard'),fn:()=>train(b,'guard')})}
  if(b.type==='lab') for(const k in RESEARCH){const r=RESEARCH[k];if(G.research[k]===true)continue;
    out.push({k:r.key,txt:{solar:'☀',wind:'≋',save:'↓',clean:'✦',forest:'♣'}[k],n:r.n,c:cost(k),tip:r.d+'<br><span class="h">연구가 끝나면 에너지 퀴즈를 맞혀야 완성돼요.</span>',dis:G.energy<cost(k)||!!b.rs||G.research[k]===0&&Object.values(G.ents).some(x=>x.rs&&x.rs.k===k),fn:()=>startResearch(b,k)})}
  if(b.type!=='hq') {while(out.length<11)out.push(null);out.push({k:'X',txt:'✕',n:'철거하기',tip:'건물을 없애고 전기의 25%를 돌려받아요. 화력 발전소를 철거하면 대기 탄소를 줄일 수 있어요.',fn:()=>demolish(b),danger:1})}
  return out;
}
function renderCmd(){
  const sl=slots(); slotCache=sl; const cmd=$('cmd'); cmd.innerHTML='';
  for(let i=0;i<12;i++){const s=sl[i];const b=document.createElement('button');b.type='button';b.className='cb'+(s?'':' empty');
    if(s){b.innerHTML=`<canvas width="60" height="60"></canvas><span class="k">${s.k}</span>`;b.disabled=!!s.dis;b.setAttribute('aria-label',s.n);
      s.ic?paintIcon(b.firstChild,s.ic):paintText(b.firstChild,s.txt,s.danger?'#ff9a9a':'#dbe3e6');
      b.addEventListener('click',()=>{s.fn();dirty=true;});
      const show=()=>{const tp=$('ctip');tp.hidden=false;tp.innerHTML=`<b>${s.n}</b> <span class="c">${s.c!=null?'⚡'+s.c:''}</span> <span class="c">[${s.k}]</span><br>${s.tip||''}`};
      b.addEventListener('pointerenter',show);b.addEventListener('focus',show);
      b.addEventListener('pointerleave',()=>$('ctip').hidden=true);b.addEventListener('blur',()=>$('ctip').hidden=true);}
    else b.disabled=true;
    cmd.appendChild(b)}
}

  if(e.type==='tree'&&e.built) st.push(`이산화 탄소 흡수 <b>${(0.016*(G.research.forest?2:1)*60).toFixed(1)}</b>/분`);
  if(e.type==='worker') st.push(e.ord.t==='gather'?(e.ord.ph==='ret'?'연료 나르는 중':'화석 연료 캐는 중'):e.ord.t==='build'?'건설 중':e.ord.t==='move'?'이동 중':'쉬는 중');
  if(d.dmg) st.push(`공격 <b>${Math.round(d.dmg*(e.team==='me'?atkMult():1))}</b>`);

const ptr={down:false};
function toWorld(px,py){return {x:px+cam.x,y:py+cam.y}}
function pickAt(x,y){
  let best=null,bd=1e9;
  for(const e of G.ents){if(!e.alive)continue;
    if(e.r){const d=Math.hypot(e.x-x,e.y-y);if(d<e.r+6&&d<bd){bd=d;best=e}}
    else if(Math.abs(e.x-x)<e.w/2+4&&Math.abs(e.y-y)<e.h/2+4+(e.type==='wind'?40:0)&&(!best||!best.r)){const d=Math.hypot(e.x-x,e.y-y);if(d<bd+40){bd=d;best=e}}}
  return best;
}
function setSel(arr){G.sel=arr;dirty=true}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',ev=>{
  if(!G.started||G.paused&&!G.userPaused) return;
  const r=cv.getBoundingClientRect(),px=ev.clientX-r.left,py=ev.clientY-r.top,w=toWorld(px,py);
  if(G.place){ if(ev.button===2){G.place=null;updPlaceHint();return} G.place.x=w.x;G.place.y=w.y; if(ev.pointerType==='mouse'){tryPlace(w.x,w.y);return} ptr.placeTouch=true; }
  if(ev.button===2){smartCommand(w.x,w.y);return}
  cv.setPointerCapture(ev.pointerId);
  Object.assign(ptr,{down:true,sx:px,sy:py,x:px,y:py,moved:false,box:false,type:ev.pointerType,shift:ev.shiftKey,lx:px,ly:py});
});
cv.addEventListener('pointermove',ev=>{
  const r=cv.getBoundingClientRect(),px=ev.clientX-r.left,py=ev.clientY-r.top;
  mouse.x=px;mouse.y=py;mouse.in=ev.pointerType==='mouse';
  if(G.place&&(ev.pointerType==='mouse'||ptr.placeTouch&&ptr.down)){const w=toWorld(px,py);G.place.x=w.x;G.place.y=w.y;if(ptr.placeTouch)return}
  if(!ptr.down) return;
  if(Math.hypot(px-ptr.sx,py-ptr.sy)>8) ptr.moved=true;
  if(!ptr.moved) return;
  if(ptr.type==='mouse'||boxMode){ptr.box=true;ptr.x=px;ptr.y=py}
  else {cam.x-=px-ptr.lx;cam.y-=py-ptr.ly;clampCam()}
  ptr.lx=px;ptr.ly=py;
});
cv.addEventListener('pointerleave',()=>mouse.in=false);
cv.addEventListener('pointerup',ev=>{
  if(ptr.placeTouch){ptr.placeTouch=false;ptr.down=false;if(G.place)tryPlace(G.place.x,G.place.y);return}
  if(!ptr.down) return; ptr.down=false;
  const r=cv.getBoundingClientRect(),px=ev.clientX-r.left,py=ev.clientY-r.top;
  if(ptr.box){
    const a=toWorld(Math.min(ptr.sx,px),Math.min(ptr.sy,py)),b=toWorld(Math.max(ptr.sx,px),Math.max(ptr.sy,py));
    const got=G.ents.filter(e=>e.alive&&e.team==='me'&&e.r&&e.x>=a.x&&e.x<=b.x&&e.y>=a.y&&e.y<=b.y);
    if(got.length) setSel(ptr.shift?[...new Set([...G.sel,...got])]:got);
    ptr.box=false; return;
  }
  if(ptr.moved) return;
  const w=toWorld(px,py), e=pickAt(w.x,w.y);
  const myUnits=G.sel.some(x=>x.alive&&x.team==='me'&&x.r);
  if(ptr.type!=='mouse'&&myUnits&&(!e||e.team!=='me'||(e.team==='me'&&DEF[e.type].kind==='bld'&&!e.built&&G.sel.some(x=>x.type==='worker')))){smartCommand(w.x,w.y);return}
  if(e){ if(ptr.shift&&e.team==='me'&&e.r) setSel(G.sel.includes(e)?G.sel.filter(x=>x!==e):[...G.sel,e]); else setSel([e]); }
  else setSel([]);
});
cv.addEventListener('wheel',ev=>{ev.preventDefault();cam.x+=ev.deltaX||0;cam.y+=ev.deltaY;clampCam()},{passive:false});
const mouse={x:0,y:0,in:false};
function miniTo(ev){const r=mini.getBoundingClientRect();centerOn((ev.clientX-r.left)/r.width*W,(ev.clientY-r.top)/r.height*H)}
mini.addEventListener('pointerdown',ev=>{if(!G.started)return;if(ev.button===2){const r=mini.getBoundingClientRect();smartCommand((ev.clientX-r.left)/r.width*W,(ev.clientY-r.top)/r.height*H);return}mini.setPointerCapture(ev.pointerId);miniTo(ev);mini.dragging=true});

const keys={};
window.addEventListener('keydown',ev=>{
  if(!G||!G.started) {if(ev.key==='Enter'&&$('goBtn')){ev.preventDefault();$('goBtn').click()}return}

  keys[ev.key]=true;

  if(ev.key==='p'||ev.key==='P'){togglePause();return}

  $('goBtn').onclick=()=>{hideOv();G.started=true;G.paused=false;dirty=true;
    toast('작전 시작! 일꾼 로봇을 선택해 재생에너지 발전소를 지어 보세요.','good')};
  $('howBtn').onclick=()=>showHelp(false);
}

function openQuiz(lab){
  G.quizOpen=true; G.paused=true;
  const q=G.quiz[G.qi++%G.quiz.length], r=RESEARCH[lab.rs.k];
  showOv(`<div class="brief"><div class="eyebrow">연구 완성 퀴즈 · ${r.n}</div><h2>${q.q}</h2>
    <div class="choices">${q.a.map((a,i)=>`<button class="choice" type="button" data-i="${i}">${a}</button>`).join('')}</div><div id="qres"></div></div>`);
  ov.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.i===q.c;
    ov.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(+x.dataset.i===q.c)x.classList.add('right')}); if(!ok)b.classList.add('wrong');
    $('qres').innerHTML=`<div class="note ${ok?'good':'bad'}"><b>${ok?'정답! '+r.n+' 완성':'아쉬워요. 조금 더 연구한 뒤 다시 도전해요'}</b><br>${q.e}</div>
      <div class="go-bar" style="margin-top:12px"><button class="go" id="qGo" type="button">작전으로 돌아가기</button></div>`;
    if(ok){G.research[lab.rs.k]=true;lab.rs=null;toast(`연구 완료: ${r.n} (${r.d})`,'good')} else {lab.rs.p=.5}
    $('qGo').onclick=()=>{hideOv();G.quizOpen=false;G.paused=!!G.userPaused;dirty=true};$('qGo').focus();
  });
}
function endGame(kind){
  G.ended=true;G.paused=true;
  const win=kind==='win', mm=Math.floor(G.t/60), ss=Math.floor(G.t%60);
  const tot=G.stats.renE+G.stats.fosE, share=tot?Math.round(G.stats.renE/tot*100):0;
  const title=win?'탄소 중립 달성!':kind==='hq'?'본부가 무너졌어요':'지구가 너무 뜨거워졌어요';
  const msg=win?'화석 연료 대신 재생에너지로 마을을 밝히고, 나무로 이산화 탄소를 줄여 탄소 중립을 이뤘어요.'
    :kind==='hq'?'스모그 괴물을 막지 못했어요. 정화탑과 로봇을 일찍 준비해 보세요. 대기 탄소가 낮으면 괴물도 줄어요.'
    :'화석 연료를 너무 많이 태워 대기 탄소가 100이 되었어요. 재생에너지로 일찍 바꾸고 나무를 심어 보세요.';
  showOv(`<div class="brief ${win?'win':'lose'}"><div class="eyebrow">작전 결과</div><h1>${title}</h1><p>${msg}</p>
    <div class="stats"><div><b>${mm}:${String(ss).padStart(2,'0')}</b><small>작전 시간</small></div><div><b>${G.stats.cleaned}</b><small>정화한 스모그</small></div>
      <div><b>${share}%</b><small>전체 전기 중 재생에너지</small></div><div><b>${Math.round(G.stats.fuelUsed)}</b><small>태운 화석 연료</small></div></div>
    <div class="box"><h3>오늘 배운 것</h3><ul>
      <li>석탄·석유·천연가스는 매장량이 정해진 <b>유한한 자원</b>이라 캐면 바닥나요.</li>
      <li>화석 연료를 태우면 <b>이산화 탄소</b>가 나와 지구 온난화를 일으켜요.</li>
      <li>햇빛·바람·물·지열·바이오 같은 <b>재생에너지</b>는 다시 채워지지만, 알맞은 장소가 필요하고 밤낮과 날씨에 따라 양이 달라져요.</li>
      <li>여러 에너지를 함께 쓰고, 나무를 심고, 전기를 아끼면 <b>탄소 중립</b>에 다가갈 수 있어요.</li></ul></div>
    <div class="go-bar"><button class="go" id="againBtn" type="button">다시 도전하기</button></div></div>`);
  $('againBtn').onclick=()=>{newGame();showStart();dirty=true};
}

/* ================= 루프 ================= */
let last=performance.now(),uiT=0;
function frame(now){
  const rdt=Math.min(.05,(now-last)/1000); last=now;
  if(G.started&&!G.paused&&!G.ended){let s=rdt*G.speed;while(s>0){const d=Math.min(.05,s);step(d);s-=d}}
  if(G.started&&!G.ended&&ov.hidden){
    const sp=700*rdt;
    if(keys.ArrowLeft)cam.x-=sp;if(keys.ArrowRight)cam.x+=sp;if(keys.ArrowUp)cam.y-=sp;if(keys.ArrowDown)cam.y+=sp;
    if(mouse.in&&!ptr.down){if(mouse.x<10)cam.x-=sp;if(mouse.x>vw-10)cam.x+=sp;if(mouse.y<10)cam.y-=sp;if(mouse.y>vh-10)cam.y+=sp}
    clampCam();
  }
  draw(now/1000);drawMini();
  uiT-=rdt; if(uiT<=0||dirty){uiT=.2;renderTop();renderObj();renderInfo();if(dirty){renderCmd();dirty=false}else refreshCmd()}
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
newGame(); resize(); centerOn(G.hq.x+120,G.hq.y); showStart(); requestAnimationFrame(frame);
</script>
