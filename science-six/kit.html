<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>__TITLE__</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--y:#ffd43b;--k:#111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Jua,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.chip{background:rgba(17,17,17,.72);border:2px solid #111;border-radius:14px;padding:6px 12px;font-size:15px;line-height:1.3;box-shadow:0 3px 0 rgba(0,0,0,.4)}
#obj{max-width:62vw}#obj b{color:var(--y)}
#stat{text-align:right;white-space:nowrap}
#bar{position:fixed;left:50%;transform:translateX(-50%);top:64px;width:min(420px,70vw);height:14px;background:rgba(0,0,0,.5);border:2px solid #111;border-radius:10px;overflow:hidden;z-index:5;display:none}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69db7c,#ffd43b)}
#toast{width:max-content;max-width:92vw;white-space:normal!important;line-height:1.25;position:fixed;left:50%;top:26%;transform:translateX(-50%);font-family:'Black Han Sans',sans-serif;font-size:clamp(24px,6vw,44px);text-shadow:0 3px 0 #111,0 0 12px rgba(0,0,0,.6);-webkit-text-stroke:1.5px #111;pointer-events:none;z-index:6;opacity:0;transition:opacity .25s;text-align:center;white-space:nowrap}
#help{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font-size:13px;background:rgba(0,0,0,.55);padding:5px 12px;border-radius:10px;z-index:5;pointer-events:none;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis}
#cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #111;z-index:5;display:none;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7;transition:opacity .3s}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,10,20,.78);z-index:20;padding:14px;overflow:auto}
.ov.on{display:flex}
.card{background:#fffdf5;color:#222;border:4px solid #111;border-radius:22px;box-shadow:0 8px 0 #111;padding:20px 20px 18px;width:min(560px,100%);text-align:center;max-height:96vh;overflow:auto}
.card h1{font-family:'Black Han Sans',sans-serif;font-size:clamp(28px,7vw,44px);margin:4px 0;color:#111;line-height:1.1}
.card h3{margin:6px 0;font-size:20px}
.sub{color:#c92a2a;font-size:17px;margin-bottom:6px}
.badge{display:inline-block;background:#1c7ed6;color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;margin:2px}
.badge.age{background:#f08c00}
.facts{text-align:left;background:#fff3bf;border:3px solid #111;border-radius:14px;padding:10px 14px;margin:10px 0;font-size:15.5px;line-height:1.5}
.facts b{color:#c92a2a}
.small{font-size:13.5px;color:#555;line-height:1.5}
.btn{display:block;width:100%;margin-top:10px;padding:13px;border:3px solid #111;border-radius:14px;background:var(--y);font:20px 'Black Han Sans',Jua,sans-serif;color:#111;box-shadow:0 5px 0 #111;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #111}
.opt{display:block;width:100%;margin-top:8px;padding:11px 12px;border:3px solid #111;border-radius:12px;background:#fff;font:16px Jua,sans-serif;color:#111;text-align:left;cursor:pointer}
.opt.ok{background:#b2f2bb}.opt.no{background:#ffc9c9}
#qEx{display:none;margin-top:10px;background:#e7f5ff;border:3px solid #111;border-radius:12px;padding:10px;font-size:15px;text-align:left;line-height:1.5}
#touch{position:fixed;inset:0;z-index:4;display:none;pointer-events:none}
#joy{position:absolute;left:22px;bottom:26px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.5);pointer-events:auto}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(255,255,255,.75)}
#btns{position:absolute;right:16px;bottom:24px;display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
#btns button{width:70px;height:70px;border-radius:50%;border:3px solid #111;background:var(--y);font:13px Jua,sans-serif;color:#111;box-shadow:0 4px 0 #111;line-height:1.15}
#btns button b{display:block;font-size:24px}
@media(max-width:640px){.chip{font-size:12.5px;padding:5px 9px}#help{display:none}#bar{top:auto;bottom:158px;width:56vw}#board{top:96px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud"><div class="chip" id="obj"></div><div class="chip" id="stat"></div></div>
<div id="bar"><i></i></div>
<div class="chip" id="board" style="position:fixed;right:12px;top:74px;z-index:5;font-size:13px;display:none;pointer-events:none;text-align:right"></div>
<div id="toast"></div><div id="cross"></div><div id="flash"></div>
<div id="help"></div>
<div id="touch"><div id="joy"><i></i></div><div id="btns"></div></div>

<div class="ov on" id="ovStart"><div class="card">
  <div style="font-size:52px;line-height:1" id="sEmo"></div>
  <h1 id="sTitle"></h1><div class="sub" id="sSub"></div>
  <div><span class="badge" id="sUnit"></span><span class="badge age">12세 이용가</span></div>
  <div class="facts" id="sFacts"></div>
  <div class="small" id="sHow"></div>
  <div id="mp" style="margin-top:10px;border-top:2px dashed #bbb;padding-top:10px">
    <input id="nick" maxlength="8" placeholder="닉네임" style="width:100%;padding:10px;border:3px solid #111;border-radius:12px;font:17px Jua,sans-serif;text-align:center">
    <button class="btn" id="bStart">혼자 하기 ▶</button>
    <div style="display:grid;grid-template-columns:1fr 92px 1fr;gap:8px"><button class="btn" id="bHost" style="background:#8ce99a;font-size:16px;padding:13px 4px">👥 방 만들기</button><input id="code" inputmode="numeric" maxlength="4" placeholder="방 번호" style="min-width:0;width:100%;margin-top:10px;border:3px solid #111;border-radius:14px;font:18px 'Black Han Sans',sans-serif;text-align:center;padding:0"><button class="btn" id="bJoin" style="background:#a5d8ff;font-size:16px;padding:13px 4px">🚪 들어가기</button></div>
    <div class="small" id="mpMsg" style="margin-top:6px;min-height:18px"></div>
  </div>
</div></div>
<div class="ov" id="ovQuiz"><div class="card">
  <h3>🔬 과학 퀴즈</h3><div id="qQ" style="font-size:18px;margin:8px 0;line-height:1.45"></div>
  <div id="qOpts"></div><div id="qEx"></div>
  <button class="btn" id="qNext" style="display:none">계속하기 ▶</button>
</div></div>
<div class="ov" id="ovEnd"><div class="card">
  <div style="font-size:52px;line-height:1" id="eEmo"></div>
  <h1 id="eTitle"></h1><div class="sub" id="eMsg"></div>
  <div class="facts" id="eFacts"></div>
  <button class="btn" id="bRetry">다시 하기 🔁</button>
</div></div>

/* ===== 같이 하기 (방 번호 4자리 · 방장이 중계) ===== */
const NCOL = ['#ff6b6b', '#4dabf7', '#51cf66', '#fcc419', '#b197fc', '#ff922b', '#22b8cf', '#f783ac'];
const NET = {
  on: false, host: false, id: Math.random().toString(36).slice(2, 8), name: '', col: pick(NCOL), code: '', peer: null, conns: [], hc: null, rem: {}, acc: 0,
  open(asHost, code, cb) {
    if (typeof Peer === 'undefined') return cb('온라인 연결 도구를 불러오지 못했어요. 인터넷을 확인해 주세요.');
    this.host = asHost; this.code = code; const rid = 'mwg6-' + GAME.id + '-' + code; let done = false; const fin = e => { if (!done) { done = true; cb(e) } };
    try { this.peer = new Peer(asHost ? rid : undefined, { debug: 0 }) } catch (e) { return fin('연결을 시작하지 못했어요.') }
    this.peer.on('error', e => fin(asHost ? '방을 만들지 못했어요. 다시 눌러 주세요.' : '그 번호의 방을 찾지 못했어요.'));
    this.peer.on('open', () => {
      if (asHost) { this.on = true; this.peer.on('connection', c => { if (this.conns.length >= (GAME.maxP || 8) - 1) { const no = () => { try { c.send(JSON.stringify({ t: 'full', id: this.id, max: GAME.maxP || 8 })) } catch (e) { } setTimeout(() => c.close(), 600) }; if (c.open) no(); else c.on('open', no); return } this.conns.push(c); c.on('data', d => this.rx(d, c)); c.on('close', () => { this.conns = this.conns.filter(x => x !== c) }) }); fin() }
      else { const c = this.peer.connect(rid, { reliable: true }); this.hc = c; c.on('open', () => { this.on = true; fin() }); c.on('data', d => this.rx(d, c)); c.on('close', () => { if (this.on) toast('방장과 연결이 끊겼어요', '#ff8787', 2); this.on = false }); setTimeout(() => fin('그 번호의 방을 찾지 못했어요.'), 12000) }
    });
  },
  raw(s, except) { if (this.host) this.conns.forEach(c => { if (c !== except && c.open) try { c.send(s) } catch (e) { } }); else if (this.hc && this.hc.open) try { this.hc.send(s) } catch (e) { } },
  send(m) { if (!this.on) return; m.id = this.id; this.raw(JSON.stringify(m)) },
  rx(s, c) {
    let m; try { m = JSON.parse(s) } catch (e) { return } if (!m || m.id === this.id) return;
    if (m.t === 'full') { toast(`방이 꽉 찼어요 (최대 ${m.max}명) · 혼자 하기로 해요`, '#ff8787', 3); this.on = false; this.rem = {}; $('#board').style.display = 'none'; return }
    if (m.t === 'b') { for (const e of m.a) if (e[0] !== this.id) this.st(e[0], e[1], e[2], e[3]); return }
    if (this.host && m.t !== 's') this.raw(s, c);
    if (m.t === 's') this.st(m.id, m.n, m.c, m.d);
    else if (m.to && m.to !== this.id) return; else if (GAME.onNet) GAME.onNet(m);
  },
  st(id, n, c, d) { const r = this.rem[id] || (this.rem[id] = { id }); if (!r.n && n) toast(`👋 ${n} 입장!`, '#8ce99a', 1.2); r.n = n; r.c = c; r.d = d; r.at = performance.now() },
  tick(dt) {
    if (!this.on) return; this.acc += dt;
    if (this.acc > .1) { this.acc = 0; const d = (GAME.net ? GAME.net() : [0, 0, 0, 0, 0]).map(v => typeof v === 'number' ? Math.round(v * 100) / 100 : v);
      if (this.host) { const t0 = performance.now(), a = [[this.id, this.name, this.col, d]]; for (const k in this.rem) { const r = this.rem[k]; if (r.d && t0 - r.at < 3000) a.push([k, r.n, r.c, r.d]) } this.raw(JSON.stringify({ t: 'b', id: this.id, a })) } else this.send({ t: 's', n: this.name, c: this.col, d }) }
    const now = performance.now(), rows = [[this.name + ' (나)', GAME.net ? GAME.net()[4] : 0, this.col]];
    for (const k in this.rem) {
      const r = this.rem[k]; if (now - r.at > 6000) { if (r.g) r.g.g.parent && r.g.g.parent.remove(r.g.g); delete this.rem[k]; continue } if (!r.d) continue;
      if (!r.g || r.sc !== scene) { r.g = GAME.mkGhost ? GAME.mkGhost(r) : person({ top: r.c, s: .98 }); r.sc = scene; scene.add(r.g.g); const l = label(r.g.g, r.n || '친구', 2.2, .55, '#111', '#fff', 0, GAME.ghostH || 2.9, 0, 40); l.userData.bill = 1; r.lb = l; r.g.g.position.set(r.d[0], r.d[1], r.d[2]) }
      const P = r.g.g.position, moved = Math.hypot(P.x - r.d[0], P.z - r.d[2]); P.x = lerp(P.x, r.d[0], Math.min(1, dt * 10)); P.y = lerp(P.y, r.d[1], Math.min(1, dt * 10)); P.z = lerp(P.z, r.d[2], Math.min(1, dt * 10)); r.g.g.rotation.y = r.d[3];
      if (r.g.lL) { if (moved > .05) walk(r.g, now / 80); else stand(r.g, now / 1000) } r.lb.quaternion.copy(r.g.g.quaternion.clone().invert().multiply(cam.quaternion));
      if (GAME.ghost) GAME.ghost(r, dt); rows.push([r.n || '친구', r.d[4] || 0, r.c]);
    }
    rows.sort((a, b) => b[1] - a[1]); const B = $('#board'); B.style.display = 'block'; B.innerHTML = `🚪 방 <b style="color:#ffd43b">${this.code}</b> · ${rows.length}/${GAME.maxP || 8}명<br>` + rows.slice(0, 8).map(r => `<span style="color:${r[2]}">●</span> ${r[0]} <b>${r[1]}</b>`).join('<br>') + (rows.length > 8 ? `<br>… 외 ${rows.length - 8}명` : '');
  }
};
function mpGo(asHost) {
  NET.name = ($('#nick').value || '').trim() || '친구' + (Math.random() * 90 + 10 | 0); const code = asHost ? String(Math.random() * 9000 + 1000 | 0) : ($('#code').value || '').trim();
  if (!asHost && !/^\d{4}$/.test(code)) { $('#mpMsg').textContent = '방 번호 4자리를 적어 주세요.'; return }
  $('#mpMsg').textContent = '연결하는 중…'; NET.open(asHost, code, err => { if (err) { $('#mpMsg').textContent = err; try { NET.peer && NET.peer.destroy() } catch (e) { } NET.peer = null; return } $('#mpMsg').textContent = ''; start(); toast(asHost ? `방 번호 ${code} · 친구에게 알려 줘요!` : `방 ${code}에 들어왔어요!`, '#ffd43b', 3) });
}
$('#bHost').onclick = () => mpGo(true); $('#bJoin').onclick = () => mpGo(false);
$('#nick').addEventListener('keydown', e => e.stopPropagation()); $('#code').addEventListener('keydown', e => e.stopPropagation());
</script>

<script>
$('#sEmo').textContent = GAME.emoji; $('#sTitle').textContent = GAME.title; $('#sSub').textContent = GAME.sub; $('#sUnit').textContent = '5학년 과학 · ' + GAME.unit;
$('#sFacts').innerHTML = '<b>📌 오늘의 과학</b><br>' + GAME.facts.map(f => '· ' + f).join('<br>'); $('#sHow').innerHTML = GAME.how; document.title = GAME.title;
GAME.init(); let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop); const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (playing && (!quizOn || NET.on && GAME.liveQuiz)) GAME.update(dt); else if (!playing && GAME.idle) GAME.idle(dt);
  NET.tick(dt);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('#toast').style.opacity = 0 }
  if (shake > 0) { shake = Math.max(0, shake - dt * 2); cam.position.x += (Math.random() - .5) * shake * .5; cam.position.y += (Math.random() - .5) * shake * .5 }
  lookDX = lookDY = 0; for (const k in KP) delete KP[k];
  R.render(scene, cam);
}
requestAnimationFrame(loop);
